    const what = S.armed.kind;
    const cost = what === "free" ? "" :
      " — " + Object.entries(COST[what]).map(([r, n]) => n + " " + RES_NAME[r]).join(", ");
    hint(`Click again to confirm ${what === "free" ? "placement" : "the " + what + cost}, or click elsewhere to cancel.`, true);
  } else if (S.select && S.select.kind === "robber"){
    hint("Click a hex to move the robber onto it.", true);
  } else if (S.select && S.select.kind === "alter"){
    hint(S.select.first === null ? "Pick the first number token to swap."
                                 : "Now pick the second number token.", true);
  } else if (S.phase.startsWith("setup")){
    hint(`Place your ${S.setupNeed} — click a highlighted spot.`, true);
  } else if (S.phase === "roll"){
    hint("Roll the dice to begin your turn.", true);
  } else {
    hint(null);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LOG / DICE HISTORY
   ══════════════════════════════════════════════════════════════════════ */

/* ── Imploding Kitten clock ──────────────────────────────────────────── */
let implodeTimer = null;

function implodeActive(){ return S && S.implodeTurn === S.turnCounter; }

function clearImplodeClock(){
  if (implodeTimer){ clearTimeout(implodeTimer); implodeTimer = null; }
  const el = document.getElementById("implodeClock");
  if (el) el.remove();
}

function startImplodeClock(){
  clearImplodeClock();
  S.implodeUntil = Date.now() + 20000;
  implodeClockTick();
}

function implodeClockTick(){
  implodeTimer = null;
  if (!S || !implodeActive() || S.phase === "over"){ clearImplodeClock(); return; }
  const left = Math.max(0, Math.ceil((S.implodeUntil - Date.now()) / 1000));

  let el = document.getElementById("implodeClock");
  if (!el){
    el = document.createElement("div");
    el.id = "implodeClock";
    const area = document.getElementById("boardArea");
    if (area) area.appendChild(el);
  }
  el.className = left <= 5 ? "urgent" : "";
  el.innerHTML = "💥 <b>" + S.players[S.cur].name + "</b> imploded — un-Nopeable<br><span>" +
                 left + "s left in this turn</span>";

  if (left <= 0){
    clearImplodeClock();
    // Only the host ends the turn. A terminal just stops showing the clock and
    // waits to be told, or two browsers would end the same turn twice.
    if (window.NET && NET.isGuest && NET.isGuest()) return;
    logMsg("<span style='color:#d98b4b'>The Imploding Kitten's 20 seconds are up.</span>");
    announce("⏳ " + pdot(S.players[S.cur]) + "'s imploded turn runs out", "big");
    S.implodeTurn = -1;
    S.armed = null;
    if (!S.pending && !S.select && (S.phase === "main" || S.phase === "roll")) doEndTurn();
    return;
  }
  implodeTimer = setTimeout(implodeClockTick, 250);
}

/* ══ HAND-OVER WINDOW ══════════════════════════════════════════
   A Nope may be played at any time, including after the turn it answers has
   already ended — which is the only way a Nope can itself be Noped, since
   being Noped ends your turn on the spot. So every turn hands over through a
   few seconds in which nobody may roll and the last entry in the log is still
   live. Playing a Nope inside the window starts it again, so a chain of them
   can run as long as people keep answering.
   ═══════════════════════════════════════════════════════════════════ */
/* Tunable from the console if three seconds is too brisk or too slow:
   REACT_WINDOW = 2000 (it is read fresh every time a window opens). */
let REACT_WINDOW = 3000;        // ms of answering room at every hand-over
let reactTimer = null;

function reactWindowOpen(){
  return !!S && S.phase !== "over" && !S.phase.startsWith("setup") &&
         S.reactUntil > Date.now();
}
function reactSecondsLeft(){
  if (!S) return 0;
  return Math.max(0, Math.ceil((S.reactUntil - Date.now()) / 1000));
}

function clearReactClock(){
  if (reactTimer){ clearTimeout(reactTimer); reactTimer = null; }
  const el = document.getElementById("reactClock");
  if (el) el.remove();
}

/* Open the window, or push it back out to full length if it is already
   running — a Nope played inside the window buys everyone another go. */
function openReactWindow(bumped){
  if (!S || S.phase === "over" || S.phase.startsWith("setup")) return;
  S.reactUntil = Date.now() + REACT_WINDOW;
  if (reactTimer){ clearTimeout(reactTimer); reactTimer = null; }
  reactClockTick(bumped);
}

function reactClockTick(bumped){
  reactTimer = null;
  if (!S || S.phase === "over" || S.phase.startsWith("setup")){ clearReactClock(); return; }
  const left = reactSecondsLeft();

  if (left <= 0){
    clearReactClock();
    S.reactUntil = 0;
    render();
    botTick();
    return;
  }

  let el = document.getElementById("reactClock");
  if (!el){
    el = document.createElement("div");
    el.id = "reactClock";
    const area = document.getElementById("boardArea");
    if (area) area.appendChild(el);
  }
  el.className = bumped ? "bumped" : "";
  el.innerHTML = "↩︎ last call — Nope, Attack or Defuse<br><span>" + left +
                 "s</span> before " + esc(cur().name) + " rolls";
  const rb = document.getElementById("rollBtn");
  if (rb) rb.textContent = "Reactions open — " + left + "s";

  reactTimer = setTimeout(function(){ reactClockTick(bumped); }, 200);
}

/* A terminal is sent how much of each clock is still to run rather than being
   trusted to keep time; this starts and stops the two banners to match. */
function mirrorClocks(){
  if (!S) return;
  if (S.reactUntil > Date.now()){ if (!reactTimer) reactClockTick(false); }
  else clearReactClock();
  if (S.implodeUntil > Date.now() && S.implodeTurn === S.turnCounter){
    if (!implodeTimer) implodeClockTick();
  } else if (S.implodeTurn !== S.turnCounter){
    clearImplodeClock();
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function logMsg(msg){
  S.log.push(msg);
  if (S.log.length > 500) S.log.shift();
}

/* The running feed is the game log now, so the button shows and hides it
   rather than opening a separate window. */
function toggleFeed(){
  const box = document.getElementById("feed");
  const btn = document.getElementById("logBtn");
  if (!box) return;
  const hidden = box.classList.toggle("hidden");
  if (btn) btn.classList.toggle("on", !hidden);
  if (!hidden) box.scrollTop = box.scrollHeight;
}
function showLog(){ toggleFeed(); }

function showDice(){
  const rolls = S.diceLog || [];
  const tally = {};
  for (let n = 2; n <= 12; n++) tally[n] = 0;
  for (const r of rolls) tally[r]++;
  const max = Math.max(1, ...Object.values(tally));

  let h = `<p class="sub">${rolls.length} roll${rolls.length === 1 ? "" : "s"} this game.</p>`;
  h += `<div class="vchart">`;
  for (let n = 2; n <= 12; n++){
    const pct = (tally[n] / max) * 100;
    h += `<div class="vcol ${n === 7 ? "seven" : ""}">
            <span class="vc">${tally[n] || ""}</span>
            <span class="vb" style="height:${pct}%"></span>
            <span class="vn">${n}</span>
          </div>`;
  }
  h += `</div>`;
  if (rolls.length){
    h += `<h4 style="margin:14px 0 4px;font-size:13px">Most recent (newest first)</h4><div class="recent">`;
    for (const r of rolls.slice(-40).reverse())
      h += `<span class="${r === 7 ? "seven" : ""}">${r}</span>`;
    h += `</div>`;
  }
  openModal("Dice history", h, [{ label:"Close", cls:"primary", fn: closeModal }]);
}

/* ══════════════════════════════════════════════════════════════════════
   SETUP PHASE
   ══════════════════════════════════════════════════════════════════════ */

function beginSetupStep(){
  S.cur = S.setupOrder[S.setupIdx];
  S.phase = S.setupIdx < S.players.length ? "setup1" : "setup2";
  S.setupNeed = "settlement";
  S.setupLastVertex = null;
  S.armed = null;
  S.select = { kind:"settlement", setup:true };
  render();
  botTick();
}

/* ══════════════════════════════════════════════════════════════════════
   BUILDING BY CLICKING THE BOARD
   ══════════════════════════════════════════════════════════════════════
   There is no "pick a build mode" step. During your turn every spot you can
   legally afford is shown on the board; click it once to arm it, click again
   to confirm, click anywhere else to cancel.

   Setup placements work the same way, which also guards against a misclick
   putting your opening settlement somewhere you did not intend.
   ══════════════════════════════════════════════════════════════════════ */

function countPieces(p, kind){
  return kind === "road" ? p.roads : kind === "settlement" ? p.settlements : p.cities;
}
function hasSpotFor(kind){
  if (kind === "road")       return edges.some(e => canPlaceRoad(e.id, S.cur, null));
  if (kind === "settlement") return vertices.some(v => canPlaceSettlement(v.id, S.cur, false));
  return vertices.some(v => canPlaceCity(v.id, S.cur));
}

function armed(kind, id){ return S.armed && S.armed.kind === kind && S.armed.id === id; }
function arm(kind, id){ S.armed = { kind, id }; render(); }
function disarm(){ if (S.armed){ S.armed = null; render(); } }

/* What can the active player afford and still has pieces for? */
function affordable(kind){
  const p = cur();
  return canAfford(p, COST[kind]) && countPieces(p, kind) < LIMIT[kind];
}
/* During setup the placement is free, so only the piece limit applies. */
function buildableNow(kind){
  if (S.phase.startsWith("setup")) return true;
  return S.phase === "main" && !S.select && !S.pending && affordable(kind);
}

function vertexClick(vid){
  if (netSend("vertex", [vid])) return;
  if (swallowedByPan() || uiBlocked()) return;
  const sel = S.select;

  // ── setup: forced settlement placement ──
  if (sel && sel.kind === "settlement" && sel.setup){
    if (!canPlaceSettlement(vid, S.cur, true)) return;
    if (!armed("free", vid)){ arm("free", vid); return; }
    S.armed = null;
    placeSettlement(vid, true);
    return;
  }

  // ── normal play ──
  if (S.select || S.pending || S.phase !== "main") return;

  if (canPlaceCity(vid, S.cur) && buildableNow("city")){
    if (!armed("city", vid)){ arm("city", vid); return; }
    S.armed = null;
    placeCity(vid);
    return;
  }
  if (canPlaceSettlement(vid, S.cur, false) && buildableNow("settlement")){
    if (!armed("settlement", vid)){ arm("settlement", vid); return; }
    S.armed = null;
    placeSettlement(vid, false);
    return;
  }
  disarm();
}

function edgeClick(eid){
  if (netSend("edge", [eid])) return;
  if (swallowedByPan() || uiBlocked()) return;
  const sel = S.select;

  // ── setup: forced road placement ──
  if (sel && sel.kind === "road"){
    if (!canPlaceRoad(eid, S.cur, sel.fromVertex)) return;
    if (!armed("free", eid)){ arm("free", eid); return; }
    S.armed = null;
    placeRoad(eid, true);
    return;
  }

  if (S.select || S.pending || S.phase !== "main") return;
  if (!canPlaceRoad(eid, S.cur, null) || !buildableNow("road")){ disarm(); return; }
  if (!armed("road", eid)){ arm("road", eid); return; }
  S.armed = null;
  placeRoad(eid, false);
}

/* ── the placements themselves ─────────────────────────────────────── */

function placeSettlement(vid, setup){
  const snapBefore = snapAll();
  vertices[vid].owner = S.cur;
  vertices[vid].type = "settlement";
  cur().settlements++;

  if (setup){
    S.setupLastVertex = vid;
    logMsg(`<b>${cur().name}</b> settles.`);
    if (S.phase === "setup2"){
      // The second settlement pays out immediately.
      const got = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
      for (const hid of vertices[vid].hexes){
        const hx = hexes[hid];
        if (hx.terrain !== "desert") got[hx.terrain] += give(cur(), hx.terrain, 1);
      }
      logMsg(`<b>${cur().name}</b> starts with ` +
             RES.filter(r => got[r] > 0).map(r => got[r] + " " + RES_NAME[r]).join(", ") + ".");
      announce(pdot(cur()) + " settles and starts with<br>" + resList(got), "buy");
    } else {
      announce(pdot(cur()) + " places their first settlement", "info");
    }
    S.setupNeed = "road";
    S.select = { kind:"road", fromVertex: vid };
    render();
    return;
  }

  pay(cur(), COST.settlement);
  if (S.turnRec) S.turnRec.verts.push({ vid, prevType: null });
  logMsg(`<b>${cur().name}</b> builds a settlement.`);
  logAction(pdot(cur()) + " builds a <b>settlement</b>", "buy", { snap: snapBefore });
  updateLongestRoad();          // an opponent's settlement can cut a road
  afterBuild();
}

function placeCity(vid){
  const snapBefore = snapAll();
  pay(cur(), COST.city);
  vertices[vid].type = "city";
  cur().settlements--; cur().cities++;
  if (S.turnRec) S.turnRec.verts.push({ vid, prevType: "settlement" });
  logMsg(`<b>${cur().name}</b> upgrades to a city.`);
  logAction(pdot(cur()) + " upgrades to a <b>city</b>", "buy", { snap: snapBefore });
  afterBuild();
}

function placeRoad(eid, setup){
  const snapBefore = snapAll();
  edges[eid].owner = S.cur;
  cur().roads++;

  if (setup){
    logMsg(`<b>${cur().name}</b> lays a road.`);
    S.select = null;
    S.setupIdx++;
    if (S.setupIdx >= S.setupOrder.length){
      S.phase = "roll";
      S.cur = S.firstPlayer;
      S.turnCounter = 1;
      S.turnRec = freshTurnRecord();
      logMsg("Setup complete. <b>" + cur().name + "</b> to roll.");
      updateLongestRoad();
      render();
      botTick();
    } else {
      beginSetupStep();
    }
    return;
  }

  pay(cur(), COST.road);
  if (S.turnRec) S.turnRec.edges.push(eid);
  logMsg(`<b>${cur().name}</b> builds a road.`);
  logAction(pdot(cur()) + " builds a <b>road</b>", "buy", { snap: snapBefore });
  updateLongestRoad();
  afterBuild();
}

function hexClick(hid){
  if (netSend("hex", [hid])) return;
  if (swallowedByPan() || uiBlocked()) return;
  const sel = S.select;
  if (!sel){ disarm(); return; }

  if (sel.kind === "robber"){
    if (hid === S.robber) return;
    S.robber = hid;
    S.select = null;
    logMsg(`<b>${S.players[sel.actor].name}</b> moves the robber onto the ` +
           `${hexes[hid].terrain}${hexes[hid].number ? " " + hexes[hid].number : ""}.`);
    announce(pdot(S.players[sel.actor]) + " moves the robber onto the " +
             hexes[hid].terrain + " " + (hexes[hid].number || "") , "attack");
    const victims = S.players.filter(q =>
      q.id !== sel.actor &&
      totalRes(q) > 0 &&
      hexes[hid].verts.some(v => vertices[v].owner === q.id));
    if (victims.length === 0){ finishRobber(sel); return; }
    chooseVictim(victims, sel);
    return;
  }

  if (sel.kind === "alter"){
    if (hexes[hid].number === null) return;
    if (sel.first === null){ sel.first = hid; render(); return; }
    if (sel.first === hid){ sel.first = null; render(); return; }   // click again to deselect
    const a = sel.first, b = hid, cb = sel.onPick;
    S.select = null;
    cb(a, b);
    return;
  }
}

function afterBuild(){
  S.armed = null;
  checkVictory();
  render();
}

document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !S) return;
  if (dragCard || pressPend){ cancelCardDrag(); return; }   // drop the card
  if (S.armed){ disarm(); return; }
  if (S.select && !S.phase.startsWith("setup") && S.select.kind !== "robber"){
    S.select = null; render();
  }
});

/* ══════════════════════════════════════════════════════════════════════
   DICE / PRODUCTION / ROBBER
   ══════════════════════════════════════════════════════════════════════ */

function rollDice(){
  if (netSend("roll")) return;
  if (reactWindowOpen()){
    hint("Hold on — " + reactSecondsLeft() + "s left for anyone to react.");
    return;
  }
  const snapBefore = snapAll();
  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  S.rolled = [d1, d2];
  S.diceFresh = true;
  const sum = d1 + d2;
  S.diceLog.push(sum);
  logMsg(`<b>${cur().name}</b> rolls <b>${sum}</b> (${d1}+${d2}).`);

  if (sum === 7){
    logAction(pdot(cur()) + " rolls <b>7</b> <span style='opacity:.55'>(" + d1 + "+" + d2 +
             ")</span><br><span style='opacity:.75'>robber moves — hands over 7 are cut</span>",
             "roll", { snap: snapBefore });
    S.phase = "main"; startSevenSequence(S.cur); return;
  }

  const out = produce(sum);
  logAction(rollSummary(cur(), d1, d2, out), "roll", { snap: snapBefore });
  S.phase = "main";
  render();
}

function produce(sum){
  // Tally first: if the bank can't pay everyone for a resource, nobody gets it.
  const owed = S.players.map(() => ({ wood:0, brick:0, sheep:0, wheat:0, ore:0 }));
  const paid = S.players.map(() => ({ wood:0, brick:0, sheep:0, wheat:0, ore:0 }));
  for (const hx of hexes){
    if (hx.number !== sum || hx.id === S.robber || hx.terrain === "desert") continue;
    for (const vid of hx.verts){
      const v = vertices[vid];
      if (v.owner === null) continue;
      owed[v.owner][hx.terrain] += v.type === "city" ? 2 : 1;
    }
  }
  const notes = [];
  for (const r of RES){
    const claimants = S.players.filter(p => owed[p.id][r] > 0);
    const demand = claimants.reduce((s, p) => s + owed[p.id][r], 0);
    if (demand === 0) continue;
    if (demand > S.bank[r]){
      if (claimants.length > 1){ notes.push(`bank is short on ${RES_NAME[r]} — nobody collects it`); continue; }
      paid[claimants[0].id][r] += give(claimants[0], r, S.bank[r]);
      notes.push(`${claimants[0].name} takes the last ${RES_NAME[r]}`);
      continue;
    }
    for (const p of claimants) paid[p.id][r] += give(p, r, owed[p.id][r]);
  }
  const gains = S.players
    .map(p => { const g = RES.filter(r => owed[p.id][r] > 0).map(r => owed[p.id][r] + " " + RES_NAME[r]);
                return g.length ? `${p.name}: ${g.join(", ")}` : null; })
    .filter(Boolean);
  if (gains.length) logMsg(gains.join(" · "));
  else logMsg("<span style='opacity:.7'>Nobody produces.</span>");
  for (const n of notes) logMsg(`<span style='opacity:.7'>${n}</span>`);
  return { paid, notes };
}

/* ── 7: discard, then robber ─────────────────────────────────────────── */
function startSevenSequence(actor){
  const queue = S.players.filter(p => totalRes(p) > 7).map(p => p.id);
  processDiscards(queue, () => beginRobberMove(actor));
}

function processDiscards(queue, done){
  if (!queue.length){ done(); return; }
  const p = S.players[queue[0]];
  const n = Math.floor(totalRes(p) / 2);
  discardDialog(p, n, () => processDiscards(queue.slice(1), done));
}

function beginRobberMove(actor){
  S.select = { kind:"robber", actor, knight:false };
  setTimeout(botTick, 0);
  logMsg(`<b>${S.players[actor].name}</b> must move the robber.`);
  render();
}

function chooseVictim(victims, sel){
  promptFor(sel.actor);
  const vag = agentOf(sel.actor);
  let html = `<p class="sub">Steal one random resource card.</p><div class="pick">`;
  victims.forEach(v => {
    html += `<button onclick="window.__pickVictim(${v.id})">${v.name} (${totalRes(v)} cards)</button>`;
  });
  html += `</div>`;
  if (vag && vag.chooseVictim){
    const pickId = vag.chooseVictim(victims, sel).id;
    setTimeout(function(){ window.__pickVictim(pickId); }, AI_PACE);
  } else {
    openModal("Choose a victim", html, []);
  }
  window.__pickVictim = (vid) => {
    closeModal();
    const victim = S.players[vid], thief = S.players[sel.actor];

    // A Knight played "on you" can be turned around with Defuse. A robbery
    // caused by rolling a 7 is not a card play, so nothing to answer there.
    const di = victim.cards.findIndex(c => c.key === "defuse");
    const dag = agentOf(victim.id);
    if (sel.knight && di >= 0 && !sel.defused && dag && dag.defuseKnight){
      if (dag.defuseKnight(thief, victim, sel)){
        S.discard.push(victim.cards.splice(di, 1)[0]);
        logMsg("<b>" + victim.name + "</b> plays <b>Defuse</b> — they seize the robber from <b>" + thief.name + "</b>.");
        S.select = { kind:"robber", actor: victim.id, knight: sel.knight,
                     credit: sel.actor, defused: true };
        render(); botTick();
      } else {
        doSteal(thief, victim, sel);
      }
      return;
    }
    if (sel.knight && di >= 0 && !sel.defused && !dag){
      promptFor(victim.id);
      openModal("Defuse?", `<p class="sub"><b>${thief.name}</b>'s Knight is stealing from
        <b>${victim.name}</b>. ${victim.name} holds a Defuse — say "no you" and take
        control of the robber?</p>
        <div class="okbox">You move the robber wherever you like and steal from whoever
        is there. ${thief.name} still gets credit for the knight toward Largest Army.</div>`, [
        { label:"Take the hit", fn: () => { closeModal(); doSteal(thief, victim, sel); } },
        { label:'"No you" — take the robber', cls:"primary", fn: () => {
            closeModal();
            S.discard.push(victim.cards.splice(di, 1)[0]);
            logMsg(`<b>${victim.name}</b> plays <b>Defuse</b> — they seize the robber from <b>${thief.name}</b>.`);
            // Hand the placement to the defuser. `credit` keeps the knight on the
            // original player's army; `defused` stops a second Defuse chaining.
            S.select = { kind:"robber", actor: victim.id, knight: sel.knight,
                         credit: sel.actor, defused: true };
            render();
          } }
      ]);
      return;
    }
    doSteal(thief, victim, sel);
  };
}

function doSteal(thief, victim, sel){
  const pool = [];
  for (const r of RES) for (let i = 0; i < victim.res[r]; i++) pool.push(r);
  if (pool.length){
    const r = pool[Math.floor(Math.random() * pool.length)];
    victim.res[r]--; thief.res[r]++; noteGain(thief, r, 1);
    logMsg(`<b>${thief.name}</b> steals ${RES_NAME[r]} from <b>${victim.name}</b>.`);
    // The card taken is private; only the two of them see which it was.
    const reveal = (!isBot(thief.id) || !isBot(victim.id)) ? " " + RES_NAME[r] : "";
    announce(pdot(thief) + " steals" + reveal + " from " + pdot(victim), "attack");
  } else {
    logMsg(`<b>${victim.name}</b> has nothing to steal.`);
  }
  finishRobber(sel);
}

function finishRobber(sel){
  S.select = null;
  if (sel.knight){
    // The knight counts for whoever played the card, even if it was Defused.
    const p = S.players[sel.credit !== undefined ? sel.credit : sel.actor];
    p.knights++;
    if (S.turnRec && p.id === S.cur) S.turnRec.knights++;
    updateLargestArmy();
    checkVictory();
  }
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   KITTEN CARDS
   ══════════════════════════════════════════════════════════════════════ */

/* How many cards a pool of resources can buy: each card wants three DIFFERENT
   types, so repeatedly spend one each from the three deepest piles. */
function cardsFromPool(pool){
  const left = { wood:pool.wood, brick:pool.brick, sheep:pool.sheep,
                 wheat:pool.wheat, ore:pool.ore };
  let n = 0;
  for (;;){
    const have = RES.filter(r => left[r] > 0).sort((a, b) => left[b] - left[a]);
    if (have.length < 3) break;
    left[have[0]]--; left[have[1]]--; left[have[2]]--;
    n++;
  }
  const spent = {};
  for (const r of RES) spent[r] = pool[r] - left[r];
  return { cards: n, spent, left };
}

function buyKittenDialog(){
  if (netSend("buy")) return;
  promptFor(S.cur);
  if (!myTurnNow()) return;
  const p = cur();
  const pool = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };

  const refresh = () => {
    const res = cardsFromPool(pool);
    const capped = Math.min(res.cards, S.deck.length);
    const leftover = RES.filter(r => res.left[r] > 0);

    let h = `<p class="sub">A kitten card costs <b>any 3 different resources</b>.
             Click resources to pile them up — every three different ones buys another
             card, so you can take several at once.</p><div class="pick">`;
    for (const r of RES){
      const spare = p.res[r] - pool[r];
      h += `<button ${spare > 0 ? "" : "disabled"} onclick="window.__poolAdd('${r}')"
              title="${RES_NAME[r]} — ${spare} left">
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:5px"></span>
              ${RES_NAME[r]} <b>+${pool[r]}</b> <span style="opacity:.55">/${p.res[r]}</span></button>`;
    }
    h += `</div>`;
    h += `<div class="stack" style="margin-top:10px">
            <div>Buying <b>${capped}</b> card${capped === 1 ? "" : "s"}${
              res.cards > capped ? " <span style='opacity:.6'>(deck only has " + S.deck.length + ")</span>" : ""}</div>
            <div style="opacity:.7">Spending ${resList(res.spent)}</div>
            ${leftover.length ? `<div style="opacity:.55">Not enough to pair up: ${resList(res.left)}</div>` : ""}
          </div>`;

    openModal("Buy Kitten Cards", h, [
      { label:"Clear", fn: () => { for (const r of RES) pool[r] = 0; refresh(); } },
      { label:"Cancel", fn: () => { closeModal(); render(); } },
      { label: capped > 1 ? `Buy ${capped} cards` : "Buy", cls:"primary", disabled: capped < 1,
        fn: () => {
          closeModal();
          for (const r of RES) take(p, r, res.spent[r]);
          for (let k = 0; k < capped; k++) drawKitten(p);
          hint(`Bought ${capped} kitten card${capped === 1 ? "" : "s"}.`);
          render();
        } }
    ]);
  };

  window.__poolAdd = (r) => {
    if (p.res[r] - pool[r] > 0) pool[r]++;
    refresh();
  };
  if (RES.filter(r => p.res[r] > 0).length < 3 || !S.deck.length) return;
  refresh();
}

function drawKitten(p){
  if (!S.deck.length){ logMsg("The kitten deck is empty."); return; }
  const snapBefore = snapAll();
  const c = S.deck.pop();

  if (c.key === "implode"){
    // Fires the instant it is drawn — never enters a hand.
    logMsg(`<b>${p.name}</b> draws the <b>Imploding Kitten</b>!`);
    let stolen = 0;
    for (const q of S.players){
      if (q.id === p.id) continue;
      for (const r of RES){ p.res[r] += q.res[r]; stolen += q.res[r]; q.res[r] = 0; }
    }
    S.discard.push(c);
    // Nothing this player does for the rest of the turn can be Noped. The
    // 20 second clock is the counterweight — the turn ends when it runs out.
    S.implodeTurn = S.turnCounter;
    S.implodeBy = p.id;
    startImplodeClock();
    logMsg(`Every other player's hand implodes into <b>${p.name}</b> — ${stolen} cards taken.`);
    logMsg(`<b>${p.name}</b>'s turn cannot be Noped, but ends in 20 seconds.`);
    announce("💥 " + pdot(p) + " draws the <b>Imploding Kitten</b> — takes " + stolen +
             " resources from everyone", "big", 5200);
    checkVictory();
    return;
  }

  c.boughtTurn = S.turnCounter;
  p.cards.push(c);
  if (S.turnRec && p.id === S.cur) S.turnRec.drawn.push(c);
  logMsg(`<b>${p.name}</b> buys a kitten card.`);
  // Only the buyer learns what it was; everyone sees that a card was bought.
  logAction(pdot(p) + " buys a kitten card" +
           (isBot(p.id) ? "" : " — <b>" + KITTEN[c.key].name + "</b>") +
           ' <span style="opacity:.6">(' + S.deck.length + ' left)</span>', "buy",
            { actor: p.id, snap: snapBefore });
  if (c.key === "vp"){ checkVictory(); }
}

/* Plays a card that resolves on the board rather than at a player: dropped
   onto the board by a human, or chosen outright by a bot. Everything aimed at
   a person is played by dragging the card onto them, which is why there is no
   target picker and no confirmation prompt left in here. */
function playCard(idx, ownerId){
  const p = ownerId === undefined ? cur() : S.players[ownerId];
  const c = p.cards[idx];
  if (!c) return;
  const def = KITTEN[c.key];
  if (def.kind === "vp" || def.kind === "response") return;
  if (c.boughtTurn === S.turnCounter) return;
  if (p.id !== S.cur) return;                  // board plays are on-turn only

  if (def.kind === "target"){
    hint("Drag " + def.name + " onto the player you want to hit.");
  } else if (def.kind === "board"){
    // The two tokens must be named before anyone can react — whether a player
    // may Defuse depends on which hexes are being swapped.
    beginAlterPick(p.id, (a, b) => {
      proposeAction({ type:"card", card:c, idx, actor:p.id, target:null, payload:{ hexes:[a, b] } });
    });
  } else {
    proposeAction({ type:"card", card:c, idx, actor:p.id, target:null, payload:{} });
  }
}

/* The confirmation prompts that used to stand between a click and a card
   — "Nope this turn?", "Play Attack now?" — are gone along with clicking.
   A card is played by dragging it where it should go, so the drop IS the
   confirmation, and nobody watching sees you hesitate over a reaction. */

function beginAlterPick(actorId, onPick){
  S.select = { kind:"alter", actor: actorId, first:null, onPick };
  logMsg(`<b>${S.players[actorId].name}</b> is choosing two number tokens to swap.`);
  render();
}

function favorGuessDialog(c, idx, tid, ownerId){
  const asker = ownerId === undefined ? S.cur : ownerId;
  promptFor(asker);
  const want = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  const refresh = () => {
    const total = RES.reduce((s, r) => s + want[r], 0);
    let h = `<p class="sub">Name 3 resource cards. <b>${S.players[tid].name}</b> hands over whichever
             of them they actually hold — you get nothing for the ones they don't have.</p>`;
    for (const r of RES){
      h += `<div class="counter">
              <span class="lbl"><span class="swatch" style="background:${RES_COLOR[r]}"></span>${RES_NAME[r]}</span>
              <button class="sm" onclick="window.__fv('${r}',-1)">−</button>
              <span class="val">${want[r]}</span>
              <button class="sm" onclick="window.__fv('${r}',1)">+</button>
            </div>`;
    }
    h += `<div class="stack">Naming ${total} of 3</div>`;
    openModal("Favor — name 3 cards", h, [
      { label:"Cancel", fn: closeModal },
      { label:"Demand", cls:"primary", disabled: total !== 3, fn: () => {
          closeModal();
          proposeAction({ type:"card", card:c, idx, actor:asker, target:tid,
                          payload:{ want:{ ...want } }, quiet: !!c.synthetic });
        } }
    ]);
  };
  window.__fv = (r, d) => {
    const total = RES.reduce((s, x) => s + want[x], 0);
    if (d > 0 && total >= 3) return;
    want[r] = Math.max(0, want[r] + d);
    refresh();
  };
  refresh();
}

/* ── Resolution: apply a card's effect ──────────────────────────────── */
function resolveCard(action){
  const c = action.card;
  const actor = S.players[action.actor];
  const target = action.target === null ? null : S.players[action.target];
  const def = KITTEN[c.key];


  switch (c.key){
    case "skip":
      target.skipTokens++;
      logMsg(`<b>${actor.name}</b> skips <b>${target.name}</b>'s next turn.`);
      break;

    case "explode": {
      let n = 0;
      for (const r of RES){ n += target.res[r]; S.bank[r] += target.res[r]; target.res[r] = 0; }
      logMsg(`💥 <b>${actor.name}</b> explodes <b>${target.name}</b> — ${n} resources returned to the bank.`);
      break;
    }

    case "attack": {
      const n = Math.min(3, totalRes(target));
      if (n === 0){ logMsg(`<b>${target.name}</b> has nothing to drop.`); break; }
      logMsg(`<b>${target.name}</b> must drop ${n} resource${n === 1 ? "" : "s"}.`);
      discardDialog(target, n, () => { render(); });
      break;
    }

    case "favor": {
      const want = action.payload.want;
      const got = [];
      for (const r of RES){
        const n = Math.min(want[r], target.res[r]);
        if (n > 0){ target.res[r] -= n; actor.res[r] += n; noteGain(actor, r, n); got.push(n + " " + RES_NAME[r]); }
      }
      logMsg(got.length
        ? `<b>${target.name}</b> owes <b>${actor.name}</b> a favor: ${got.join(", ")}.`
        : `<b>${target.name}</b> had none of what <b>${actor.name}</b> asked for.`);
      break;
    }

    case "knight":
      S.select = { kind:"robber", actor: actor.id, knight:true };
      break;

    case "alter": {
      const [ha, hb] = action.payload.hexes;
      const na = hexes[ha].number, nb = hexes[hb].number;
      hexes[ha].number = nb; hexes[hb].number = na;
      logMsg(`The swap takes effect: <b>${na}</b> ⇄ <b>${nb}</b>.`);
      break;
    }

    case "reverse":
      S.dir *= -1;
      S.extraTurn = true;
      logMsg(`<b>${actor.name}</b> plays Reverse — another turn, then order flips to ${S.dir === 1 ? "clockwise" : "counter-clockwise"}.`);
      break;
  }
  checkVictory();
  render();
  // Attack already has a window of its own — the discard prompt carries the
  // same two buttons — so it is the one card that does not open a second.
  if (c.key !== "attack") offerTargetResponse(action);
}

/* ══════════════════════════════════════════════════════════════════════
   ACTION JOURNAL
   ══════════════════════════════════════════════════════════════════════
   Nothing waits for permission any more. Every action resolves at once and
   is recorded here together with a snapshot of the state immediately before
   it. A Nope played later simply rewinds to that snapshot, which is what
   lets a player answer without first announcing that they hold the card.

   Rewinding to an entry also discards whatever happened after it — the Nope
   erases that action and everything that followed from it in the same turn.
   In practice you are answering the newest entry, so this rarely bites.
   ══════════════════════════════════════════════════════════════════════ */

let journalId = 0;

/* Everything a rewind has to put back. Taken before each recorded action. */
function snapAll(){
  return {
    res:     S.players.map(p => Object.assign({}, p.res)),
    bank:    Object.assign({}, S.bank),
    hands:   S.players.map(p => p.cards.slice()),      // refs, so identity survives
    knights: S.players.map(p => p.knights),
    skips:   S.players.map(p => p.skipTokens),
    roads:   S.players.map(p => p.roads),
    setts:   S.players.map(p => p.settlements),
    cities:  S.players.map(p => p.cities),
    vOwner:  vertices.map(v => v.owner),
    vType:   vertices.map(v => v.type),
    eOwner:  edges.map(e => e.owner),
    numbers: hexes.map(h => h.number),
    robber:  S.robber,
    dir:     S.dir,
    extra:   S.extraTurn,
    rolled:  S.rolled ? S.rolled.slice() : null,
    deck:    S.deck.slice(),
    discard: S.discard.slice(),
    lr:      Object.assign({}, S.longestRoad),
    la:      Object.assign({}, S.largestArmy),
    roadLens: (S.roadLens || []).slice(),
    implodeTurn: S.implodeTurn,
    rec: S.turnRec ? {
      edges: S.turnRec.edges.slice(),
      verts: S.turnRec.verts.map(v => Object.assign({}, v)),
      drawn: S.turnRec.drawn.slice(),
      knights: S.turnRec.knights,
      gained: Object.assign({}, S.turnRec.gained)
    } : null
  };
}

function restoreAll(s){
  S.players.forEach((p, i) => {
    p.res = Object.assign({}, s.res[i]);
    p.cards = s.hands[i].slice();
    p.knights = s.knights[i];
    p.skipTokens = s.skips[i];
    p.roads = s.roads[i];
    p.settlements = s.setts[i];
    p.cities = s.cities[i];
  });
  S.bank = Object.assign({}, s.bank);
  vertices.forEach((v, i) => { v.owner = s.vOwner[i]; v.type = s.vType[i]; });
  edges.forEach((e, i) => { e.owner = s.eOwner[i]; });
  hexes.forEach((h, i) => { h.number = s.numbers[i]; });
  S.robber = s.robber;
  S.dir = s.dir;
  S.extraTurn = s.extra;
  S.rolled = s.rolled ? s.rolled.slice() : null;
  S.deck = s.deck.slice();
  S.discard = s.discard.slice();
  S.longestRoad = Object.assign({}, s.lr);
  S.largestArmy = Object.assign({}, s.la);
  S.roadLens = s.roadLens.slice();
  S.implodeTurn = s.implodeTurn;
  if (s.rec && S.turnRec){
    S.turnRec.edges = s.rec.edges.slice();
    S.turnRec.verts = s.rec.verts.map(v => Object.assign({}, v));
    S.turnRec.drawn = s.rec.drawn.slice();
    S.turnRec.knights = s.rec.knights;
    S.turnRec.gained = Object.assign({}, s.rec.gained);
  }
}

/* Record an action and show it in the log. Returns the entry. */
function logAction(html, kind, opts){
  opts = opts || {};
  const e = {
    id: ++journalId,
    turn: S.turnCounter,
    actor: opts.actor === undefined ? S.cur : opts.actor,
    target: opts.target === undefined ? null : opts.target,
    kind: kind,
    card: opts.card || null,
    payload: opts.payload || null,
    snap: opts.snap || null,
    turnBack: opts.turnBack || null,
    spent: opts.spent || null,
    redo: opts.redo || null,
    nopeable: opts.nopeable !== false,
    noped: false,
    plain: String(html).replace(/<[^>]+>/g, "").trim()
  };
  S.journal.push(e);
  while (S.journal.length > 240) S.journal.shift();
  announce(html, kind, e);
  return e;
}

/* The newest entry in the log — the only one still open to an answer. */
function openEntry(){
  if (!S || !S.journal.length) return null;
  const e = S.journal[S.journal.length - 1];
  return canNopeEntry(e) ? e : null;
}

/* May this entry still be answered?

   The window used to stay open for the whole turn, which meant a stack of
   answerable entries and no sense of urgency. It is now exactly one entry
   wide: the moment the NEXT thing reaches the log, the one before it is
   settled for good. Bot pacing was slowed to 3s to keep that window humane.

   It is not, however, closed by the turn ending. A Nope may be played at any
   time, and the hand-over window keeps the last entry of a finished turn live
   for a few seconds — without which a Nope could never be Noped, since being
   Noped ends your turn on the spot. */
function canNopeEntry(e){
  if (!e || e.noped || !e.nopeable || !e.snap) return false;
  if (S.phase === "over" || S.phase.startsWith("setup")) return false;
  // Only the newest entry. Anything older has been overtaken.
  if (!S.journal.length || S.journal[S.journal.length - 1].id !== e.id) return false;
  // From a turn that is already over: live only while the hand-over window is
  // still counting down.
  if (e.turn !== S.turnCounter && !reactWindowOpen()) return false;
  // An Imploding Kitten seals its own turn for good, not just while it lasts.
  if (e.turn === S.implodeTurn && e.actor === S.implodeBy) return false;
  return true;
}

/* A Defuse only answers an attack that landed on you. */
/* A Defuse only answers an attack that landed on you — and it cannot answer
   another Defuse. Anything at all can be Noped, but "no you" does not stack
   against itself: a Defuse entry carries no `card`, which is what rules it
   out here while leaving it wide open to a Nope. */
function canDefuseEntry(e, pid){
  if (!canNopeEntry(e)) return false;
  if (!e.card) return false;           // a reaction, not a card aimed at anyone
  if (e.actor === pid) return false;
  if (e.card.key === "alter"){
    return (e.payload && e.payload.hexes || []).some(hid =>
      hexes[hid].verts.some(v => vertices[v].owner === pid));
  }
  return TARGETED.has(e.card.key) && e.target === pid;
}

function spendCard(p, key){
  const i = p.cards.findIndex(c => c.key === key);
  if (i < 0) return false;
  S.discard.push(p.cards.splice(i, 1)[0]);
  return true;
}

/* ── Answering from inside a prompt ───────────────────────────────
   A card that forces a window open used to make you pay first and react
   afterwards — hand over the Favor, discard for the Attack, and only then go
   hunting in the log for a line to drop a Defuse on. By then the window had
   usually closed. The prompt now carries the answer itself.

   These buttons only appear when the player is genuinely holding the card, so
   a hand with nothing in it looks exactly like a hand that is holding back.
   A modal covers the screen, which is what makes them necessary: no card can
   be dragged anywhere while one is open. */
function promptReactions(pid){
  const out = [];
  if (!S) return out;
  const e = openEntry();
  if (!e) return out;
  if (e.kind === "roll") return out;     // a die roll is not a card; leave the 7 queue alone
  const p = S.players[pid];
  if (!p) return out;
  const fresh = c => c.boughtTurn !== S.turnCounter;
  if (p.cards.some(c => c.key === "defuse" && fresh(c)) && canDefuseEntry(e, pid))
    out.push({ label:"🛡 Defuse it", cls:"react",
               fn: () => { closeModal(); defuseEntry(e.id, pid); } });
  if (p.cards.some(c => c.key === "nope" && fresh(c)) && canNopeEntry(e) && e.actor !== pid)
    out.push({ label:"🚫 Nope it", cls:"reactno",
               fn: () => { closeModal(); nopeEntry(e.id, pid); } });
  return out;
}

function reactNoteHTML(){
  return `<div class="reactnote">You are holding an answer to this — spend it from
          here. Once the next thing reaches the log the window is shut.</div>`;
}

/* A card aimed at a person opens a window of its own for them. Only when they
   have something to answer with: no card, no window, so it is never a tell. */
function offerTargetResponse(action){
  const tid = action.target;
  if (tid === null || tid === undefined || !S.players[tid]) return;
  if (tid === action.actor || isBot(tid)) return;
  const react = promptReactions(tid);
  if (!react.length) return;
  promptFor(tid);
  const def = KITTEN[action.card.key];
  const from = S.players[action.actor];
  let what;
  if (action.card.key === "favor"){
    const want = (action.payload && action.payload.want) || {};
    const named = RES.filter(r => want[r]).map(r => want[r] + " " + RES_NAME[r]);
    what = `<b>${from.name}</b> named ${named.join(", ") || "nothing"}, and has taken
            whichever of those you were holding.`;
  } else if (action.card.key === "explode"){
    what = `<b>${from.name}</b> has sent your whole resource hand back to the bank.`;
  } else if (action.card.key === "skip"){
    what = `<b>${from.name}</b> has skipped your next turn.`;
  } else {
    what = `<b>${from.name}</b> played it on you.`;
  }
  openModal(esc(def.name) + " — aimed at you",
    `<p class="sub">${what}</p>` + reactNoteHTML(),
    [{ label:"Take it", fn: closeModal }].concat(react));
}

/* ── Nope an entry ───────────────────────────────────────────────────── */
function nopeEntry(id, noperId){
  const idx = S.journal.findIndex(e => e.id === id);
  if (idx < 0) return false;
  const e = S.journal[idx];
  if (!canNopeEntry(e)) return false;
  const noper = S.players[noperId];
  if (!noper.cards.some(c => c.key === "nope")) return false;

  const label = e.plain;
  // Whose turn is being cut short. Off-turn plays (an Attack thrown during
  // somebody else's turn), and anything from a turn that has already handed
  // over, have no turn of their own to end.
  const victim = S.players[e.actor];
  const wasNoperTurn = e.actor === S.cur && S.phase !== "over" &&
                       !S.phase.startsWith("setup");
  // Where the turn was standing when this Nope landed. Whose turn it is lives
  // outside the snapshots — they carry the board, not the clock — so a
  // counter-Nope needs this to undo the ending as well as the effect. Recorded
  // for every Nope: putting it back is a no-op when nothing moved, and a turn
  // can change hands with no journal entry to hang it off.
  const turnBack = {
    cur: S.cur, phase: S.phase, turnCounter: S.turnCounter,
    rolled: S.rolled ? S.rolled.slice() : null, extraTurn: S.extraTurn
  };

  // Captured BEFORE the rewind: this is what a counter-Nope has to put back,
  // and it still holds the Nope we are about to spend.
  const undone = snapAll();

  // Rewind first, then spend the card — the entry's own snapshot predates the
  // Nope and would otherwise hand it straight back.
  restoreAll(e.snap);
  S.journal.splice(idx);
  spendCard(noper, "nope");

  // "The attack and the Nope are both spent." The rewind predates the card
  // leaving its owner's hand, so without this it would be handed straight
  // back and thrown again next turn.
  if (e.card && !e.card.synthetic){
    const owner = S.players[e.actor];
    const oi = owner.cards.indexOf(e.card);
    if (oi >= 0) S.discard.push(owner.cards.splice(oi, 1)[0]);
  }
  // Same rule one level up: a Nope that is itself Noped is still spent. The
  // rewind predates the reaction, so it would otherwise come back for free.
  if (e.spent && S.players[e.spent.pid]) spendCard(S.players[e.spent.pid], e.spent.key);
  // Half-finished board business belongs to the action being undone — a
  // robber still to place, two tokens still to name.
  S.select = null;

  // A Nope can be Noped. It is the one reaction that can, and the hand-over
  // window is what makes it reachable.
  logAction(pdot(noper) + " <b>Nopes</b> " + esc(label), "defend",
            { actor: noperId, snap: undone, nopeable: true, turnBack: turnBack,
              spent: { pid: noperId, key: "nope" } });
  logMsg(`<b>${noper.name}</b> Nopes: ${esc(label)}`);

  // Noping a Defuse cancels the "no you", so the original card is simply
  // played again — at the target it was first aimed at, and by the player who
  // first aimed it. Quietly: this Nope is the log entry for all of it.
  if (e.redo){
    playResolved({ type:"card", card: e.redo.card, actor: e.redo.actor,
                   target: e.redo.target, payload: e.redo.payload, quiet: true });
  }

  // Did undoing this entry move the turn back to somebody else? Only then is
  // the turn "handed back" — and only then does the usual end-your-turn
  // penalty step aside, because there is already a turn change in flight.
  const handedBack = !!e.turnBack &&
        (e.turnBack.cur !== S.cur || e.turnBack.turnCounter !== S.turnCounter);
  if (e.turnBack) restoreTurnPointer(e.turnBack);

  if (handedBack){
    // This was a Nope that ended somebody's turn. Undoing it gives the turn
    // back rather than ending another one — the interrupted player picks up
    // exactly where they were standing.
    const back = S.players[S.cur];
    announce(pdot(back) + " gets their turn back", "defend");
    logMsg(`<b>${back.name}</b> gets their turn back.`);
  } else if (wasNoperTurn){
    // Being Noped costs you the rest of your turn, whatever you were doing.
    // A Noped roll is therefore not rerolled — there is no turn left to roll
    // for — which is a good part of why a Nope is worth holding on to.
    announce(pdot(victim) + " is Noped — their turn ends", "attack");
    logMsg(`<b>${victim.name}</b>'s turn ends.`);
    endTurnAfterNope();
  }
  // Whatever just happened, everyone gets a fresh few seconds to answer it.
  openReactWindow(true);
  render();
  botTick();
  return true;
}

/* Put the turn pointer back where a Nope found it. Only the counter-Nope path
   uses this; every other rewind leaves whose turn it is alone. */
function restoreTurnPointer(t){
  if (!t) return;
  clearImplodeClock();
  S.cur = t.cur;
  S.phase = t.phase;
  S.turnCounter = t.turnCounter;
  S.rolled = t.rolled ? t.rolled.slice() : null;
  S.extraTurn = t.extraTurn;
  S.select = null;
  S.armed = null;
}

/* A Noped player's turn is over immediately. Anything half-finished — a
   robber waiting to be placed, an armed build — is dropped on the way out. */
function endTurnAfterNope(){
  S.select = null;
  S.armed = null;
  clearImplodeClock();
  closeModal();
  doEndTurn();
}

/* ── Defuse an entry ─────────────────────────────────────────────────── */
function defuseEntry(id, defuserId){
  const idx = S.journal.findIndex(e => e.id === id);
  if (idx < 0) return false;
  const e = S.journal[idx];
  if (!canDefuseEntry(e, defuserId)) return false;
  const d = S.players[defuserId];
  if (!d.cards.some(c => c.key === "defuse")) return false;

  const card = e.card, payload = e.payload, victimId = e.actor;
  const key = card.key;

  /* What a Nope aimed at this Defuse has to put back. Not "the state just
     before the Defuse" — that would leave the original card already resolved
     and any prompt it owed already dismissed, so an Attack Defused from its
     own discard window would end up costing nobody anything. Instead the
     Defuse is journalled against the state before the ORIGINAL card, with the
     original play recorded alongside it. Undo the Defuse and the card is
     simply played again, at the target it was first aimed at. */
  const preCard = e.snap;
  const redo = { card: card, actor: victimId, target: e.target, payload: payload };
  const answerable = { snap: preCard, redo: redo, nopeable: true,
                       spent: { pid: defuserId, key: "defuse" } };

  restoreAll(e.snap);
  S.journal.splice(idx);
  spendCard(d, "defuse");

  // The rewind put the defused card back in its owner's hand. It is spent
  // whichever way it ends up pointing, so take it out again here — otherwise
  // Defusing an Alter or a Favor handed the attacker their card back, and
  // Defusing anything else left a copy of it sitting in the discard pile as
  // well as in their hand.
  const origOwner = S.players[victimId];
  const oi = origOwner.cards.indexOf(card);
  if (oi >= 0) S.discard.push(origOwner.cards.splice(oi, 1)[0]);

  logMsg(`<b>${d.name}</b> Defuses <b>${KITTEN[key].name}</b>.`);

  // Alter the Future and Favor hand the card's power over rather than simply
  // reflecting it — the defuser names their own numbers or their own demand.
  if (key === "alter"){
    logAction(pdot(d) + " <b>Defuses</b> Alter the Future — they swap instead", "defend",
              Object.assign({ actor: defuserId }, answerable));
    beginAlterPick(defuserId, (a, b) => playResolved(
      { type:"card", card:{ key:"alter", synthetic:true }, actor:defuserId,
        target:null, payload:{ hexes:[a, b] }, quiet:true }));
    render();
    return true;
  }
  if (key === "favor"){
    logAction(pdot(d) + " <b>Defuses</b> the Favor — " + pdot(S.players[victimId]) +
              " owes them instead", "defend", Object.assign({ actor: defuserId }, answerable));
    const ag = agentOf(defuserId);
    const synth = { key:"favor", synthetic:true };
    if (ag && ag.favorWant){
      playResolved({ type:"card", card:synth, actor:defuserId, target:victimId,
                     payload:{ want: ag.favorWant(S.players[victimId]) }, quiet:true });
    } else {
      favorGuessDialog(synth, -1, victimId, defuserId);
    }
    render();
    return true;
  }

  // Everything else bounces straight back at whoever played it.
  logAction(pdot(d) + " <b>Defuses</b> " + KITTEN[key].name + " — it hits " +
            pdot(S.players[victimId]) + " instead", "defend",
            Object.assign({ actor: defuserId }, answerable));
  playResolved({ type:"card", card:{ key: key, flavor: card.flavor, synthetic:true },
                 actor:defuserId, target:victimId, payload:payload, quiet:true });
  render();
  return true;
}


/* One line describing a card being played. */
function describeCard(base){
  const who = S.players[base.actor];
  if (base.card.key === "alter" && base.payload && base.payload.hexes){
    const [ha, hb] = base.payload.hexes;
    return pdot(who) + " plays <b>Alter the Future</b>: swap <b>" + hexes[ha].number +
           "</b> (" + hexes[ha].terrain + ") ⇄ <b>" + hexes[hb].number + "</b> (" +
           hexes[hb].terrain + ")";
  }
  const flav = base.card.flavor ? " (" + base.card.flavor + ")" : "";
  const tgt = base.target === null || base.target === undefined
            ? "" : " on " + pdot(S.players[base.target]);
  return pdot(who) + " plays <b>" + KITTEN[base.card.key].name + "</b>" + flav + tgt;
}

/* Play a card. Nothing pauses: it resolves now and is journalled so that a
   Nope or Defuse can undo it afterwards. */
/* Play a card. Nothing pauses: it resolves now and is journalled so that a
   Nope or Defuse can undo it afterwards.

   `base.quiet` resolves the card without writing a journal entry of its own.
   That is how a Defuse turns a card around: the whole "no you" is ONE
   answerable line in the log rather than two, so a Nope aimed at it undoes
   the reflection and the Defuse together instead of picking one apart. */
function playResolved(base){
  const snap = base.quiet ? null : snapAll();   // taken while the card is still held
  const owner = S.players[base.actor];
  if (base.card && !base.card.synthetic){
    const i = owner.cards.indexOf(base.card);
    if (i >= 0) owner.cards.splice(i, 1);
    S.discard.push(base.card);
  }
  const aggressive = TARGETED.has(base.card.key) || base.card.key === "alter";
  if (!base.quiet){
    logAction(describeCard(base), aggressive ? "attack" : "info",
              { actor: base.actor, target: base.target, card: base.card,
                payload: base.payload, snap: snap });
  }
  logMsg(describeCard(base).replace(/<span[^>]*><\/span>/g, "") + ".");
  resolveCard(base);
}

/* Older call sites still say proposeAction. */
function proposeAction(base){ playResolved(base); }

/* Shared by a voluntary turn-Nope and the forced one after a win. */
function cancelTurn(actorId, wasWin){
  S.winner = null;
  if (S.phase === "over") S.phase = "main";
  S.select = null;
  const onTheirTurn = actorId === S.cur;
  if (onTheirTurn){
    wipeNopedTurn();                       // rewind the turn that earned it
  } else {
    // They crossed 10 on somebody else's turn, so there is no turn of theirs
    // to rewind — the Nope simply takes the points back.
    logMsg(`<b>${S.players[actorId].name}</b> reached 10 on another player's turn.`);
  }
  stripWinningPoints(S.players[actorId], wasWin);

  // The denial could not reduce them below 10 — their points are buildings and
  // Longest Road from earlier turns, which a Nope may not touch. Rather than
  // let them carry a silent win into the next turn, the win stands.
  if (S.unstoppable !== null && S.unstoppable !== undefined){
    const w = S.unstoppable;
    S.unstoppable = null;
    declareWinner(w);
    return;
  }
  if (onTheirTurn) advancePlayer();
  else { S.armed = null; render(); botTick(); }
}

/* Rewinding the turn is not always enough: a player sitting on 8 points with a
   Feral Kitten in hand is still on 10 the moment the settlement comes down,
   and would simply win again next turn. A cancelled win therefore destroys the
   points that carried them over — hidden Feral Kittens first, then the knights
   propping up Largest Army — until they are actually short of the target. */
function stripWinningPoints(p, wasWin){
  let ferals = 0;
  let guard = 0;
  // Noping a win costs a Feral Kitten outright, even when rewinding the turn
  // already dropped them under 10 — otherwise a player holding one simply
  // rebuilds the settlement next turn and wins again with the same card.
  //
  // Knights are deliberately NOT taken. One played on the cancelled turn is
  // already undone by wipeNopedTurn; knights from earlier turns, and the
  // Largest Army resting on them, were never part of what is being cancelled.
  let owed = wasWin ? 1 : 0;
  while ((owed > 0 || totalVP(p) >= 10) && guard++ < 25){
    if (owed > 0) owed--;
    const vi = p.cards.findIndex(c => c.key === "vp");
    if (vi < 0) break;                        // nothing left that can be taken
    p.cards.splice(vi, 1);                    // out of the game, not discarded
    ferals++;
  }
  if (totalVP(p) >= 10){
    // Their 10 points are buildings and Longest Road from earlier turns —
    // there is nothing a Nope is allowed to destroy. Let it stand rather
    // than leave them parked on 10 forever.
    logMsg(`<span style="color:#d98b4b"><b>${p.name}</b> is still on ` +
           `${totalVP(p)} — nothing left that a Nope can take.</span>`);
    S.unstoppable = p.id;
  }
  if (ferals){
    const what = ferals === 1 ? "a Feral Kitten" : ferals + " Feral Kittens";
    logMsg(`<span style="color:#d98b4b">The cancelled win costs <b>${p.name}</b> ${what}.</span>`);
    announce(pdot(p) + " loses " + what + " to the cancelled win", "big", 5600);
  }
}

/* ── Forced Nope on a win ────────────────────────────────────────────────
   If someone hits 10 VP, the next player in turn order who holds a Nope must
   spend it. Without that, everyone sits on their Nopes waiting for somebody
   else to spend theirs first.                                             */
function forcedNoperFor(winnerId){
  const n = S.players.length;
  for (let i = 1; i < n; i++){
    const id = (winnerId + S.dir * i + n * n) % n;
    if (id === winnerId) continue;
    if (S.players[id].cards.some(c => c.key === "nope")) return id;
  }
  return null;
}

function forcedWinNope(winner, pid){
  promptFor(pid);
  const p = S.players[pid];
  const i = p.cards.findIndex(c => c.key === "nope");
  S.discard.push(p.cards.splice(i, 1)[0]);
  logMsg(`<b>${winner.name}</b> reaches 10 VP — <b>${p.name}</b> is forced to Nope it.`);
  announce("🏆 " + pdot(winner) + " reached 10 VP — " + pdot(p) +
           " is <b>forced to Nope</b> it", "big", 6000);
  // Only the player being forced gets a prompt. Everyone else just sees it
  // happen — being asked to confirm somebody else's obligation is noise.
  if (isBot(pid)){ cancelTurn(winner.id, true); return; }
  openModal("Forced Nope", `
    <div class="warnbox"><b>${winner.name}</b> just reached 10 victory points.
    <b>${p.name}</b> is the next player in turn order holding a Nope, so they must
    spend it — no choice. ${winner.name}'s turn is cancelled and everything they
    gained this turn is destroyed, including whatever took them to 10.</div>`,
    [{ label:`Cancel ${winner.name}'s turn`, cls:"warn",
       fn: () => { closeModal(); cancelTurn(winner.id, true); } }]);
}

/* ══════════════════════════════════════════════════════════════════════
   TURN FLOW
   ══════════════════════════════════════════════════════════════════════ */

/* Ending a turn no longer polls the table for Nopes. A Nope must be played
   during the turn it is meant to cancel — once the turn is over it is too
   late, which also removes the prompt that fired after every single turn. */
function requestEndTurn(){
  if (netSend("endTurn")) return;
  if (S.select){ hint("Finish or cancel the current board action first."); return; }
  doEndTurn();
}

function doEndTurn(){
  if (S.extraTurn){
    S.extraTurn = false;
    S.phase = "roll";
    S.rolled = null;
    S.turnCounter++;
    S.turnRec = freshTurnRecord();
    logMsg(`<b>${cur().name}</b> takes another turn.`);
    openReactWindow();
    render();
    botTick();
    return;
  }
  advancePlayer();
}

function advancePlayer(){
  const n = S.players.length;
  let guard = 0;
  do {
    S.cur = (S.cur + S.dir + n) % n;
    guard++;
    if (cur().skipTokens > 0){
      cur().skipTokens--;
      logMsg(`<b>${cur().name}</b>'s turn is skipped.`);
      continue;
    }
    break;
  } while (guard < n * 3);

  S.phase = "roll";
  S.rolled = null;
  S.armed = null;
  S.turnCounter++;
  S.turnRec = freshTurnRecord();
  clearImplodeClock();
  // A few seconds of answering room before the new player may roll. The last
  // entry of the turn just ended stays live for exactly this long.
  openReactWindow();
  render();
  botTick();

  // Final sweep. A crossing can happen while the PREVIOUS turn was resolving —
  // cancelling a turn recomputes Longest Road, which can hand it to a third
  // player who was not being examined at the time. Guarded because resolving
  // that win re-enters this function.
  if (!S.sweeping){
    S.sweeping = true;
    try { checkVictory(); } finally { S.sweeping = false; }
  }
}

/* A win does not always land on the player whose turn it is. Building a
   settlement can cut someone's road and hand Longest Road to a THIRD player,
   and a cancelled turn can shift Longest Road or Largest Army the same way.
   Checking only the current player let those crossings pass unnoticed, so the
   player carried 10+ into their own turn — and a Nope there could not undo a
   win that had been earned on somebody else's turn. Every player is checked. */
function checkVictory(){
  if (S.winner !== null || S.phase === "over") return;
  let claimant = totalVP(cur()) >= 10 ? cur() : null;
  if (!claimant){
    for (const q of S.players)
      if (totalVP(q) >= 10 && (!claimant || totalVP(q) > totalVP(claimant))) claimant = q;
  }
  if (!claimant) return;
  // An Imploding Kitten makes its turn un-Nopeable, and that includes the win
  // it produces. The forced-Nope rule used to bypass this entirely.
  if (implodeActive() && claimant.id === S.cur){
    logMsg(`<b>${claimant.name}</b> wins on an imploded turn — no Nope can touch it.`);
    announce("\ud83d\udca5 " + pdot(claimant) + " wins on an <b>imploded turn</b> — un-Nopeable", "big");
    declareWinner(claimant.id);
    return;
  }
  // Not optional: the next player in turn order holding a Nope must spend it.
  const forced = forcedNoperFor(claimant.id);
  if (forced !== null) forcedWinNope(claimant, forced);
  else declareWinner(claimant.id);
}

function declareWinner(pid){
  const p = S.players[pid];
  S.winner = pid;
  S.phase = "over";
  S.select = null;
  S.armed = null;
  S.reactUntil = 0;
  clearReactClock();
  S.revealed = true;              // every hand is face up once the game is done
  clearImplodeClock();
  logMsg(`🏆 <b>${p.name}</b> wins with ${totalVP(p)} victory points!`);
  announce("🏆 " + pdot(p) + " wins with <b>" + totalVP(p) + "</b> victory points", "big");
  render();
  showStandings();
}

/* The final table, rebuilt on demand so it can be reopened after closing. */
function standingsHTML(){
  const p = S.players[S.winner];
  const rest = S.players.filter(q => q.id !== p.id)
                        .sort((a, b) => totalVP(b) - totalVP(a) ||
                                        (b.cities * 2 + b.settlements) - (a.cities * 2 + a.settlements));
  const order = [p].concat(rest);

  let h = `<p class="sub">Final standings — every hand is revealed.</p>
    <table class="rank"><tr><th></th><th>Player</th><th>Breakdown</th><th style="text-align:right">VP</th></tr>`;
  order.forEach((q, i) => {
    const bits = [];
    if (q.settlements) bits.push(`${q.settlements} settlement${q.settlements === 1 ? "" : "s"}`);
    if (q.cities)      bits.push(`${q.cities} cit${q.cities === 1 ? "y" : "ies"} (+${q.cities * 2})`);
    if (vpCards(q))    bits.push(`${vpCards(q)} Feral`);
    if (S.longestRoad.owner === q.id) bits.push("Longest Road +2");
    if (S.largestArmy.owner === q.id) bits.push(`Largest Army +2 (${q.knights}⚔)`);
    h += `<tr class="${i === 0 ? "win" : ""}">
            <td class="pl">${i + 1}</td>
            <td><span class="who"><span class="dot" style="background:${q.color}"></span>${q.name}</span></td>
            <td class="brk">${bits.length ? bits.join(" · ") : "—"}</td>
            <td class="tot">${totalVP(q)}</td>
          </tr>`;
  });
  h += `</table>`;

  // What everyone was still holding at the end.
  h += `<h4 style="margin:14px 0 6px;font-size:13px">Kitten cards still in hand</h4>`;
  for (const q of order){
    const counts = {};
    for (const c of q.cards){
      const nm = KITTEN[c.key].name;
      counts[nm] = (counts[nm] || 0) + 1;
    }
    const names = Object.keys(counts)
      .map(nm => `<span class="rchip">${counts[nm] > 1 ? counts[nm] + "× " : ""}${nm}</span>`);
    h += `<div class="artrow" style="align-items:flex-start">
            <span class="dot" style="background:${q.color};margin-top:4px"></span>
            <span class="f" style="color:var(--ink)">${
              names.length ? names.join(" ") : "<i style='color:var(--dim)'>nothing</i>"}</span>
          </div>`;
  }
  return h;
}

function showStandings(){
  if (S.winner === null) return;
  openModal(`${S.players[S.winner].name} wins`, standingsHTML(), [
    { label:"Review board", fn: () => { closeModal(); render(); } },
    { label:"New Game", cls:"primary", fn: () => { closeModal(); newGameDialog(); } }
  ]);
}

/* ══════════════════════════════════════════════════════════════════════
   TRADING
   ══════════════════════════════════════════════════════════════════════ */

function bankTradeDialog(){
  if (netSend("bankTrade")) return;
  promptFor(S.cur);
  if (!myTurnNow()) return;
  const p = cur();
  const give_ = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };   // in LOTS, not cards
  const get_  = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };   // in single cards

  const lots  = () => RES.reduce((n, r) => n + give_[r], 0);
  const units = () => RES.reduce((n, r) => n + get_[r], 0);
  const cost  = (r) => give_[r] * tradeRate(p, r);

  const refresh = () => {
    const spend = {};
    for (const r of RES) spend[r] = cost(r);

    let h = `<p class="sub">Click to stack up as many exchanges as you like, then make
             them all at once. Each click on the left is one lot at your rate for that
             resource; each click on the right is one card back.</p>`;

    h += `<div style="margin-bottom:5px;color:var(--dim);font-size:12.5px">Give — click to add a lot</div><div class="pick">`;
    for (const r of RES){
      const rate = tradeRate(p, r);
      const room = p.res[r] - cost(r) >= rate;
      h += `<button ${room ? "" : "disabled"} onclick="window.__bGive('${r}')"
              title="${rate}:1 — you hold ${p.res[r]}">
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:5px"></span>
              ${rate}× ${RES_NAME[r]}${give_[r] ? ` <b>×${give_[r]}</b>` : ""}
              <span style="opacity:.55">(${p.res[r]})</span></button>`;
    }
    h += `</div>`;

    h += `<div style="margin:10px 0 5px;color:var(--dim);font-size:12.5px">Receive — click to add one</div><div class="pick">`;
    for (const r of RES){
      const room = S.bank[r] - get_[r] > 0;
      h += `<button ${room ? "" : "disabled"} onclick="window.__bGet('${r}')"
              title="bank has ${S.bank[r]}">
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:5px"></span>
              ${RES_NAME[r]}${get_[r] ? ` <b>×${get_[r]}</b>` : ""}
              <span style="opacity:.55">(${S.bank[r]})</span></button>`;
    }
    h += `</div>`;

    const bal = lots() === units() && lots() > 0;
    h += `<div class="stack" style="margin-top:10px">
            <div>Give ${resList(spend)}</div>
            <div>Take ${resList(get_)}</div>
            ${lots() !== units()
               ? `<div style="color:var(--accent);margin-top:4px">${lots()} lot${lots() === 1 ? "" : "s"}
                  given vs ${units()} card${units() === 1 ? "" : "s"} taken — these must match.</div>`
               : ""}
          </div>`;

    openModal("Bank / Port Trade", h, [
      { label:"Clear", fn: () => { for (const r of RES){ give_[r] = 0; get_[r] = 0; } refresh(); } },
      { label:"Cancel", fn: () => { closeModal(); render(); } },
      { label:"Trade", cls:"primary", disabled: !bal, fn: () => {
          closeModal();
          for (const r of RES) if (spend[r]) take(p, r, spend[r]);
          for (const r of RES) if (get_[r])  give(p, r, get_[r]);
          logMsg(`<b>${p.name}</b> trades with the bank.`);
          announce(pdot(p) + " banks " + resList(spend) + " → " + resList(get_), "info");
          render();
        } }
    ]);
  };

  window.__bGive = (r) => {
    if (p.res[r] - cost(r) >= tradeRate(p, r)) give_[r]++;
    refresh();
  };
  window.__bGet = (r) => {
    if (S.bank[r] - get_[r] > 0) get_[r]++;
    refresh();
  };
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════
   OPEN TRADE
   ══════════════════════════════════════════════════════════════════════
   Build one offer, put it to the whole table at once, then pick from
   whoever accepted. Bots answer immediately; other humans (hot-seat) get
   Accept / Decline buttons in the same list.
   ══════════════════════════════════════════════════════════════════════ */
function playerTradeDialog(){
  if (netSend("playerTrade")) return;
  // The whole negotiation sits on the offering player's screen: they click
  // Accept or Decline as the table answers out loud. A hot-seat habit, but it
  // survives going online intact, and you will be on a call anyway.
  promptFor(S.cur);
  const p = cur();
  const offer = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  const want  = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  let replies = null;                 // playerId -> "yes" | "no" | "wait"

  const fmt = o => RES.filter(r => o[r] > 0).map(r => o[r] + " " + RES_NAME[r]).join(", ") || "nothing";
  const others = () => S.players.filter(q => q.id !== p.id);
  const anyOffer = () => RES.some(r => offer[r] > 0) || RES.some(r => want[r] > 0);

  function counterRow(label, obj, fn){
    let h = `<div style="margin-bottom:4px;color:var(--dim);font-size:12.5px">${label}</div>`;
    for (const r of RES){
      h += `<div class="counter">
              <span class="lbl"><span class="swatch" style="background:${RES_COLOR[r]}"></span>${RES_NAME[r]}</span>
              <button class="sm" onclick="window.${fn}('${r}',-1)">−</button>
              <span class="val">${obj[r]}</span>
              <button class="sm" onclick="window.${fn}('${r}',1)">+</button>
            </div>`;
    }
    return h;
  }

  /* ── stage 1: compose ── */
  function compose(){
    let h = `<p class="sub">Put one offer to the whole table. Everyone answers, then you
             choose who to deal with.</p>
             <table class="trade"><tr><td style="vertical-align:top;width:50%">
             ${counterRow("You give", offer, "__tof")}
             </td><td style="vertical-align:top">
             ${counterRow("You want", want, "__twa")}
             </td></tr></table>`;
    openModal("Open Trade", h, [
      { label:"Cancel", fn: closeModal },
      { label:"Ask everyone", cls:"primary", disabled: !anyOffer(), fn: ask }
    ]);
  }

  /* ── stage 2: collect answers ── */
  function ask(){
    replies = {};
    for (const q of others()){
      const canPay = RES.every(r => q.res[r] >= want[r]);
      if (!canPay){ replies[q.id] = "cant"; continue; }
      const ag = agentOf(q.id);
      if (ag && ag.considerTrade) replies[q.id] = ag.considerTrade(p, q, offer, want) ? "yes" : "no";
      else replies[q.id] = "wait";        // a human at this table must answer
    }
    logMsg(`<b>${p.name}</b> offers ${fmt(offer)} for ${fmt(want)}.`);
    announce(pdot(p) + " offers a trade to the table", "info");
    results();
  }

  function results(){
    const list = others();
    const waiting = list.some(q => replies[q.id] === "wait");
    let h = `<div class="stack"><div>You give: <b>${fmt(offer)}</b></div>
             <div>You want: <b>${fmt(want)}</b></div></div>`;
    h += `<div style="margin-top:10px">`;
    for (const q of list){
      const st = replies[q.id];
      h += `<div class="counter">
              <span class="lbl"><span class="dot" style="background:${q.color}"></span><b>${q.name}</b></span>`;
      if (st === "wait"){
        h += `<button class="sm" onclick="window.__ans(${q.id},'yes')">Accept</button>
              <button class="sm" onclick="window.__ans(${q.id},'no')">Decline</button>`;
      } else if (st === "yes"){
        h += `<span style="color:#6fbf7a;font-size:12px;margin-right:8px">accepted</span>
              <button class="sm primary" onclick="window.__deal(${q.id})">Trade</button>`;
      } else if (st === "cant"){
        h += `<span style="color:var(--dim);font-size:12px">can't pay</span>`;
      } else {
        h += `<span style="color:#b06a6a;font-size:12px">declined</span>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
    if (!waiting && !list.some(q => replies[q.id] === "yes"))
      h += `<div class="warnbox">Nobody took it. Try a different offer.</div>`;

    openModal("Open Trade", h, [
      { label:"New offer", fn: compose },
      { label:"Done", cls:"primary", fn: () => { closeModal(); render(); } }
    ]);
  }

  window.__tof = (r, d) => { offer[r] = Math.max(0, Math.min(p.res[r], offer[r] + d)); compose(); };
  window.__twa = (r, d) => { want[r]  = Math.max(0, want[r] + d); compose(); };
  window.__ans = (qid, a) => { replies[qid] = a; results(); };
  window.__deal = (qid) => {
    const q = S.players[qid];
    if (!RES.every(r => q.res[r] >= want[r])){ replies[qid] = "cant"; results(); return; }
    for (const r of RES){
      p.res[r] -= offer[r]; q.res[r] += offer[r]; noteGain(q, r, offer[r]);
      q.res[r] -= want[r];  p.res[r] += want[r];  noteGain(p, r, want[r]);
    }
    logMsg(`<b>${p.name}</b> ⇄ <b>${q.name}</b>: gave ${fmt(offer)} for ${fmt(want)}.`);
    tradeToast(p, q, offer, want);
    closeModal();
    render();
  };

  compose();
}

/* ══════════════════════════════════════════════════════════════════════
   DISCARD DIALOG (used by the 7-roll and by Attack)
   ══════════════════════════════════════════════════════════════════════ */

function discardDialog(p, n, done){
  promptFor(p.id);
  const ag = agentOf(p.id);
  if (ag && ag.chooseDiscard){
    const pick = ag.chooseDiscard(p, n);
    for (const r of RES) take(p, r, pick[r] || 0);
    logMsg("<b>" + p.name + "</b> discards " + n + ".");
    render();
    setTimeout(done, AI_PACE);
    return;
  }
  const pick = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  const refresh = () => {
    const total = RES.reduce((s, r) => s + pick[r], 0);
    let h = `<p class="sub"><b>${p.name}</b> must discard <b>${n}</b> resource card${n === 1 ? "" : "s"}.</p>`;
    for (const r of RES){
      h += `<div class="counter">
              <span class="lbl"><span class="swatch" style="background:${RES_COLOR[r]}"></span>${RES_NAME[r]} — has ${p.res[r]}</span>
              <button class="sm" onclick="window.__dc('${r}',-1)">−</button>
              <span class="val">${pick[r]}</span>
              <button class="sm" onclick="window.__dc('${r}',1)">+</button>
            </div>`;
    }
    h += `<div class="stack">Discarding ${total} of ${n}</div>`;
    // An Attack can be Defused or Noped from right here, instead of being paid
    // for first. A discard forced by a 7 cannot — a die roll is not a card,
    // so promptReactions returns nothing and the queue is left alone.
    const react = promptReactions(p.id);
    openModal("Discard", h + (react.length ? reactNoteHTML() : ""), [
      { label:"Confirm", cls:"primary", disabled: total !== n, fn: () => {
          closeModal();
          for (const r of RES) take(p, r, pick[r]);
          logMsg(`<b>${p.name}</b> discards ${n}.`);
          render();
          done();
        } }
    ].concat(react));
  };
  window.__dc = (r, d) => {
    const total = RES.reduce((s, x) => s + pick[x], 0);
    if (d > 0 && (total >= n || pick[r] >= p.res[r])) return;
    pick[r] = Math.max(0, pick[r] + d);
    refresh();
  };
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════
   MODAL PLUMBING
   ══════════════════════════════════════════════════════════════════════ */

let modalEl = null;

/* Drawing and dismissing are split out from openModal/closeModal so that
   online play can hand a whole dialog to the browser it actually belongs to,
   and so that a dialog redrawing itself (every +/− on a counter reopens it)
   does not read as the dialog being dismissed. */
function drawLocalModal(title, bodyHTML, btnsHTML){
  dismissLocalModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal"><h2>${title}</h2>${bodyHTML}
    ${btnsHTML ? `<div class="actions">${btnsHTML}</div>` : ""}</div>`;
  document.body.appendChild(modalEl);
}
function dismissLocalModal(){
  if (modalEl){ modalEl.remove(); modalEl = null; }
}

/* Tag the dialog about to be opened as belonging to one seat. Online, that is
   what sends it to the right person instead of drawing it on the host's
   screen; offline it does nothing at all. */
function promptFor(pid){ if (window.NET) NET.promptSeat = pid; }

function openModal(title, bodyHTML, buttons){
  dismissLocalModal();
  if (window.NET && NET.shipModal && NET.shipModal(title, bodyHTML, buttons)) return;
  let btns = "";
  (buttons || []).forEach((b, i) => {
    btns += `<button class="${b.cls || ""}" ${b.disabled ? "disabled" : ""} onclick="window.__mb(${i})">${b.label}</button>`;
  });
  drawLocalModal(title, bodyHTML, btns);
  window.__mb = (i) => buttons[i].fn();
}
function closeModal(){
  dismissLocalModal();
  if (window.NET && NET.clearRemote) NET.clearRemote();
}
