<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exploding Catan</title>
<style>
  :root{
    --bg:#14171c; --panel:#1c2129; --panel2:#232936; --line:#333c4a;
    --ink:#e7ebf1; --dim:#95a1b3; --accent:#e2b33c; --danger:#d94b4b;
    --wood:#2f6b3a; --brick:#a4472a; --sheep:#7fb85c; --wheat:#dfae32; --ore:#78838f; --desert:#cdbb8e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  header .spacer{flex:1}
  button{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:6px 11px; cursor:pointer; font:inherit;
  }
  button:hover:not(:disabled){background:#2d3546; border-color:#4a5668}
  button:disabled{opacity:.35; cursor:not-allowed}
  button.primary{background:#2f5d3a; border-color:#3f7a4d}
  button.primary:hover:not(:disabled){background:#3a7248}
  button.warn{background:#6b2f2f; border-color:#8a3f3f}
  button.warn:hover:not(:disabled){background:#813a3a}
  button.sm{padding:3px 8px; font-size:12px}

  /* ── Player strip ────────────────────────────────────────────────── */
  #players{
    display:flex; gap:8px; padding:8px 10px; background:var(--panel);
    border-bottom:1px solid var(--line); flex:0 0 auto; overflow-x:auto;
  }
  .pcard{
    flex:1 1 0; min-width:128px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px;
  }
  .pcard.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
  .pcard.done{opacity:.55}
  .pcard .phead{display:flex; align-items:center; gap:7px; margin-bottom:6px}
  .pcard .pname{font-weight:600; font-size:13px; flex:1; white-space:nowrap}
  .pcard .you{font-size:9px; color:var(--accent); border:1px solid var(--accent);
              border-radius:3px; padding:0 3px; vertical-align:1px; letter-spacing:.3px}
  .pcard .pskip{font-size:10px; color:var(--danger); border:1px solid var(--danger);
                border-radius:4px; padding:0 4px}
  .stats{display:flex; gap:4px}
  .stat{
    flex:1 1 0; background:#0004; border:1px solid var(--line); border-radius:5px;
    padding:3px 0; text-align:center; min-width:0;
  }
  .stat b{display:block; font-size:14px; line-height:1.15; font-variant-numeric:tabular-nums}
  .stat span{display:block; font-size:8.5px; letter-spacing:.2px; color:var(--dim);
             text-transform:uppercase; white-space:nowrap; overflow:hidden}
  .stat.vp b{color:var(--accent)}
  .reveal{margin-top:6px; display:flex; flex-wrap:wrap; gap:3px}
  .revcard{
    font-size:9.5px; border:1px solid var(--line); border-radius:4px;
    padding:1px 4px; background:#0004; color:var(--ink); white-space:nowrap;
  }

  /* ── Stage (board + floating overlays) ───────────────────────────── */
  #stage{flex:1; position:relative; min-height:0; padding:6px}
  #boardArea{position:absolute; inset:6px}
  svg{width:100%; height:100%; touch-action:none; display:block}
  #leftbtns{position:absolute; left:10px; top:10px; z-index:5; display:flex; gap:6px}
  #leftbtns button{white-space:nowrap}
  #zoomWrap{
    position:absolute; right:12px; top:62px; z-index:4;
    display:flex; flex-direction:column; gap:4px;
  }
  #zoomWrap button{width:30px; text-align:center; padding:3px 0; font-size:14px; line-height:1}
  #deckWrap{position:absolute; right:12px; bottom:12px; z-index:3; transition:left .12s, top .12s}
  .rank{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
  .rank th{text-align:left; font-size:10px; letter-spacing:.5px; text-transform:uppercase;
           color:var(--dim); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line)}
  .rank td{padding:6px; border-bottom:1px solid #2a3140; font-variant-numeric:tabular-nums}
  .rank tr.win td{background:#1f3a2833}
  .rank .pl{width:30px; font-weight:700; color:var(--dim)}
  .rank tr.win .pl{color:var(--accent)}
  .rank .who{display:flex; align-items:center; gap:7px}
  .rank .tot{font-weight:700; text-align:right}
  .rank .brk{color:var(--dim); font-size:11px}
  .thinking{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:13px;
            font-style:italic; padding:0 8px}
  #implodeClock{
    position:absolute; left:50%; transform:translateX(-50%); top:8px; z-index:7;
    background:#3a1d1dF2; border:1px solid var(--danger); border-radius:8px;
    padding:6px 14px; font-size:13px; text-align:center; color:#ffd9d9;
    box-shadow:0 6px 20px #0009; pointer-events:none;
  }
  #implodeClock span{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  #implodeClock.urgent{border-color:#ff5a5a; animation:pulse .6s infinite alternate}
  /* The hand-over window between turns: the seconds in which a Nope, an
     Attack or a Defuse can still be thrown before the next player rolls. */
  #reactClock{
    position:absolute; left:50%; transform:translateX(-50%); top:8px; z-index:7;
    background:#12303aF2; border:1px solid #4bb1d9; border-radius:8px;
    padding:6px 14px; font-size:13px; text-align:center; color:#dff2fb;
    box-shadow:0 6px 20px #0009; pointer-events:none;
  }
  #reactClock span{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  #reactClock.bumped{animation:pulse .5s infinite alternate}
  @keyframes pulse{from{opacity:.75}to{opacity:1}}
  /* Running event feed. Newest at the bottom; older entries scroll up and out
     of sight but stay in the list, so you can scroll back through the game. */
  /* Floats over the board rather than taking a column from it. Clicks pass
     straight through, and there is no container or scrollbar — entries simply
     stack up from the bottom and the oldest are clipped off the top. */
  #feed{
    position:absolute; left:10px; top:52px; bottom:8px;
    width:clamp(170px, 19%, 280px); z-index:3;
    display:flex; flex-direction:column; gap:5px;
    overflow-y:auto; overflow-x:hidden;
    /* Scrollable, but with no visible track — the wheel works over the panel
       while the board keeps the wheel for zooming. */
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 44px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 44px);
  }
  /* Bottom-aligned via auto margin rather than justify-content: with
     justify-content:flex-end an overflowing column spills past the top edge
     and cannot be scrolled back to. */
  #feed > .ev:first-child{margin-top:auto}
  #feed::-webkit-scrollbar{width:0; height:0}
  #feed.hidden{display:none}
  #leftbtns button.on{background:#2f5d3a; border-color:#4d8a5f}
  .ev{
    background:#151a22ee; border:1px solid #ffffff14; border-left:4px solid var(--line);
    border-radius:6px; padding:6px 9px; font-size:12.5px; line-height:1.4;
    flex:0 0 auto; animation:evin .2s ease-out; backdrop-filter:blur(3px);
    box-shadow:0 3px 12px #0007; position:relative;
  }
  .ev b{font-weight:700}
  .ev .evturn{
    display:block; font-size:9.5px; letter-spacing:.4px; color:var(--dim);
    text-transform:uppercase; margin-bottom:2px;
  }
  .toast b{font-weight:700}
  .rchip{
    display:inline-block; border:1px solid #ffffff1a; border-left:3px solid var(--line);
    border-radius:4px; padding:0 5px; margin:1px 1px; font-size:11.5px;
    background:#0005; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .ev.roll{border-left-color:#7f8ba0}
  .ev.buy{border-left-color:#5a8f68}
  .ev.attack{border-left-color:var(--danger)}
  .ev.defend{border-left-color:#4bb1d9}
  .ev.info{border-left-color:#5a6478}
  .ev.big{
    border-left-color:var(--accent); background:#232a1c; font-size:13.5px;
    box-shadow:0 0 0 1px #e2b33c33 inset;
  }

  /* ── "you can answer this" markers ──────────────────────────────────
     Personal to whoever is sitting at the screen: a badge only appears on an
     entry THIS player still holds the card to answer, and it disappears the
     moment the next entry lands. Everyone else's feed shows nothing, so the
     badge never gives away what is in your hand. */
  .evmarks{
    position:absolute; top:-8px; right:3px; display:flex; gap:3px; z-index:2;
    pointer-events:none;   /* never steals the drop from the entry underneath */
  }
  .evmark{
    width:26px; height:26px; border-radius:50%; overflow:hidden; position:relative;
    border:2px solid; background:#0d1014; box-shadow:0 2px 8px #000a;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1;
  }
  .evmark img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .evmark.defuse{border-color:#4bb1d9; animation:markpop .9s ease-out infinite alternate}
  .evmark.nope{border-color:#c76b6b; opacity:.85}
  @keyframes markpop{
    from{box-shadow:0 2px 8px #000a, 0 0 0 0 #4bb1d900}
    to  {box-shadow:0 2px 8px #000a, 0 0 0 5px #4bb1d92e}
  }
  .ev.answerable{border-color:#4bb1d955}
  /* Rewound by a Nope or a Defuse: it happened, then it un-happened. */
  .ev.undone{opacity:.42; text-decoration:line-through}
  .ev.undone .evturn, .ev.undone .evmarks{text-decoration:none}
  /* The one entry still open to an answer. Its window closes as soon as the
     next entry arrives, so it is worth pointing at. */
  .ev.livewindow{box-shadow:0 3px 12px #0007, 0 0 0 1px #4bb1d94d inset}

  /* Reaction buttons carried inside a prompt, so an attack can be answered
     from the window it opened rather than after paying for it. */
  .reactnote{
    margin-top:10px; border-top:1px solid var(--line); padding-top:9px;
    font-size:12px; color:var(--dim);
  }
  .reactnote b{color:var(--ink)}
  .modal .actions button.react{background:#1d3a49; border-color:#4bb1d9; color:#dff2fb}
  .modal .actions button.react:hover:not(:disabled){background:#265066}
  .modal .actions button.reactno{background:#4a2230; border-color:#c76b6b; color:#ffdede}
  .modal .actions button.reactno:hover:not(:disabled){background:#5e2b3c}
  @keyframes evin{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
  #diceWrap{position:absolute; right:12px; top:10px; z-index:3; display:flex; align-items:center; gap:8px}
  .die{
    width:44px; height:44px; border-radius:9px; background:#f2ead6; border:1px solid #0b0d10;
    box-shadow:0 3px 10px #0008; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr);
    padding:6px; gap:1px; flex:0 0 auto;
  }
  .die i{border-radius:50%; background:#242424; width:8px; height:8px; align-self:center; justify-self:center}
  .die i.off{background:transparent}
  .die.roll{animation:tumble .45s ease-out}
  @keyframes tumble{
    0%{transform:rotate(-18deg) scale(.8)} 60%{transform:rotate(10deg) scale(1.08)} 100%{transform:none}
  }
  .dicesum{
    font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink);
    background:#0b0d10cc; border:1px solid var(--line); border-radius:8px; padding:5px 11px;
  }
  .dicesum.seven{color:var(--danger); border-color:var(--danger)}

  /* vertical dice histogram */
  .vchart{display:flex; align-items:flex-end; gap:5px; height:190px; margin:10px 0 4px}
  .vcol{flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
  .vcol .vb{width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px}
  .vcol.seven .vb{background:var(--danger)}
  .vcol .vn{font-size:11px; color:var(--dim); margin-top:4px; font-variant-numeric:tabular-nums}
  .vcol.seven .vn{color:var(--danger)}
  .vcol .vc{font-size:11px; font-weight:600; margin-bottom:3px; font-variant-numeric:tabular-nums}
  /* Its own strip between board and bottom bar, so it can never cover a hex. */
  #hintbar{
    flex:0 0 auto; height:24px; line-height:24px; text-align:center;
    color:var(--accent); font-size:12.5px; background:#0f1218;
    border-top:1px solid var(--line); padding:0 10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transition:opacity .12s;
  }
  #hintbar.on{opacity:1}

  /* Kitten deck */
  .deck{
    width:74px; height:104px; border-radius:9px; border:2px solid var(--line);
    background:linear-gradient(150deg,#2a3242,#1a1f29); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    box-shadow:0 5px 16px #0007; position:relative; overflow:hidden;
  }
  .deck img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .deck .cnt{position:relative; font-size:21px; font-weight:700; z-index:1; text-shadow:0 1px 4px #000}
  .deck .lbl{position:relative; font-size:9px; letter-spacing:.5px; color:var(--dim); z-index:1;
             text-transform:uppercase; text-shadow:0 1px 4px #000}
  .deck.buyable{border-color:#5a8f68}
  .deck.buyable:hover{transform:translateY(-2px); border-color:#7fc48f}
  .deck.dim{opacity:.45; cursor:not-allowed}
  .deckcost{font-size:10px; color:var(--dim); text-align:center; margin-top:4px; max-width:84px}

  /* ── Bottom bar ──────────────────────────────────────────────────── */
  #bottom{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 10px; display:flex; align-items:center; gap:10px;
  }
  .group{display:flex; gap:5px; align-items:center}
  .group.hand{flex-wrap:wrap; justify-content:center; max-width:100%; padding-bottom:2px}
  .sep{width:1px; align-self:stretch; background:var(--line); flex:0 0 auto}
  .slot{
    width:52px; height:70px; border-radius:7px; border:1px solid var(--line);
    background:#0004; position:relative; overflow:hidden; flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:4px;
  }
  .slot .swatchbig{position:absolute; inset:0; opacity:.30}
  .slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .slot .n{position:relative; font-size:17px; font-weight:700; z-index:1; text-shadow:0 1px 4px #000;
           font-variant-numeric:tabular-nums}
  .slot .rn{position:relative; font-size:8.5px; letter-spacing:.3px; color:#e7ebf1cc; z-index:1;
            text-transform:uppercase; text-shadow:0 1px 4px #000}
  .slot.zero{opacity:.4}

  .kcard{
    width:52px; height:70px; border-radius:7px; border:1px solid var(--line); flex:0 0 auto;
    background:linear-gradient(160deg,#2c3444,#1c222c); position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:3px;
    cursor:grab;
    /* The card is dragged by hand (pointer events), never by the browser's own
       drag-and-drop. Without these the browser grabs the <img> instead and
       offers to open the picture in a new window when it is dropped. */
    -webkit-user-drag:none; user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  /* Art comes in assorted sizes, so every card is cropped to one 5:7 tile.
     The rounding lives on the image because the tile can no longer clip
     (a clipping tile would cut off the hover preview). */
  .kcard img{position:absolute; inset:0; width:100%; height:100%;
             object-fit:cover; border-radius:6px;
             -webkit-user-drag:none; user-select:none; pointer-events:none}

  /* The card grows in place rather than spawning a preview. Growth is anchored
     to the bottom edge, so the preview always rises into the board and can
     never fall off the bottom of the screen whatever size the card is.
     ONE hover rule covers every card: the old per-state rules quietly
     overrode this one, which is why some cards barely moved. */
  .kcard{transition:transform .12s ease-out, box-shadow .12s ease-out;
         transform-origin:bottom center}
  .kcard:hover{
    transform:translateY(-10px) scale(3.4); z-index:40;
    box-shadow:0 16px 44px #000d;
  }
  /* Nothing zooms while a card is being carried — the card under the pointer
     is the floating one, and a zooming neighbour would fight it. */
  body.dragging .kcard{transition:none}
  body.dragging .kcard:hover{transform:none; box-shadow:none; z-index:auto}
  body.dragging{cursor:grabbing}
  /* The gap left behind while the card is being carried around. */
  .kcard.picked{opacity:.22; filter:grayscale(.6)}

  /* The card actually being carried: a real, solid card under the pointer
     rather than the browser's washed-out drag image. */
  #dragGhost{
    position:fixed; left:0; top:0; z-index:200; pointer-events:none;
    width:52px; height:70px; border-radius:7px; border:1px solid var(--accent);
    background:linear-gradient(160deg,#2c3444,#1c222c);
    box-shadow:0 18px 40px #000e; will-change:transform;
    transform-origin:center center;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:3px;
  }
  #dragGhost img{position:absolute; inset:0; width:100%; height:100%;
                 object-fit:cover; border-radius:6px}
  #dragGhost .kn{position:relative; z-index:1; font-size:9px; line-height:1.1;
                 text-align:center; text-shadow:0 1px 3px #000; padding:0 2px}
  #dragGhost.over{border-color:#8fe0a0; box-shadow:0 18px 40px #000e, 0 0 0 3px #8fe0a055}

  /* Where a dragged card may be dropped. */
  body.dragging .pcard.droppable{outline:2px dashed var(--accent); outline-offset:2px}
  body.dragging .ev.droppable{outline:2px dashed var(--accent); outline-offset:1px}
  body.dragging #boardArea.droppable{outline:2px dashed var(--accent); outline-offset:-6px}
  body.dragging .hand.droppable{outline:2px dashed #7f8ba0; outline-offset:3px; border-radius:8px}
  .ev.dropping, .pcard.dropping{background:#2a3320}
  .kcard .kn{position:relative; z-index:1; font-size:9px; line-height:1.1; text-align:center;
             text-shadow:0 1px 3px #000; padding:0 2px}
  .kcard.playable{border-color:#5a8f68}
  .kcard.playable:hover{border-color:#7fc48f}
  .kcard.locked{opacity:.42; cursor:not-allowed}
  .kcard.reaction{border-color:#6b5a8f}
  .kcard.offturn{border-color:#c76b6b}
  .kcard.offturn:hover{border-color:#e08a8a}
  /* A reaction that could be spent on the newest log entry right now. */
  .kcard.armedreact{border-color:#4bb1d9; box-shadow:0 0 0 2px #4bb1d955}
  .kcard .pip.now{background:#a33; color:#fff}
  .kcard .pip{position:absolute; top:2px; right:3px; z-index:2; font-size:8px; color:#fff;
              background:#0009; border-radius:3px; padding:0 3px}
  .emptyhand{color:var(--dim); font-size:12px; padding:0 6px; white-space:nowrap}
  .bside{flex:1 1 0; min-width:0; display:flex; align-items:center}
  .bside.right{justify-content:flex-end}
  .bcentre{display:flex; align-items:center; gap:10px; flex:0 0 auto}
  .actions-bar{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  .actions-bar button{padding:9px 15px}

  /* ── Log / dice modals ───────────────────────────────────────────── */
  .logbox{max-height:52vh; overflow-y:auto; font-size:12.5px; color:var(--dim);
          background:#12151a; border:1px solid var(--line); border-radius:6px; padding:9px 11px}
  .logbox div{margin-bottom:3px}
  .logbox b{color:var(--ink); font-weight:600}
  .dicerow{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:2px 0}
  .dicerow .dn{width:22px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
  .dicebar{height:12px; border-radius:3px; background:var(--accent); min-width:2px}
  .dicerow .dc{width:26px; color:var(--dim); font-variant-numeric:tabular-nums}
  .recent{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px}
  .recent span{background:#0004; border:1px solid var(--line); border-radius:4px;
               padding:1px 6px; font-size:12px; font-variant-numeric:tabular-nums}
  .recent span.seven{border-color:var(--danger); color:var(--danger)}

  @media (max-width:900px){
    #feed{width:150px}
    .ev{font-size:11px; padding:4px 6px}
    #leftbtns{flex-direction:column}
    #feed{top:78px}
  }
  @media (max-width:820px){
    .pcard{min-width:132px}
    .pcard .pname{font-size:12px}
    .stat b{font-size:12.5px}
    .slot,.kcard{width:44px; height:60px}
  }

  .overlay{
    position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:18px;
    box-shadow:0 18px 50px #0008;
  }
  .modal h2{margin:0 0 4px; font-size:17px}
  .modal p.sub{margin:0 0 14px; color:var(--dim); font-size:13px}
  .modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
  .counter{display:flex; align-items:center; gap:8px; padding:5px 0}
  .counter .lbl{flex:1; display:flex; align-items:center; gap:6px}
  .counter .val{width:26px; text-align:center; font-variant-numeric:tabular-nums}
  .pick{display:flex; gap:6px; flex-wrap:wrap}
  .pick button.on{background:#2f5d3a; border-color:#4d8a5f}

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONSTANTS
   ══════════════════════════════════════════════════════════════════════ */

const RES = ["wood","brick","sheep","wheat","ore"];
const RES_NAME = {wood:"Wood", brick:"Brick", sheep:"Sheep", wheat:"Wheat", ore:"Ore"};
const RES_COLOR = {wood:"#2f6b3a", brick:"#a4472a", sheep:"#7fb85c", wheat:"#dfae32", ore:"#78838f", desert:"#cdbb8e"};
const PLAYER_COLORS = ["#d94b4b","#4b7fd9","#e08a2e","#e8e8e8","#59b364","#a86fd0"];
const PLAYER_NAMES  = ["Red","Blue","Orange","White","Green","Purple"];

const COST = {
  road:       {wood:1, brick:1},
  settlement: {wood:1, brick:1, sheep:1, wheat:1},
  city:       {wheat:2, ore:3}
};
const LIMIT = {road:15, settlement:5, city:4};
let BANK_PER_RES = 19;

// ── Kitten deck (54 cards) ───────────────────────────────────────────────
// Reverse count is inferred: the doc lists no number, and 54 − (all others) = 5.
const KITTEN = {
  implode: {name:"Imploding Kitten", count:1,  kind:"auto",
    text:"When drawn, immediately take every other player's entire resource hand. It cannot be Noped, Defused or refuted in any way — even a cancelled turn does not undo it."},
  vp:      {name:"Feral Kitten", count:3,  kind:"vp",
    text:"Worth 1 victory point. Kept hidden until you win."},
  skip:    {name:"Skip", count:5, kind:"target",
    text:"Skip a chosen player's next turn."},
  nope:    {name:"Nope", count:5, kind:"response",
    text:"Two uses only: cancel an attack aimed at you, or cancel a player's whole turn. A cancelled turn destroys everything they gained that turn. If someone reaches 10 points, the next player in turn order holding a Nope must spend it."},
  explode: {name:"Exploding Kitten", count:5, kind:"target",
    text:"Return a chosen player's entire resource hand to the bank."},
  defuse:  {name:"Defuse", count:5, kind:"response",
    text:'"No you." Reflect an attack aimed at you back onto the player who played it.'},
  alter:   {name:"Alter the Future", count:5, kind:"board",
    text:"Swap any two number tokens on the board."},
  attack:  {name:"Attack", count:5, kind:"target",
    text:"A chosen player discards 3 resource cards of their choice."},
  favor:   {name:"Favor", count:5, kind:"target",
    text:"Name 3 resource cards. A chosen player gives you whichever of them they actually hold."},
  reverse: {name:"Reverse", count:5, kind:"self",
    text:"Take another turn immediately, then turn order reverses."},
  knight:  {name:"Knight", count:10, kind:"knight",
    text:"Move the robber and steal 1 resource from a player on that hex. Counts toward Largest Army."}
};
const KNIGHT_FLAVOR = ["Beard Cat","Watermelon Cat","Potato Cat","Rainbow Cat","Taco Cat"];

/* Playable on anyone's turn, not just your own: a Nope to cancel the turn in
   progress, and the two direct attacks. */
const OFF_TURN = new Set(["nope","attack","explode"]);

// Cards that name a player when played, and can therefore be Defused in the
// response window. Knight is handled separately — it picks its victim later,
// so its Defuse chance comes at the moment of the steal.
const TARGETED = new Set(["skip","explode","attack","favor"]);

/* ══════════════════════════════════════════════════════════════════════
   CUSTOM ART
   ══════════════════════════════════════════════════════════════════════
   Drop files into ./art/ and they are picked up on load. Anything missing
   falls back to the procedural drawing, so partial art sets work fine —
   send one hex tile and only that hex changes.

   Piece art (settlement/city/road/robber) is used as an ALPHA MASK and
   flooded with the player's colour, so the colour you draw in is irrelevant;
   only the silhouette matters. Hex art is clipped to the hexagon, so send
   squares that bleed to the edges rather than pre-cut hexes.

   Header → "Art" lists every expected file and whether it loaded.
   ══════════════════════════════════════════════════════════════════════ */
/* Bots deliberately move slowly. The window for a Nope or a Defuse now
   closes as soon as the NEXT entry reaches the log, so a fast bot would slam
   it shut before a human could reach for a card. */
let AI_PACE = 3000;         // ms between visible bot actions
const ART_DIR = "art/";
const ART = { hex:{}, res:{}, piece:{}, token:{}, card:{} };
const ART_MANIFEST = [];
let artLoaded = 0, artTotal = 0;

function buildArtManifest(){
  for (const t of RES.concat(["desert"]))
    ART_MANIFEST.push({ kind:"hex", key:t, file:`hex-${t}.png` });
  for (const r of RES)
    ART_MANIFEST.push({ kind:"res", key:r, file:`res-${r}.png` });
  for (const p of ["settlement","city","road","robber"])
    ART_MANIFEST.push({ kind:"piece", key:p, file:`piece-${p}.svg` });
  ART_MANIFEST.push({ kind:"token", key:"blank", file:"token-blank.png" });
  for (const k in KITTEN){
    if (k === "knight") continue;
    ART_MANIFEST.push({ kind:"card", key:k, file:`card-${k}.png` });
  }
  for (const f of KNIGHT_FLAVOR){
    const slug = f.split(" ")[0].toLowerCase();
    ART_MANIFEST.push({ kind:"card", key:"knight-" + slug, file:`card-knight-${slug}.png` });
  }
  ART_MANIFEST.push({ kind:"card", key:"back", file:"card-back.png" });
  artTotal = ART_MANIFEST.length;
}

/* Probing with <img> rather than fetch() on purpose: fetch() is blocked by
   CORS on file:// pages, but image loads are not. Missing files log a 404 in
   the console — harmless, and expected until the art folder is filled in. */
function preloadArt(done){
  buildArtManifest();
  let pending = ART_MANIFEST.length;
  for (const a of ART_MANIFEST){
    const img = new Image();
    img.onload  = () => { ART[a.kind][a.key] = a.file; artLoaded++; if (!--pending) done(); };
    img.onerror = () => { ART[a.kind][a.key] = null;              if (!--pending) done(); };
    img.src = ART_DIR + a.file;
  }
}

function art(kind, key){
  const f = ART[kind] && ART[kind][key];
  return f ? ART_DIR + f : null;
}
function knightArtKey(c){
  return c && c.flavor ? "knight-" + c.flavor.split(" ")[0].toLowerCase() : null;
}
function cardArt(c){
  return c.key === "knight" ? art("card", knightArtKey(c)) : art("card", c.key);
}

let HEX_SIZE = 54;

/* Base game: 19 hexes. The 5-6 player extension adds 11 more for a 30-hex
   board laid out in rows of 3-4-5-6-5-4-3, with two deserts, 28 number
   tokens, 11 ports and five extra of each resource in the bank. */
const BOARD = {
  small: {
    rows: null,                       // radius-2 hexagon, generated directly
    size: 54, ports: 9, bank: 19,
    terrain: ["wood","wood","wood","wood","brick","brick","brick",
              "sheep","sheep","sheep","sheep","wheat","wheat","wheat","wheat",
              "ore","ore","ore","desert"],
    numbers: [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]
  },
  large: {
    rows: [3,4,5,6,5,4,3],
    size: 44, ports: 11, bank: 24,
    terrain: ["wood","wood","wood","wood","wood","wood",
              "brick","brick","brick","brick","brick",
              "sheep","sheep","sheep","sheep","sheep","sheep",
              "wheat","wheat","wheat","wheat","wheat","wheat",
              "ore","ore","ore","ore","ore",
              "desert","desert"],
    numbers: [2,2,3,3,3,4,4,4,5,5,5,6,6,6,8,8,8,9,9,9,10,10,10,11,11,11,12,12]
  }
};
let BOARDSET = BOARD.small;
let NUMBERS = BOARDSET.numbers;
let TERRAIN = BOARDSET.terrain;
let BANK_PER_RES_CUR = BOARDSET.bank;

/* 5 or 6 players uses the extension board. */
function boardFor(numPlayers){ return numPlayers >= 5 ? BOARD.large : BOARD.small; }

/* Axial coordinates for whichever board is in play. */
function hexLayout(set){
  const out = [];
  if (!set.rows){
    for (let q = -2; q <= 2; q++)
      for (let r = -2; r <= 2; r++)
        if (Math.abs(q + r) <= 2) out.push({ q, r });
    return out;
  }
  const mid = (set.rows.length - 1) / 2;
  set.rows.forEach((n, i) => {
    const r = i - mid;
    // centre each row on the axis so the board comes out symmetric
    const qmin = Math.round(-(n - 1) / 2 - r / 2);
    for (let k = 0; k < n; k++) out.push({ q: qmin + k, r });
  });
  return out;
}

/* ══════════════════════════════════════════════════════════════════════
   BOARD GEOMETRY
   ══════════════════════════════════════════════════════════════════════ */

let hexes = [], vertices = [], edges = [];

function axialCenter(q, r){
  return { x: HEX_SIZE * Math.sqrt(3) * (q + r/2), y: HEX_SIZE * 1.5 * r };
}
function cornerPoints(cx, cy){
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push({ x: cx + HEX_SIZE * Math.cos(a), y: cy + HEX_SIZE * Math.sin(a) });
  }
  return pts;
}

function buildGeometry(){
  hexes = []; vertices = []; edges = [];
  const vKey = new Map(), eKey = new Map();

  for (const a of hexLayout(BOARDSET)){
    const c = axialCenter(a.q, a.r);
    hexes.push({ id: hexes.length, q: a.q, r: a.r, x: c.x, y: c.y,
                 terrain: null, number: null, verts: [], edges: [] });
  }

  for (const h of hexes){
    const pts = cornerPoints(h.x, h.y);
    const ids = pts.map(p => {
      // Distinct corners sit ~54px apart, so 1px quantization safely dedupes
      // without ever merging two genuinely different vertices.
      const k = Math.round(p.x) + "," + Math.round(p.y);
      if (!vKey.has(k)){
        vKey.set(k, vertices.length);
        vertices.push({ id: vertices.length, x: p.x, y: p.y, hexes: [], edges: [], adj: [],
                        owner: null, type: null, port: null });
      }
      return vKey.get(k);
    });
    h.verts = ids;
    for (const vid of ids) vertices[vid].hexes.push(h.id);

    for (let i = 0; i < 6; i++){
      const a = ids[i], b = ids[(i + 1) % 6];
      const k = Math.min(a, b) + "-" + Math.max(a, b);
      if (!eKey.has(k)){
        eKey.set(k, edges.length);
        edges.push({ id: edges.length, v: [a, b], hexes: [], owner: null, port: null });
      }
      const eid = eKey.get(k);
      edges[eid].hexes.push(h.id);
      h.edges.push(eid);
      if (!vertices[a].edges.includes(eid)) vertices[a].edges.push(eid);
      if (!vertices[b].edges.includes(eid)) vertices[b].edges.push(eid);
      if (!vertices[a].adj.includes(b)) vertices[a].adj.push(b);
      if (!vertices[b].adj.includes(a)) vertices[b].adj.push(a);
    }
  }
}

function placePorts(){
  // Coastal edges touch exactly one hex. Spread 9 ports around the ring.
  const coast = edges.filter(e => e.hexes.length === 1);
  coast.sort((a, b) => {
    const am = midOf(a), bm = midOf(b);
    return Math.atan2(am.y, am.x) - Math.atan2(bm.y, bm.x);
  });
  const n = BOARDSET.ports;
  const kinds = ["wood","brick","sheep","wheat","ore"];
  while (kinds.length < n) kinds.push("3:1");          // the rest are generic
  shuffle(kinds);
  // Spread them as evenly as the coastline allows.
  for (let i = 0; i < n; i++){
    const e = coast[Math.round(i * coast.length / n) % coast.length];
    e.port = kinds[i];
    for (const vid of e.v) vertices[vid].port = kinds[i];
  }
}
function midOf(e){
  const a = vertices[e.v[0]], b = vertices[e.v[1]];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function dealTerrain(){
  // Reshuffle until no two red numbers (6 / 8) sit on adjacent hexes. With six
  // reds on the extension board this can take longer, so allow more attempts
  // and fall through to the last shuffle rather than looping forever.
  for (let attempt = 0; attempt < 3000; attempt++){
    const terr = shuffle(TERRAIN.slice());
    const nums = shuffle(NUMBERS.slice());
    let n = 0;
    hexes.forEach((h, i) => {
      h.terrain = terr[i];
      h.number  = terr[i] === "desert" ? null : nums[n++];
    });
    if (!hasAdjacentReds()) return;
  }
}
function hasAdjacentReds(){
  for (const h of hexes){
    if (h.number !== 6 && h.number !== 8) continue;
    for (const o of hexes){
      if (o.id === h.id) continue;
      if (o.number !== 6 && o.number !== 8) continue;
      const shared = h.verts.filter(v => o.verts.includes(v)).length;
      if (shared >= 2) return true;   // sharing an edge = adjacent
    }
  }
  return false;
}

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ══════════════════════════════════════════════════════════════════════
   AGENTS
   ══════════════════════════════════════════════════════════════════════
   Seats can be driven by a bot instead of the UI. ai.js registers agents
   here; every decision that would normally open a modal checks for one
   first and asks it instead. With no ai.js present this is inert and the
   game behaves exactly as the pure hot-seat game it was.
   ══════════════════════════════════════════════════════════════════════ */
window.AGENTS = window.AGENTS || {};
function agentOf(pid){ return window.AGENTS ? (window.AGENTS[pid] || null) : null; }

/* Online, a browser that is not the host decides nothing: it says what the
   player did and waits to be told what came of it. Returns true when the
   caller should stop here. Offline this is always false and costs nothing. */
function netSend(type, args){
  return !!(window.NET && NET.sendIntent && NET.sendIntent(type, args));
}
function isBot(pid){ return !!agentOf(pid); }
function anyBots(){ return S && S.players.some(p => isBot(p.id)); }

/* Which seat the bottom bar belongs to. In a bot game that is always the
   human's own seat — never the current player, or a bot's hand would be on
   screen (and clickable) whenever a prompt handed us control mid-bot-turn. */
function viewSeat(){
  // Online, the bottom bar is always your own seat, whoever is playing.
  if (window.NET && NET.isOnline && NET.isOnline() && NET.mySeat() !== null) return NET.mySeat();
  if (!anyBots()) return S.cur;
  for (const p of S.players) if (!isBot(p.id)) return p.id;
  return S.cur;
}
function viewPlayer(){ return S.players[viewSeat()]; }

/* True when the UI must ignore board clicks because the active seat is a bot.
   Exceptions: the bot driver itself (__botActing), and prompts a human owns —
   for example the robber after we Defused a bot's knight. */
function uiBlocked(){
  if (window.NET && NET.isOnline && NET.isOnline()){
    // A prompt handed to you is yours to answer even on somebody else's turn.
    if (S.select && S.select.actor !== undefined) return S.select.actor !== viewSeat();
    return S.cur !== viewSeat();
  }
  if (!anyBots()) return false;
  if (window.__botActing) return false;
  if (S.select && S.select.actor !== undefined && !isBot(S.select.actor)) return false;
  return isBot(S.cur);
}
/* ai.js overrides this to drive a bot seat forward. */
function botTick(){}

/* ══════════════════════════════════════════════════════════════════════
   GAME STATE
   ══════════════════════════════════════════════════════════════════════ */

let S = null;

function newGame(numPlayers){
  BOARDSET = boardFor(numPlayers);
  HEX_SIZE = BOARDSET.size;
  NUMBERS  = BOARDSET.numbers;
  TERRAIN  = BOARDSET.terrain;
  BANK_PER_RES = BOARDSET.bank;
  buildGeometry();
  dealTerrain();
  placePorts();

  const deck = [];
  let knightN = 0;
  for (const key in KITTEN){
    for (let i = 0; i < KITTEN[key].count; i++){
      const c = { key, id: deck.length, flavor: null };
      if (key === "knight") c.flavor = KNIGHT_FLAVOR[Math.floor(knightN++ / 2)];
      deck.push(c);
    }
  }
  shuffle(deck);

  const players = [];
  for (let i = 0; i < numPlayers; i++){
    players.push({
      id: i, name: PLAYER_NAMES[i], color: PLAYER_COLORS[i],
      res: { wood:0, brick:0, sheep:0, wheat:0, ore:0 },
      cards: [], knights: 0, skipTokens: 0,
      roads: 0, settlements: 0, cities: 0
    });
  }

  const desert = hexes.find(h => h.terrain === "desert");   // either one, on the large board
  const first = Math.floor(Math.random() * numPlayers);   // nobody always leads

  S = {
    players, deck, discard: [],
    bank: { wood:BANK_PER_RES, brick:BANK_PER_RES, sheep:BANK_PER_RES, wheat:BANK_PER_RES, ore:BANK_PER_RES },
    robber: desert.id,
    cur: first, dir: 1, turnCounter: 0, firstPlayer: first,
    phase: "setup1",          // setup1 | setup2 | roll | main | over
    setupNeed: "settlement",
    setupLastVertex: null,
    setupOrder: buildSetupOrder(numPlayers, first),
    setupIdx: 0,
    rolled: null,
    extraTurn: false,
    roadLens: S_zeroLens(numPlayers),
    longestRoad: { owner:null, len:0 },
    largestArmy: { owner:null, n:0 },
    select: null,             // {kind, ...} forced board interaction
    armed: null,              // {kind, id} spot awaiting a confirming second click
    diceLog: [],              // every roll this game, for the history panel
    pending: null,            // response-window stack
    turnRec: null,            // what the active player gained this turn
    zoom: 1, panX: 0, panY: 0,   // board view
    journal: [],              // every action, with the state that preceded it
    revealed: false,          // hands are face up once somebody has won
    unstoppable: null,        // a win the table had no legal way to deny
    sweeping: false,          // re-entrancy guard for the turn-start win sweep
    implodeTurn: -1,          // turn number made Nope-proof by an Imploding Kitten
    implodeBy: null,          // who drew it, so the seal outlives their turn
    implodeUntil: 0,          // wall-clock deadline for that turn
    reactUntil: 0,            // hand-over window: nobody rolls until this passes
    feed: [],                 // the on-screen event list, so it can be sent online
    log: [],
    winner: null
  };
  S.turnRec = freshTurnRecord();
  clearReactClock();
  clearFeed();
  logMsg("New game — " + numPlayers + " players. Deck: 54 kitten cards.");
  logMsg("<b>" + S.players[first].name + "</b> goes first.");
  logMsg("Setup: place your first settlement.");
  render();
}

function S_zeroLens(n){ const a = []; for (let i = 0; i < n; i++) a.push(0); return a; }

function buildSetupOrder(n, start){
  const fwd = [];
  for (let i = 0; i < n; i++) fwd.push((start + i) % n);
  return fwd.concat(fwd.slice().reverse());   // snake order from the first player
}

function cur(){ return S.players[S.cur]; }

/* ── Turn record (used by Nope-the-turn) ─────────────────────────────────
   A Noped turn is not rewound to a snapshot — everything the player gained
   that turn is DELETED FROM PLAY. Drawn kitten cards do not go back into the
   deck, a knight played that turn stops counting toward Largest Army, and
   roads laid that turn are lifted (so a Longest Road earned that turn is
   lost with them). Resources spent are still never refunded.

   Only the active player's own record is touched, so reaction cards other
   players spent answering the turn stay spent.                            */
function freshTurnRecord(){
  return {
    edges: [],                       // edge ids built this turn
    verts: [],                       // {vid, prevType} — null prevType = new settlement
    drawn: [],                       // kitten card objects drawn this turn
    knights: 0,                      // knights played this turn
    gained: { wood:0, brick:0, sheep:0, wheat:0, ore:0 }   // excl. Imploding Kitten
  };
}

/* Record resources flowing to the active player so a Nope can strip them.
   The Imploding Kitten is explicitly immune, so its haul is never recorded. */
function noteGain(p, r, n){
  if (!S.turnRec || !p || p.id !== S.cur || n <= 0) return;
  S.turnRec.gained[r] += n;
}

function wipeNopedTurn(){
  const p = cur(), rec = S.turnRec;
  const lost = [];

  for (const eid of rec.edges){ edges[eid].owner = null; p.roads--; }
  if (rec.edges.length) lost.push(rec.edges.length + " road" + (rec.edges.length === 1 ? "" : "s"));

  // Undo newest-first so a settlement→city upgrade unwinds before the build.
  for (let i = rec.verts.length - 1; i >= 0; i--){
    const { vid, prevType } = rec.verts[i];
    if (prevType === null){ vertices[vid].owner = null; vertices[vid].type = null; p.settlements--; }
    else { vertices[vid].type = "settlement"; p.cities--; p.settlements++; }
  }
  if (rec.verts.length) lost.push(rec.verts.length + " building" + (rec.verts.length === 1 ? "" : "s"));

  // Cards drawn this turn are destroyed, not returned to the deck.
  let vp = 0;
  for (const c of rec.drawn){
    const i = p.cards.indexOf(c);
    if (i >= 0) p.cards.splice(i, 1);
    if (c.key === "vp") vp++;
  }
  if (rec.drawn.length) lost.push(rec.drawn.length + " kitten card" + (rec.drawn.length === 1 ? "" : "s")
                                  + (vp ? " (incl. " + vp + " Feral)" : ""));

  if (rec.knights){ p.knights -= rec.knights; lost.push(rec.knights + " knight" + (rec.knights === 1 ? "" : "s")); }

  // Resources collected this turn go back to the bank.
  let res = 0;
  for (const r of RES){
    const n = Math.min(rec.gained[r], p.res[r]);
    if (n > 0){ p.res[r] -= n; S.bank[r] += n; res += n; }
  }
  if (res) lost.push(res + " resource" + (res === 1 ? "" : "s"));

  updateLongestRoad();
  updateLargestArmy();
  announce("🚫 " + pdot(p) + "'s turn is <b>cancelled</b>" +
           (lost.length ? " — lost " + lost.join(", ") : ""), "big", 5200);
  logMsg(`<span style="color:#d98b4b"><b>${p.name}</b>'s turn is cancelled — `
       + (lost.length ? "lost " + lost.join(", ") : "nothing to lose")
       + `. Resources already spent are gone too.</span>`);
}

/* ══════════════════════════════════════════════════════════════════════
   RESOURCES / BANK
   ══════════════════════════════════════════════════════════════════════ */

function totalRes(p){ return RES.reduce((s, r) => s + p.res[r], 0); }

function give(p, r, n){
  const actual = Math.min(n, S.bank[r]);
  p.res[r] += actual; S.bank[r] -= actual;
  noteGain(p, r, actual);
  return actual;
}
function take(p, r, n){
  const actual = Math.min(n, p.res[r]);
  p.res[r] -= actual; S.bank[r] += actual;
  return actual;
}
function canAfford(p, cost){ return Object.keys(cost).every(r => p.res[r] >= cost[r]); }
function pay(p, cost){ for (const r in cost) take(p, r, cost[r]); }

/* ══════════════════════════════════════════════════════════════════════
   VICTORY POINTS / LONGEST ROAD / LARGEST ARMY
   ══════════════════════════════════════════════════════════════════════ */

function vpCards(p){ return p.cards.filter(c => c.key === "vp").length; }
function publicVP(p){
  return p.settlements + p.cities * 2
       + (S.longestRoad.owner === p.id ? 2 : 0)
       + (S.largestArmy.owner === p.id ? 2 : 0);
}
function totalVP(p){ return publicVP(p) + vpCards(p); }

/* Longest continuous road. A path may END on a vertex holding an opponent's
   building but may not pass THROUGH it. */
function longestRoadFor(pid){
  let best = 0;
  const walk = (at, used, isStart) => {
    const v = vertices[at];
    if (!isStart && v.owner !== null && v.owner !== pid) return 0;  // broken here
    let local = 0;
    for (const eid of v.edges){
      const e = edges[eid];
      if (e.owner !== pid || used.has(eid)) continue;
      used.add(eid);
      const other = e.v[0] === at ? e.v[1] : e.v[0];
      local = Math.max(local, 1 + walk(other, used, false));
      used.delete(eid);
    }
    return local;
  };
  for (const v of vertices){
    if (!v.edges.some(eid => edges[eid].owner === pid)) continue;
    best = Math.max(best, walk(v.id, new Set(), true));
  }
  return best;
}

function updateLongestRoad(){
  let bestPid = S.longestRoad.owner, bestLen = S.longestRoad.owner === null ? 4 : S.longestRoad.len;
  const lens = S.players.map(p => longestRoadFor(p.id));
  // The current holder keeps it on ties; a challenger must strictly exceed.
  if (S.longestRoad.owner !== null){
    bestLen = lens[S.longestRoad.owner];
    bestPid = S.longestRoad.owner;
    if (bestLen < 5){ bestPid = null; bestLen = 4; }
  }
  for (const p of S.players){
    if (lens[p.id] >= 5 && lens[p.id] > bestLen){ bestLen = lens[p.id]; bestPid = p.id; }
  }
  if (bestPid !== S.longestRoad.owner && bestPid !== null)
  {
    logMsg(`<b>${S.players[bestPid].name}</b> takes Longest Road (${bestLen}).`);
    announce(pdot(S.players[bestPid]) + " takes <b>Longest Road</b> (" + bestLen + ")", "big");
  }
  S.roadLens = lens;              // cached so the player strip need not recompute
  S.longestRoad = { owner: bestPid, len: bestPid === null ? 0 : lens[bestPid] };
}

function updateLargestArmy(){
  let bestPid = S.largestArmy.owner;
  let bestN = S.largestArmy.owner === null ? 2 : S.players[S.largestArmy.owner].knights;
  // The holder loses the card if a cancelled turn drops them under three.
  if (bestPid !== null && bestN < 3){ bestPid = null; bestN = 2; }
  for (const p of S.players){
    if (p.knights >= 3 && p.knights > bestN){ bestN = p.knights; bestPid = p.id; }
  }
  if (bestPid !== S.largestArmy.owner && bestPid !== null)
  {
    logMsg(`<b>${S.players[bestPid].name}</b> takes Largest Army (${bestN} knights).`);
    announce(pdot(S.players[bestPid]) + " takes <b>Largest Army</b> (" + bestN + ")", "big");
  }
  S.largestArmy = { owner: bestPid, n: bestN };
}

/* ══════════════════════════════════════════════════════════════════════
   BUILD LEGALITY
   ══════════════════════════════════════════════════════════════════════ */

function canPlaceSettlement(vid, pid, setup){
  const v = vertices[vid];
  if (v.owner !== null) return false;
  for (const a of v.adj) if (vertices[a].owner !== null) return false;   // distance rule
  if (setup) return true;
  return v.edges.some(eid => edges[eid].owner === pid);                  // must touch own road
}
function canPlaceRoad(eid, pid, setupVertex){
  const e = edges[eid];
  if (e.owner !== null) return false;
  if (setupVertex !== null && setupVertex !== undefined) return e.v.includes(setupVertex);
  return e.v.some(vid => {
    const v = vertices[vid];
    if (v.owner === pid) return true;
    if (v.owner !== null) return false;   // opponent building blocks pass-through
    return v.edges.some(x => edges[x].owner === pid);
  });
}
function canPlaceCity(vid, pid){
  const v = vertices[vid];
  return v.owner === pid && v.type === "settlement";
}

/* ══════════════════════════════════════════════════════════════════════
   TRADE RATES
   ══════════════════════════════════════════════════════════════════════ */

function tradeRate(p, r){
  let rate = 4;
  for (const v of vertices){
    if (v.owner !== p.id || !v.port) continue;
    if (v.port === "3:1") rate = Math.min(rate, 3);
    else if (v.port === r) rate = Math.min(rate, 2);
  }
  return rate;
}

/* ══════════════════════════════════════════════════════════════════════
   RENDERING
   ══════════════════════════════════════════════════════════════════════ */

function render(){
  if (!S) return;
  drawBoard(); drawPlayers(); drawBottom(); drawDeck(); drawDice(); drawHint();
  refreshFeedMarks();
  // A repaint in the middle of a drag (a bot moving, say) wipes the outlines
  // showing where the card may go. Put them straight back.
  if (dragCard) markDropTargets();
  placeDeck();
  // Replacing the board's markup can leave measurements momentarily stale, so
  // always settle the deck again on the next frame.
  requestAnimationFrame(placeDeck);
  // Online: anything that redrew the host's screen is news. Debounced, so the
  // burst of renders one action causes goes out as a single state.
  if (window.NET && NET.publishSoon) NET.publishSoon();
}

const PORT_OUT = 1.075;     // how far outside the ring a port marker sits
function portPos(e){
  const m = midOf(e);
  return { x: m.x * PORT_OUT, y: m.y * PORT_OUT };
}

function drawBoard(){
  const svg = document.getElementById("board");
  // Bounds must include the port markers and their labels, not just the
  // hex ring — otherwise the outermost ports get clipped.
  const xs = vertices.map(v => v.x), ys = vertices.map(v => v.y);
  for (const e of edges){
    if (!e.port) continue;
    const p = portPos(e);
    xs.push(p.x - 15, p.x + 15);
    ys.push(p.y - 15, p.y + 15);
  }
  const pad = 16;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  // Zoom shrinks the viewBox about the centre; pan slides that window.
  const z = S.zoom || 1;
  const vw = (maxX - minX) / z, vh = (maxY - minY) / z;
  const cx = (minX + maxX) / 2 + (S.panX || 0);
  const cy = (minY + maxY) / 2 + (S.panY || 0);
  S.viewW = vw;                              // used to scale drag distances
  svg.setAttribute("viewBox", `${cx - vw / 2} ${cy - vh / 2} ${vw} ${vh}`);

  const uiHidden = uiBlocked();
  let h = artDefs();
  h += `<rect x="${minX}" y="${minY}" width="${maxX - minX}" height="${maxY - minY}"
          fill="transparent" onclick="disarm()"/>`;
  const sel = S.select;

  // Ports
  for (const e of edges){
    if (!e.port) continue;
    const m = midOf(e);
    const pp = portPos(e);
    const px = pp.x, py = pp.y;
    const generic = e.port === "3:1";
    const col = generic ? "#95a1b3" : RES_COLOR[e.port];
    // 2:1 ports are identified by colour alone; 3:1s just show "?".
    h += `<line x1="${m.x}" y1="${m.y}" x2="${px}" y2="${py}" stroke="${col}" stroke-width="3" opacity=".6"/>`;
    h += `<circle cx="${px}" cy="${py}" r="13" fill="#1a1e25" stroke="${col}" stroke-width="2.5"/>`;
    h += `<title>${generic ? "3:1 — any resource" : "2:1 " + RES_NAME[e.port]}</title>`;
    h += `<text x="${px}" y="${py + 4}" text-anchor="middle" font-size="${generic ? 13 : 10}"
             font-weight="700" fill="${col}" pointer-events="none">${generic ? "?" : "2:1"}</text>`;
  }

  // Hexes
  for (const hx of hexes){
    const pts = cornerPoints(hx.x, hx.y).map(p => `${p.x},${p.y}`).join(" ");
    const hot = sel && (sel.kind === "robber" || sel.kind === "alter");
    const altPicked = sel && sel.kind === "alter" && sel.first === hx.id;
    const click = hot ? ` style="cursor:pointer" onclick="hexClick(${hx.id})"` : "";
    const tile = art("hex", hx.terrain);
    if (tile){
      // Square source, cropped to cover the hex's bounding box.
      const w = HEX_SIZE * Math.sqrt(3), ht = HEX_SIZE * 2;
      h += `<g transform="translate(${hx.x},${hx.y})" clip-path="url(#hexclip)"${click}>
              <image href="${tile}" x="${-w/2}" y="${-ht/2}" width="${w}" height="${ht}"
                     preserveAspectRatio="xMidYMid slice"/>
            </g>`;
      h += `<polygon points="${pts}" fill="none" stroke="#0b0d10" stroke-width="2.5" pointer-events="none"/>`;
    } else {
      h += `<polygon points="${pts}" fill="${RES_COLOR[hx.terrain]}" stroke="#0b0d10" stroke-width="2.5"${click}/>`;
    }
    if (hot){
      const ok = sel.kind === "robber" ? hx.id !== S.robber : hx.number !== null;
      if (ok) h += `<polygon points="${pts}" fill="${altPicked ? "#ffffff33" : "#ffffff14"}"
                      stroke="${altPicked ? "#fff" : "#ffffff66"}" stroke-width="3"
                      style="cursor:pointer" onclick="hexClick(${hx.id})"/>`;
    }
    if (hx.number !== null){
      const red = hx.number === 6 || hx.number === 8;
      const blank = art("token", "blank");
      // The number and pips stay procedural so they remain legible.
      if (blank) h += `<image href="${blank}" x="${hx.x - 21}" y="${hx.y - 21}" width="42" height="42"
                              pointer-events="none"/>`;
      else h += `<circle cx="${hx.x}" cy="${hx.y}" r="19" fill="#f2ead6" stroke="#0b0d10" stroke-width="1.5"/>`;
      h += `<text x="${hx.x}" y="${hx.y + 6}" text-anchor="middle" font-size="18" font-weight="700"
              fill="${red ? "#b3261e" : "#242424"}">${hx.number}</text>`;
      const pips = 6 - Math.abs(7 - hx.number);
      let dots = "";
      for (let i = 0; i < pips; i++)
        dots += `<circle cx="${hx.x - (pips - 1) * 2.6 + i * 5.2}" cy="${hx.y + 13}" r="1.5"
                   fill="${red ? "#b3261e" : "#242424"}"/>`;
      h += dots;
    } else {
      h += `<text x="${hx.x}" y="${hx.y + 5}" text-anchor="middle" font-size="12" fill="#8a7a52">DESERT</text>`;
    }
    if (S.robber === hx.id){
      const rb = art("piece", "robber");
      if (rb){
        h += `<image href="${rb}" x="${hx.x + 22 - 17}" y="${hx.y - 20 - 17}" width="34" height="34"
                     filter="url(#tintRobber)" pointer-events="none"/>`;
      } else {
        h += `<g transform="translate(${hx.x + 22},${hx.y - 20})">
                <ellipse cx="0" cy="9" rx="10" ry="8" fill="#15181d" stroke="#000" stroke-width="1"/>
                <circle cx="0" cy="-3" r="6.5" fill="#15181d" stroke="#000" stroke-width="1"/>
              </g>`;
      }
    }
  }

  // Roads (edges)
  for (const e of edges){
    const a = vertices[e.v[0]], b = vertices[e.v[1]];
    if (e.owner !== null){
      const rd = art("piece", "road");
      if (rd){
        // Stretch a horizontal road tile along the edge.
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        const th  = 18;
        h += `<g transform="translate(${(a.x+b.x)/2},${(a.y+b.y)/2}) rotate(${ang})">
                <image href="${rd}" x="${-len/2}" y="${-th/2}" width="${len}" height="${th}"
                       preserveAspectRatio="none" filter="url(#tint${e.owner})"/>
              </g>`;
      } else {
        h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="#0b0d10" stroke-width="12" stroke-linecap="round"/>`;
        h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="${S.players[e.owner].color}" stroke-width="8" stroke-linecap="round"/>`;
      }
    } else if (!uiHidden && roadSpotShown(e.id)){
      const on = armed("road", e.id) || armed("free", e.id);
      // Halo + dashed fill so the target stays legible over any terrain colour.
      h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#fff"
              stroke-width="${on ? 16 : 12}" stroke-linecap="round" opacity="${on ? ".85" : ".3"}"
              style="cursor:pointer" onclick="edgeClick(${e.id})"/>`;
      h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${cur().color}"
              stroke-width="${on ? 9 : 7}" stroke-linecap="round"
              ${on ? "" : 'stroke-dasharray="7 5"'} opacity=".95"
              style="cursor:pointer" onclick="edgeClick(${e.id})"/>`;
    }
  }

  // Buildings (vertices)
  for (const v of vertices){
    if (v.owner !== null){
      const col = S.players[v.owner].color;
      const pieceArt = art("piece", v.type);
      if (pieceArt){
        const sz = v.type === "city" ? 34 : 28;
        h += `<image href="${pieceArt}" x="${v.x - sz/2}" y="${v.y - sz/2}" width="${sz}" height="${sz}"
                     filter="url(#tint${v.owner})" pointer-events="none"/>`;
      } else if (v.type === "settlement"){
        h += `<g transform="translate(${v.x},${v.y})">
                <path d="M-9,4 L-9,-2 L0,-9 L9,-2 L9,4 Z" fill="${col}" stroke="#0b0d10" stroke-width="2"/>
              </g>`;
      } else {
        h += `<g transform="translate(${v.x},${v.y})">
                <path d="M-12,6 L-12,-3 L-4,-9 L-4,-3 L4,-3 L12,-3 L12,6 Z" fill="${col}"
                      stroke="#0b0d10" stroke-width="2"/>
              </g>`;
      }
    }
    const spot = uiHidden ? null : vertexSpotShown(v.id);
    if (spot){
      const on = armed(spot, v.id) || armed("free", v.id);
      const r  = on ? 17 : (spot === "city" ? 15 : 13);
      h += `<circle cx="${v.x}" cy="${v.y}" r="${r}" fill="${cur().color}" opacity="${on ? ".9" : ".55"}"
              stroke="#fff" stroke-width="${on ? 3.5 : 2.5}" ${on ? "" : 'stroke-dasharray="4 3"'}
              style="cursor:pointer" onclick="vertexClick(${v.id})"/>`;
      if (spot === "city" && !on)
        h += `<text x="${v.x}" y="${v.y + 4}" text-anchor="middle" font-size="11" font-weight="700"
                fill="#fff" pointer-events="none">+</text>`;
      if (on)
        h += `<circle cx="${v.x}" cy="${v.y}" r="${r + 6}" fill="none" stroke="#fff"
                stroke-width="1.5" opacity=".7" pointer-events="none"/>`;
    }
  }
  svg.innerHTML = h;
}

/* One hex-shaped clip (all tiles share it) plus a tint filter per player.
   The tint floods the player's colour through the art's alpha and lays a dark
   dilated outline behind it, matching the look of the procedural pieces. */
/* Which build spots the board offers right now. During setup the forced
   placement wins; otherwise anything legal and affordable is shown. */
function roadSpotShown(eid){
  const sel = S.select;
  if (sel && sel.kind === "road") return canPlaceRoad(eid, S.cur, sel.fromVertex);
  if (S.select || S.pending || S.phase !== "main") return false;
  return buildableNow("road") && canPlaceRoad(eid, S.cur, null);
}
function vertexSpotShown(vid){
  const sel = S.select;
  if (sel && sel.kind === "settlement" && sel.setup)
    return canPlaceSettlement(vid, S.cur, true) ? "settlement" : null;
  if (S.select || S.pending || S.phase !== "main") return null;
  if (canPlaceCity(vid, S.cur) && buildableNow("city")) return "city";
  if (canPlaceSettlement(vid, S.cur, false) && buildableNow("settlement")) return "settlement";
  return null;
}

function artDefs(){
  const pts = cornerPoints(0, 0).map(p => `${p.x},${p.y}`).join(" ");
  let d = `<defs><clipPath id="hexclip"><polygon points="${pts}"/></clipPath>`;
  S.players.forEach(p => {
    d += `<filter id="tint${p.id}" x="-25%" y="-25%" width="150%" height="150%">
            <feFlood flood-color="${p.color}" result="col"/>
            <feComposite in="col" in2="SourceGraphic" operator="in" result="body"/>
            <feMorphology in="SourceGraphic" operator="dilate" radius="1.3" result="fat"/>
            <feFlood flood-color="#0b0d10" result="dark"/>
            <feComposite in="dark" in2="fat" operator="in" result="edge"/>
            <feMerge><feMergeNode in="edge"/><feMergeNode in="body"/></feMerge>
          </filter>`;
  });
  d += `<filter id="tintRobber" x="-25%" y="-25%" width="150%" height="150%">
          <feFlood flood-color="#15181d" result="col"/>
          <feComposite in="col" in2="SourceGraphic" operator="in"/>
        </filter>`;
  return d + `</defs>`;
}

/* ══════════════════════════════════════════════════════════════════════
   PLAYER STRIP (top)
   ══════════════════════════════════════════════════════════════════════ */

/* One entry per roll: who rolled what, and exactly who collected. */
function rollSummary(p, d1, d2, out){
  const sum = d1 + d2;
  let h = pdot(p) + " rolls <b>" + sum + "</b> " +
          "<span style='opacity:.55'>(" + d1 + "+" + d2 + ")</span>";
  const lines = [];
  for (const q of S.players){
    const g = out.paid[q.id];
    if (RES.some(r => g[r] > 0)) lines.push(pdot(q) + " " + resList(g));
  }
  h += lines.length ? "<br>" + lines.join("<br>")
                    : "<br><span style='opacity:.55'>nobody collects</span>";
  for (const n of out.notes) h += "<br><span style='opacity:.55'>" + n + "</span>";
  return h;
}

/* ── board view controls ─────────────────────────────────────────────── */
const ZOOM_MIN = 0.85, ZOOM_MAX = 1.6;

function zoomBoard(delta){
  if (!S) return;
  const before = S.zoom || 1;
  S.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, before + delta));
  if (S.zoom <= 1.001){ S.panX = 0; S.panY = 0; }   // nothing to pan when it fits
  drawBoard();
}
function resetZoom(){
  if (!S) return;
  S.zoom = 1; S.panX = 0; S.panY = 0;
  drawBoard();
}

/* Wheel to zoom, drag to pan. The drag only counts once the pointer has moved
   a few pixels, so an ordinary click still builds where you clicked. */
function initBoardControls(){
  const svg = document.getElementById("board");
  if (!svg || svg.__wired) return;
  svg.__wired = true;

  svg.addEventListener("wheel", function(e){
    if (!S) return;
    e.preventDefault();
    zoomBoard(e.deltaY < 0 ? 0.1 : -0.1);
  }, { passive:false });

  let down = null;
  svg.addEventListener("pointerdown", function(e){
    if (!S || (S.zoom || 1) <= 1.001) return;      // only pan when zoomed in
    down = { x:e.clientX, y:e.clientY, panX:S.panX || 0, panY:S.panY || 0, moved:false };
  });
  svg.addEventListener("pointermove", function(e){
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) < 5) return;
    down.moved = true;
    const scale = (S.viewW || 600) / Math.max(1, svg.clientWidth);
    S.panX = down.panX - dx * scale;
    S.panY = down.panY - dy * scale;
    drawBoard();
  });
  svg.addEventListener("pointerup", function(){
    // Suppress the click that follows a real drag so it does not place a piece.
    if (down && down.moved) window.__panDragged = true;
    down = null;
  });
  svg.addEventListener("pointerleave", function(){ down = null; });
}

/* Board clicks arriving straight after a pan are swallowed. */
function swallowedByPan(){
  if (window.__panDragged){ window.__panDragged = false; return true; }
  return false;
}

function drawPlayers(){
  let h = "";
  for (const p of S.players){
    const active = p.id === S.cur && S.phase !== "over";
    h += `<div class="pcard ${active ? "active" : ""} ${p.skipTokens ? "done" : ""}"
                data-pid="${p.id}">
            <div class="phead">
              <span class="dot" style="background:${p.color}"></span>
              <span class="pname">${p.name}${!isBot(p.id) && anyBots() ? " <span class=\"you\">you</span>" : ""}</span>
              ${p.skipTokens ? `<span class="pskip">skip ×${p.skipTokens}</span>` : ""}
            </div>
            <div class="stats">
              <div class="stat vp" title="Victory points (public — Feral Kittens stay hidden)">
                <b>${publicVP(p)}</b><span>VP</span></div>
              <div class="stat" title="Resource cards"><b>${totalRes(p)}</b><span>Res</span></div>
              <div class="stat" title="Kitten cards in hand"><b>${p.cards.length}</b><span>Kit</span></div>
              <div class="stat" title="Longest unbroken road (${p.roads} built)${
                    S.longestRoad.owner === p.id ? " — holds Longest Road" : ""}">
                <b${S.longestRoad.owner === p.id ? ' style="color:var(--accent)"' : ""}>${
                  (S.roadLens && S.roadLens[p.id] !== undefined) ? S.roadLens[p.id] : 0
                }</b><span>Rd</span></div>
              <div class="stat" title="Knights played"><b>${p.knights}</b><span>Knt</span></div>
            </div>`;
    if (S.revealed){
      const counts = {};
      for (const c of p.cards){
        const nm = KITTEN[c.key].name;
        counts[nm] = (counts[nm] || 0) + 1;
      }
      const names = Object.keys(counts).map(nm =>
        `<span class="revcard">${counts[nm] > 1 ? counts[nm] + "\u00d7 " : ""}${nm}</span>`);
      h += `<div class="reveal">${names.length ? names.join("") :
            "<span style='color:var(--dim)'>no cards</span>"}</div>`;
    }
    h += `</div>`;
  }
  document.getElementById("players").innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════
   KITTEN DECK (bottom-right of the board)
   ══════════════════════════════════════════════════════════════════════ */

function canBuyKitten(){
  return S.phase === "main" && S.deck.length > 0 &&
         RES.filter(r => cur().res[r] > 0).length >= 3;
}

/* Is the seat the UI belongs to the one actually playing right now? Anything
   the human can click has to be gated on this, or a stray click acts for a
   bot — which is how the deck was letting you buy cards on their behalf. */
function myTurnNow(){
  if (window.NET && NET.isOnline && NET.isOnline()) return S.cur === viewSeat();
  if (!anyBots()) return true;
  return S.cur === viewSeat() && !uiBlocked();
}

/* Where the board's artwork actually sits inside the SVG, in pixels relative
   to #boardArea. The SVG fills the pane but the drawing is letterboxed inside
   it, so anything that should hug the board has to be placed from this. */
function boardContentRect(){
  const svg  = document.getElementById("board");
  const area = document.getElementById("boardArea");
  if (!svg || !area) return null;
  const vb = (svg.getAttribute("viewBox") || "").split(" ").map(Number);
  if (vb.length !== 4 || !vb[2] || !vb[3]) return null;
  const sr = svg.getBoundingClientRect(), ar = area.getBoundingClientRect();
  if (!sr.width || !sr.height) return null;
  const scale = Math.min(sr.width / vb[2], sr.height / vb[3]);   // xMidYMid meet
  const w = vb[2] * scale, h = vb[3] * scale;
  return {
    left:   sr.left - ar.left + (sr.width  - w) / 2,
    top:    sr.top  - ar.top  + (sr.height - h) / 2,
    width:  w, height: h
  };
}

/* Where a point in board coordinates lands on screen, relative to #boardArea. */
function svgToScreen(x, y){
  const svg  = document.getElementById("board");
  const area = document.getElementById("boardArea");
  if (!svg || !area) return null;
  const vb = (svg.getAttribute("viewBox") || "").split(" ").map(Number);
  if (vb.length !== 4 || !vb[2] || !vb[3]) return null;
  const sr = svg.getBoundingClientRect(), ar = area.getBoundingClientRect();
  if (!sr.width || !sr.height) return null;
  const scale = Math.min(sr.width / vb[2], sr.height / vb[3]);
  return {
    x: sr.left - ar.left + (sr.width  - vb[2] * scale) / 2 + (x - vb[0]) * scale,
    y: sr.top  - ar.top  + (sr.height - vb[3] * scale) / 2 + (y - vb[1]) * scale,
    scale
  };
}

/* The tiles alone, ignoring the port markers that ring them. */
function hexFieldBounds(){
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const h of hexes){
    for (const p of cornerPoints(h.x, h.y)){
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
  }
  return { minX, maxX, minY, maxY };
}

/* Park the deck off the board's bottom-right corner, roughly 70px clear of the
   nearest tile, and never hanging below the board itself. It is absolutely
   positioned, so it can never take space from the board or resize it. */
const DECK_GAP = 50;      // per axis — about 70px on the diagonal

function placeDeck(){
  const el = document.getElementById("deckWrap");
  if (!el) return;
  const card = el.querySelector(".deck");
  const area = document.getElementById("boardArea");
  const content = boardContentRect();
  if (!card || !area || !content){ el.style.left = ""; el.style.top = ""; return; }

  const hb = hexFieldBounds();
  const corner = svgToScreen(hb.maxX, hb.maxY);
  if (!corner){ el.style.left = ""; el.style.top = ""; return; }

  const ar = area.getBoundingClientRect();
  const cardH = card.offsetHeight || 104;
  const wrapW = el.offsetWidth  || 86;
  const wrapH = el.offsetHeight || 122;

  // Bottom edge of the card sits level with the board's lowest point at most.
  const boardBottom = content.top + content.height;
  const bottom = Math.min(corner.y + DECK_GAP, boardBottom);
  let left = corner.x + DECK_GAP;
  let top  = bottom - cardH;

  left = Math.max(6, Math.min(left, ar.width  - wrapW - 6));
  top  = Math.max(6, Math.min(top,  ar.height - wrapH - 6));

  el.style.left = left + "px";
  el.style.top = top + "px";
  el.style.right = "auto";
  el.style.bottom = "auto";
}

function drawDeck(){
  const el = document.getElementById("deckWrap");
  if (S.phase === "over" || S.phase.startsWith("setup")){ el.innerHTML = ""; return; }
  const buyable = canBuyKitten() && myTurnNow();
  const back = art("card", "back");
  el.innerHTML = `
    <div class="deck ${buyable ? "buyable" : "dim"}" ${buyable ? `onclick="buyKittenDialog()"` : ""}
         title="${buyable ? "Buy a kitten card — any 3 different resources"
                       : myTurnNow() ? "Needs 3 different resources" : "Not your turn"}">
      ${back ? `<img src="${back}" alt="">` : ""}
      <span class="cnt">${S.deck.length}</span>
    </div>
    <div class="deckcost">any 3 unique</div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   BOTTOM BAR — resources, hand, actions
   ══════════════════════════════════════════════════════════════════════ */

function drawBottom(){
  const p = viewPlayer();
  const netOn = !!(window.NET && NET.isOnline && NET.isOnline());
  const myTurn = netOn ? S.cur === p.id
                       : (!anyBots() || (S.cur === p.id && !uiBlocked()));
  let h = `<div class="bside"></div><div class="bcentre"><div class="group">`;
  for (const r of RES){
    const face = art("res", r);
    h += `<div class="slot ${p.res[r] ? "" : "zero"}" title="${RES_NAME[r]}">
            ${face ? `<img src="${face}" alt="">`
                   : `<span class="swatchbig" style="background:${RES_COLOR[r]}"></span>`}
            <span class="n">${p.res[r]}</span>
            <span class="rn">${RES_NAME[r]}</span>
          </div>`;
  }
  h += `</div><div class="sep"></div>`;

  // ── kitten hand ──
  h += `<div class="group hand" data-hand="${p.id}">`;
  if (!p.cards.length){
    h += `<span class="emptyhand">No kitten cards</span>`;
  } else {
    // The one entry still open to a reaction, so a Nope or Defuse that has
    // something to answer right now can light up in your hand.
    const live = openEntry();
    p.cards.forEach((c, i) => {
      const def = KITTEN[c.key];
      const locked = c.boughtTurn === S.turnCounter;
      const reaction = def.kind === "response";
      const isVP = def.kind === "vp";
      const offTurn  = OFF_TURN.has(c.key) && !locked && !isVP && !S.pending &&
                        S.phase !== "over" && !S.phase.startsWith("setup") &&
                        S.cur !== p.id;
      const playable = (myTurn && !locked && !isVP && !S.pending &&
                        (def.kind !== "response" || c.key === "nope") &&
                        (S.phase === "main" || S.phase === "roll")) || offTurn;
      const canAnswer = !!live && !locked &&
                        ((c.key === "defuse" && canDefuseEntry(live, p.id)) ||
                         (c.key === "nope"   && canNopeEntry(live) && live.actor !== p.id));
      const held = dragCard && dragCard.ownerId === p.id && dragCard.idx === i;
      const face = cardArt(c);
      let cls = offTurn ? "playable offturn" : playable ? "playable"
              : reaction ? "reaction" : locked ? "locked" : "";
      if (canAnswer) cls += " armedreact";
      if (held) cls += " picked";
      const tip = esc(def.name + (c.flavor ? " · " + c.flavor : "") + " — " + def.text) +
                  (locked ? "" : "\nDrag it where it should go.");
      h += `<div class="kcard ${cls}" title="${tip}"
                 data-idx="${i}" data-owner="${p.id}"
                 onpointerdown="cardPointerDown(event,${i},${p.id})">
              ${face ? `<img src="${face}" alt="" draggable="false">` : ""}
              ${locked ? `<span class="pip">next turn</span>` : ""}
              ${isVP ? `<span class="pip">1 VP</span>` : ""}
              ${canAnswer ? `<span class="pip now">answer</span>`
                : offTurn ? `<span class="pip now">now</span>`
                : reaction ? `<span class="pip">react</span>` : ""}
              ${face ? "" : `<span class="kn">${def.name}${c.flavor ? "<br>" + c.flavor.split(" ")[0] : ""}</span>`}
            </div>`;
    });
  }
  h += `</div></div>`;

  // ── actions ──
  h += `<div class="bside right"><div class="actions-bar">`;
  if (!myTurn && S.phase !== "over"){
    const who = S.players[S.cur];
    h += `<span class="thinking"><span class="dot" style="background:${who.color}"></span>
            ${who.name} is thinking…</span>`;
  } else if (S.phase === "roll"){
    const waiting = reactWindowOpen();
    h += `<button class="primary" id="rollBtn" ${waiting ? "disabled" : ""} onclick="rollDice()">${
            waiting ? "Reactions open — " + reactSecondsLeft() + "s" : "Roll Dice"}</button>`;
  } else if (S.phase === "main"){
    h += `<button onclick="bankTradeDialog()">Bank / Port</button>`;
    h += `<button onclick="playerTradeDialog()">Trade</button>`;
    h += `<button class="warn" onclick="requestEndTurn()">End Turn</button>`;
  } else if (S.phase.startsWith("setup")){
    h += `<span class="emptyhand">Setup — place your ${S.setupNeed}</span>`;
  } else if (S.phase === "over"){
    h += `<button class="primary" onclick="showStandings()">Final standings</button>`;
    h += `<button onclick="newGameDialog()">New Game</button>`;
  }
  h += `</div></div>`;

  document.getElementById("bottom").innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════
   HINT BAR
   ══════════════════════════════════════════════════════════════════════ */

/* On-screen event feed. The game log keeps everything; these surface the
   things you would otherwise miss while the bots take their turns. */
/* Events append to the feed and stay there. Older ones are pushed up out of
   view rather than deleted, so the list can be scrolled back through. The `ms`
   argument is accepted for compatibility with the old toast calls and ignored.
*/
function announce(html, kind, entry){
  const box = document.getElementById("feed");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "ev " + (kind || "info");
  if (entry && entry.id) el.dataset.jid = entry.id;
  const turn = (S && S.turnCounter) ? "Turn " + S.turnCounter : "Setup";
  el.innerHTML = '<span class="evturn">' + turn + "</span>" + html;
  // Kept on the state as well as in the DOM: online, the feed has to travel to
  // players whose browser never saw the action happen.
  if (S){
    if (!S.feed) S.feed = [];
    S.feed.push({ jid: (entry && entry.id) || null, kind: kind || "info",
                  html: html, turn: S.turnCounter || 0 });
    while (S.feed.length > 160) S.feed.shift();
  }
  // Follow the newest entry only if the reader is already at the bottom, so
  // scrolling back through the game is not interrupted.
  const following = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.appendChild(el);
  while (box.children.length > 250) box.removeChild(box.firstChild);
  if (following) box.scrollTop = box.scrollHeight;
  refreshFeedMarks();
}

/* ── "you can answer this" markers ─────────────────────────────────
   A card badge pinned to a log entry saying "this one is yours to answer".
   It is drawn for the seat at the keyboard and nobody else: it only appears
   when YOU are holding the card that would answer it, so it tells the rest of
   the table nothing. Because the window is one entry wide the badge also
   vanishes the instant the next thing happens — which is the point. The
   badge IS the countdown. */
function markFace(key, cls, tip){
  const face = art("card", key);
  const glyph = key === "defuse" ? "🛡" : "🚫";
  return '<span class="evmark ' + cls + '" title="' + esc(tip) + '">' +
         (face ? '<img src="' + face + '" alt="">' : glyph) + '</span>';
}

function refreshFeedMarks(){
  const box = document.getElementById("feed");
  if (!box || !S) return;
  const me = viewSeat();
  const p = S.players[me];
  const live = openEntry();
  const hasDefuse = p && p.cards.some(c => c.key === "defuse" && c.boughtTurn !== S.turnCounter);
  const hasNope   = p && p.cards.some(c => c.key === "nope"   && c.boughtTurn !== S.turnCounter);

  box.querySelectorAll(".ev[data-jid]").forEach(el => {
    const jid = +el.dataset.jid;
    // A rewound entry stays on screen — the feed is a record of what was said,
    // not of what survived — but it is struck through so the log still reads
    // straight after a Nope has erased something out of the middle of it.
    const gone = !S.journal.some(x => x.id === jid);
    el.classList.toggle("undone", gone);
    const isLive = !!live && live.id === jid;
    el.classList.toggle("livewindow", isLive);
    const old = el.querySelector(".evmarks");
    if (old) old.remove();
    el.classList.remove("answerable");
    if (!isLive) return;

    let marks = "";
    if (hasDefuse && canDefuseEntry(live, me))
      marks += markFace("defuse", "defuse", "You can Defuse this — drag your Defuse onto this line");
    if (hasNope && live.actor !== me)
      marks += markFace("nope", "nope", "You can Nope this — drag your Nope onto this line");
    if (!marks) return;
    el.classList.add("answerable");
    const wrap = document.createElement("div");
    wrap.className = "evmarks";
    wrap.innerHTML = marks;
    el.appendChild(wrap);
  });
}

/* Cleared with the board when a new game starts. */
function clearFeed(){
  const box = document.getElementById("feed");
  if (box) box.innerHTML = "";
  if (S) S.feed = [];
}
/* Resources as coloured chips, so a trade shows what actually moved. */
function resList(o){
  const parts = RES.filter(r => o[r] > 0)
    .map(r => '<span class="rchip" style="border-left-color:' + RES_COLOR[r] + '">' +
              o[r] + "× " + RES_NAME[r] + "</span>");
  return parts.length ? parts.join(" ") : "<i>nothing</i>";
}
function tradeToast(a, b, gave, got){
  announce(pdot(a) + " → " + resList(gave) + "<br>" + pdot(b) + " → " + resList(got),
           "info", 5200);
}

function pdot(p){
  return '<span class="dot" style="background:' + p.color +
         ';display:inline-block;vertical-align:-2px;margin-right:5px"></span><b>' + p.name + '</b>';
}

let hintTimer = null;
function hint(msg, sticky){
  const el = document.getElementById("hintbar");
  if (!el) return;
  clearTimeout(hintTimer);
  if (!msg){ el.className = ""; el.textContent = ""; return; }
  el.textContent = msg;
  el.className = "on";
  if (!sticky) hintTimer = setTimeout(() => { el.className = ""; }, 2600);
}

const DIE_PIPS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
function dieHTML(n, animate){
  const on = DIE_PIPS[n] || [];
  let cells = "";
  for (let i = 0; i < 9; i++) cells += `<i class="${on.includes(i) ? "" : "off"}"></i>`;
  return `<div class="die ${animate ? "roll" : ""}" title="${n}">${cells}</div>`;
}

function drawDice(){
  const el = document.getElementById("diceWrap");
  if (!el) return;
  if (!S.rolled || S.phase.startsWith("setup") || S.phase === "over"){ el.innerHTML = ""; return; }
  const [a, b] = S.rolled, sum = a + b;
  const fresh = S.diceFresh;
  S.diceFresh = false;
  el.innerHTML = dieHTML(a, fresh) + dieHTML(b, fresh) +
                 `<span class="dicesum ${sum === 7 ? "seven" : ""}">${sum}</span>`;
}

function drawHint(){
  // Advice is for whoever is actually playing. During a bot's turn the strip
  // stays empty unless a prompt has handed us control.
  const ours = !anyBots() || myTurnNow() ||
               (S.select && S.select.actor !== undefined && !isBot(S.select.actor));
  if (!ours){ hint(null); return; }
  if (S.armed){
