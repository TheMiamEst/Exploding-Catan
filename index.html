<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exploding Catan</title>
<style>
  :root{
    --bg:#14171c; --panel:#1c2129; --panel2:#232936; --line:#333c4a;
    --ink:#e7ebf1; --dim:#95a1b3; --accent:#e2b33c; --danger:#d94b4b;
    --wood:#2f6b3a; --brick:#a4472a; --sheep:#7fb85c; --wheat:#dfae32; --ore:#78838f; --desert:#cdbb8e;

  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    /* Kills the browser's double-tap-to-zoom, which on a fixed full-screen
       layout like this one zooms in on a corner with nothing to scroll back
       out with. Pinch-zooming the page still works, so anyone who needs to
       magnify it still can — it is only the accidental double tap that goes. */
    touch-action:manipulation;
  }
  /* Wraps rather than overflows. On a phone the row of buttons has never
     actually fitted, and without this the right-hand end of it was simply off
     the side of the screen with no way to reach it. */
  header{
    position:relative;
    display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  header .spacer{flex:1}
  /* Which opening is in play, beside the build tag. Shown only when it is not
     the ordinary one — there is nothing to say about a normal game. */
  #modeTag{
    font-size:10.5px; color:#161a20; background:var(--accent); font-weight:700;
    border-radius:6px; padding:2px 7px; letter-spacing:.2px; white-space:nowrap;
  }
  button{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:6px 11px; cursor:pointer; font:inherit;
  }
  button:hover:not(:disabled){background:#2d3546; border-color:#4a5668}
  button:disabled{opacity:.35; cursor:not-allowed}
  button.primary{background:#2f5d3a; border-color:#3f7a4d}
  button.primary:hover:not(:disabled){background:#3a7248}
  button.warn{background:#6b2f2f; border-color:#8a3f3f}
  button.warn:hover:not(:disabled){background:#813a3a}
  button.sm{padding:3px 8px; font-size:12px}

  /* ── Player strip ────────────────────────────────────────────────── */
  #players{
    display:flex; gap:8px; padding:8px 10px 20px; background:var(--panel);
    border-bottom:1px solid var(--line); flex:0 0 auto; overflow-x:auto;
  }
  /* Laid out the way Catan Universe lays its player box out, because that is
     an arrangement most people at this table already know how to read: the
     portrait on the left with the score in a ring over its corner, the name on
     a banner across the top of the right column, and what is on the board
     hanging under the banner.

     What is in the HAND hangs off the BOTTOM of the card, half in and half
     out, which is the one thing here that is not ordinary layout. It buys the
     portrait its size back: the two numbers you glance at most sit in the
     strip's own padding rather than taking a row from a card that has a face
     in it. The card is a grid so that the short-screen layout can fold the
     same four boxes into two rows without the markup changing, and so that
     pill can drop back into the flow when there is no height to hang into. */
  .pcard{
    position:relative;
    flex:1 1 0; min-width:168px; border-radius:8px; padding:6px 8px;
    background:var(--pcTint, var(--panel2));
    border:1px solid var(--pcEdge, var(--line));
    border-left:5px solid var(--pc, var(--line));
    --avW:70px; --avPull:12px; --emW:86px; --pillDrop:17px;
    display:grid; gap:5px 9px; align-items:center;
    grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:
      "av   name"
      "av   board";
  }
  .pcard.active{
    border-color:var(--accent); border-left-color:var(--pc);
    box-shadow:0 0 0 2px var(--accent) inset;
  }
  .pcard.done{opacity:.55}

  /* ── The portrait ────────────────────────────────────────────────────
     Ringed in the seat's own colour, which is the whole reason the coloured
     dot that used to sit here can go: six people who have all picked the same
     cat are still six different colours. */
  /* Bigger than the box has room for, and it breaks the top edge to get there.

     The negative margin is what makes that free: a grid item's margins are
     what the row is sized against, so the portrait contributes its old height
     to the layout and renders at its new one, growing UPWARDS out of the card.
     The card does not get taller, the pill hanging under it does not move, and
     the strip's existing top padding is what the overhang grows into. */
  .avwrap{
    grid-area:av; position:relative; align-self:start;
    width:var(--avW, 70px); height:var(--avW, 70px);
    margin-top:calc(var(--avPull, 12px) * -1);
    border-radius:50%;
    border:2px solid var(--pc, var(--line)); background:#0b0d10;
    box-shadow:0 2px 8px #0008;
  }
  .avwrap .avin{
    position:absolute; inset:0; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .avwrap img{width:100%; height:100%; object-fit:cover; display:block}
  /* Nobody picked a picture: their initial on the seat colour, which still
     reads as a face-shaped thing at a glance. */
  .avwrap .avinit{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--avW, 70px) * 0.43); font-weight:700;
    color:#0e1116; background:var(--pc, #4a5668);
  }
  /* Yours, and therefore yours to change. */
  .avwrap.mine{cursor:pointer}
  .avwrap.mine:hover{border-color:var(--accent)}
  .avwrap.mine:hover .avin{filter:brightness(1.15)}

  /* Points ride the top-left corner of the portrait. They are the score — the
     one number on this card that says who is winning — and lined up as a fifth
     identical box among roads and knights they read as trivia. */
  /* As near the top-left corner as it can sit without being clipped.

     It used to ride above the portrait, which was fine until the portrait
     started overhanging the top of the card — then the top edge of the seat
     strip took a bite out of the number. Level with the top of the circle is
     as high as it can go: nothing of it is above the picture, so there is
     nothing for the strip to cut, and it still reads as riding the corner
     rather than sitting beside it. */
  .vpring{
    position:absolute; top:0; left:-11px; z-index:2;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
    color:#161a20; background:var(--accent);
    box-shadow:0 1px 5px #0007, 0 0 0 2px #151a22;
  }
  /* Your own, with the Feral Kittens counted in — see vpStat. */
  .vpring.hidden{ box-shadow:0 1px 5px #0007, 0 0 0 2px #151a22, 0 0 0 4px #e2b33c66 }

  /* An emoji somebody just threw, over the middle of their face.

     Centred with negative margins rather than a translate, because the pop is
     a transform animation and the two would fight: whatever the keyframes set
     would throw away the centring. No disc behind it either — at this size a
     bubble would cover the portrait entirely, and the point is to see who is
     being rude. Two drop shadows instead, so it reads over pale art as well
     as dark. One animation carries the whole life of it — in, hold, out — so
     nothing has to time the fade; the element is simply removed once it has
     run. */
  .emote{
    position:absolute; top:50%; left:50%; z-index:3;
    width:var(--emW, 86px); height:var(--emW, 86px);
    margin:calc(var(--emW, 86px) / -2) 0 0 calc(var(--emW, 86px) / -2);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--emW, 86px) * 0.7); line-height:1; pointer-events:none;
    filter:drop-shadow(0 2px 3px #000) drop-shadow(0 0 9px #000c);
    /* 3400ms is EMOTE_MS in the script, and the two have to agree: the script
       resumes a bubble caught mid-life with a negative animation-delay, which
       lands in the wrong place if this duration is not the one it measured
       against. */
    animation:emotepop 3400ms cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes emotepop{
    0%  {transform:translateY(8px) scale(.2); opacity:0}
    8%  {transform:translateY(-3px) scale(1.18); opacity:1}
    16% {transform:none; opacity:1}
    84% {transform:none; opacity:1}
    100%{transform:translateY(-10px) scale(.85); opacity:0}
  }

  /* The name on a banner rather than loose text: it gives the right-hand
     column a top edge to hang from, and tinting it with the seat's own colour
     means the card says whose it is twice over without saying it twice. */
  .pcard .pname{
    grid-area:name; align-self:end;
    display:flex; align-items:center; gap:5px; min-width:0;
    font-weight:600; font-size:13.5px; white-space:nowrap;
    padding:3px 8px; border-radius:5px;
    background:color-mix(in srgb, var(--pc, #4a5668) 34%, #0b0d10);
    border-left:3px solid var(--pc, var(--line));
    box-shadow:0 1px 3px #0006;
  }
  .pcard .pname .nm{overflow:hidden; text-overflow:ellipsis; min-width:0}
  .pcard .pskip{font-size:10px; color:var(--danger); border:1px solid var(--danger);
                border-radius:4px; padding:0 4px; flex:0 0 auto; background:#0007}

  /* Two pills, not five boxes in a row: what is in the hand, and what is on
     the board. Reading a seat card should be a glance at two things. */
  .statgroup{
    display:flex; min-width:0; align-self:start; justify-self:start;
    background:#0006; border:1px solid var(--line); border-radius:7px; overflow:hidden;
  }
  .statgroup.board{grid-area:board}
  /* Half off the bottom edge, and centred UNDER the portrait rather than
     lined up with its left edge — which is what it was doing, and left it a
     few pixels off centre because the pill is wider than the circle. Measured
     from the padding edge: the card's own left padding, then half a portrait.
     Solid rather than translucent, because it sits across the card's border. */
  .statgroup.hand{
    position:absolute; z-index:2;
    left:calc(8px + var(--avW, 70px) / 2); transform:translateX(-50%);
    bottom:calc(var(--pillDrop, 17px) * -1);
    background:#12161d; border-color:var(--pcEdge, var(--line));
    box-shadow:0 3px 9px #0009;
  }
  .statgroup .stat + .stat{ border-left:1px solid var(--line) }
  .stat{
    flex:1 1 0; min-width:32px; padding:3px 5px;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .stat b{font-size:15px; line-height:1.15; font-variant-numeric:tabular-nums}
  /* Icons rather than three-letter labels: at this size "Rd" and "Res" read
     as noise, and a glyph is taken in without being read. Each stat keeps its
     title attribute, so hovering still names it. */
  .stat svg{flex:0 0 auto; width:14px; height:14px;
            fill:none; stroke:var(--dim); stroke-width:1.7;
            stroke-linecap:round; stroke-linejoin:round}
  /* Longest Road and Largest Army are the same kind of thing — two points for
     holding something nobody else can — so they light the same gold. */
  .stat.holds b{color:var(--accent)}
  .stat.holds svg{stroke:var(--accent)}
  /* The coloured seat dot, used in the log, in trade offers and in the "who is
     thinking" line. It carries its own colour inline. */
  .dot{
    display:inline-block; flex:0 0 auto; width:9px; height:9px;
    border-radius:50%; box-shadow:0 0 0 1px #0006;
  }

  /* ── Stage (board + floating overlays) ───────────────────────────── */
  #stage{flex:1; position:relative; min-height:0; padding:6px}
  #boardArea{position:absolute; inset:6px}
  svg{width:100%; height:100%; touch-action:none; display:block}
  /* Above the panels, so the emoji tray hanging off these buttons is not
     drawn under an open trade. */
  #leftbtns{position:absolute; left:10px; top:10px; z-index:7; display:flex; gap:6px}
  #leftbtns button{white-space:nowrap}
  /* Sits under the dice, which share this right edge — the offset has to
     clear their full height or the two overlap. */
  #zoomWrap{
    position:absolute; right:12px; top:110px; z-index:4;
    display:flex; flex-direction:column; gap:4px;
  }
  #zoomWrap button{width:30px; text-align:center; padding:3px 0; font-size:14px; line-height:1}
  #deckWrap{position:absolute; right:12px; bottom:12px; z-index:3; transition:left .12s, top .12s}
  .rank{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
  .rank th{text-align:left; font-size:10px; letter-spacing:.5px; text-transform:uppercase;
           color:var(--dim); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line)}
  .rank td{padding:6px; border-bottom:1px solid #2a3140; font-variant-numeric:tabular-nums}
  .rank tr.win td{background:#1f3a2833}
  .rank .pl{width:30px; font-weight:700; color:var(--dim)}
  .rank tr.win .pl{color:var(--accent)}
  .rank .who{display:flex; align-items:center; gap:7px}
  .rank .tot{font-weight:700; text-align:right}
  .rank .brk{color:var(--dim); font-size:11px}
  .thinking{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:13px;
            font-style:italic; padding:0 8px}
  #implodeClock{
    position:absolute; left:50%; transform:translateX(-50%); top:8px; z-index:7;
    background:#3a1d1dF2; border:1px solid var(--danger); border-radius:8px;
    padding:6px 14px; font-size:13px; text-align:center; color:#ffd9d9;
    box-shadow:0 6px 20px #0009; pointer-events:none;
  }
  #implodeClock span{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  #implodeClock.urgent{border-color:#ff5a5a; animation:pulse .6s infinite alternate}
  @keyframes pulse{from{opacity:.75}to{opacity:1}}
  /* Running event feed. Newest at the bottom; older entries scroll up and out
     of sight but stay in the list, so you can scroll back through the game. */
  /* Floats over the board rather than taking a column from it. Clicks pass
     straight through, and there is no container or scrollbar — entries simply
     stack up from the bottom and the oldest are clipped off the top. */
  #feed{
    position:absolute; left:10px; top:var(--feedTop, 52px); bottom:8px;
    width:clamp(170px, 19%, 280px); z-index:3;
    display:flex; flex-direction:column; gap:5px;
    overflow-y:auto; overflow-x:hidden;
    /* Scrollable, but with no visible track — the wheel works over the panel
       while the board keeps the wheel for zooming. */
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 44px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 44px);
  }
  /* Bottom-aligned via auto margin rather than justify-content: with
     justify-content:flex-end an overflowing column spills past the top edge
     and cannot be scrolled back to. */
  #feed > .ev:first-child{margin-top:auto}
  #feed::-webkit-scrollbar{width:0; height:0}
  #feed.hidden{display:none}
  #leftbtns button.on{background:#2f5d3a; border-color:#4d8a5f}
  /* Which way round the table play is going. Worth saying out loud because a
     Reverse turns it over mid-game and nothing else on screen does say so —
     you found out by watching whose turn came next. Not a button: there is
     nothing to press, it is a label that happens to live in a row of them. */
  .turntag{
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    padding:3px 9px; border-radius:6px; font-size:12px; cursor:default;
    background:var(--panel2); border:1px solid var(--line); color:var(--dim);
  }
  .turntag b{color:var(--ink); font-size:15px; line-height:1}
  .turntag[hidden]{display:none}

  /* Somebody said something while the window was shut. */
  #chatBtn{position:relative}
  #chatBtn .unread{
    position:absolute; top:-7px; right:-7px; min-width:16px; height:16px; padding:0 4px;
    border-radius:9px; background:var(--danger); color:#fff;
    font-size:10px; font-weight:700; line-height:16px; text-align:center;
    box-shadow:0 1px 4px #0009;
  }

  /* ── Chat ────────────────────────────────────────────────────────────
     Hung off the bottom of the button strip, in the same place the emoji tray
     drops into: they are two answers to the same question, so only one of them
     is ever out and opening either puts the other away. It shares the left
     column with the log rather than floating over it — with the window open
     the log starts below it, so nothing you were reading is covered by what
     somebody typed. Two heights, named once each, because several rules have
     to agree on them.

     The height is in vh and not a percentage: hanging the box off the button
     strip made the strip its containing block, and a percentage of a row of
     buttons is about eleven pixels. */
  #stage{--chatH:min(300px, 40vh); --feedTop:52px}
  #chatbox{
    position:absolute; top:calc(100% + 6px); left:0; z-index:8;
    width:clamp(200px, 21vw, 300px); height:var(--chatH);
    display:none; flex-direction:column; overflow:hidden;
    background:#151a22f2; border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 30px #000a; backdrop-filter:blur(3px);
  }
  body.haschat #chatbox{display:flex}
  body.haschat #feed{top:calc(var(--feedTop) + var(--chatH) + 8px)}
  #chatlog{
    flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:none;
    padding:7px 8px; display:flex; flex-direction:column; gap:5px;
  }
  #chatlog::-webkit-scrollbar{width:0}
  /* Bottom-aligned the same way the log is, so a near-empty chat sits down by
     the box you type into instead of floating at the top of nothing. */
  #chatlog > *:first-child{margin-top:auto}
  .msg{
    font-size:12px; line-height:1.4; word-break:break-word;
    border-left:3px solid var(--mc, var(--line)); padding-left:6px;
  }
  .msg .who{font-weight:700; color:var(--mc, var(--ink)); margin-right:5px}
  .msg.sys{border-left-color:#0000; color:var(--dim); font-style:italic; font-size:11px}
  #chatrow{
    flex:0 0 auto; display:flex; gap:5px; padding:6px;
    border-top:1px solid var(--line); background:#0b0d1099;
  }
  #chatin{
    flex:1 1 auto; min-width:0; background:#0006; border:1px solid var(--line);
    border-radius:5px; color:var(--ink); padding:5px 7px; font:inherit; font-size:12px;
  }
  #chatin:focus{outline:none; border-color:var(--accent)}
  #chatin:disabled{opacity:.5}
  #chatrow button{padding:3px 9px; font-size:12px}

  /* ── Emoji tray ──────────────────────────────────────────────────────
     Hung off the button strip itself rather than positioned against the
     board, so it follows the buttons when a narrow screen stacks them. */
  #emojiTray{
    position:absolute; top:calc(100% + 6px); left:0; z-index:8;
    display:none; grid-template-columns:repeat(6, 1fr); gap:4px;
    width:max-content; max-width:min(272px, 74vw); padding:7px;
    background:#151a22f2; border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 30px #000a; backdrop-filter:blur(3px);
  }
  body.hastray #emojiTray{display:grid}
  #emojiTray button{
    font-size:20px; line-height:1; padding:3px 5px; background:#0004;
    border:1px solid #0000; border-radius:6px;
  }
  #emojiTray button:hover:not(:disabled){background:#2d3546; border-color:var(--accent)}

  /* ── Picking a portrait ──────────────────────────────────────────── */
  .avgrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(54px, 1fr));
    gap:7px; margin:6px 0 2px; padding:2px;
    max-height:242px; overflow-y:auto;
  }
  .avopt{
    width:100%; aspect-ratio:1; padding:0; overflow:hidden;
    border-radius:50%; border:2px solid var(--line); background:#0b0d10;
  }
  .avopt img{width:100%; height:100%; object-fit:cover; display:block}
  .avopt .none{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:10.5px; letter-spacing:.3px;
  }
  .avopt.on{border-color:var(--accent); box-shadow:0 0 0 3px #e2b33c33}
  /* The chosen one, shown large beside the name field it belongs to. */
  .avnow{
    width:54px; height:54px; border-radius:50%; overflow:hidden; flex:0 0 auto;
    border:2px solid var(--accent); background:#0b0d10;
    display:flex; align-items:center; justify-content:center;
  }
  .avnow img{width:100%; height:100%; object-fit:cover; display:block}
  .avnow .none{color:var(--dim); font-size:20px; font-weight:700}
  .ev{
    background:#151a22ee; border:1px solid #ffffff14; border-left:4px solid var(--line);
    border-radius:6px; padding:6px 9px; font-size:12.5px; line-height:1.4;
    flex:0 0 auto; animation:evin .2s ease-out; backdrop-filter:blur(3px);
    box-shadow:0 3px 12px #0007; position:relative;
  }
  .ev b{font-weight:700}
  .ev .evturn{
    display:block; font-size:9.5px; letter-spacing:.4px; color:var(--dim);
    text-transform:uppercase; margin-bottom:2px;
  }
  .toast b{font-weight:700}
  /* Tinted with the resource's own colour rather than carrying a hairline of
     it, so an offer can be judged without reading it. --rc is set per chip. */
  .rchip{
    display:inline-block; border:1px solid var(--rc, var(--line));
    border-left:4px solid var(--rc, var(--line));
    border-radius:4px; padding:0 5px 0 4px; margin:1px 1px; font-size:11.5px;
    background:color-mix(in srgb, var(--rc, #888) 22%, #0b0d10);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .rchip .rdot{display:inline-block; width:7px; height:7px; border-radius:2px;
               background:var(--rc); margin-right:4px; vertical-align:0}
  .rchip.none{--rc:#5a6478; font-style:italic; opacity:.75}
  .ev.roll{border-left-color:#7f8ba0}
  .ev.buy{border-left-color:#5a8f68}
  .ev.attack{border-left-color:var(--danger)}
  .ev.defend{border-left-color:#4bb1d9}
  .ev.info{border-left-color:#5a6478}
  .ev.big{
    border-left-color:var(--accent); background:#232a1c; font-size:13.5px;
    box-shadow:0 0 0 1px #e2b33c33 inset;
  }

  /* ── "you can answer this" markers ──────────────────────────────────
     Personal to whoever is sitting at the screen: a badge only appears on an
     entry THIS player still holds the card to answer, and it disappears the
     moment the next entry lands. Everyone else's feed shows nothing, so the
     badge never gives away what is in your hand. */
  .evmarks{
    position:absolute; top:-8px; right:3px; display:flex; gap:3px; z-index:2;
    pointer-events:none;   /* never steals the drop from the entry underneath */
  }
  .evmark{
    width:26px; height:26px; border-radius:50%; overflow:hidden; position:relative;
    border:2px solid; background:#0d1014; box-shadow:0 2px 8px #000a;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1;
  }
  .evmark img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .evmark.defuse{border-color:#4bb1d9; animation:markpop .9s ease-out infinite alternate}
  .evmark.nope{border-color:#c76b6b; opacity:.85}
  @keyframes markpop{
    from{box-shadow:0 2px 8px #000a, 0 0 0 0 #4bb1d900}
    to  {box-shadow:0 2px 8px #000a, 0 0 0 5px #4bb1d92e}
  }
  .ev.answerable{border-color:#4bb1d955}
  /* Rewound by a Nope or a Defuse: it happened, then it un-happened. */
  .ev.undone{opacity:.42; text-decoration:line-through}
  .ev.undone .evturn, .ev.undone .evmarks{text-decoration:none}
  /* The one entry still open to an answer. Its window closes as soon as the
     next entry arrives, so it is worth pointing at. */
  .ev.livewindow{box-shadow:0 3px 12px #0007, 0 0 0 1px #4bb1d94d inset}

  /* Reaction buttons carried inside a prompt, so an attack can be answered
     from the window it opened rather than after paying for it. */
  .reactnote{
    margin-top:10px; border-top:1px solid var(--line); padding-top:9px;
    font-size:12.5px; color:#b9c4d3; line-height:1.45;
  }
  .reactnote b{color:var(--ink); font-weight:700}
  .modal .actions button.react{background:#1d3a49; border-color:#4bb1d9; color:#dff2fb}
  .modal .actions button.react:hover:not(:disabled){background:#265066}
  .modal .actions button.reactno{background:#4a2230; border-color:#c76b6b; color:#ffdede}
  .modal .actions button.reactno:hover:not(:disabled){background:#5e2b3c}
  @keyframes evin{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
  #diceWrap{position:absolute; right:12px; top:10px; z-index:3; display:flex; align-items:center; gap:8px}
  .die{
    width:88px; height:88px; border-radius:16px; background:#f2ead6; border:2px solid #0b0d10;
    box-shadow:0 5px 16px #0009; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr);
    padding:11px; gap:2px; flex:0 0 auto;
  }
  .die i{border-radius:50%; background:#242424; width:16px; height:16px; align-self:center; justify-self:center}
  .die i.off{background:transparent}
  .die.roll{animation:tumble .45s ease-out}
  @keyframes tumble{
    0%{transform:rotate(-18deg) scale(.8)} 60%{transform:rotate(10deg) scale(1.08)} 100%{transform:none}
  }
  .dicesum{
    font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink);
    background:#0b0d10cc; border:1px solid var(--line); border-radius:10px; padding:7px 15px;
  }
  .dicesum.seven{color:var(--danger); border-color:var(--danger)}

  /* vertical dice histogram */
  .vchart{display:flex; align-items:flex-end; gap:5px; height:190px; margin:10px 0 4px}
  .vcol{flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
  .vcol .vb{width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px}
  .vcol.seven .vb{background:var(--danger)}
  .vcol .vn{font-size:11px; color:var(--dim); margin-top:4px; font-variant-numeric:tabular-nums}
  .vcol.seven .vn{color:var(--danger)}
  .vcol .vc{font-size:11px; font-weight:600; margin-bottom:3px; font-variant-numeric:tabular-nums}
  /* Its own strip between board and bottom bar, so it can never cover a hex. */
  /* Advice, pushed as far right along the bar as it will go without touching
     anything. The spacer ahead of it takes up all the slack, so it comes to
     rest against the left edge of the buttons — and being in the flow rather
     than laid over the top, it cannot overlap them however narrow the window
     gets. It gives up width before the title does, and truncates with an
     ellipsis rather than pushing anything off the end. */
  #hintslot{
    flex:0 1 auto; min-width:0; text-align:center;
    color:var(--accent); font-size:12.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transition:opacity .12s;
  }
  #hintslot.on{opacity:1}
  /* Nothing to say: out of the way entirely, so it can never sit over a
     button on a narrow header even by accident. */
  #hintslot:empty{display:none}
  #tipBtn.off{opacity:.5}

  /* Kitten deck */
  .deck{
    width:74px; height:104px; border-radius:9px; border:2px solid var(--line);
    background:linear-gradient(150deg,#2a3242,#1a1f29); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    box-shadow:0 5px 16px #0007; position:relative; overflow:hidden;
  }
  .deck img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .deck .cnt{position:relative; font-size:21px; font-weight:700; z-index:1; text-shadow:0 1px 4px #000}
  .deck .lbl{position:relative; font-size:9px; letter-spacing:.5px; color:var(--dim); z-index:1;
             text-transform:uppercase; text-shadow:0 1px 4px #000}
  .deck.buyable{border-color:#5a8f68}
  .deck.buyable:hover{transform:translateY(-2px); border-color:#7fc48f}
  .deck.dim{opacity:.45; cursor:not-allowed}
  .deckcost{font-size:10px; color:var(--dim); text-align:center; margin-top:4px; max-width:84px}

  /* ── Bottom bar ──────────────────────────────────────────────────── */
  #bottom{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 10px; display:flex; align-items:center; gap:10px;
  }
  .group{display:flex; gap:5px; align-items:center}
  .group.hand{flex-wrap:wrap; justify-content:center; max-width:100%; padding-bottom:2px}
  .sep{width:1px; align-self:stretch; background:var(--line); flex:0 0 auto}
  .slot{
    width:52px; height:70px; border-radius:7px; border:1px solid var(--line);
    background:#0004; position:relative; overflow:hidden; flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:4px;
  }
  .slot .swatchbig{position:absolute; inset:0; opacity:.30}
  .slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .slot .n{position:relative; font-size:17px; font-weight:700; z-index:1; text-shadow:0 1px 4px #000;
           font-variant-numeric:tabular-nums}
  .slot .rn{position:relative; font-size:8.5px; letter-spacing:.3px; color:#e7ebf1cc; z-index:1;
            text-transform:uppercase; text-shadow:0 1px 4px #000}
  .slot.zero{opacity:.4}

  .kcard{
    width:52px; height:70px; border-radius:7px; border:1px solid var(--line); flex:0 0 auto;
    background:linear-gradient(160deg,#2c3444,#1c222c); position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:3px;
    cursor:grab;
    /* The card is dragged by hand (pointer events), never by the browser's own
       drag-and-drop. Without these the browser grabs the <img> instead and
       offers to open the picture in a new window when it is dropped. */
    -webkit-user-drag:none; user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  /* Art comes in assorted sizes, so every card is cropped to one 5:7 tile.
     The rounding lives on the image because the tile can no longer clip
     (a clipping tile would cut off the hover preview). */
  .kcard img{position:absolute; inset:0; width:100%; height:100%;
             object-fit:cover; border-radius:6px;
             -webkit-user-drag:none; user-select:none; pointer-events:none}

  /* The card grows in place rather than spawning a preview. Growth is anchored
     to the bottom edge, so the preview always rises into the board and can
     never fall off the bottom of the screen whatever size the card is.
     ONE hover rule covers every card: the old per-state rules quietly
     overrode this one, which is why some cards barely moved. */
  .kcard{transition:transform .12s ease-out, box-shadow .12s ease-out;
         transform-origin:bottom center}
  .kcard:hover{
    transform:translateY(-10px) scale(3.4); z-index:40;
    box-shadow:0 16px 44px #000d;
  }
  /* Nothing zooms while a card is being carried — the card under the pointer
     is the floating one, and a zooming neighbour would fight it. */
  body.dragging .kcard{transition:none}
  body.dragging .kcard:hover{transform:none; box-shadow:none; z-index:auto}
  body.dragging{cursor:grabbing}
  /* The gap left behind while the card is being carried around. */
  .kcard.picked{opacity:.22; filter:grayscale(.6)}

  /* The card actually being carried: a real, solid card under the pointer
     rather than the browser's washed-out drag image. */
  #dragGhost{
    position:fixed; left:0; top:0; z-index:200; pointer-events:none;
    width:52px; height:70px; border-radius:7px; border:1px solid var(--accent);
    background:linear-gradient(160deg,#2c3444,#1c222c);
    box-shadow:0 18px 40px #000e; will-change:transform;
    transform-origin:center center;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:3px;
  }
  #dragGhost img{position:absolute; inset:0; width:100%; height:100%;
                 object-fit:cover; border-radius:6px}
  #dragGhost .kn{position:relative; z-index:1; font-size:9px; line-height:1.1;
                 text-align:center; text-shadow:0 1px 3px #000; padding:0 2px}
  #dragGhost.over{border-color:#8fe0a0; box-shadow:0 18px 40px #000e, 0 0 0 3px #8fe0a055}

  /* Where a dragged card may be dropped. */
  body.dragging .pcard.droppable{outline:2px dashed var(--accent); outline-offset:2px}
  body.dragging .ev.droppable{outline:2px dashed var(--accent); outline-offset:1px}
  body.dragging #boardArea.droppable{outline:2px dashed var(--accent); outline-offset:-6px}
  body.dragging .hand.droppable{outline:2px dashed #7f8ba0; outline-offset:3px; border-radius:8px}
  .ev.dropping, .pcard.dropping{background:#2a3320}
  .kcard .kn{position:relative; z-index:1; font-size:9px; line-height:1.1; text-align:center;
             text-shadow:0 1px 3px #000; padding:0 2px}
  .kcard.playable{border-color:#5a8f68}
  .kcard.playable:hover{border-color:#7fc48f}
  .kcard.locked{opacity:.42; cursor:not-allowed}
  .kcard.reaction{border-color:#6b5a8f}
  .kcard.offturn{border-color:#c76b6b}
  .kcard.offturn:hover{border-color:#e08a8a}
  /* A reaction that could be spent on the newest log entry right now. */
  .kcard.armedreact{border-color:#4bb1d9; box-shadow:0 0 0 2px #4bb1d955}
  .kcard .pip.now{background:#a33; color:#fff}
  .kcard .pip{position:absolute; top:2px; right:3px; z-index:2; font-size:8px; color:#fff;
              background:#0009; border-radius:3px; padding:0 3px}
  .emptyhand{color:var(--dim); font-size:12px; padding:0 6px; white-space:nowrap}
  .bside{flex:1 1 0; min-width:0; display:flex; align-items:center}
  .bside.right{justify-content:flex-end}
  .bcentre{display:flex; align-items:center; gap:10px; flex:0 0 auto}
  .actions-bar{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  .actions-bar button{padding:9px 15px}
  .turntimer{position:relative; display:inline-flex; align-items:center; justify-content:center;
             width:138px; min-height:36px; padding:0 15px; overflow:hidden;
             border:1px solid var(--line); border-radius:6px; background:#0004;
             color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
  .turntimer .timerfill{position:absolute; inset:0 auto 0 0; width:0; background:#a33;
                        opacity:.72; transition:width .25s linear; pointer-events:none}
  .turntimer .timertext{position:relative; z-index:1; text-shadow:0 1px 3px #000}
  input[type="range"]{width:100%; height:18px; margin:4px 0; appearance:none; background:transparent; cursor:pointer}
  input[type="range"]::-webkit-slider-runnable-track{height:6px; border:1px solid var(--line); border-radius:3px; background:#171b22}
  input[type="range"]::-webkit-slider-thumb{width:16px; height:16px; margin-top:-6px; appearance:none;
    border:2px solid var(--ink); border-radius:50%; background:var(--accent); box-shadow:0 1px 5px #000b}
  input[type="range"]::-moz-range-track{height:6px; border:1px solid var(--line); border-radius:3px; background:#171b22}
  input[type="range"]::-moz-range-progress{height:6px; border-radius:3px; background:var(--accent)}
  input[type="range"]::-moz-range-thumb{width:12px; height:12px; border:2px solid var(--ink);
    border-radius:50%; background:var(--accent); box-shadow:0 1px 5px #000b}

  /* ── Log / dice modals ───────────────────────────────────────────── */
  .logbox{max-height:52vh; overflow-y:auto; font-size:12.5px; color:var(--dim);
          background:#12151a; border:1px solid var(--line); border-radius:6px; padding:9px 11px}
  .logbox div{margin-bottom:3px}
  .logbox b{color:var(--ink); font-weight:600}
  .dicerow{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:2px 0}
  .dicerow .dn{width:22px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
  .dicebar{height:12px; border-radius:3px; background:var(--accent); min-width:2px}
  .dicerow .dc{width:26px; color:var(--dim); font-variant-numeric:tabular-nums}
  .recent{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px}
  .recent span{background:#0004; border:1px solid var(--line); border-radius:4px;
               padding:1px 6px; font-size:12px; font-variant-numeric:tabular-nums}
  .recent span.seven{border-color:var(--danger); color:var(--danger)}

  @media (max-width:900px){
    #panels{width:min(300px, 54%)}
    /* Full-size dice would eat a narrow board. */
    .die{width:58px; height:58px; border-radius:11px; padding:7px}
    .die i{width:10px; height:10px}
    .dicesum{font-size:22px; padding:5px 11px}
    #zoomWrap{top:80px}
    #feed{width:150px}
    .ev{font-size:11px; padding:4px 6px}
    /* Stacked into a column these ran down past the top of the log and sat on
       it. Wrapped they stay two rows deep, and the log is placed underneath
       whatever height they end up — see placeFeed. */
    header{gap:7px; padding:5px 8px}
    header h1{font-size:14px}
    /* Narrow enough that the header wraps anyway, so the advice takes a line
       of its own rather than squeezing itself down to three words. */
    #hintslot{flex:1 0 100%; order:9; font-size:11.5px}
    #leftbtns{flex-wrap:wrap; max-width:250px}
  }
  @media (max-width:820px){
    .pcard{min-width:148px; gap:4px 7px; --avW:60px; --avPull:10px; --emW:74px; --pillDrop:15px}
    .pcard .pname{font-size:12px; padding:2px 6px}
    .avwrap .avinit{font-size:22px}
    .vpring{width:24px; height:24px; font-size:13px; left:-10px}

    .stat{min-width:29px; padding:2px 4px}
    .stat b{font-size:13.5px}
    .stat svg{width:13px; height:13px}
    .slot,.kcard{width:44px; height:60px}
  }


  /* A hex that just changed under you: a token swapped by Alter the Future,
     or the robber landing. Floated over the board rather than drawn into the
     SVG, because the SVG is rebuilt from scratch on every repaint and an
     animation in there would restart each time. */
  /* The robber landing, a number token swapped. Bigger and slower than they
     were: these are the two things that change the board without a piece being
     built, and at the old size and speed they were easy to blink past. */
  .hexpulse{
    position:absolute; z-index:8; pointer-events:none;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    width:66px; height:66px; border-radius:50%;
    font-size:25px; font-weight:700; font-variant-numeric:tabular-nums;
    animation:hexpop 1.75s cubic-bezier(.2,.85,.3,1) forwards;
  }
  .hexpulse.alter{ background:#e2b33c44; border:3px solid var(--accent); color:#ffe9ab;
                   box-shadow:0 0 0 4px #e2b33c22, 0 8px 26px #000a; }
  .hexpulse.robber{ background:#0b0d10cc; border:3px solid #cbd3df; color:#e7ebf1; font-size:20px;
                    box-shadow:0 0 0 4px #cbd3df22, 0 8px 26px #000c; }
  @keyframes hexpop{
    0%  {transform:translate(-50%,-50%) scale(.3)  rotate(-12deg); opacity:0}
    18% {transform:translate(-50%,-50%) scale(1.3) rotate(4deg);   opacity:1}
    34% {transform:translate(-50%,-50%) scale(1)   rotate(0);      opacity:1}
    74% {transform:translate(-50%,-50%) scale(1.04);               opacity:1}
    100%{transform:translate(-50%,-50%) scale(1.45);               opacity:0}
  }

  /* ══ MOVEMENT ══════════════════════════════════════════════════════
     Things that ought to be SEEN to move. Resources used to arrive as a number
     ticking up in a corner and a road appeared on the next repaint, so half of
     what happened on your turn happened invisibly.

     A fixed overlay across the whole window rather than something inside the
     board, because most of these journeys start on the board and finish on a
     seat card in the strip above it. Nothing here takes a pointer event and
     nothing here is state: miss it and you have lost only the flourish.
     ══════════════════════════════════════════════════════════════════ */
  #fx{ position:fixed; inset:0; z-index:150; pointer-events:none; overflow:hidden }
  .fxcard{
    position:absolute; left:0; top:0; width:34px; height:46px; border-radius:5px;
    border:1px solid #0b0d10; background:var(--panel2); overflow:hidden;
    box-shadow:0 6px 18px #000b; display:flex; align-items:center; justify-content:center;
  }
  .fxcard img{ width:100%; height:100%; object-fit:cover; display:block }
  .fxcard .fxswatch{ width:100%; height:100%; display:block }
  /* Until res-back.png exists, a face-down resource still has to read as one. */
  .fxcard .hiddenface{
    background:linear-gradient(150deg,#3c465a,#232a36);
    box-shadow:inset 0 0 0 2px #0b0d10, inset 0 0 0 4px #4a5668;
  }
  .fxcard.kit{ width:32px; height:44px; border-color:var(--accent) }
  .fxcard .fxback{ font-size:19px; line-height:1 }

  /* The hex that grew them, lighting up as they leave it. */
  .hexflash{
    position:absolute; z-index:7; pointer-events:none; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, var(--fc,#fff) 0%, transparent 66%);
    opacity:0; animation:hexflash .9s ease-out forwards;
  }
  @keyframes hexflash{
    0%  {opacity:0;  transform:translate(-50%,-50%) scale(.65)}
    28% {opacity:.62;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;  transform:translate(-50%,-50%) scale(1.14)}
  }

  /* A piece landing where it was placed. The board leaves the piece out for
     the duration, so this IS the piece arriving — it comes down from above,
     settles, and the real one takes over at exactly the moment it stops. */
  .plop{ position:absolute; left:0; top:0; width:0; height:0; pointer-events:none }
  /* The size has to be set here, not left to the <svg> inside. An inline SVG
     with display:block takes width:auto, and auto inside a zero-width holder
     is zero — so the piece was being drawn 0x0 and all anybody ever saw was
     the ring going off around it. */
  .plopbody{
    position:absolute; left:0; top:0; line-height:0;
    filter:drop-shadow(0 5px 12px #000b);
    animation:plopdrop .52s cubic-bezier(.2,.86,.28,1.35) forwards;
  }
  .plopbody svg{ display:block; width:100%; height:100% }
  @keyframes plopdrop{
    0%  {opacity:0; transform:translate(-50%,-50%) translateY(-30px) scale(1.85)}
    45% {opacity:1; transform:translate(-50%,-50%) translateY(0)     scale(1.12)}
    72% {opacity:1; transform:translate(-50%,-50%) scale(.96)}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1)}
  }
  .plopring{
    position:absolute; left:0; top:0; border-radius:50%; border:2px solid var(--pcol,#fff);
    opacity:0; animation:plopring .66s .08s ease-out forwards;
  }
  @keyframes plopring{
    0%  {opacity:.85; transform:translate(-50%,-50%) scale(.2)}
    100%{opacity:0;   transform:translate(-50%,-50%) scale(1)}
  }

  /* A play announces itself in the middle of the board for a couple of
     seconds. The log keeps the full record; this is so a card actually being
     played is not something you only find out by reading. Nothing here takes
     a click — pointer-events stay off the whole layer, so a Nope can still be
     dragged onto the log while it is on screen. */
  #showcase{
    position:absolute; inset:0; z-index:60; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  /* Above the dialogs rather than behind them. The moment your own play is
     answered is exactly the moment a dialog is most likely to be thrown up at
     you — a Defused card comes straight back, which opens one — and at z-index
     9 the answer was drawn behind it. The person whose play it was, the one
     with most reason to see it, was the only one who never did.

     With a dialog open the reveal moves to the top of the board rather than
     fighting it for the middle, and comes down in size to match. Still no
     pointer events, so it can never take a click meant for the dialog. */
  /* Collapsed to its own height at the top of the board rather than filling
     it, so the strip clears a dialog centred below instead of lying across it. */
  body.hasmodal #showcase{
    bottom:auto; flex-direction:row; align-items:center; justify-content:center;
    padding:2px 8px 0; gap:9px;
  }
  body.hasmodal .showcard{ width:clamp(46px, 6.4vh, 60px); border-width:1px; border-radius:7px }
  body.hasmodal .showcard.implode{ width:clamp(76px, 11vh, 100px) }
  body.hasmodal .showseven{
    width:clamp(40px, 5.6vh, 52px); font-size:clamp(19px, 3vh, 26px); border-width:2px;
  }
  body.hasmodal .showcap{ font-size:15px; padding:6px 13px; max-width:min(370px, 66%) }
  #showcase.out{animation:showout .4s ease-in forwards}
  @keyframes showout{to{opacity:0; transform:scale(.94)}}
  .showcard{
    width:clamp(112px, 17vh, 156px); aspect-ratio:5/7; border-radius:12px;
    border:2px solid var(--accent); background:linear-gradient(160deg,#2c3444,#1c222c);
    box-shadow:0 26px 64px #000d, 0 0 0 5px #0007; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    animation:flipin .55s cubic-bezier(.2,.85,.3,1.25) both;
  }
  .showcard img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .showcard .kn{position:relative; z-index:1; font-size:17px; font-weight:800;
                text-align:center; padding:0 8px; text-shadow:0 2px 6px #000}
  @keyframes flipin{
    0%  {transform:perspective(900px) rotateY(-115deg) scale(.5);  opacity:0}
    55% {transform:perspective(900px) rotateY(14deg)   scale(1.08); opacity:1}
    100%{transform:perspective(900px) rotateY(0)       scale(1)}
  }
  /* The Imploding Kitten is not so much drawn as arrived at. It spins up out
     of nothing, half again the size of any other card, and stops dead at full
     size — the one card the whole table has to look at. */
  .showcard.implode{
    width:clamp(178px, 27vh, 250px);
    border-color:var(--danger);
    box-shadow:0 30px 80px #000e, 0 0 0 6px #0008, 0 0 46px #ff5a5a55;
    animation:implodein 1.05s cubic-bezier(.13,.86,.24,1) both;
  }
  @keyframes implodein{
    0%  {transform:scale(.012) rotate(0turn); opacity:0}
    7%  {opacity:1}
    100%{transform:scale(1) rotate(5turn)}
  }
  .showcap.implode{border-color:var(--danger); color:#ffd9d9; font-weight:800;
                   font-size:21px}

  /* A seven gets the same moment without a card to turn over. */
  .showseven{
    width:clamp(84px, 13vh, 116px); aspect-ratio:1; border-radius:50%;
    background:#f2ead6; border:3px solid var(--danger); color:#b3261e;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(40px, 6.5vh, 60px); font-weight:700; line-height:1;
    box-shadow:0 26px 64px #000d; animation:sevenin .5s cubic-bezier(.2,.9,.3,1.3) both;
  }
  @keyframes sevenin{
    0%  {transform:scale(.3) rotate(-25deg); opacity:0}
    60% {transform:scale(1.14) rotate(6deg); opacity:1}
    100%{transform:scale(1) rotate(0)}
  }
  .showcap{
    background:#0b0d10ee; border:1px solid var(--line); border-radius:10px;
    padding:10px 20px; font-size:19px; font-weight:700; letter-spacing:.2px;
    line-height:1.35; max-width:min(480px, 80%); text-align:center;
    text-shadow:0 2px 8px #000c;
    box-shadow:0 10px 30px #000a; animation:capin .45s .12s ease-out both;
  }
  /* The one thing in here that is coloured is WHO. Every player already has a
     colour — their pieces on the board, the bar down their seat card, the dot
     beside their name in the log — so the names in a caption wear it too, and
     the box stays out of it. Heavier and shadowed because a seat colour is
     picked to sit against the board, not to be read as a word. */
  .showcap .capname{font-weight:800; text-shadow:0 1px 4px #000, 0 0 10px #0009}
  .showcap.seven{border-color:var(--danger); color:#ffd9d9}
  @keyframes capin{from{transform:translateY(10px); opacity:0}to{transform:none; opacity:1}}

  /* Dialogs that dock beside the board rather than covering it. A trade or a
     card purchase is not urgent enough to take the screen away, and taking it
     away meant you could not answer a Nope while one was open — the log, the
     board and your hand all sit behind an .overlay. These leave all three
     reachable. Several can stand at once, one per seat, which is what lets a
     trade offer go to everybody together instead of round the table. */
  /* The full height of the board area. These used to be inset top and bottom
     to keep clear of the dice and the kitten deck, which on a shorter screen
     left a trade offer scrolling inside itself — and a dialog you have to
     scroll to answer is a dialog half the table will answer wrong. Overlapping
     the deck is the better trade: the deck is not going anywhere, and the
     panel is gone in a few seconds. */
  #panels{
    position:absolute; right:12px; top:12px; bottom:12px;
    width:min(330px, 46%); z-index:6;
    display:flex; flex-direction:column; gap:8px; align-items:stretch;
    overflow-y:auto; scrollbar-width:none;
    pointer-events:none;              /* the empty column never eats a click */
  }
  #panels::-webkit-scrollbar{width:0}
  .panel{
    pointer-events:auto;
    background:var(--panel); border:1px solid var(--accent); border-radius:10px;
    padding:10px 12px; box-shadow:0 12px 34px #000a; flex:0 0 auto;
    animation:panelin .16s ease-out;
  }
  @keyframes panelin{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
  .panel h3{margin:0 0 6px; font-size:15px; font-weight:700;
            color:var(--accent); letter-spacing:.2px}
  .panel .sub{margin:0 0 8px; color:#b9c4d3; font-size:12.5px; line-height:1.45}
  .panel .sub b{color:var(--ink); font-weight:700}
  .panel .actions{display:flex; gap:5px; justify-content:flex-end; margin-top:9px; flex-wrap:wrap}
  .panel .actions button{padding:6px 11px; font-size:12.5px}
  .panel .counter{margin-bottom:3px}
  .panel .pick{display:flex; flex-wrap:wrap; gap:4px}
  /* Fixed geometry: the count rides in the corner, out of the flow entirely,
     so a button is exactly as wide with a count as without one. Reserving an
     inline slot for it worked too, but cost ~70px across the row and pushed
     every picker onto two lines. Nothing here ever moves as you click. */
  .pick.tight{padding-top:6px}
  .pick.tight button{padding:4px 6px; font-size:11.5px; line-height:1.2; position:relative}
  .pick.tight .ct{
    position:absolute; top:-5px; right:-3px; z-index:1;
    background:var(--accent); color:#161a20; font-size:9.5px; font-weight:700;
    border-radius:8px; padding:0 4px; min-width:15px; text-align:center;
    box-shadow:0 1px 4px #0009;
  }
  .pick.tight .ct.off{display:none}
  /* Take one back out. A span rather than a button because it lives inside
     one, and its click is stopped from reaching the button underneath — which
     would otherwise put the card straight back in. Only drawn when there is
     something to take back, so it never sits there doing nothing. */
  .pick.tight .ct.minus{
    right:auto; left:-4px; top:-6px; padding:0 5px;
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    font-size:11px; line-height:1.3; cursor:pointer;
  }
  .pick.tight .ct.minus:hover{border-color:var(--accent); color:var(--accent)}
  .pick.tight .swatch{width:8px; height:8px; border-radius:2px}
  .panel .stack{font-size:12.5px}
  /* An offer should be judgeable at a glance, so the resources are chips in
     their own colours rather than a sentence to read. */
  .tline{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px}
  /* What the staged exchange comes to, on one line. */
  .tsum{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:8px;
        padding-top:7px; border-top:1px solid var(--line); font-size:12px}
  .tsum .arrow{color:var(--dim)}
  .tsum .mismatch{color:var(--accent); font-size:11px; width:100%}
  .tsum .buys{color:var(--ink); font-weight:600}
  .tline > span:first-child{color:var(--dim); font-size:11px; min-width:52px}
  .pick.tight .rate{opacity:.6; font-size:10.5px}
  .panel.forme{border-color:#7fc48f; box-shadow:0 12px 34px #000a, 0 0 0 2px #7fc48f33}
  /* An answer is still owed — the turn controls are gone until it is given. */
  .thinking.owed{color:var(--accent)}
  /* The board moved under an open panel — a Nope rewound something. */
  .panel.stale{border-color:var(--danger)}
  body.haspanel #zoomWrap{display:none}

  .overlay{
    position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:18px;
    box-shadow:0 18px 50px #0008;
  }
  .modal h2{margin:0 0 6px; font-size:19px; font-weight:700;
            color:var(--accent); letter-spacing:.2px}

  /* A forced dialog you can push out of the way. Discarding for a seven or
     paying an Attack used to mean paying FIRST and reacting afterwards: the
     overlay covers the log, and the log is the only place a Nope can be
     dropped. Minimised, the dialog becomes a tab in the corner and the board,
     the log and your hand are all live again behind it. The answer is still
     owed — the table still waits for it — you have just stopped staring at it.
     Purely a view state: nothing about it travels, so a shipped dialog is
     minimised by whoever is looking at it and by nobody else. */
  .minibtn{
    float:right; margin:-2px 0 0 12px; padding:1px 8px 3px; line-height:1.1;
    font-size:15px; background:#0000; border:1px solid var(--line); border-radius:7px;
    color:var(--dim); cursor:pointer;
  }
  .minibtn:hover{color:var(--ink); border-color:var(--accent)}
  .minibtn .up{display:none}
  /* Folded: bottom right, which is the one corner nothing else claims — the
     seats run across the top, the log down the left, the trade panels down the
     right above it, and your hand along the bottom. All four stay clickable. */
  .overlay.mini{
    background:#0000; pointer-events:none;
    align-items:flex-end; justify-content:flex-end; padding:0 12px 104px 0;
  }
  .overlay.mini .modal{
    width:auto; max-width:min(340px, 62vw); padding:0; overflow:visible;
    background:#0000; border:none; box-shadow:none;
  }
  .overlay.mini .modal > *{display:none}
  .overlay.mini .modal > h2{
    display:flex; align-items:center; gap:8px; margin:0; font-size:13px;
    pointer-events:auto; cursor:pointer;
    background:var(--panel); border:1px solid var(--accent); border-radius:9px;
    padding:7px 11px; box-shadow:0 12px 34px #000a;
    animation:panelin .16s ease-out;
  }
  .overlay.mini .mtitle{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .overlay.mini .minibtn{float:none; margin:0; flex:0 0 auto}
  .overlay.mini .minibtn .down{display:none}
  .overlay.mini .minibtn .up{display:inline}
  .mininote{
    margin:6px 0 0; font-size:12px; color:#a7b2c2; line-height:1.45;
    border-top:1px solid var(--line); padding-top:7px;
  }
  .modal p.sub{margin:0 0 14px; color:#b9c4d3; font-size:13.5px; line-height:1.5}
  .modal p.sub b{color:var(--ink); font-weight:700}
  .modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
  .counter{display:flex; align-items:center; gap:8px; padding:5px 0}
  .counter .lbl{flex:1; display:flex; align-items:center; gap:6px; font-weight:600}
  .counter .val{width:26px; text-align:center; font-variant-numeric:tabular-nums}
  .pick{display:flex; gap:6px; flex-wrap:wrap}
  .pick button.on{background:#2f5d3a; border-color:#4d8a5f}
  .stack{background:#0003; border:1px solid var(--line); border-radius:6px;
         padding:9px; margin:8px 0; font-size:13px}
  .stack b{font-weight:700; color:var(--ink)}
  .stack div{padding:2px 0}
  table.trade{width:100%; border-collapse:collapse; font-size:12.5px}
  table.trade td{padding:3px 4px}
  .warnbox{background:#4a2020; border:1px solid #7a3535; border-radius:6px;
           padding:9px 11px; font-size:13px; font-weight:600; color:#ffcaca;
           line-height:1.45; margin:8px 0}
  .okbox{background:#1f3a28; border:1px solid #3a6b47; border-radius:6px;
         padding:9px 11px; font-size:13px; font-weight:600; color:#c6ecd3;
         line-height:1.45; margin:8px 0}
  .warnbox b, .okbox b{color:#fff; font-weight:800}
  /* One line of a list inside a dialog: a marker, then the thing. Used by
     the art audit and by the seat list in the online lobby. */
  .artrow{display:flex; align-items:center; gap:8px; padding:2px 0; font-size:12.5px}
  .artrow .f{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .artrow .ok{color:#7fc48f; flex:0 0 auto}
  .artrow .no{color:var(--dim); flex:0 0 auto}
  .rules{font-size:13px; color:#a7b2c2; line-height:1.5}
  .rules b{color:var(--ink); font-weight:700}
  .rules h4{color:var(--accent); margin:13px 0 5px; font-size:14px; font-weight:700}
  .rules ul{margin:4px 0; padding-left:18px}
  .rules li{margin-bottom:3px}

  /* Kept last on purpose. Several of the rules below restate things the base
     stylesheet sets further down the file — #panels, .modal, .panel — and a
     media query that appears BEFORE them loses to them however specific it is.
     The 900px block above has the same problem with #panels and has never
     actually moved it; this one sits after everything so it wins.
     ---------------------------------------------------------------- */
  /* ── A phone held sideways ─────────────────────────────────────────
     Barely 380 pixels of height for everything. The strip at the top and the
     hand at the bottom were sized for a laptop and between them left the board
     a letterbox; here they give back every row they can and the board takes
     the rest. Nothing is removed — the same numbers, the same cards, smaller.
     ────────────────────────────────────────────────────────────────── */
  @media (max-height:560px){
    header{padding:3px 8px; gap:8px}
    header h1{font-size:13px}
    button.sm{padding:2px 6px; font-size:11px}
    #modeTag{font-size:9px}

    /* The seat card folds onto TWO rows beside the portrait rather than three
       down the card: the name across the top, both pills under it. Stacked,
       four of these ate a sixth of the screen. Same four boxes, same order,
       re-parcelled — which is why the card is a grid and not nested columns. */
    #players{padding:3px 5px; gap:5px}
    .pcard{
      padding:3px 5px; border-left-width:4px; border-radius:6px; min-width:0;
      gap:2px 5px;
      grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:
        "av name name"
        "av hand board";
    }
    /* No spare height on a short screen, so nothing overhangs anything. */
    .pcard{--avW:40px; --avPull:0px; --emW:52px}
    .avwrap{align-self:center}
    .avwrap{border-width:2px}
    .avwrap .avinit{font-size:17px}
    .vpring{width:19px; height:19px; font-size:11px; left:-8px}
    .pcard .pname{font-size:11px; align-self:center; padding:1px 5px; border-radius:4px}
    /* Back into the flow: there is no spare height to hang into, and the
       strip's padding has gone with it. */
    .statgroup.hand{position:static; transform:none; grid-area:hand;
                    box-shadow:none; background:#0006}
    .stat{padding:0 3px; min-width:23px; gap:3px}
    .stat b{font-size:12px; line-height:1.15}
    .stat svg{width:11px; height:11px}

    #stage{padding:3px}
    #boardArea{inset:3px}
    /* One row of buttons, not three. Wrapped, they were taller than the hand
       they sat beside and the board paid for all of it. */
    #bottom{padding:3px 6px; gap:6px}
    .bside{flex:0 1 auto}
    .actions-bar{flex-wrap:nowrap; gap:4px}
    .actions-bar button{padding:5px 8px; font-size:11px; white-space:nowrap}
    .thinking{font-size:10.5px; white-space:nowrap}
    .slot,.kcard{width:34px; height:46px; border-radius:5px}
    .slot .n{font-size:12px}
    .slot .rn{display:none}          /* unreadable at this size, and the art says it */
    .kcard .pip{font-size:7px; padding:0 2px}
    .deck{width:52px; height:72px}
    .deckcost{display:none}
    .die{width:40px; height:40px; border-radius:8px; padding:5px}
    .die i{width:7px; height:7px}
    .dicesum{font-size:16px; padding:3px 8px}
    #feed{width:132px}
    .ev{font-size:10px; padding:3px 5px}
    /* Wide and short: there is room across the top for all four on one line,
       and no height to spare for a second row. */
    #leftbtns{top:6px; left:6px; flex-wrap:nowrap; max-width:none}
    /* Chat takes a bigger share of a short column, or it is two lines deep. */
    #stage{--chatH:min(190px, 42vh)}
    #chatbox{width:clamp(160px, 26vw, 240px)}
    .turntag{padding:2px 7px; font-size:11px}
    .turntag b{font-size:13px}
    .msg{font-size:11px}
    #chatin{font-size:11px; padding:4px 6px}
    #emojiTray{grid-template-columns:repeat(5, 1fr); padding:5px}
    #emojiTray button{font-size:17px; padding:2px 4px}

    /* Whole, not scrolling inside itself: a panel that has to be scrolled to
       be answered is the thing this was meant to avoid. If one is ever taller
       than the screen the column behind it scrolls, which is the fallback
       rather than the plan. */
    #panels{width:min(280px, 60%)}
    .panel{padding:7px 9px}
    .panel h3{font-size:13.5px}
    .panel .sub{font-size:11.5px; margin-bottom:5px}
    /* The buttons used to be pinned to the bottom of a panel that scrolled
       inside itself. Nothing scrolls inside a panel now, so there is nothing
       for them to be pinned against. */
    .pick.tight button{font-size:10.5px; padding:3px 5px}

    /* Same for a forced dialog: it can be taller than the screen, so its
       buttons stay put while the rest of it scrolls under them. */
    .overlay{padding:8px}
    .modal{max-height:96vh; padding:10px 12px}
    .modal h2{font-size:16px}
    .modal p.sub{font-size:12.5px; margin-bottom:8px}
    .rules{font-size:12px}
    .warnbox, .okbox, .stack{font-size:12px; padding:7px 9px}
    .showcap{font-size:15px; padding:6px 13px}
    .counter{padding:2px 0}
    .modal .actions{
      position:sticky; bottom:-10px; margin-top:10px; padding:8px 0 2px;
      background:var(--panel); border-top:1px solid var(--line);
    }
    .overlay.mini{padding:0 8px 58px 0}
  }
</style>
</head>
<body>

<header>
  <h1>Exploding <span>Catan</span></h1>
  <!-- Advice used to have a bar of its own across the bottom of the window: 24
       pixels of chrome, permanently, for a line that is empty most of the time
       and never longer than a sentence. It shares the header's spare width
       now, and the board keeps the height. -->
  <div class="spacer"></div>
  <span id="hintslot"></span>
  <button class="sm" id="tipBtn" onclick="toggleTips()" title="Show or hide the
    one-line advice in this bar">Tips</button>
  <span id="modeTag" hidden></span>
  <button class="sm" onclick="onlineDialog()">Online</button>
  <button class="sm" onclick="showRules()">Rules</button>
  <button class="sm" onclick="newGameDialog()">New Game</button>
</header>

<div id="players"></div>

<div id="stage">
  <div id="boardArea">
    <svg id="board"></svg>
    <div id="diceWrap"></div>
    <div id="zoomWrap">
      <button class="sm" onclick="zoomBoard(0.12)" title="Zoom in">+</button>
      <button class="sm" onclick="zoomBoard(-0.12)" title="Zoom out">−</button>
      <button class="sm" onclick="resetZoom()" title="Reset view">⌂</button>
    </div>
    <div id="deckWrap"></div>
    <div id="panels"></div>
    <div id="showcase" hidden></div>
  </div>
  <div id="leftbtns">
    <button class="sm on" id="logBtn" onclick="toggleFeed()">Game log</button>
    <button class="sm" onclick="showDice()">Dice history</button>
    <button class="sm" id="chatBtn" onclick="toggleChat()">Chat</button>
    <button class="sm" id="emojiBtn" onclick="toggleEmojiTray()">Emoji</button>
    <span class="turntag" id="turnDir" hidden></span>
    <!-- Both hang off the bottom of the strip, in the same place, and only one
         of them is ever out: opening either puts the other away. -->
    <div id="emojiTray"></div>
    <div id="chatbox">
      <div id="chatlog"></div>
      <div id="chatrow">
        <input id="chatin" maxlength="140" placeholder="Say something…" autocomplete="off"
               onkeydown="chatKey(event)">
        <button onclick="sendChatFromInput()">Send</button>
      </div>
    </div>
  </div>
  <div id="feed"></div>
</div>

<div id="bottom"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONSTANTS
   ══════════════════════════════════════════════════════════════════════ */

/* The build stamp. Bump it on EVERY release, and bump the ?v= on the three
   script tags at the bottom of this file to match — GitHub Pages serves
   assets with max-age=600, so without it players sit on stale code for ten
   minutes and the game misbehaves in ways that look like game bugs.

   Nothing on the page shows it. It has two jobs, both machine-facing: busting
   that cache, and letting a terminal notice it is on different code from the
   host and say so instead of quietly misbehaving. A date rather than a version
   name on purpose — a name has to be decided, and a stamp that has to be
   decided is a stamp somebody forgets to change. */
const GAME_VERSION = "2026-08-27w";

const RES = ["wood","brick","sheep","wheat","ore"];
const RES_NAME = {wood:"Wood", brick:"Brick", sheep:"Sheep", wheat:"Wheat", ore:"Ore"};
const RES_COLOR = {wood:"#2f6b3a", brick:"#a4472a", sheep:"#7fb85c", wheat:"#dfae32", ore:"#78838f", desert:"#cdbb8e"};
const PLAYER_COLORS = ["#d94b4b","#4b7fd9","#e08a2e","#e8e8e8","#59b364","#a86fd0"];

/* Little line glyphs for the profile stats. Drawn rather than lettered so the
   row reads at a glance, and stroked in currentColour so they follow the
   theme. Every one keeps a title on its tile for whoever wants the word. */
const SVG = (d) => '<svg viewBox="0 0 16 16" aria-hidden="true">' + d + '</svg>';
const ICON = {
  vp:     SVG('<path d="M8 2.2l1.7 3.6 3.9.5-2.9 2.7.8 3.9L8 11l-3.5 1.9.8-3.9L2.4 6.3l3.9-.5z"/>'),
  res:    SVG('<rect x="2.2" y="4.4" width="7.4" height="9.2" rx="1.2"/>' +
              '<path d="M6.4 4.4V3.6a1.2 1.2 0 011.2-1.2h5a1.2 1.2 0 011.2 1.2v7a1.2 1.2 0 01-1.2 1.2h-.8"/>'),
  kit:    SVG('<path d="M8 1.6l1.5 2.9 3-1-1 3 2.9 1.5-2.9 1.5 1 3-3-1L8 14.4 ' +
              '6.5 11.5l-3 1 1-3L1.6 8l2.9-1.5-1-3 3 1z"/>'),
  // Dashes on a slant: dead level they read as an ellipsis rather than a road.
  road:   SVG('<path d="M2.4 12.6l2-2.4M6.6 9.6l2.4-2.8M11.2 6l2.4-2.6"/>'),
  knight: SVG('<path d="M8 2.2l5 1.8v4.2c0 3-2.1 5-5 5.6-2.9-.6-5-2.6-5-5.6V4z"/>')
};
const PLAYER_NAMES  = ["Red","Blue","Orange","White","Green","Purple"];

const COST = {
  road:       {wood:1, brick:1},
  settlement: {wood:1, brick:1, sheep:1, wheat:1},
  city:       {wheat:2, ore:3}
};
const LIMIT = {road:15, settlement:5, city:4};
let BANK_PER_RES = 19;

// ── Kitten deck (54 cards) ───────────────────────────────────────────────
// Reverse count is inferred: the doc lists no number, and 54 − (all others) = 5.
const KITTEN = {
  implode: {name:"Imploding Kitten", count:1,  kind:"auto",
    text:"When drawn, immediately take every other player's entire resource hand. It cannot be Noped, Defused or refuted in any way — even a cancelled turn does not undo it."},
  vp:      {name:"Feral Kitten", count:3,  kind:"vp",
    text:"Worth 1 victory point. Kept hidden until you win."},
  skip:    {name:"Skip", count:5, kind:"target",
    text:"Skip a chosen player's next turn."},
  nope:    {name:"Nope", count:5, kind:"response",
    text:"Two uses only: cancel an attack aimed at you, or cancel a player's whole turn. A cancelled turn destroys everything they gained that turn. If someone reaches the target points, the next player in turn order holding a Nope must spend it."},
  explode: {name:"Exploding Kitten", count:5, kind:"target",
    text:"Return a chosen player's entire resource hand to the bank."},
  defuse:  {name:"Defuse", count:5, kind:"response",
    text:'"No you." Reflect an attack aimed at you back onto the player who played it.'},
  alter:   {name:"Alter the Future", count:5, kind:"board",
    text:"Swap any two number tokens on the board."},
  attack:  {name:"Attack", count:5, kind:"target",
    text:"A chosen player discards 3 resource cards of their choice."},
  favor:   {name:"Favor", count:5, kind:"target",
    text:"Name 3 resource cards. A chosen player gives you whichever of them they actually hold."},
  reverse: {name:"Reverse", count:5, kind:"self",
    text:"Take another turn immediately, then turn order reverses."},
  knight:  {name:"Knight", count:10, kind:"knight",
    text:"Move the robber and steal 1 resource from a player on that hex. Counts toward Largest Army."}
};
const KNIGHT_FLAVOR = ["Beard Cat","Watermelon Cat","Potato Cat","Rainbow Cat","Taco Cat"];

/* How much of a head start everybody gets. Catan's opening is slow on purpose,
   which is fine across a table and long over a browser tab; these shorten it
   without touching anything else about the game. */
const MODES = {
  normal: {
    name: "Normal",
    blurb: "Catan's own opening. Only the second settlement pays out."
  },
  fast: {
    name: "Fast track",
    blurb: "Both opening settlements pay out, so everybody starts with roughly twice the resources."
  },
  fastplus: {
    name: "Fast track +",
    blurb: "Fast track, and everybody opens holding one random kitten card — dealt fresh, not off the 54, and never the Imploding Kitten."
  }
};
/* The last mode chosen, reused by the online lobby so the host picks once. */
let GAME_MODE = "normal";
let GAME_BOARD = "small";
let GAME_WIN_POINTS = 10;
let GAME_TURN_SECONDS = 0;
function modeOf(){ return (S && MODES[S.mode]) ? S.mode : "normal"; }
function fastStart(){ return modeOf() !== "normal"; }

/* Playable on anyone's turn, not just your own: a Nope to cancel the turn in
   progress, and the two direct attacks. */
const OFF_TURN = new Set(["nope","attack","explode"]);

// Cards that name a player when played, and can therefore be Defused in the
// response window. Knight is handled separately — it picks its victim later,
// so its Defuse chance comes at the moment of the steal.
const TARGETED = new Set(["skip","explode","attack","favor"]);

/* ══════════════════════════════════════════════════════════════════════
   CUSTOM ART
   ══════════════════════════════════════════════════════════════════════
   Drop files into ./art/ and they are picked up on load. Anything missing
   falls back to the procedural drawing, so partial art sets work fine —
   send one hex tile and only that hex changes.

   Piece art (settlement/city/road/robber) is used as an ALPHA MASK and
   flooded with the player's colour, so the colour you draw in is irrelevant;
   only the silhouette matters. Hex art is clipped to the hexagon, so send
   squares that bleed to the edges rather than pre-cut hexes.

   showArt() in the browser console lists every expected file and whether it
   loaded. It had a button in the header until the header ran out of room; the
   audit is worth keeping, a permanent button for it was not.
   ══════════════════════════════════════════════════════════════════════ */
/* Bots deliberately move slowly. The window for a Nope or a Defuse now
   closes as soon as the NEXT entry reaches the log, so a fast bot would slam
   it shut before a human could reach for a card. */
let AI_PACE = 3000;         // ms between visible bot actions
const ART_DIR = "art/";
const ART = { hex:{}, res:{}, piece:{}, token:{}, card:{}, avatar:{} };
const ART_MANIFEST = [];
let artLoaded = 0, artTotal = 0;

/* Portraits live in a folder of their own — art/profile/1.png upwards — so
   that actual pictures of people stay separate from hex tiles and card faces.
   Numbered rather than named because they are probed: the game asks for each
   in turn and keeps whatever answers, so adding one is dropping a file in.

   They are OPTIONAL in a way nothing else in the art folder is, so they are
   not counted in the "N of M found" figure, and their 404s are not a missing
   file so much as a question nobody answered. */
const PROFILE_DIR = "profile/";
const AVATAR_FILES = 40;

function buildArtManifest(){
  for (const t of RES.concat(["desert"]))
    ART_MANIFEST.push({ kind:"hex", key:t, file:`hex-${t}.png` });
  for (const r of RES)
    ART_MANIFEST.push({ kind:"res", key:r, file:`res-${r}.png` });
  // The back of a resource card. Only the robber needs one: everything else
  // that moves resources is public.
  ART_MANIFEST.push({ kind:"res", key:"back", file:"res-back.png" });
  for (const p of ["settlement","city","road","robber"])
    ART_MANIFEST.push({ kind:"piece", key:p, file:`piece-${p}.svg` });
  ART_MANIFEST.push({ kind:"token", key:"blank", file:"token-blank.png" });
  for (const k in KITTEN){
    if (k === "knight") continue;
    ART_MANIFEST.push({ kind:"card", key:k, file:`card-${k}.png` });
  }
  for (const f of KNIGHT_FLAVOR){
    const slug = f.split(" ")[0].toLowerCase();
    ART_MANIFEST.push({ kind:"card", key:"knight-" + slug, file:`card-knight-${slug}.png` });
  }
  ART_MANIFEST.push({ kind:"card", key:"back", file:"card-back.png" });
  // Portraits, if anybody put any in. Optional, so they stay out of the "N of M
  // found" count — otherwise an art folder with every real file in it would
  // still report itself two dozen short.
  for (let i = 1; i <= AVATAR_FILES; i++)
    ART_MANIFEST.push({ kind:"avatar", key:String(i),
                        file:`${PROFILE_DIR}${i}.png`, optional:true });
  artTotal = ART_MANIFEST.filter(a => !a.optional).length;
}

/* Probing with <img> rather than fetch() on purpose: fetch() is blocked by
   CORS on file:// pages, but image loads are not. Missing files log a 404 in
   the console — harmless, and expected until the art folder is filled in. */
function preloadArt(done){
  buildArtManifest();
  let pending = ART_MANIFEST.length;
  for (const a of ART_MANIFEST){
    const img = new Image();
    img.onload  = () => { ART[a.kind][a.key] = a.file;
                          if (!a.optional) artLoaded++;
                          if (!--pending) done(); };
    img.onerror = () => { ART[a.kind][a.key] = null;              if (!--pending) done(); };
    img.src = ART_DIR + a.file;
  }
}

function art(kind, key){
  const f = ART[kind] && ART[kind][key];
  return f ? ART_DIR + f : null;
}
function knightArtKey(c){
  return c && c.flavor ? "knight-" + c.flavor.split(" ")[0].toLowerCase() : null;
}
function cardArt(c){
  return c.key === "knight" ? art("card", knightArtKey(c)) : art("card", c.key);
}

/* ── Portraits ────────────────────────────────────────────────────────
   A player's picture is a short id rather than a filename — "a:3" is
   profile/3.png — so it can travel between browsers with different folders and
   be resolved against whatever each one actually has. An id that resolves to
   nothing falls back to the initial on the seat colour, which is what
   everybody has before they pick anything.

   art/profile/ is the ONLY place a portrait comes from. The picker used to
   fall back to the card faces and terrain tiles in art/ while that folder was
   empty, which was a reasonable stopgap and wrong the moment it had real
   pictures in it — not least because an id saved from those days went on
   resolving, so somebody who had once picked the Defuse card kept it for good
   however many portraits arrived afterwards. Nothing outside art/profile/ is a
   face, and an id naming anything else resolves to nothing at all. */
function avatarSrc(id){
  return validAvatarId(id) ? art("avatar", id.slice(2)) : null;
}

/* What the picker offers: art/profile/, and nothing else.

   Gaps are ordinary — a missing number just means nobody drew that one — and
   an empty folder means everybody plays as their initial, which is a perfectly
   good answer and no longer a reason to go raiding the card faces. */
function avatarPool(){
  const out = [];
  for (let i = 1; i <= AVATAR_FILES; i++)
    if (ART.avatar[String(i)]) out.push("a:" + i);
  return out;
}

/* For the picker's tooltip: what the player is looking at. */
function avatarLabel(id){
  return id ? "Portrait " + id.slice(2) : "No picture";
}

/* The portrait this browser plays as, remembered so it is picked once and not
   once a game. Empty means the initial, which is a perfectly good answer. */
let MY_AVATAR = (function(){
  try {
    const saved = localStorage.getItem("ec_avatar") || "";
    // An id from the days when the picker also offered card faces and tiles.
    // It resolves to nothing now, so drop it rather than carry a choice that
    // shows as an initial and cannot be explained by anything on screen.
    return validAvatarId(saved) ? saved : "";
  } catch(e){ return ""; }
})();
function setMyAvatar(id){
  MY_AVATAR = id || "";
  try { localStorage.setItem("ec_avatar", MY_AVATAR); } catch(e){}
}

/* Deal the bots faces of their own, all different, and never the one the
   person at the keyboard chose. Called at the start of a game, before anyone
   knows which seats are bots — the human's seat is written over afterwards by
   applyMyAvatar, and online the roster does it instead. */
function dealAvatars(players){
  const pool = avatarPool().filter(id => id !== MY_AVATAR);
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  players.forEach((p, i) => { p.avatar = pool.length ? pool[i % pool.length] : ""; });
}

/* Whoever is sitting at this screen gets the picture they chose. Run after the
   bots are switched on, because that is the moment it becomes knowable which
   seat that is. Online the roster answers it instead — see net.js. */
function applyMyAvatar(){
  if (!S) return;
  const me = S.players[viewSeat()];
  if (me) me.avatar = MY_AVATAR;
  render();
}

let HEX_SIZE = 54;

/* Base game: 19 hexes. The 5-6 player extension adds 11 more for a 30-hex
   board laid out in rows of 3-4-5-6-5-4-3, with two deserts, 28 number
   tokens, 11 ports and five extra of each resource in the bank. */
const BOARD = {
  small: {
    rows: null,                       // radius-2 hexagon, generated directly
    size: 54, ports: 9, bank: 19,
    terrain: ["wood","wood","wood","wood","brick","brick","brick",
              "sheep","sheep","sheep","sheep","wheat","wheat","wheat","wheat",
              "ore","ore","ore","desert"],
    numbers: [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]
  },
  large: {
    rows: [3,4,5,6,5,4,3],
    // Seven rows of up to six is taller than it is wide, and the screen is the
    // other way round. Drawn a quarter turn over — see turnPt.
    turned: true,
    size: 44, ports: 11, bank: 24,
    terrain: ["wood","wood","wood","wood","wood","wood",
              "brick","brick","brick","brick","brick",
              "sheep","sheep","sheep","sheep","sheep","sheep",
              "wheat","wheat","wheat","wheat","wheat","wheat",
              "ore","ore","ore","ore","ore",
              "desert","desert"],
    numbers: [2,2,3,3,3,4,4,4,5,5,5,6,6,6,8,8,8,9,9,9,10,10,10,11,11,11,12,12]
  }
};
let BOARDSET = BOARD.small;
let NUMBERS = BOARDSET.numbers;
let TERRAIN = BOARDSET.terrain;
let BANK_PER_RES_CUR = BOARDSET.bank;

/* 5 or 6 players uses the extension board. */
function boardFor(numPlayers, boardKey){
  if (boardKey === "small" || boardKey === "large") return BOARD[boardKey];
  return numPlayers >= 5 ? BOARD.large : BOARD.small;
}

/* Axial coordinates for whichever board is in play. */
function hexLayout(set){
  const out = [];
  if (!set.rows){
    for (let q = -2; q <= 2; q++)
      for (let r = -2; r <= 2; r++)
        if (Math.abs(q + r) <= 2) out.push({ q, r });
    return out;
  }
  const mid = (set.rows.length - 1) / 2;
  set.rows.forEach((n, i) => {
    const r = i - mid;
