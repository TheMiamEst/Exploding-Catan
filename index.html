      if (!hp || !sp) continue;
      if (!flashed[g.h]){ flashed[g.h] = 1; flashHex(g.h); }
      for (let k = 0; k < g.n && sent < FX_MAX_CARDS; k++, sent++)
        flyCard(hp, sp, resFaceHTML(g.r), "", 45 * sent + 100, sent);
    }
  });
}

function playKitten(pid){
  fxSoon(function(){
    flyCard(deckPoint(), seatKitPoint(pid), kittenBackHTML(), "kit", 60, 0);
  });
}

/* Where a bank or port trade happens: just under the trader's own seat card.
   It used to cross to the middle of the board, which read as a deal with
   somebody — and there is nobody on the other side of it. It is their own
   transaction and it belongs at their elbow. */
function benchPoint(pid){
  const card = document.querySelector('.pcard[data-pid="' + pid + '"]');
  const seat = seatResPoint(pid);
  if (!card || !seat) return null;
  return { x: seat.x, y: card.getBoundingClientRect().bottom + 46 };
}

function playCardsFx(f){
  fxSoon(function(){
    const from = seatResPoint(f.f);
    const to = (f.o === null || f.o === undefined) ? benchPoint(f.f) : seatResPoint(f.o);
    if (!from || !to) return;
    let i = 0;
    if (f.d){
      for (; i < (f.n || 0) && i < FX_MAX_CARDS; i++)
        flyCard(from, to, resBackHTML(), "", 55 * i, i);
      return;
    }
    for (const r of RES)
      for (let k = 0; k < ((f.b && f.b[r]) || 0) && i < FX_MAX_CARDS; k++, i++)
        flyCard(from, to, resFaceHTML(r), "", 55 * i, i);
  });
}

function playTradeFx(f){
  fxSoon(function(){
    const pa = seatResPoint(f.a);
    const pb = (f.b === null || f.b === undefined) ? benchPoint(f.a) : seatResPoint(f.b);
    if (!pa || !pb) return;
    let i = 0, j = 0;
    for (const r of RES) for (let k = 0; k < (f.g[r] || 0) && i < FX_MAX_CARDS; k++, i++)
      flyCard(pa, pb, resFaceHTML(r), "", 55 * i, i);
    for (const r of RES) for (let k = 0; k < (f.h[r] || 0) && j < FX_MAX_CARDS; k++, j++)
      flyCard(pb, pa, resFaceHTML(r), "", 55 * j + 110, j);
  });
}

function pulseHex(hid, cls, label){
  // A frame late, like everything else here: this now runs before the board is
  // redrawn, so measuring immediately would measure the previous layout.
  fxSoon(function(){ drawPulse(hid, cls, label); });
}
function drawPulse(hid, cls, label){
  const h = hexes[hid];
  const area = document.getElementById("boardArea");
  if (!h || !area) return;
  const pt = svgToScreen(h.x, h.y);
  if (!pt) return;
  const el = document.createElement("div");
  el.className = "hexpulse " + (cls || "");
  el.style.left = pt.x + "px";
  el.style.top  = pt.y + "px";
  el.textContent = label === undefined || label === null ? "" : String(label);
  area.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

/* Point at anything on the board that moved since the last repaint. */
function checkBoardChanges(){
  if (!S){ boardWatch = null; return; }
  const now = { robber: S.robber, nums: hexes.map(h => h.number),
                vOwner: vertices.map(v => v.owner), vType: vertices.map(v => v.type),
                eOwner: edges.map(e => e.owner) };
  const was = boardWatch;
  boardWatch = now;
  // First paint of a game, or a board of a different size: nothing to compare.
  if (!was || was.nums.length !== now.nums.length) return;

  for (let i = 0; i < now.nums.length; i++)
    if (was.nums[i] !== now.nums[i] && now.nums[i] !== null)
      pulseHex(i, "alter", now.nums[i]);

  if (was.robber !== now.robber) pulseHex(now.robber, "robber", "♟");

  // Pieces plop where they land. Driven off the state rather than off the
  // click that placed them, so a terminal watching somebody else build sees it
  // too — the same reason the reveals read the journal.
  //
  // Only things ARRIVING: a spot going from empty to owned, or a settlement
  // becoming a city. A Nope taking a road back off the board is a rewind, not
  // a build, and should not land with a thump.
  for (let i = 0; i < now.eOwner.length; i++)
    if (was.eOwner[i] === null && now.eOwner[i] !== null)
      plopBuild("road", i, now.eOwner[i]);

  for (let i = 0; i < now.vOwner.length; i++){
    if (now.vOwner[i] === null) continue;
    if (was.vOwner[i] === null) plopBuild(now.vType[i] || "settlement", i, now.vOwner[i]);
    else if (was.vType[i] !== "city" && now.vType[i] === "city")
      plopBuild("city", i, now.vOwner[i]);
  }
}

/* Reveals QUEUE. They used to overwrite: whatever was on screen was thrown
   away the instant the next one arrived, which is fine for two unrelated plays
   and useless for the pair that matter most — an action and the answer to it.
   A Nope and the Nope that cancels it turn over the same card face, so cutting
   the first one off and dropping the second in its place looks like nothing
   happened at all. Answering somebody now waits for their card to finish.

   A backlog is capped and hurried rather than allowed to run minutes behind
   the board: only so many may wait, the oldest waiting one is dropped when
   that fills, and a card with something behind it holds for a shorter beat. */
const SHOWCASE_FADE = 400;
const SHOWCASE_GAP  = 140;        // a breath between one card and the next
const SHOWCASE_RUSH = 1100;       // dwell while others are waiting their turn
const SHOWCASE_WAIT = 2;          // how many may queue behind the one showing

let showQueue = [];
let showing = false;

function clearShowcase(){
  if (showcaseTimer){ clearTimeout(showcaseTimer); showcaseTimer = null; }
  showQueue = [];
  showing = false;
  const el = document.getElementById("showcase");
  if (el){ el.hidden = true; el.className = ""; el.innerHTML = ""; }
}

function showcase(bodyHTML, capHTML, capCls, ms, must){
  showQueue.push({ body: bodyHTML, cap: capHTML, cls: capCls || "",
                   ms: ms || SHOWCASE_MS, must: !!must });
  // Keep the newest — a stale card is worth less than an accurate board. A
  // `must` is never dropped: the Imploding Kitten never reaches a hand, so if
  // its moment is thrown away nobody ever sees the card at all.
  while (showQueue.length > SHOWCASE_WAIT){
    const i = showQueue.findIndex(x => !x.must);
    if (i < 0) break;
    showQueue.splice(i, 1);
  }
  if (!showing) runShowcase();
}

function runShowcase(){
  const el = document.getElementById("showcase");
  const next = showQueue.shift();
  if (!el || !next){ showing = false; return; }
  showing = true;
  if (showcaseTimer) clearTimeout(showcaseTimer);
  el.className = "";
  el.hidden = false;
  el.innerHTML = next.body + '<div class="showcap ' + next.cls + '">' + next.cap + "</div>";
  // Something behind it: show this one briskly rather than make the answer
  // wait a full beat to appear.
  const dwell = showQueue.length ? Math.min(next.ms, SHOWCASE_RUSH) : next.ms;
  showcaseTimer = setTimeout(() => {
    el.className = "out";
    showcaseTimer = setTimeout(() => {
      el.hidden = true; el.className = ""; el.innerHTML = "";
      showcaseTimer = null;
      if (showQueue.length) showcaseTimer = setTimeout(runShowcase, SHOWCASE_GAP);
      else showing = false;
    }, SHOWCASE_FADE);
  }, dwell);
}

/* Everything worth turning over that has not been turned over yet.

   This used to look at the newest journal entry and nothing else, which is
   fine right up until two things happen between one repaint and the next.
   Buying two kitten cards does exactly that: draw the Imploding Kitten on the
   first and the second card's log line is the newest by the time anything is
   drawn, so the one card in the deck nobody ever holds was also the one card
   nobody ever saw. They queue now, in the order they happened. */
function checkShowcase(){
  if (!S) return;
  // Same rule the flights follow: a screen that has not looked at this table
  // before catches up silently. Without it, joining a game in progress turned
  // over every card still on the journal, one after another, at somebody who
  // had just sat down.
  //
  // The catch-up has to happen on an EMPTY journal too. Returning early on one
  // left the mark at "never looked", so the first entry of a fresh game was
  // taken for history and swallowed — which cost the reveal of any card played
  // before anything else had been journalled.
  const newest = S.journal.length ? S.journal[S.journal.length - 1].id : 0;
  if (lastShowcased < 0 || newest < lastShowcased){ lastShowcased = newest; return; }
  if (!S.journal.length) return;
  for (const e of S.journal){
    if (e.id <= lastShowcased) continue;
    lastShowcased = e.id;
    if (e.show) showEntry(e);
  }
}

/* Put the players' own colours back into a line of plain text.

   A caption is built from the journal's plain-text copy of the line, which is
   what it is for: `plain` is the sentence with every tag stripped, so by the
   time a card is turned over the markup naming anybody is long gone. The names
   are found again here and re-marked in the colour that player already wears
   everywhere else — their pieces, the bar down their seat card, the dot beside
   their name in the log.

   Longest name first, so a player called Jo cannot eat half of Josh. Escaped
   before matching, because the text being searched has been escaped too and a
   name with an & in it would otherwise never be found. One pass of replace(),
   which does not re-scan what it has just inserted — so a name cannot be
   found a second time inside the markup wrapping it. */
function tintNames(plain){
  const text = esc(plain === null || plain === undefined ? "" : String(plain));
  if (!S) return text;
  const seats = S.players.filter(q => q.name)
                         .slice()
                         .sort((a, b) => String(b.name).length - String(a.name).length);
  if (!seats.length) return text;
  const colour = {};
  const parts = seats.map(q => {
    const e = esc(q.name);
    colour[e] = q.color;
    return e.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  });
  return text.replace(new RegExp("(" + parts.join("|") + ")", "g"),
    m => '<b class="capname" style="color:' + colour[m] + '">' + m + "</b>");
}

function showEntry(e){
  if (e.show === "seven"){
    showcase('<div class="showseven">7</div>',
             tintNames((S.players[e.actor] ? S.players[e.actor].name : "") +
             " rolls a seven — hands over 7 are cut, and the robber moves"), "seven");
    return;
  }
  // The Imploding Kitten never reaches a hand, so it would otherwise be the
  // one card in the deck nobody ever sees. It gets the entrance to match: half
  // again the size of a played card, spun up out of a point, and left standing
  // long enough that the whole table has looked at it.
  if (e.show === "implode"){
    const iface = art("card", "implode");
    showcase('<div class="showcard implode">' +
               (iface ? '<img src="' + iface + '" alt="">'
                      : '<span class="kn">Imploding Kitten</span>') +
             "</div>", tintNames(String(e.plain).replace(/\s+/g, " ")), "implode", 4600, true);
    return;
  }
  const def = KITTEN[e.show];
  if (!def) return;
  const face = cardArt({ key: e.show, flavor: (e.card && e.card.flavor) || null });
  showcase('<div class="showcard">' +
             (face ? '<img src="' + face + '" alt="">' : '<span class="kn">' + esc(def.name) + "</span>") +
           "</div>", tintNames(String(e.plain).replace(/\s+/g, " ")));
}

/* ══ SIDE PANELS ═════════════════════════════════════════════════
   A dialog docked beside the board instead of covering it. Trades and card
   purchases are not urgent, and as modals they took away the log, the board
   and your hand — so you could not drop a Nope on anything while one was
   open. Panels leave all of that reachable.

   Each panel belongs to a seat. On one screen you see the panels for the
   seats that screen plays, which is your own and no other — so one offer can
   go to the whole table at once and everybody answers for themselves.
   ═══════════════════════════════════════════════════════════════════ */

const panelBox = {};        // key -> { seat, buttons, rewindAt, title }

/* Which seats this screen answers for. */
function ownsSeat(pid){
  if (window.NET && NET.isOnline && NET.isOnline()) return pid === NET.mySeat();
  return !isBot(pid);            // offline the only seat that is not a bot is yours
}

function openPanel(key, seat, title, bodyHTML, buttons){
  const fresh = !panelBox[key];
  panelBox[key] = { seat: seat, buttons: buttons || [], title: title,
                    rewindAt: fresh ? (S ? S.rewinds : 0)
                                    : panelBox[key].rewindAt };
  // Somebody else's to answer: hand it to them and draw nothing here.
  if (seat !== null && seat !== undefined && !ownsSeat(seat)){
    const sent = !!(window.NET && NET.shipPanel &&
                    NET.shipPanel(key, seat, title, bodyHTML, buttons || []));
    // If it cannot be delivered there is nobody to answer it, and an entry
    // left in the box would stall the table for good — the bots wait on any
    // outstanding answer. Drop it instead.
    if (!sent) delete panelBox[key];
    drawPanels();
    return;
  }
  panelBox[key].body = bodyHTML;
  drawPanels();
}

function closePanel(key){
  const p = panelBox[key];
  if (!p) return;
  delete panelBox[key];
  if (window.NET && NET.clearPanel) NET.clearPanel(key, p.seat);
  drawPanels();
}

function closeAllPanels(){
  // Snapshot the keys: closePanel deletes as it goes, and deleting out from
  // under a for-in can skip entries — a panel left behind here is a table
  // that never moves again, because the bots wait on it.
  for (const k of Object.keys(panelBox)) closePanel(k);
}

/* Seats the table is currently waiting on for an answer, here or elsewhere. */
function pendingAnswerers(){
  const out = [];
  for (const k in panelBox){
    const s = panelBox[k].seat;
    if (s !== null && s !== undefined && out.indexOf(s) < 0) out.push(s);
  }
  if (window.NET && NET.pendingSeats)
    for (const s of NET.pendingSeats()) if (out.indexOf(s) < 0) out.push(s);
  return out;
}

/* Redrawn in place, panel by panel, rather than by replacing the whole column.
   Every click on a counter reopens its panel — that is how these dialogs are
   written — and rebuilding the column's innerHTML each time tore the panel out
   of the document and put a new one back, which replayed the slide-in
   animation and flashed. Nothing about the panel had actually changed except
   the number under the pointer.

   So: the container is only touched when a panel arrives or leaves, and a
   panel that is merely redrawing has its title, body and buttons written over
   the top of themselves. The element survives, so the animation does not
   replay and neither does the flicker. */
function drawPanels(){
  const box = document.getElementById("panels");
  if (!box) return;

  const keys = Object.keys(panelBox).filter(k => panelBox[k].body !== undefined);

  // Gone: panels that closed while this one was open.
  for (const el of Array.from(box.children))
    if (keys.indexOf(el.dataset.key) < 0) el.remove();

  let prev = null;
  for (const key of keys){
    const p = panelBox[key];
    const mine = p.seat !== null && p.seat !== undefined;
    let btns = "";
    (p.buttons || []).forEach((b, i) => {
      btns += `<button class="${b.cls || ""}" ${b.disabled ? "disabled" : ""}
                 onclick="panelClick('${key}',${i})">${b.label}</button>`;
    });
    const inner = `<h3>${p.title}</h3>${p.body}` +
                  (btns ? `<div class="actions">${btns}</div>` : "");

    let el = box.querySelector('.panel[data-key="' + key + '"]');
    if (!el){
      el = document.createElement("div");
      el.dataset.key = key;
      el.className = "panel";                       // .panel animates itself in
      box.appendChild(el);
    }
    el.classList.toggle("forme", mine);
    // Compared before writing: an identical write still resets any text
    // selection inside the panel, and costs a layout for nothing.
    if (el.dataset.html !== inner){
      el.dataset.html = inner;
      el.innerHTML = inner;
    }
    // Keep the column in the order the box lists them, without moving anything
    // that is already where it belongs — a move re-runs the animation too.
    const want = prev ? prev.nextSibling : box.firstChild;
    if (el !== want) box.insertBefore(el, want);
    prev = el;
  }

  document.body.classList.toggle("haspanel", !!keys.length);
}

function panelClick(key, i){
  const p = panelBox[key];
  const b = p && p.buttons && p.buttons[i];
  if (!b || b.disabled) return;
  b.fn();
}

/* A Nope or a Defuse rewound the board while a panel was open, so whatever it
   was offering may no longer be true — the resources it named could already
   have moved. Close it rather than let somebody act on a stale offer. */
function checkStalePanels(){
  if (!S) return;
  const dead = [];
  for (const key in panelBox)
    if (panelBox[key].rewindAt !== S.rewinds) dead.push(key);
  if (!dead.length) return;
  for (const key of dead) closePanel(key);
  // The feed, not the hint bar: the very render that spots this goes on to
  // redraw the hint, and a rewind usually triggers several in a row.
  announce("↺ A card was answered — the trade on the table is off", "defend");
}

/* Is an answer still owed before play may continue — a seven part-paid, or a
   forced dialog on this screen, folded away or not?

   Folding a dialog exists so a Nope can be dropped on the log while it is
   open. It handed back the WHOLE bottom bar with it, turn controls included,
   so folding the discard window for a seven and pressing End Turn walked away
   from the discard, the robber and all: advancePlayer clears S.seven, and the
   whole obligation simply evaporated.

   Every voluntary action is gated on this. Dropping a Nope or a Defuse on a
   log entry deliberately is not, and neither is Noping somebody's turn —
   those are the reactions folding is FOR. */
function owesAnswer(){
  if (!S) return false;
  if (S.seven) return true;        // a seven still being paid, by anybody
  if (modalForced) return true;    // a forced dialog here, open or folded away
  // A robber still to place, two tokens still to name. Setup's placements are
  // the turn rather than an interruption to it, so they are not owed in this
  // sense — the bar has its own words for those.
  if (S.select && !S.phase.startsWith("setup")) return true;
  return false;
}

/* True while a person still owes an answer, here or on another screen. The
   bots wait for it. */
function humanPromptOpen(){
  if (document.querySelector(".overlay")) return true;
  if (Object.keys(panelBox).length) return true;
  if (window.NET && NET.anyPrompt && NET.anyPrompt()) return true;
  return false;
}

/* ══════════════════════════════════════════════════════════════════════
   MENUS
   ══════════════════════════════════════════════════════════════════════ */

/* The three openings, as a row of buttons with the chosen one lit. Shared by
   the local New Game dialog and the online lobby, so the wording only exists
   once and the host picks a mode the same way a solo player does. */
function modePickerHTML(){
  let h = `<div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Opening</div>
           <div class="pick">`;
  for (const key in MODES){
    h += `<button class="${GAME_MODE === key ? "primary" : ""}"
            onclick="window.__mode('${key}')">${MODES[key].name}</button>`;
  }
  return h + `</div><div class="rules" style="margin:6px 0 0">${MODES[GAME_MODE].blurb}</div>`;
}

function timerSliderValue(seconds){
  return seconds ? Math.round((seconds - 20) / 10) + 1 : 0;
}

/* Hot-seat is gone: one screen, one person. Everybody else at the table is a
   bot, or is online in their own browser. Passing a laptop round a room was
   the only thing it was for, and it cost every dialog a "whose is this?" step. */
function newGameDialog(){
  const haveAI = typeof window.AI !== "undefined";
  const refresh = () => {
    let h = `<p class="sub">The other seats are played by bots</p>`;
    h += modePickerHTML();
    h += `<div style="height:12px"></div>
          <div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Your picture</div>` +
         avatarGridHTML(MY_AVATAR);
    h += `<div style="height:12px"></div>
          <div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Table</div>
          <div class="pick">`;
    for (let n = 2; n <= 6; n++)
      h += `<button class="${n === 4 ? "primary" : ""}" onclick="window.__ng(${n})"
              >You + ${n - 1} bot${n === 2 ? "" : "s"}</button>`;
    h += `</div>
          <div style="height:12px"></div>
          <div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Board</div>
          <div class="pick">`;
        for (const key of ["small", "large"])
      h += `<button class="${GAME_BOARD === key ? "primary" : ""}" onclick="window.__board('${key}')">` +
           `${key === "small" ? "Normal board" : "Expansion board"}</button>`;
        h += `</div>
          <div style="height:12px"></div>
          <div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Points to win <b id="ngWinValue">${GAME_WIN_POINTS}</b></div>
          <input type="range" min="3" max="20" value="${GAME_WIN_POINTS}" oninput="window.__win(this.value)" style="width:100%">`;
        h += `
          <div style="height:12px"></div>
          <div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Turn timer <b id="ngTimerValue">${GAME_TURN_SECONDS ? GAME_TURN_SECONDS + " seconds" : "Off"}</b></div>
          <input type="range" min="0" max="9" step="1" value="${timerSliderValue(GAME_TURN_SECONDS)}" oninput="window.__timer(this.value)" style="width:100%">`;
        h += `
          <div class="rules" style="margin-top:6px">The board, win target, and timer are independent of player count.</div>`;
    if (!haveAI)
      h = `<div class="warnbox">ai.js did not load, so there is nobody to play against.
           Check that it is next to index.html.</div>` + h;
    // Say so before, not after. Dealing here leaves the room, and if this
    // browser is the one hosting, leaving the room ends the game for everybody
    // in it.
    if (window.NET && NET.isOnline && NET.isOnline())
      h = `<div class="warnbox">You are ` + (NET.isHost() ? "hosting" : "playing in") +
          ` an online game. Starting one here leaves it` +
          (NET.isHost() ? ` — and since you are the host, that ends it for everybody.` : `.`) +
          `</div>` + h;
    openModal("New Game", h,
      [{ label:"Cancel", fn: () => { closeModal(); if (!S) renderIdle(); } }]);
  };
  window.__mode = (key) => { if (MODES[key]) GAME_MODE = key; refresh(); };
  window.__board = (key) => { if (key === "small" || key === "large") GAME_BOARD = key; refresh(); };
  window.__win = (points) => {
    GAME_WIN_POINTS = Math.min(20, Math.max(3, Number(points) || 10));
    const out = document.getElementById("ngWinValue");
    if (out) out.textContent = GAME_WIN_POINTS;
  };
  window.__timer = (seconds) => {
    const position = Math.min(9, Math.max(0, Math.round(Number(seconds))));
    GAME_TURN_SECONDS = position === 0 ? 0 : 20 + (position - 1) * 10;
    const out = document.getElementById("ngTimerValue");
    if (out) out.textContent = GAME_TURN_SECONDS ? GAME_TURN_SECONDS + " seconds" : "Off";
  };
  window.__avPick = (id) => { setMyAvatar(id); refresh(); };
  window.__avRefresh = refresh;
  window.__ng = (n) => {
    closeModal();
    // Still sitting in a room. A local game cannot start on top of an online
    // one: the host would go on publishing to people who are no longer in the
    // game it is publishing, and a guest would have whatever the host sent
    // drawn straight over the table they had just dealt themselves.
    if (window.NET && NET.leave) NET.leave();
    window.AGENTS = {};
    newGame(n, GAME_MODE, GAME_BOARD, GAME_WIN_POINTS, GAME_TURN_SECONDS);
    if (typeof window.AI !== "undefined") window.AI.enable([0]);
    // After the bots are switched on, because that is the moment it becomes
    // knowable which seat is the one at this keyboard.
    applyMyAvatar();
    beginSetupStep();
  };
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════
   DRAGGING CARDS
   ══════════════════════════════════════════════════════════════════════
   Cards are carried with plain pointer events, not HTML5 drag-and-drop. The
   browser's version kept grabbing the card's <img> instead of the card: that
   is where the washed-out duplicate under the cursor came from, and why a
   miss offered to open the picture in its own window. Here the thing under
   the pointer is a real card element we own, the card in hand greys out where
   it came from, and a drop that lands nowhere simply puts it back.

   Drop a card on the board to play it, on a player to aim it at them, on a
   log entry to answer that specific action, or anywhere in your own hand to
   move it about. Dragging is the ONLY way to play a card — there is no
   click-to-play and no prompt, so holding a Nope never gives you away, and a
   card can no longer be fired twice by a stray second click.
   ══════════════════════════════════════════════════════════════════════ */

let dragCard  = null;     // the card in flight
let dragGhost = null;     // the element following the pointer
let dragHot   = null;     // element highlighted underneath right now
let pressPend = null;     // a press that has not moved far enough to be a drag

const DRAG_SLOP = 5;      // px of travel before a press becomes a drag

/* Cards that resolve on the board rather than at a player. */
const BOARD_PLAY = new Set(["knight", "alter", "reverse"]);

function cardPointerDown(ev, idx, ownerId){
  if (ev.button) return;                       // left button / touch only
  const p = S && S.players[ownerId];
  const c = p && p.cards[idx];
  if (!c) return;
  ev.preventDefault();                         // no selection, no native drag
  pressPend = { idx, ownerId, x: ev.clientX, y: ev.clientY };
}

function onCardPointerMove(ev){
  if (pressPend && !dragCard){
    if (Math.abs(ev.clientX - pressPend.x) < DRAG_SLOP &&
        Math.abs(ev.clientY - pressPend.y) < DRAG_SLOP) return;
    beginCardDrag(ev);
    if (!dragCard) return;
  }
  if (!dragCard) return;
  ev.preventDefault();
  moveGhost(ev.clientX, ev.clientY);
  highlightUnder(ev.clientX, ev.clientY);
}

function onCardPointerUp(ev){
  const tapped = pressPend;
  pressPend = null;
  if (!dragCard){
    // A click no longer fires a card — that is what made it possible to play
    // the same one twice. Say so rather than doing nothing at all.
    if (tapped && S){
      const c = S.players[tapped.ownerId] && S.players[tapped.ownerId].cards[tapped.idx];
      if (c) hint(cardDestinationHint(c));
    }
    return;
  }
  const info = dragCard;                       // endCardDrag clears it
  const drop = dropTargetAt(ev.clientX, ev.clientY);
  endCardDrag();
  if (drop && dropAllowed(info, drop)) performDrop(info, drop);
  else render();                               // the card goes back where it was
}

/* Where this card wants to be dropped, in one line. */
function cardDestinationHint(c){
  const def = KITTEN[c.key];
  if (c.boughtTurn === S.turnCounter) return def.name + " was bought this turn — it plays next turn.";
  if (def.kind === "vp") return "Feral Kittens are never played — they are points in your hand.";
  if (c.key === "defuse") return "Drag Defuse onto the log entry you want to turn around.";
  if (c.key === "nope") return "Drag Nope onto a log entry to cancel it, or onto the player whose turn it is to cancel the whole turn.";
  if (BOARD_PLAY.has(c.key)) return "Drag " + def.name + " onto the board.";
  return "Drag " + def.name + " onto the player you want to hit.";
}

function beginCardDrag(ev){
  const pp = pressPend;
  pressPend = null;
  if (!pp || !S) return;
  const p = S.players[pp.ownerId];
  const c = p && p.cards[pp.idx];
  if (!c) return;

  const src = document.querySelector(
    '.kcard[data-owner="' + pp.ownerId + '"][data-idx="' + pp.idx + '"]');
  const r = src ? src.getBoundingClientRect() : { width:52, height:70 };

  dragCard = { idx: pp.idx, ownerId: pp.ownerId, key: c.key, card: c,
               w: r.width, h: r.height };
  if (src) src.classList.add("picked");
  document.body.classList.add("dragging");

  const face = cardArt(c), def = KITTEN[c.key];
  dragGhost = document.createElement("div");
  dragGhost.id = "dragGhost";
  dragGhost.style.width  = r.width + "px";
  dragGhost.style.height = r.height + "px";
  dragGhost.innerHTML = face ? '<img src="' + face + '" alt="">'
                             : '<span class="kn">' + esc(def.name) + '</span>';
  document.body.appendChild(dragGhost);

  moveGhost(ev.clientX, ev.clientY);
  markDropTargets();
}

/* The carried card sits centred on the pointer and a little oversized, so it
   stays readable while you look for somewhere to put it. Only a little: at
   1.9 it covered most of a player card and several lines of the log at once,
   so you could not see what you were about to drop it on. */
const DRAG_SCALE = 1.4;
function moveGhost(x, y){
  if (!dragGhost || !dragCard) return;
  dragGhost.style.transform =
    "translate(" + (x - dragCard.w / 2) + "px," + (y - dragCard.h / 2) + "px)" +
    " scale(" + DRAG_SCALE + ") rotate(-3deg)";
}

function endCardDrag(){
  if (dragGhost){ dragGhost.remove(); dragGhost = null; }
  dragCard = null;
  dragHot = null;
  pressPend = null;
  document.body.classList.remove("dragging");
  document.querySelectorAll(".picked").forEach(el => el.classList.remove("picked"));
  document.querySelectorAll(".droppable,.dropping")
          .forEach(el => el.classList.remove("droppable", "dropping"));
}

/* Escape, a lost pointer, or the window going away all just drop the card. */
function cancelCardDrag(){
  if (!dragCard && !pressPend) return;
  endCardDrag();
  if (S) render();
}

/* ── what is under the pointer ───────────────────────────────────────── */
function dropTargetAt(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el || !el.closest) return null;
  const evEl = el.closest(".ev[data-jid]");
  if (evEl) return { kind:"entry", jid: +evEl.dataset.jid, el: evEl };
  const pc = el.closest(".pcard[data-pid]");
  if (pc) return { kind:"player", pid: +pc.dataset.pid, el: pc };
  const hand = el.closest(".hand[data-hand]");
  if (hand){
    const over = el.closest(".kcard");
    return { kind:"hand", owner: +hand.dataset.hand, el: hand,
             overIdx: over ? +over.dataset.idx : null };
  }
  const board = el.closest("#boardArea");
  if (board) return { kind:"board", el: board };
  return null;
}

/* A card may only be played the turn after it was bought, and never during
   setup or after the game is decided. Rearranging your hand is always fine. */
/* A Defuse is the exception to "not until next turn". Every other card is a
   move you choose to make and can wait a turn to make; a Defuse is the answer
   to something being done to you, and a card you cannot play when you need it
   is not a card. Draw one, get exploded, use it. */
function playableWhenDrawn(c){ return !!c && c.key === "defuse"; }

function cardIsPlayable(info){
  const c = info && info.card;
  if (!c || !S) return false;
  if (c.boughtTurn === S.turnCounter && !playableWhenDrawn(c)) return false;
  if (KITTEN[c.key].kind === "vp") return false;
  if (S.phase === "over" || S.phase.startsWith("setup")) return false;
  return true;
}

function dropAllowed(info, drop){
  if (!info || !drop || !S) return false;
  const key = info.key, me = info.ownerId;

  if (drop.kind === "hand") return drop.owner === me;
  if (!cardIsPlayable(info)) return false;

  if (drop.kind === "entry"){
    const e = S.journal.find(x => x.id === drop.jid);
    if (!e) return false;
    if (key === "nope")   return canNopeFor(e, me);
    if (key === "defuse") return canDefuseEntry(e, me);
    return false;
  }
  if (drop.kind === "player") return pcardAccepts(key, me, drop.pid);
  if (drop.kind === "board")
    return BOARD_PLAY.has(key) && me === S.cur && !S.pending && !owesAnswer();
  return false;
}

function highlightUnder(x, y){
  const drop = dropTargetAt(x, y);
  const el = (drop && dropAllowed(dragCard, drop)) ? drop.el : null;
  if (el === dragHot) return;
  if (dragHot) dragHot.classList.remove("dropping");
  dragHot = el;
  if (dragHot) dragHot.classList.add("dropping");
  if (dragGhost) dragGhost.classList.toggle("over", !!dragHot);
}

/* Outline everywhere this particular card could legally go. */
function markDropTargets(){
  if (!dragCard) return;
  const me = dragCard.ownerId;
  const area = document.getElementById("boardArea");
  if (area && dropAllowed(dragCard, { kind:"board", el:area })) area.classList.add("droppable");
  document.querySelectorAll(".pcard[data-pid]").forEach(el => {
    if (dropAllowed(dragCard, { kind:"player", pid:+el.dataset.pid, el })) el.classList.add("droppable");
  });
  document.querySelectorAll(".ev[data-jid]").forEach(el => {
    if (dropAllowed(dragCard, { kind:"entry", jid:+el.dataset.jid, el })) el.classList.add("droppable");
  });
  const hand = document.querySelector('.hand[data-hand="' + me + '"]');
  if (hand) hand.classList.add("droppable");
}

function pcardAccepts(key, me, pid){
  if (!S || S.phase === "over" || S.phase.startsWith("setup")) return false;
  if (key === "nope") return pid === S.cur && pid !== me && !implodeActive();
  // Noping a turn is a reaction and stays open above; starting something new
  // while you still owe an answer does not.
  if (owesAnswer()) return false;
  if (key === "defuse") return false;                  // Defuse answers an entry
  if (key === "vp") return false;
  const def = KITTEN[key];
  if (!def || def.kind !== "target") return false;
  if (pid === me || S.pending) return false;
  // On your own turn you may aim any targeted card. Off your turn only the two
  // direct attacks may be thrown — the same cards the rules already let you
  // interrupt with, and exactly the ones that could not be dragged before.
  return me === S.cur ? true : OFF_TURN.has(key);
}

/* ── doing the drop ──────────────────────────────────────────────────── */
function performDrop(info, drop){
  const { idx, ownerId, key, card } = info;
  if (netSend("drop", [idx, drop.kind,
        drop.kind === "entry"  ? drop.jid :
        drop.kind === "player" ? drop.pid :
        drop.kind === "hand"   ? drop.overIdx : null])) return;

  if (drop.kind === "hand"){ reorderHand(ownerId, idx, drop.overIdx); return; }

  if (drop.kind === "entry"){
    if (key === "nope") nopeEntry(drop.jid, ownerId);
    else if (key === "defuse") defuseEntry(drop.jid, ownerId);
    return;
  }

  if (drop.kind === "board"){ playCard(idx, ownerId); return; }

  const pid = drop.pid;
  if (key === "nope"){ nopeWholeTurn(ownerId, pid); return; }
  if (key === "favor"){ favorGuessDialog(card, idx, pid, ownerId); return; }
  playResolved({ type:"card", card, actor:ownerId, target:pid, payload:{} });
  render();
}

/* Dropping a Nope on whoever is playing cancels their whole turn — the second
   of the card's two uses, and the only one that is not answering a log entry. */
function nopeWholeTurn(ownerId, pid){
  const victim = S.players[pid], noper = S.players[ownerId];
  spendCard(noper, "nope");
  logMsg("<b>" + noper.name + "</b> Nopes <b>" + victim.name + "</b>'s turn.");
  // Snapshot and turn pointer both taken before cancelTurn tears the turn
  // down, so a counter-Nope can put the whole thing back.
  const turnBack = { cur: S.cur, phase: S.phase, turnCounter: S.turnCounter,
                     rolled: S.rolled ? S.rolled.slice() : null, extraTurn: S.extraTurn };
  const noteEntry = logAction(pdot(noper) + " <b>Nopes</b> " + pdot(victim) + "'s turn",
            "defend", { actor: ownerId, snap: snapAll(), nopeable: true, turnBack: turnBack,
                        spent: { pid: ownerId, key: "nope" }, show: "nope" });
  clearImplodeClock();
  cancelTurn(pid, totalVP(victim) >= S.winPoints); // cancelTurn ends the turn itself
  noteEntry.turn = S.turnCounter;             // it belongs to the turn it made
}

/* Cards can be shuffled around in your own hand at will; where a card sits is
   nobody's business but yours. Dropped on empty space it goes to the end. */
function reorderHand(ownerId, from, to){
  const p = S.players[ownerId];
  if (!p || from < 0 || from >= p.cards.length) return;
  const c = p.cards.splice(from, 1)[0];
  if (to === null || to === undefined || to > p.cards.length) p.cards.push(c);
  else p.cards.splice(to > from ? to - 1 : to, 0, c);
  render();
}

window.addEventListener("pointermove",   onCardPointerMove, { passive:false });
window.addEventListener("pointerup",     onCardPointerUp);
window.addEventListener("pointercancel", cancelCardDrag);
window.addEventListener("blur",          cancelCardDrag);
/* Belt and braces: if anything ever does manage to start a native drag on this
   page, swallow it rather than let the browser open the card art in a window
   of its own. */
window.addEventListener("dragstart", function(e){ e.preventDefault(); });
window.addEventListener("dragover",  function(e){ e.preventDefault(); });
window.addEventListener("drop",      function(e){ e.preventDefault(); });

/* Which art files were found. I cannot verify file:// loading from outside
   the game, so this is the ground truth — open it after dropping files in. */
function showArt(){
  const groups = { hex:"Hex terrain", res:"Resource cards", piece:"Pieces (tinted per player)",
                   token:"Number token", card:"Kitten card faces" };
  let h = `<p class="sub">Looking in <b>./${ART_DIR}</b> next to this HTML file.
           <b>${artLoaded}</b> of <b>${artTotal}</b> found — anything missing just uses the built-in drawing.</p>`;
  for (const g in groups){
    const rows = ART_MANIFEST.filter(a => a.kind === g);
    if (!rows.length) continue;
    h += `<h4 style="margin:12px 0 4px;font-size:13px">${groups[g]}</h4>`;
    for (const a of rows){
      const ok = !!ART[a.kind][a.key];
      h += `<div class="artrow"><span class="${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span>
              <span class="f">${ART_DIR}${a.file}</span></div>`;
    }
  }
  // Portraits are listed as a count rather than twelve rows of nothing: they
  // are the one optional set, and an empty folder here is not a problem to
  // fix — the picker falls back to the card faces, which are already listed.
  const avN = ART_MANIFEST.filter(a => a.kind === "avatar" && ART.avatar[a.key]).length;
  h += `<h4 style="margin:12px 0 4px;font-size:13px">Portraits (optional)</h4>`;
  h += `<div class="artrow"><span class="${avN ? "ok" : "no"}">${avN ? "✓" : "✗"}</span>
          <span class="f">${ART_DIR}${PROFILE_DIR}1.png … ${AVATAR_FILES}.png</span>
          <span style="color:var(--dim);font-size:11.5px">${avN} found</span></div>`;
  h += `<p class="rules">Square, 256×256, drawn to the middle — they are shown in a circle.
        A folder of their own, and the only place a portrait comes from: nothing above is ever
        offered as a face. An empty folder means everybody plays as their initial.</p>`;
  h += `<div class="okbox" style="margin-top:14px">Pieces are used as a silhouette and flooded with the
        player's colour, so whatever colour you draw them in makes no difference — only the transparent
        background matters. Hex tiles should be squares that bleed to the edges; the hexagon is clipped
        out of the middle for you.</div>`;
  h += `<p class="rules">Reload the page after adding files. 404s in the console for missing art are
        expected and harmless.</p>`;
  promptFor(viewSeat());
  openModal("Custom art", h, [{ label:"Close", cls:"primary", fn: closeModal }]);
}

function showRules(){
  let h = `<div class="rules">
    <h4>Exploding Catan</h4>

    <h4>Changed rules</h4>
    <ul>
      <li>A kitten card costs <b>any 3 different resources</b> (not wheat + sheep + ore).</li>
      <li>You may play <b>as many kitten cards per turn as you like</b>, starting the turn after you buy them.</li>
      <li>Knights still count toward Largest Army — there are 10 of them.</li>
    </ul>

    <h4>The deck (54)</h4><ul>`;
  for (const k in KITTEN){
    h += `<li><b>${KITTEN[k].name} ×${KITTEN[k].count}</b> — ${esc(KITTEN[k].text)}</li>`;
  }
  h += `</ul>
    <h4>Playing a card</h4>
    <p>Every kitten card is played by <b>dragging it</b> out of your hand and dropping it where it
    should go. Nothing is played by clicking, so a card can never go off twice by accident, and
    nobody watching learns anything from you picking one up.</p>
    <ul>
      <li><b>Onto another player</b> — Skip, Attack, Exploding Kitten and Favor.</li>
      <li><b>Onto the board</b> — Knight, Alter the Future and Reverse.</li>
      <li><b>Onto a line in the game log</b> — Nope and Defuse, to answer that exact action.</li>
      <li><b>Anywhere in your own hand</b> — to move the card about. The order is yours to keep.</li>
    </ul>
    <p>Hover a card to blow it up and read it. Dropping it somewhere it cannot go simply puts it
    back, and Escape drops it mid-drag.</p>

    <h4>Nope &amp; Defuse</h4>
    <p>Both are reactions, played out of turn, and the card is always expended.
    <b>Anything can be Noped</b>, including another Nope and including a Defuse — as many times
    over as people are willing to spend cards, with the last one standing settling it. Noping a
    Defuse cancels the "no you": the original card is simply played again, at whoever it was first
    aimed at. A <b>Defuse</b> cannot answer another Defuse, though — "no you" does not stack
    against itself.</p>
    <p><b>Last call is the end of the turn.</b> Drag a Nope or a Defuse onto any of the last
    <b>four</b> lines of the game log, as long as they happened on the turn still in progress —
    once a turn is over, everything in it is settled. Lines you are holding the card to answer
    wear a small badge of that card; only you can see it, so a badge never gives away what is in
    your hand. Bots take three seconds between moves, so there is always time.</p>
    <p>Answering a line also erases everything that came after it, which is why the reach is short
    rather than the whole turn.</p>
    <p><b>Being Noped ends your turn.</b> Whatever you were Noped for — a roll, a build, a card —
    the rest of that turn goes with it. A counter-Nope hands that turn straight back: the
    interrupted player picks up exactly where they were standing.</p>
    <p>Noping a <b>Defuse</b> is the exception: it costs nobody their turn. The "no you" is simply
    cancelled and the original card lands where it was first aimed.</p>
    <p>When a card forces a window open on you — the discard from an Attack, the handover from a
    Favor — <b>Defuse</b> and <b>Nope</b> sit in that window next to the usual buttons, so you can
    answer before you pay rather than afterwards. They only appear when you are actually holding
    the card, so an empty hand looks exactly like a hand that is holding back.</p>
    <p><b>Nope</b> has exactly two uses:</p>
    <ul>
      <li><b>Cancel an attack aimed at you.</b> Drop it on that line in the log. The attack and the
      Nope are both spent, and the attacker's turn is over.</li>
      <li><b>Cancel a player's whole turn.</b> Drop it on the player themselves.
      Everything they gained that turn is
      <b>destroyed, not returned</b>: kitten cards drawn are removed from the game rather than
      shuffled back, buildings put up that turn come down, resources collected that turn go back to
      the bank — and resources they already spent are <i>still</i> not refunded. If a Feral Kitten or
      a knight took them to 10 points that turn, it is gone from play, and a Longest Road earned that
      turn goes down with the roads.</li>
    </ul>
    <p><b>Defuse</b> answers an attack aimed at you by turning it around. Alter the Future and
    Favor hand you the card's power rather than simply reflecting it — you name the two tokens,
    or your own three resources.</p>
    <p><b>Forced Nope.</b> The moment someone reaches the configured target, the next player in turn order who
    holds a Nope <i>must</i> spend it — no choice. Otherwise everyone would sit on their Nopes
    waiting for somebody else to spend theirs first.</p>
    <p>The <b>Imploding Kitten</b> is immune to all of it. It cannot be Noped or Defused.</p>
  </div>`;
  promptFor(viewSeat());
  openModal("Exploding Catan — Rules", h, [{ label:"Close", cls:"primary", fn: closeModal }]);
}

/* ══════════════════════════════════════════════════════════════════════ */
// Art probing is async and never blocks: the game opens immediately with the
// built-in drawing, then repaints once we know what actually loaded.
preloadArt(() => {
  if (artLoaded) logMsgSafe(`Custom art: ${artLoaded}/${artTotal} files loaded.`);
  // A dialog opened in the first moment of the page can be showing an empty
  // portrait picker at the instant the pictures arrive. Only ever redraws a
  // dialog that is actually on screen.
  if (window.__avRefresh && document.querySelector(".overlay")) window.__avRefresh();
  if (S) render();
});
/* Deferred to load: ai.js is a separate <script> that has not run yet at this
   point in the file, so calling it inline would offer no bot options until the
   player opened the dialog a second time. */
window.addEventListener("load", function(){
  initBoardControls();
  drawTipBtn();
  renderIdle();                 // no forced dialog: the header stays reachable
});
window.addEventListener("resize", function(){ if (S) render(); });

function logMsgSafe(m){ if (S) logMsg(m); }
