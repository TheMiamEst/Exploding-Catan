   HINT BAR
   ══════════════════════════════════════════════════════════════════════ */

/* On-screen event feed. The game log keeps everything; these surface the
   things you would otherwise miss while the bots take their turns. */
/* Events append to the feed and stay there. Older ones are pushed up out of
   view rather than deleted, so the list can be scrolled back through. The `ms`
   argument is accepted for compatibility with the old toast calls and ignored.
*/
function announce(html, kind, entry){
  const box = document.getElementById("feed");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "ev " + (kind || "info");
  if (entry && entry.id) el.dataset.jid = entry.id;
  const turn = (S && S.turnCounter) ? "Turn " + S.turnCounter : "Setup";
  el.innerHTML = '<span class="evturn">' + turn + "</span>" + html;
  // Kept on the state as well as in the DOM: online, the feed has to travel to
  // players whose browser never saw the action happen.
  if (S){
    if (!S.feed) S.feed = [];
    S.feed.push({ jid: (entry && entry.id) || null, kind: kind || "info",
                  html: html, turn: S.turnCounter || 0 });
    while (S.feed.length > 160) S.feed.shift();
  }
  // Follow the newest entry only if the reader is already at the bottom, so
  // scrolling back through the game is not interrupted.
  const following = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.appendChild(el);
  while (box.children.length > 250) box.removeChild(box.firstChild);
  if (following) box.scrollTop = box.scrollHeight;
  refreshFeedMarks();
}

/* ── "you can answer this" markers ─────────────────────────────────
   A card badge pinned to a log entry saying "this one is yours to answer".
   It is drawn for the seat at the keyboard and nobody else: it only appears
   when YOU are holding the card that would answer it, so it tells the rest of
   the table nothing. Because the window is one entry wide the badge also
   vanishes the instant the next thing happens — which is the point. The
   badge IS the countdown. */
function markFace(key, cls, tip){
  const face = art("card", key);
  const glyph = key === "defuse" ? "🛡" : "🚫";
  return '<span class="evmark ' + cls + '" title="' + esc(tip) + '">' +
         (face ? '<img src="' + face + '" alt="">' : glyph) + '</span>';
}

function refreshFeedMarks(){
  const box = document.getElementById("feed");
  if (!box || !S) return;
  const me = viewSeat();
  const p = S.players[me];
  const live = openEntries();
  const liveIds = live.map(e => e.id);
  const hasDefuse = p && p.cards.some(c => c.key === "defuse" && c.boughtTurn !== S.turnCounter);
  const hasNope   = p && p.cards.some(c => c.key === "nope"   && c.boughtTurn !== S.turnCounter);

  box.querySelectorAll(".ev[data-jid]").forEach(el => {
    const jid = +el.dataset.jid;
    // A rewound entry stays on screen — the feed is a record of what was said,
    // not of what survived — but it is struck through so the log still reads
    // straight after a Nope has erased something out of the middle of it.
    //
    // Only entries new enough to still be in the journal can be judged. The
    // journal is capped, and online a terminal is sent a shorter tail of it
    // than the feed it has to mark up; without this every old line would be
    // struck through for having fallen off the end.
    const oldestKnown = S.journal.length ? S.journal[0].id : Infinity;
    const gone = jid >= oldestKnown && !S.journal.some(x => x.id === jid);
    el.classList.toggle("undone", gone);
    const isLive = liveIds.indexOf(jid) >= 0;
    const entry = isLive ? live[liveIds.indexOf(jid)] : null;
    el.classList.toggle("livewindow", isLive);
    const old = el.querySelector(".evmarks");
    if (old) old.remove();
    el.classList.remove("answerable");
    if (!isLive) return;

    let marks = "";
    if (hasDefuse && canDefuseEntry(entry, me))
      marks += markFace("defuse", "defuse", "You can Defuse this — drag your Defuse onto this line");
    if (hasNope && canNopeFor(entry, me))
      marks += markFace("nope", "nope", entry.kind === "roll"
        ? "You can Nope this — drag your Nope onto this line to reroll"
        : "You can Nope this — drag your Nope onto this line");
    if (!marks) return;
    el.classList.add("answerable");
    const wrap = document.createElement("div");
    wrap.className = "evmarks";
    wrap.innerHTML = marks;
    el.appendChild(wrap);
  });
}

/* Cleared with the board when a new game starts. */
function clearFeed(){
  const box = document.getElementById("feed");
  // The cached copy goes with it, or a terminal starting a new game would
  // compare the fresh log against the old one and decide nothing had changed.
  if (box){ box.innerHTML = ""; box.dataset.h = ""; }
  if (S) S.feed = [];
}
/* Resources as coloured chips, so a trade shows what actually moved. */
function resList(o){
  const parts = RES.filter(r => o[r] > 0)
    .map(r => '<span class="rchip" style="--rc:' + RES_COLOR[r] + '">' +
              '<span class="rdot"></span>' + o[r] + "× " + RES_NAME[r] + "</span>");
  return parts.length ? parts.join(" ") : '<span class="rchip none">nothing</span>';
}
/* A settled trade goes in the journal with everything else, which is what
   makes it answerable: drop a Nope on the line and the resources go back where
   they came from. It used to be announced straight to the feed with no entry
   behind it, so the one action at the table that can hand somebody the card
   they were missing was also the one nobody could stop.

   `snapBefore` is the board before the resources moved — that is what the
   Nope rewinds to. */
function tradeToast(a, b, gave, got, snapBefore){
  flyTrade(a.id, b.id, gave, got);
  return logAction(pdot(a) + " → " + resList(gave) + "<br>" + pdot(b) + " → " + resList(got),
                   "info", { actor: a.id, target: b.id, snap: snapBefore || snapAll() });
}

/* The bank is not a player, so there is nobody on the other side of the line —
   but the resources still move, and a Nope still has to be able to move them
   back. */
function bankToast(a, gave, got, snapBefore){
  flyTrade(a.id, null, gave, got);      // null: the bank, at the trader's elbow
  return logAction(pdot(a) + " banks " + resList(gave) + " → " + resList(got), "info",
                   { actor: a.id, snap: snapBefore || snapAll() });
}

function pdot(p){
  return '<span class="dot" style="background:' + p.color +
         ';display:inline-block;vertical-align:-2px;margin-right:5px"></span><b>' + p.name + '</b>';
}

/* Whether the one-line advice is wanted at all. Remembered, because somebody
   who has turned it off has decided they know how to play. */
let TIPS_ON = (function(){
  try { return localStorage.getItem("ec_tips") !== "off"; } catch(e){ return true; }
})();

function toggleTips(){
  TIPS_ON = !TIPS_ON;
  try { localStorage.setItem("ec_tips", TIPS_ON ? "on" : "off"); } catch(e){}
  drawTipBtn();
  if (!TIPS_ON) hint(null);
  else if (S) drawHint();
}

function drawTipBtn(){
  const b = document.getElementById("tipBtn");
  if (!b) return;
  b.classList.toggle("off", !TIPS_ON);
  b.title = TIPS_ON ? "Tips are on — click to stop showing them"
                    : "Tips are off — click to show them again";
}

let hintTimer = null;
function hint(msg, sticky){
  const el = document.getElementById("hintslot");
  if (!el) return;
  clearTimeout(hintTimer);
  if (!msg || !TIPS_ON){ el.className = ""; el.textContent = ""; return; }
  el.textContent = msg;
  el.className = "on";
  if (!sticky) hintTimer = setTimeout(() => { el.className = ""; }, 2600);
}

const DIE_PIPS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
function dieHTML(n, animate){
  const on = DIE_PIPS[n] || [];
  let cells = "";
  for (let i = 0; i < 9; i++) cells += `<i class="${on.includes(i) ? "" : "off"}"></i>`;
  return `<div class="die ${animate ? "roll" : ""}" title="${n}">${cells}</div>`;
}

/* Which throw this screen has already watched tumble.

   This used to be a flag on the state that drawDice cleared as it read it —
   and drawDice runs inside render(), which runs BEFORE the state is published.
   So the dice were always already stale by the time they went out, and no
   terminal ever saw a die move: the numbers simply appeared. A counter that
   only ever goes up cannot be consumed by whoever looks at it first. */
let lastRollShown = 0;

function drawDice(){
  const el = document.getElementById("diceWrap");
  if (!el) return;
  if (!S.rolled || S.phase.startsWith("setup") || S.phase === "over"){
    if (el.dataset.sig){ el.innerHTML = ""; el.dataset.sig = ""; }
    return;
  }
  const [a, b] = S.rolled, sum = a + b;
  const id = S.rollId || 0;

  /* Written only when the throw itself changes.

     This is what was eating the tumble, and it ate it for everybody — host
     and terminal alike — on any roll that paid out. Producing resources asks
     for a repaint of its own, so a roll rendered TWICE: once with the dice
     animating, and again a microtask later, which replaced the very elements
     that were mid-animation with identical ones that were not. A CSS
     animation runs from the moment its element is created, so the second
     write threw the first away before the browser had drawn a single frame of
     it. Same guard the chat window and the side panels already use: compare
     first, and do not rewrite what is already on screen. */
  const sig = id + ":" + a + ":" + b;
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;

  const fresh = id !== lastRollShown;
  lastRollShown = id;
  el.innerHTML = dieHTML(a, fresh) + dieHTML(b, fresh) +
                 `<span class="dicesum ${sum === 7 ? "seven" : ""}">${sum}</span>`;
}

function drawHint(){
  // Advice is for whoever is actually playing. During a bot's turn the strip
  // stays empty unless a prompt has handed us control.
  // A forced selection belongs to whoever owns it and to nobody else. Being
  // the current player is not enough: a Defused Alter hands the picker to the
  // defuser, and the person whose card it was would otherwise be told to
  // "pick the first number token to swap" for a choice that is not theirs.
  let ours;
  if (S.select && S.select.actor !== undefined){
    ours = S.select.actor === viewSeat();
  } else if (window.NET && NET.isOnline && NET.isOnline()){
    ours = S.cur === viewSeat();
  } else {
    ours = !anyBots() || myTurnNow();
  }
  if (!ours){ hint(null); return; }
  if (S.armed){
    const what = S.armed.kind;
    if (what === "robber"){
      hint("Click that hex again to move the robber there, or another to change your mind.", true);
    } else if (what === "alterb"){
      hint("Click that token again to swap the two, or another to change your mind.", true);
    } else {
      const cost = what === "free" ? "" :
        " — " + Object.entries(COST[what]).map(([r, n]) => n + " " + RES_NAME[r]).join(", ");
      hint(`Click again to confirm ${what === "free" ? "placement" : "the " + what + cost}, or click elsewhere to cancel.`, true);
    }
  } else if (S.select && S.select.kind === "robber"){
    hint("Click a hex to move the robber onto it.", true);
  } else if (S.select && S.select.kind === "alter"){
    hint(S.select.first === null ? "Pick the first number token to swap."
                                 : "Now pick the second number token.", true);
  } else if (S.phase.startsWith("setup")){
    hint(`Place your ${S.setupNeed} — click a highlighted spot.`, true);
  } else if (S.phase === "roll"){
    hint("Roll the dice to begin your turn.", true);
  } else {
    hint(null);
  }
}

/* ── Imploding Kitten clock ──────────────────────────────────────────── */
let implodeTimer = null;

function implodeActive(){ return S && S.implodeTurn === S.turnCounter; }

function clearImplodeClock(){
  if (implodeTimer){ clearTimeout(implodeTimer); implodeTimer = null; }
  const el = document.getElementById("implodeClock");
  if (el) el.remove();
}

function startImplodeClock(){
  clearImplodeClock();
  S.implodeUntil = Date.now() + 20000;
  implodeClockTick();
}

function implodeClockTick(){
  implodeTimer = null;
  if (!S || !implodeActive() || S.phase === "over"){ clearImplodeClock(); return; }
  const left = Math.max(0, Math.ceil((S.implodeUntil - Date.now()) / 1000));

  let el = document.getElementById("implodeClock");
  if (!el){
    el = document.createElement("div");
    el.id = "implodeClock";
    const area = document.getElementById("boardArea");
    if (area) area.appendChild(el);
  }
  el.className = left <= 5 ? "urgent" : "";
  el.innerHTML = "💥 <b>" + S.players[S.cur].name + "</b> imploded — un-Nopeable<br><span>" +
                 left + "s left in this turn</span>";

  if (left <= 0){
    clearImplodeClock();
    // Only the host ends the turn. A terminal just stops showing the clock and
    // waits to be told, or two browsers would end the same turn twice.
    if (window.NET && NET.isGuest && NET.isGuest()) return;
    logMsg("<span style='color:#d98b4b'>The Imploding Kitten's 20 seconds are up.</span>");
    announce("⏳ " + pdot(S.players[S.cur]) + "'s imploded turn runs out", "big");
    S.implodeTurn = -1;
    S.armed = null;
    if (!S.pending && !S.select && (S.phase === "main" || S.phase === "roll")) doEndTurn();
    return;
  }
  implodeTimer = setTimeout(implodeClockTick, 250);
}

/* A terminal is sent how much of the imploding-kitten clock is still to run
   rather than being trusted to keep time; this starts and stops the banner to
   match. There used to be a second, turn hand-over clock here as well — a few
   seconds after every turn in which nobody could roll. It was removed: a Nope
   can now simply be dragged onto any of the last few lines of the log, which
   is both easier to understand and never makes anyone wait. */
function mirrorClocks(){
  if (!S) return;
  if (S.implodeUntil > Date.now() && S.implodeTurn === S.turnCounter){
    if (!implodeTimer) implodeClockTick();
  } else if (S.implodeTurn !== S.turnCounter){
    clearImplodeClock();
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function logMsg(msg){
  S.log.push(msg);
  if (S.log.length > 500) S.log.shift();
}

/* The running feed is the game log now, so the button shows and hides it
   rather than opening a separate window. */
function toggleFeed(){
  const box = document.getElementById("feed");
  const btn = document.getElementById("logBtn");
  if (!box) return;
  const hidden = box.classList.toggle("hidden");
  if (btn) btn.classList.toggle("on", !hidden);
  if (!hidden) box.scrollTop = box.scrollHeight;
}
function showLog(){ toggleFeed(); }

function showDice(){
  const rolls = S.diceLog || [];
  const tally = {};
  for (let n = 2; n <= 12; n++) tally[n] = 0;
  for (const r of rolls) tally[r]++;
  const max = Math.max(1, ...Object.values(tally));

  let h = `<p class="sub">${rolls.length} roll${rolls.length === 1 ? "" : "s"} this game.</p>`;
  h += `<div class="vchart">`;
  for (let n = 2; n <= 12; n++){
    const pct = (tally[n] / max) * 100;
    h += `<div class="vcol ${n === 7 ? "seven" : ""}">
            <span class="vc">${tally[n] || ""}</span>
            <span class="vb" style="height:${pct}%"></span>
            <span class="vn">${n}</span>
          </div>`;
  }
  h += `</div>`;
  if (rolls.length){
    h += `<h4 style="margin:14px 0 4px;font-size:13px">Most recent (newest first)</h4><div class="recent">`;
    for (const r of rolls.slice(-40).reverse())
      h += `<span class="${r === 7 ? "seven" : ""}">${r}</span>`;
    h += `</div>`;
  }
  // Tagged to this screen. Untagged, an online host shipped it to whichever
  // seat happened to be left in NET.promptSeat, so asking for the dice history
  // put it up on somebody else's screen instead of your own.
  promptFor(viewSeat());
  openModal("Dice history", h, [{ label:"Close", cls:"primary", fn: closeModal }]);
}

/* ══════════════════════════════════════════════════════════════════════
   CHAT AND EMOTES
   ══════════════════════════════════════════════════════════════════════
   Two more buttons beside the log. One opens a window people can type into;
   the other throws an emoji, which lands on the thrower's own portrait in
   the seat strip and fades on its own.

   Both live on the state rather than in the DOM, for the reason the feed
   does: online, the host's browser is the only one that sees anything
   happen, and everything the rest of the table knows arrived in a published
   state. A terminal sends what was typed as an intent and waits to be told
   it landed, exactly like a card being played. Which also means neither can
   be forged into anything but a message or one of the listed emoji — the
   host re-checks both before they go anywhere.

   Emoji rather than a second chat line for the bots, deliberately: a bot
   that types is a bot writing sentences, and they are much funnier when the
   whole vocabulary is eighteen faces and the timing is the joke.
   ══════════════════════════════════════════════════════════════════════ */

const CHAT_KEEP  = 60;        // messages kept on the state and sent online
const CHAT_MAX   = 140;       // characters in one message
const EMOTE_KEEP = 12;        // recent throws — enough that none is missed
const EMOTE_MS   = 3400;      // how long one sits on a portrait; matches the CSS

/* The tray, in the order it is drawn: six across, three down. Weighted the
   way the table is — mockery first, grudging respect last. */
const EMOJIS = ["\u{1F620}","\u{1F602}","\u{1F60F}","\u{1F644}","\u{1F971}","\u{1F921}",
                "\u{1F480}","\u{1F595}","\u{2639}\u{FE0F}","\u{1F60E}","\u{23F2}\u{FE0F}","\u{1F9E0}",
                "\u{1F609}","\u{1F631}","\u{1F62D}","\u{1F64F}","\u{1F91D}","\u{1F525}"];

/* ── Chat ───────────────────────────────────────────────────────────── */

function chatIsOpen(){ return document.body.classList.contains("haschat"); }

function clearChat(){
  if (S){ S.chat = []; S.emotes = []; S.msgId = 0; }
  chatSeen = 0;
  lastEmoteId = 0;
  for (const k in liveEmotes) delete liveEmotes[k];
  const box = document.getElementById("chatlog");
  if (box){ box.innerHTML = ""; box.dataset.h = ""; }
  drawChatBadge();
}

function toggleChat(){
  const on = document.body.classList.toggle("haschat");
  if (on){
    closeEmojiTray();                  // they share a peg; only one hangs on it
    drawChat();
    const log = document.getElementById("chatlog");
    if (log) log.scrollTop = log.scrollHeight;
    const inp = document.getElementById("chatin");
    if (inp) inp.focus();
  }
  drawChatBadge();
  placeFeed();
}

/* Newest message this screen has actually been shown. Your own never count:
   a badge telling you that you said something is a badge for nobody. */
let chatSeen = 0;
function chatUnread(){
  if (!S || !S.chat) return 0;
  const me = viewSeat();
  let n = 0;
  for (const m of S.chat) if (m.id > chatSeen && m.seat !== me) n++;
  return n;
}
function markChatRead(){
  if (S && S.chat && S.chat.length) chatSeen = S.chat[S.chat.length - 1].id;
}

function drawChatBadge(){
  const btn = document.getElementById("chatBtn");
  if (!btn) return;
  const open = chatIsOpen();
  const n = open ? 0 : chatUnread();
  // Written only when it actually changes: this runs on every repaint, and
  // rewriting a button's contents forty times a turn to say the same thing is
  // a layout each time for nothing.
  const want = String(n);
  if (btn.dataset.n !== want){
    btn.dataset.n = want;
    btn.innerHTML = "Chat" + (n ? `<span class="unread">${n > 9 ? "9+" : n}</span>` : "");
  }
  btn.classList.toggle("on", open);
}

function drawChat(){
  const box = document.getElementById("chatlog");
  if (!box) return;
  const msgs = (S && S.chat) || [];
  const following = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  let h = "";
  for (const m of msgs){
    const p = S.players[m.seat];
    h += `<div class="msg" style="--mc:${p ? p.color : "var(--dim)"}">` +
         `<span class="who">${esc(p ? p.name : "?")}</span>${esc(m.text)}</div>`;
  }
  if (!h) h = S ? `<div class="msg sys">Nothing said yet. The bots are listening.</div>`
                : `<div class="msg sys">No game running.</div>`;
  // Nothing to say to nobody: there is no table to say it to yet.
  const inp = document.getElementById("chatin");
  if (inp) inp.disabled = !S;
  // Compared before writing: an identical rewrite drops the caret out of any
  // text being selected in here and costs a layout for nothing.
  if (box.dataset.h !== h){
    box.dataset.h = h;
    box.innerHTML = h;
  }
  if (following) box.scrollTop = box.scrollHeight;
  if (chatIsOpen()) markChatRead();
  drawChatBadge();
}

function chatKey(ev){
  if (ev.key === "Enter"){ ev.preventDefault(); sendChatFromInput(); }
  else if (ev.key === "Escape") ev.target.blur();
  // The board reads single keys for nothing, but a stray Escape reaching the
  // document while you are typing would disarm a spot you had just lined up.
  ev.stopPropagation();
}

function sendChatFromInput(){
  const inp = document.getElementById("chatin");
  if (!inp) return;
  const text = inp.value;
  inp.value = "";
  inp.focus();
  sendChat(text);
}

/* From this screen. A terminal says what was typed and stops there; the host
   is the one that decides it was said. */
function sendChat(text){
  if (!S) return;
  text = String(text || "").replace(/\s+/g, " ").trim().slice(0, CHAT_MAX);
  if (!text) return;
  if (netSend("chat", [text])) return;
  pushChat(viewSeat(), text);
}

/* The authoritative append: the host's copy, or the only copy offline. */
function pushChat(seat, text){
  if (!S || !S.players[seat]) return;
  text = String(text || "").replace(/\s+/g, " ").trim().slice(0, CHAT_MAX);
  if (!text) return;
  if (!S.chat) S.chat = [];
  S.chat.push({ id: ++S.msgId, seat: seat, text: text, turn: S.turnCounter || 0 });
  while (S.chat.length > CHAT_KEEP) S.chat.shift();
  drawChat();
  if (window.NET && NET.publishSoon) NET.publishSoon();
  // Bots hear everything, and bots are not gracious listeners.
  if (window.AI && AI.heard) AI.heard(seat, text);
}

/* ── Emotes ─────────────────────────────────────────────────────────── */

function drawEmojiTray(){
  const el = document.getElementById("emojiTray");
  if (!el || el.childElementCount) return;
  el.innerHTML = EMOJIS.map((e, i) =>
    `<button type="button" onclick="sendEmote(EMOJIS[${i}])" title="Throw this">${e}</button>`).join("");
}

function toggleEmojiTray(){
  drawEmojiTray();
  const on = document.body.classList.toggle("hastray");
  if (on) closeChat();                 // they share a peg; only one hangs on it
  const btn = document.getElementById("emojiBtn");
  if (btn) btn.classList.toggle("on", on);
}

function closeChat(){
  if (!document.body.classList.contains("haschat")) return;
  document.body.classList.remove("haschat");
  drawChatBadge();
  placeFeed();
}
function closeEmojiTray(){
  document.body.classList.remove("hastray");
  const btn = document.getElementById("emojiBtn");
  if (btn) btn.classList.remove("on");
}

function sendEmote(key){
  closeEmojiTray();
  if (!S) return;
  if (netSend("emote", [key])) return;
  pushEmote(viewSeat(), key);
}

/* The authoritative throw. Anything not in the tray is dropped rather than
   drawn: this is the one place text from another machine reaches the screen
   without being escaped, and "one of these eighteen" is a far easier thing to
   be sure of than "harmless". */
function pushEmote(seat, key){
  if (!S || !S.players[seat]) return;
  if (EMOJIS.indexOf(key) < 0) return;
  if (!S.emotes) S.emotes = [];
  S.emotes.push({ id: ++S.msgId, seat: seat, key: key });
  while (S.emotes.length > EMOTE_KEEP) S.emotes.shift();
  syncEmotes();
  drawPlayers();
  if (window.NET && NET.publishSoon) NET.publishSoon();
}

/* Which emoji is sitting on each portrait and until when. Kept off the state
   on purpose: it is a view concern, and the seat strip is rebuilt from
   scratch on every repaint — so the bubble is re-rendered from here rather
   than left in the DOM to be wiped by the next render. */
const liveEmotes = {};        // seat -> { key, until }
let lastEmoteId = 0;
let emoteTimer = null;

/* New throws since the last look become live bubbles. Ids rather than clocks,
   because a terminal is not asked to trust anybody else's wall clock — and
   because the whole state is resent after every action, so the same throw
   arrives over and over and must only land once. */
function syncEmotes(){
  const list = (S && S.emotes) || [];
  // A fresh game, or a state from one: the counter went backwards, so nothing
  // here has been seen before. Start again rather than swallow the lot.
  if (list.length && list[list.length - 1].id < lastEmoteId) lastEmoteId = 0;
  let fresh = false;
  for (const e of list){
    if (e.id <= lastEmoteId) continue;
    lastEmoteId = e.id;
    liveEmotes[e.seat] = { key: e.key, until: Date.now() + EMOTE_MS };
    fresh = true;
  }
  if (fresh) scheduleEmoteSweep();
  return fresh;
}

/* One timer for all of them, set to whichever expires last. Expiry only has
   to take the bubble out of the next repaint — the fade itself is the tail of
   the CSS animation, which has already played by the time this fires. */
function scheduleEmoteSweep(){
  if (emoteTimer) return;
  let last = 0;
  for (const s in liveEmotes) last = Math.max(last, liveEmotes[s].until);
  if (!last) return;
  emoteTimer = setTimeout(() => {
    emoteTimer = null;
    const now = Date.now();
    let changed = false;
    for (const s in liveEmotes)
      if (liveEmotes[s].until <= now){ delete liveEmotes[s]; changed = true; }
    if (changed && S) drawPlayers();
    scheduleEmoteSweep();
  }, Math.max(120, last - Date.now() + 60));
}

/* A repaint in the middle of a bubble's life must not restart the pop, so the
   animation is resumed with a negative delay rather than begun again. */
function emoteHTML(pid){
  const e = liveEmotes[pid];
  if (!e) return "";
  const left = e.until - Date.now();
  if (left <= 0) return "";
  const elapsed = Math.max(0, EMOTE_MS - left);
  return `<span class="emote" style="animation-delay:-${elapsed}ms">${e.key}</span>`;
}

/* ══════════════════════════════════════════════════════════════════════
   PICKING A PORTRAIT
   ══════════════════════════════════════════════════════════════════════ */

/* The grid of faces, for the New Game dialog, the online lobby, and the
   click on your own seat card. `sel` is what is chosen now; every button
   calls window.__avPick, which each caller sets to whatever it wants doing
   with the answer — the same arrangement the mode picker uses. */
function avatarGridHTML(sel){
  const pool = avatarPool();
  if (!pool.length){
    return `<div class="rules">No portraits found, so everybody plays as their initial —
            which is a perfectly good answer. Drop pictures into
            <b>${ART_DIR}${PROFILE_DIR}</b> as <b>1.png</b> …
            <b>${AVATAR_FILES}.png</b> and reload.</div>`;
  }
  let h = `<div class="avgrid">`;
  h += `<button class="avopt ${sel ? "" : "on"}" onclick="window.__avPick('')"
          title="No picture — your initial on your seat colour"><span class="none">None</span></button>`;
  for (const id of pool){
    h += `<button class="avopt ${id === sel ? "on" : ""}" onclick="window.__avPick('${id}')"
            title="${esc(avatarLabel(id))}"><img src="${avatarSrc(id)}" alt="" draggable="false"></button>`;
  }
  return h + `</div>`;
}

/* The chosen face, big, to sit beside a name field. */
function avatarNowHTML(sel){
  const src = avatarSrc(sel);
  return `<span class="avnow" id="avNow">${src ? `<img src="${src}" alt="">`
                                               : `<span class="none">?</span>`}</span>`;
}

/* Shaped like a portrait id and nothing else. Ids travel between browsers, and
   this one ends up inside a src= attribute, so what arrives from another
   machine is checked against the grammar rather than against this folder's
   contents — somebody with a portrait you have not got keeps their choice,
   they just show as their initial on your screen.

   Only "a:<number>" passes. Anything naming the art folder is refused, so an
   old choice cannot creep back in through localStorage or from a player still
   running last week's build. */
function validAvatarId(id){
  return typeof id === "string" && /^a:[0-9]{1,3}$/.test(id);
}

/* Somebody changed their picture. Also called from net.js when a terminal says
   it did, which is why it sanitises rather than trusts.

   The roster is written too, not just the player: it is the roster the host
   re-seats everybody from on "Restart with these players", so without this a
   face chosen mid-game would be lost at the start of the next one. */
function setSeatAvatar(seat, id){
  const p = S && S.players[seat];
  if (!p) return;
  p.avatar = validAvatarId(id) ? id : "";
  if (window.NET && NET.roster && NET.roster[seat]) NET.roster[seat].av = p.avatar;
  render();
}
/* Changing your picture mid-game. The seat card's portrait opens this, which
   is the only way to reach it once a game has started. */
function avatarDialog(){
  const refresh = () => {
    openModal("Your picture",
      `<p class="sub">From <b>${ART_DIR}${PROFILE_DIR}</b>. It shows on your seat card,
       and everybody online sees it too.</p>` + avatarGridHTML(MY_AVATAR),
      [{ label:"Done", cls:"primary", fn: closeModal }]);
  };
  window.__avPick = (id) => {
    setMyAvatar(id);
    // A terminal says what it did and waits; everybody else is the authority
    // on their own seat and writes it themselves.
    if (S && !netSend("avatar", [id])) setSeatAvatar(viewSeat(), id);
    refresh();
  };
  window.__avRefresh = refresh;
  promptFor(viewSeat());
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════
   SETUP PHASE
   ══════════════════════════════════════════════════════════════════════ */

function beginSetupStep(){
  S.cur = S.setupOrder[S.setupIdx];
  S.phase = S.setupIdx < S.players.length ? "setup1" : "setup2";
  S.setupNeed = "settlement";
  S.setupLastVertex = null;
  S.armed = null;
  S.select = { kind:"settlement", setup:true };
  render();
  botTick();
}

/* ══════════════════════════════════════════════════════════════════════
   BUILDING BY CLICKING THE BOARD
   ══════════════════════════════════════════════════════════════════════
   There is no "pick a build mode" step. During your turn every spot you can
   legally afford is shown on the board; click it once to arm it, click again
   to confirm, click anywhere else to cancel.

   Setup placements work the same way, which also guards against a misclick
   putting your opening settlement somewhere you did not intend.
   ══════════════════════════════════════════════════════════════════════ */

function countPieces(p, kind){
  return kind === "road" ? p.roads : kind === "settlement" ? p.settlements : p.cities;
}
function hasSpotFor(kind){
  if (kind === "road")       return edges.some(e => canPlaceRoad(e.id, S.cur, null));
  if (kind === "settlement") return vertices.some(v => canPlaceSettlement(v.id, S.cur, false));
  return vertices.some(v => canPlaceCity(v.id, S.cur));
}

function armed(kind, id){ return S.armed && S.armed.kind === kind && S.armed.id === id; }
function arm(kind, id){ S.armed = { kind, id }; render(); }
function disarm(){ if (S.armed){ S.armed = null; render(); } }

/* What can the active player afford and still has pieces for? */
function affordable(kind){
  const p = cur();
  return canAfford(p, COST[kind]) && countPieces(p, kind) < LIMIT[kind];
}
/* During setup the placement is free, so only the piece limit applies. */
function buildableNow(kind){
  if (S.phase.startsWith("setup")) return true;
  return S.phase === "main" && !S.select && !S.pending && !owesAnswer() &&
         affordable(kind);
}

function vertexClick(vid){
  if (netSend("vertex", [vid])) return;
  if (swallowedByPan() || uiBlocked()) return;
  const sel = S.select;

  // ── setup: forced settlement placement ──
  if (sel && sel.kind === "settlement" && sel.setup){
    if (!canPlaceSettlement(vid, S.cur, true)) return;
    if (!armed("free", vid)){ arm("free", vid); return; }
    S.armed = null;
    placeSettlement(vid, true);
    return;
  }

  // ── normal play ──
  if (S.select || S.pending || S.phase !== "main") return;

  if (canPlaceCity(vid, S.cur) && buildableNow("city")){
    if (!armed("city", vid)){ arm("city", vid); return; }
    S.armed = null;
    placeCity(vid);
    return;
  }
  if (canPlaceSettlement(vid, S.cur, false) && buildableNow("settlement")){
    if (!armed("settlement", vid)){ arm("settlement", vid); return; }
    S.armed = null;
    placeSettlement(vid, false);
    return;
  }
  disarm();
}

function edgeClick(eid){
  if (netSend("edge", [eid])) return;
  if (swallowedByPan() || uiBlocked()) return;
  const sel = S.select;

  // ── setup: forced road placement ──
  if (sel && sel.kind === "road"){
    if (!canPlaceRoad(eid, S.cur, sel.fromVertex)) return;
    if (!armed("free", eid)){ arm("free", eid); return; }
    S.armed = null;
    placeRoad(eid, true);
    return;
  }

  if (S.select || S.pending || S.phase !== "main") return;
  if (!canPlaceRoad(eid, S.cur, null) || !buildableNow("road")){ disarm(); return; }
  if (!armed("road", eid)){ arm("road", eid); return; }
  S.armed = null;
  placeRoad(eid, false);
}

/* ── the placements themselves ─────────────────────────────────────── */

/* Paid BEFORE the snapshot, here and in placeCity and placeRoad, and it has to
   be. A Nope undoes what you built; it does not refund it. That is the rule
   freshTurnRecord has always stated for a Noped turn ("resources spent are
   still never refunded") and the one a Noped card purchase already followed,
   because drawKitten happens to snapshot after the buyer has paid. Builds
   snapshotted first, so rewinding to that snapshot handed the cost back — a
   Noped city cost its builder nothing at all. */
function placeSettlement(vid, setup){
  if (!setup) pay(cur(), COST.settlement);
  const snapBefore = snapAll();
  vertices[vid].owner = S.cur;
  vertices[vid].type = "settlement";
  cur().settlements++;

  if (setup){
    S.setupLastVertex = vid;
    logMsg(`<b>${cur().name}</b> settles.`);
    // Normally only the second settlement pays out. Fast track pays for both,
    // which is the whole of what it changes.
    if (S.phase === "setup2" || fastStart()){
      const got = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
      const opening = [];
      for (const hid of vertices[vid].hexes){
        const hx = hexes[hid];
        if (hx.terrain === "desert") continue;
        got[hx.terrain] += give(cur(), hx.terrain, 1);
        opening.push({ hid: hid, pid: S.cur, r: hx.terrain, n: 1 });
      }
      flyProduction(opening, S.players.map((q, i) => i === S.cur ? got : {}));
      logMsg(`<b>${cur().name}</b> starts with ` +
             RES.filter(r => got[r] > 0).map(r => got[r] + " " + RES_NAME[r]).join(", ") + ".");
      announce(pdot(cur()) + " settles and starts with<br>" + resList(got), "buy");
    } else {
      announce(pdot(cur()) + " places their first settlement", "info");
    }
    S.setupNeed = "road";
    S.select = { kind:"road", fromVertex: vid };
    render();
    return;
  }

  if (S.turnRec) S.turnRec.verts.push({ vid, prevType: null });
  logMsg(`<b>${cur().name}</b> builds a settlement.`);
  logAction(pdot(cur()) + " builds a <b>settlement</b>", "buy", { snap: snapBefore });
  updateLongestRoad();          // an opponent's settlement can cut a road
  afterBuild();
}

function placeCity(vid){
  pay(cur(), COST.city);
  const snapBefore = snapAll();
  vertices[vid].type = "city";
  cur().settlements--; cur().cities++;
  if (S.turnRec) S.turnRec.verts.push({ vid, prevType: "settlement" });
  logMsg(`<b>${cur().name}</b> upgrades to a city.`);
  logAction(pdot(cur()) + " upgrades to a <b>city</b>", "buy", { snap: snapBefore });
  afterBuild();
}

function placeRoad(eid, setup){
  if (!setup) pay(cur(), COST.road);
  const snapBefore = snapAll();
  edges[eid].owner = S.cur;
  cur().roads++;

  if (setup){
    logMsg(`<b>${cur().name}</b> lays a road.`);
    S.select = null;
    S.setupIdx++;
    if (S.setupIdx >= S.setupOrder.length){
      S.phase = "roll";
      S.cur = S.firstPlayer;
      S.turnCounter = 1;
      S.turnRec = freshTurnRecord();
      logMsg("Setup complete. <b>" + cur().name + "</b> to roll.");
      updateLongestRoad();
      render();
      botTick();
    } else {
      beginSetupStep();
    }
    return;
  }

  if (S.turnRec) S.turnRec.edges.push(eid);
  logMsg(`<b>${cur().name}</b> builds a road.`);
  logAction(pdot(cur()) + " builds a <b>road</b>", "buy", { snap: snapBefore });
  updateLongestRoad();
  afterBuild();
}

function hexClick(hid){
  if (netSend("hex", [hid])) return;
  if (swallowedByPan() || uiBlocked()) return;
  const sel = S.select;
  if (!sel){ disarm(); return; }

  if (sel.kind === "robber"){
    if (hid === S.robber) return;
    // Same two-step a build takes. Moving the robber is one of the few clicks
    // on this board that cannot be taken back, and it was a single one.
    if (!armed("robber", hid)){ arm("robber", hid); return; }
    S.armed = null;
    // Where it came from, so a Defuse can send it back. The move and whatever
    // theft follows it are journalled together, once, by finishRobber — they
    // are one event to answer, not two.
    sel.fromHex = S.robber;
    S.robber = hid;
    S.select = null;
    logMsg(`<b>${S.players[sel.actor].name}</b> moves the robber onto the ` +
           `${hexes[hid].terrain}${hexes[hid].number ? " " + hexes[hid].number : ""}.`);
    const victims = S.players.filter(q =>
      q.id !== sel.actor &&
      totalRes(q) > 0 &&
      hexes[hid].verts.some(v => vertices[v].owner === q.id));
    if (victims.length === 0){ finishRobber(sel); return; }
    chooseVictim(victims, sel);
    return;
  }

  if (sel.kind === "alter"){
    if (hexes[hid].number === null) return;
    if (sel.first === null){ sel.first = hid; S.armed = null; render(); return; }
    if (sel.first === hid){ sel.first = null; S.armed = null; render(); return; }   // click again to deselect
    // The first token can be un-picked by clicking it again, so only the
    // second needs confirming — that is the click that commits the swap.
    if (!armed("alterb", hid)){ arm("alterb", hid); return; }
    S.armed = null;
    const a = sel.first, b = hid, cb = sel.onPick;
    S.select = null;
    cb(a, b);
    return;
  }
}

function afterBuild(){
  S.armed = null;
  checkVictory();
  render();
}

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.body.classList.contains("hastray")){ closeEmojiTray(); return; }
  if (!S) return;
  if (dragCard || pressPend){ cancelCardDrag(); return; }   // drop the card
  if (S.armed){ disarm(); return; }
  if (S.select && !S.phase.startsWith("setup") && S.select.kind !== "robber"){
    S.select = null; render();
  }
});

/* ══════════════════════════════════════════════════════════════════════
   DICE / PRODUCTION / ROBBER
   ══════════════════════════════════════════════════════════════════════ */

function rollDice(){
  if (owesAnswer()){ hint("Finish the open window first."); return; }
  if (handoverActive()) return;      // the last turn is still open to an answer
  if (netSend("roll")) return;
  startTurnTimer();
  doRoll();
}

/* The roll itself. Split from rollDice because a Noped roll is thrown again
   on the spot — that reroll is the host acting on a decision already taken,
   not a terminal asking for one, so it must not travel back out as an intent
   and come round again. */
function doRoll(){
  const snapBefore = snapAll();
  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  S.rolled = [d1, d2];
  S.rollId = (S.rollId || 0) + 1;
  const sum = d1 + d2;
  S.diceLog.push(sum);
  logMsg(`<b>${cur().name}</b> rolls <b>${sum}</b> (${d1}+${d2}).`);

  if (sum === 7){
    const rollEntry = logAction(pdot(cur()) + " rolls <b>7</b> <span style='opacity:.55'>(" +
             d1 + "+" + d2 + ")</span><br><span style='opacity:.75'>robber moves — " +
             "hands over 7 are cut</span>", "roll", { snap: snapBefore, show: "seven" });
    S.phase = "main";
    startSevenSequence(S.cur, rollEntry.id);
    return;
  }

  const out = produce(sum);
  logAction(rollSummary(cur(), d1, d2, out), "roll", { snap: snapBefore });
  S.phase = "main";
  render();
}

function produce(sum){
  // Tally first: if the bank can't pay everyone for a resource, nobody gets it.
  const owed = S.players.map(() => ({ wood:0, brick:0, sheep:0, wheat:0, ore:0 }));
  const paid = S.players.map(() => ({ wood:0, brick:0, sheep:0, wheat:0, ore:0 }));
  // Where each card came from, so it can be flown out of the hex that grew it.
  const sources = [];
  for (const hx of hexes){
    if (hx.number !== sum || hx.id === S.robber || hx.terrain === "desert") continue;
    for (const vid of hx.verts){
      const v = vertices[vid];
      if (v.owner === null) continue;
      const n = v.type === "city" ? 2 : 1;
      owed[v.owner][hx.terrain] += n;
      sources.push({ hid: hx.id, pid: v.owner, r: hx.terrain, n: n });
    }
  }
  const notes = [];
  for (const r of RES){
    const claimants = S.players.filter(p => owed[p.id][r] > 0);
    const demand = claimants.reduce((s, p) => s + owed[p.id][r], 0);
    if (demand === 0) continue;
    if (demand > S.bank[r]){
      if (claimants.length > 1){ notes.push(`bank is short on ${RES_NAME[r]} — nobody collects it`); continue; }
      paid[claimants[0].id][r] += give(claimants[0], r, S.bank[r]);
      notes.push(`${claimants[0].name} takes the last ${RES_NAME[r]}`);
      continue;
    }
    for (const p of claimants) paid[p.id][r] += give(p, r, owed[p.id][r]);
  }
  const gains = S.players
    .map(p => { const g = RES.filter(r => owed[p.id][r] > 0).map(r => owed[p.id][r] + " " + RES_NAME[r]);
                return g.length ? `${p.name}: ${g.join(", ")}` : null; })
    .filter(Boolean);
  if (gains.length) logMsg(gains.join(" · "));
  else logMsg("<span style='opacity:.7'>Nobody produces.</span>");
  for (const n of notes) logMsg(`<span style='opacity:.7'>${n}</span>`);
  flyProduction(sources, paid);
  return { paid, notes };
}

/* ── 7: discard, then robber ───────────────────────────────────────────
   Who still owes the seven lives on the state rather than in a chain of
   closures. It has to: a Nope landing mid-discard rewinds the board, and a
   queue held only in a callback would carry on paying out for a roll that no
   longer happened — which is exactly how a Noped seven still took everybody's
   cards. Snapshotted with everything else, so a rewind puts the queue back
   precisely as it stood, and stepSeven picks it up from there. */
function startSevenSequence(actor, jid){
  pauseTurnTimer("seven");
  S.seven = { actor: actor, jid: jid,
              queue: S.players.filter(p => totalRes(p) > 7).map(p => p.id) };
  // Repaint before anybody is asked to pay, and after the queue exists so the
  // bar knows a seven is owed. The seven branch of doRoll used to return
  // without a repaint at all, which left the bottom bar showing whatever it
  // showed when the dice were thrown — in the roll phase, the Roll Dice
  // button, sitting there through a seven, looking live and doing nothing at
  // all when pressed.
  render();
  stepSeven();
}

/* Ask whoever is at the head of the queue, or move the robber when it empties.
   Safe to call again at any point — after a rewind, after a Defuse — because
   the queue says what is still owed rather than what has been asked. */
function stepSeven(){
  const s = S && S.seven;
  if (!s) return;
  if (S.phase === "over" || S.phase.startsWith("setup")){ S.seven = null; return; }
  // A hand that has shrunk since the roll — Defused, Noped, or given away in a
  // trade that was then undone — is no longer over the line.
  while (s.queue.length && totalRes(S.players[s.queue[0]]) <= 7) s.queue.shift();
  if (!s.queue.length){
    const actor = s.actor;
    S.seven = null;
    beginRobberMove(actor);
    return;
  }
  const p = S.players[s.queue[0]];
  // A bot pays the moment it is asked, so this is its only chance to answer the
  // seven instead. Whatever it spends restarts the sequence from wherever the
  // board ends up, which is why nothing after this line runs.
  const ag = agentOf(p.id);
  if (ag && ag.answerSeven && ag.answerSeven()) return;
  discardDialog(p, Math.floor(totalRes(p) / 2), () => {
    // The board may have moved under this dialog while it was open. Only the
    // answer the queue is actually waiting on counts.
    if (!S.seven || S.seven.queue[0] !== p.id) return;
    S.seven.queue.shift();
    stepSeven();
  }, { mini: true, answers: s.jid });
}

/* Is this player one of the hands a seven still has its hand out for? */
function owesSevenCut(pid){
  return !!(S && S.seven && S.seven.queue.indexOf(pid) >= 0);
}

/* ── the seven's watchdog ─────────────────────────────────────
   A seven is the one thing that stops the table until it is paid, and the only
   one whose prompt going missing wedges the whole game: the queue says who
   still owes, and nothing re-asks. It did go missing at least once, somebody
   part-way through discarding a big hand, and a table that can never move
   again is a far worse bug than whatever dropped the window.

   So rather than hunt every path that can dismiss a dialog, this asks again.
   stepSeven has always been safe to call twice — "the queue says what is
   still owed rather than what has been asked" — and the guard here is the
   strongest one available: it fires only when there is no dialog ANYWHERE on
   the table. No overlay on this screen, no panel, nothing outstanding on
   anybody else's. In that state re-asking cannot interrupt a soul, because
   there is nobody left to interrupt.

   Two quiet passes rather than one, so a dialog in the act of being handed
   from one screen to another is never mistaken for one that has gone. */
const SEVEN_WATCH_MS = 1500;
let sevenWatchIdle = 0;

function sevenWatchdog(){
  if (!S || !S.seven || !S.seven.queue.length){ sevenWatchIdle = 0; return; }
  // A terminal decides nothing, here as everywhere else.
  if (window.NET && NET.isGuest && NET.isGuest()) return;
  if (typeof humanPromptOpen === "function" && humanPromptOpen()){ sevenWatchIdle = 0; return; }
  if (++sevenWatchIdle < 2) return;
  sevenWatchIdle = 0;
  logMsg("<span style='color:#d98b4b'>The seven was left unanswered — asking again.</span>");
  announce("⏳ Nobody was holding the seven — asking again", "info");
  stepSeven();
  render();
}
setInterval(sevenWatchdog, SEVEN_WATCH_MS);

/* Robber moves QUEUE rather than overwrite each other. Two can be owed at
   once — a seven, and a Knight played in the gap while that seven's discards
   were still being paid — and each of them used to simply assign over
   S.select, so one of the two moves silently vanished. That is why a bot that
   rolled a seven and then played a Knight moved the robber once instead of
   twice.

   `opts` carries what makes this move different from the last: `knight` for
   one that counts toward Largest Army, `credit` for one whose knight belongs
   to somebody other than the player placing it. */
function beginRobberMove(actor, opts){
  const move = Object.assign({ kind:"robber", actor: actor, knight:false, noDefuse:false }, opts || {});
  if (S.select){ S.robberDue.push(move); return; }
  S.select = move;
  setTimeout(botTick, 0);
  logMsg(`<b>${S.players[actor].name}</b> must move the robber.`);
  render();
}

/* Hand over to whatever was waiting behind the move that just finished. */
function nextRobberMove(){
  if (!S.robberDue || !S.robberDue.length) return false;
  S.select = S.robberDue.shift();
  setTimeout(botTick, 0);
  logMsg(`<b>${S.players[S.select.actor].name}</b> must move the robber again.`);
  announce(pdot(S.players[S.select.actor]) + " has a second robber move to make", "attack");
  render();
  return true;
}

function chooseVictim(victims, sel){
  // One player on the hex is not a choice. Asking anyway put a window in front
  // of an answer that had already been decided — and made a bot sit through
  // its own pause before picking the only name on the list.
  if (victims.length === 1){ doSteal(S.players[sel.actor], victims[0], sel); return; }
  promptFor(sel.actor);
  const vag = agentOf(sel.actor);
  let html = `<p class="sub">Steal one random resource card.</p><div class="pick">`;
  victims.forEach(v => {
    html += `<button onclick="window.__pickVictim(${v.id})">${v.name} (${totalRes(v)} cards)</button>`;
  });
  html += `</div>`;
  if (vag && vag.chooseVictim){
    const pickId = vag.chooseVictim(victims, sel).id;
    const gameAtCall = S;
    setTimeout(function(){ if (S === gameAtCall) window.__pickVictim(pickId); }, AI_PACE);
  } else {
    openModal("Choose a victim", html, []);
  }
  // Nobody is asked whether they would like to Defuse. There used to be a
  // window here — a Knight stealing from you, do you want to say "no you"? —
  // which announced to the table that you were holding a Defuse before you had
  // decided to spend it, and could not be folded away. The robbery is a line
  // in the log now, answerable by dragging a Defuse onto it, so the window had
  // nothing left to offer.
  window.__pickVictim = (vid) => {
    closeModal();
    doSteal(S.players[sel.actor], S.players[vid], sel);
  };
}

function doSteal(thief, victim, sel){
  const pool = [];
  for (const r of RES) for (let i = 0; i < victim.res[r]; i++) pool.push(r);
  if (pool.length){
    const r = pool[Math.floor(Math.random() * pool.length)];
    victim.res[r]--; thief.res[r]++; noteGain(thief, r, 1);
    // Face down: which card it was is between the two of them.
    const took = { wood:0, brick:0, sheep:0, wheat:0, ore:0 }; took[r] = 1;
    flyCards(victim.id, thief.id, took, true);
    // WHICH card was taken is never named. The two of them can see it in their
    // own hands and nobody else is entitled to. The feed used to name it
    // whenever either side was a person, which is why it leaked on some
    // robberies and not others — a tell that told you more the more humans
    // were playing.
    logMsg(`<b>${thief.name}</b> steals a resource card from <b>${victim.name}</b>.`);
    sel.stole = r;                 // carried to finishRobber, never serialized
    sel.victim = victim.id;
  } else {
    logMsg(`<b>${victim.name}</b> has nothing to steal.`);
  }
  finishRobber(sel);
}

function finishRobber(sel){
  S.select = null;
  journalRobber(sel);
  if (sel.knight){
    // The knight counts for whoever played the card, even if it was Defused.
    const p = S.players[sel.credit !== undefined ? sel.credit : sel.actor];
    p.knights++;
    if (S.turnRec && p.id === S.cur) S.turnRec.knights++;
    updateLargestArmy();
    checkVictory();
  }
  if (nextRobberMove()) return;      // another one was waiting behind it
  if (!S.seven) resumeTurnTimer();
  render();
}

/* One line for the whole robbery: where the robber went and who it took from.
   Answerable by ANYBODY with a building on that hex, not only whoever happened
   to be robbed — the robber sitting on your wheat costs you every roll it stays
   there, which is the greater part of the damage and was unanswerable.

   What travels is the hex, so a terminal can work out for itself whether it is
   settled there. The stolen resource and the robber's previous home ride on
   fields the wire format does not carry. */
function journalRobber(sel){
  if (!sel || sel.actor === undefined || sel.fromHex === undefined) return;
  const thief = S.players[sel.actor];
  const hx = hexes[S.robber];
  const where = hx.terrain + (hx.number ? " " + hx.number : "");
  const took = (sel.victim !== undefined && sel.victim !== null)
        ? " and steals a resource card from " + pdot(S.players[sel.victim]) : "";
  const ent = logAction(pdot(thief) + " moves the robber onto the " + esc(where) + took,
            "attack", { actor: sel.actor,
                        target: (sel.victim === undefined) ? null : sel.victim,
                        snap: snapAll(), payload: { robber: true, hex: S.robber },
                        noDefuse: !!sel.noDefuse });
  ent.stolen = sel.stole || null;
  ent.fromHex = sel.fromHex;
}

/* ══════════════════════════════════════════════════════════════════════
   KITTEN CARDS
   ══════════════════════════════════════════════════════════════════════ */

/* How many cards a pool of resources can buy: each card wants three DIFFERENT
   types, so repeatedly spend one each from the three deepest piles. */
function cardsFromPool(pool){
  const left = { wood:pool.wood, brick:pool.brick, sheep:pool.sheep,
                 wheat:pool.wheat, ore:pool.ore };
  let n = 0;
  for (;;){
    const have = RES.filter(r => left[r] > 0).sort((a, b) => left[b] - left[a]);
    if (have.length < 3) break;
    left[have[0]]--; left[have[1]]--; left[have[2]]--;
    n++;
  }
  const spent = {};
  for (const r of RES) spent[r] = pool[r] - left[r];
  return { cards: n, spent, left };
}

function buyKittenDialog(){
  if (owesAnswer()){ hint("Finish the open window first."); return; }
  if (netSend("buy")) return;
  if (!myTurnNow()) return;
  const p = cur();
  const pool = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };

  const refresh = () => {
    const res = cardsFromPool(pool);
    const capped = Math.min(res.cards, S.deck.length);
    const leftover = RES.filter(r => res.left[r] > 0);

    let h = `<p class="sub">Any 3 different resources buys a card. Click to add,
             click past what you hold to clear.</p>
             <div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Spend</div>
             <div class="pick tight">`;
    for (const r of RES){
      h += `<button ${p.res[r] > 0 ? "" : "disabled"} onclick="window.__poolAdd('${r}')"
              title="${RES_NAME[r]} — you hold ${p.res[r]}">
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:3px"></span>
              ${RES_NAME[r]}<b class="ct ${pool[r] ? "" : "off"}">×${pool[r] || 1}</b></button>`;
    }
    h += `</div>`;
    if (RES.some(r => pool[r] > 0)){
      h += `<div class="tsum">${resList(res.spent)}<span class="arrow">→</span>
              <span class="buys">${capped} card${capped === 1 ? "" : "s"}</span>
              ${res.cards > capped ? `<span class="mismatch">deck only has ${S.deck.length}</span>` : ""}
              ${leftover.length ? `<span class="mismatch">${resList(res.left)} cannot pair up</span>` : ""}
            </div>`;
    }

    openPanel("buy", p.id, "Buy kitten cards", h, [
      { label:"Clear", fn: () => { for (const r of RES) pool[r] = 0; refresh(); } },
      { label:"Cancel", fn: () => { closePanel("buy"); render(); } },
      { label: capped > 1 ? `Buy ${capped} cards` : "Buy", cls:"primary", disabled: capped < 1,
        fn: () => {
          closePanel("buy");
          for (const r of RES) take(p, r, res.spent[r]);
          for (let k = 0; k < capped; k++) drawKitten(p);
          hint(`Bought ${capped} kitten card${capped === 1 ? "" : "s"}.`);
          render();
        } }
    ]);
  };

  window.__poolAdd = (r) => {
    pool[r] = p.res[r] > pool[r] ? pool[r] + 1 : 0;
    refresh();
  };
  if (RES.filter(r => p.res[r] > 0).length < 3 || !S.deck.length) return;
  refresh();
}

function drawKitten(p){
  if (!S.deck.length){ logMsg("The kitten deck is empty."); return; }
  const snapBefore = snapAll();
  const c = S.deck.pop();

  if (c.key === "implode"){
    // Fires the instant it is drawn — never enters a hand.
    logMsg(`<b>${p.name}</b> draws the <b>Imploding Kitten</b>!`);
    let stolen = 0;
    for (const q of S.players){
      if (q.id === p.id) continue;
      for (const r of RES){ p.res[r] += q.res[r]; stolen += q.res[r]; q.res[r] = 0; }
    }
    S.discard.push(c);
    // Nothing this player does for the rest of the turn can be Noped. The
    // 20 second clock is the counterweight — the turn ends when it runs out.
    S.implodeTurn = S.turnCounter;
    S.implodeBy = p.id;
    startImplodeClock();
    logMsg(`Every other player's hand implodes into <b>${p.name}</b> — ${stolen} cards taken.`);
    logMsg(`<b>${p.name}</b>'s turn cannot be Noped, but ends in 20 seconds.`);
    // Journalled purely so the card turns over on screen the way every other
    // played card does — the showcase reads the journal, which is also how a
    // terminal gets to watch it. Explicitly un-Nopeable: the card says it
    // cannot be refuted in any way, and the entry must not offer a window.
    logAction("💥 " + pdot(p) + " draws the <b>Imploding Kitten</b> — takes " + stolen +
              " resources from everyone", "big",
              { actor: p.id, snap: snapBefore, nopeable: false, show: "implode" });
    checkVictory();
    return;
  }

  c.boughtTurn = S.turnCounter;
  p.cards.push(c);
  touch();
  flyKitten(p.id);
  if (S.turnRec && p.id === S.cur) S.turnRec.drawn.push(c);
  logMsg(`<b>${p.name}</b> buys a kitten card.`);
  // Only the buyer learns what it was; everyone sees that a card was bought.
  // Never name the card. This used to reveal a human's purchase to the whole
  // table — harmless when the only human was the one reading the screen, a
  // straight information leak the moment other people are playing. You can see
  // what you drew in your own hand.
  logAction(pdot(p) + " buys a kitten card" +
           ' <span style="opacity:.6">(' + S.deck.length + ' left)</span>', "buy",
            { actor: p.id, snap: snapBefore });
  if (c.key === "vp"){ checkVictory(); }
}

/* Plays a card that resolves on the board rather than at a player: dropped
   onto the board by a human, or chosen outright by a bot. Everything aimed at
   a person is played by dragging the card onto them, which is why there is no
   target picker and no confirmation prompt left in here. */
function playCard(idx, ownerId){
  const p = ownerId === undefined ? cur() : S.players[ownerId];
  const c = p.cards[idx];
  if (!c) return;
  const def = KITTEN[c.key];
  if (def.kind === "vp" || def.kind === "response") return;
  if (c.boughtTurn === S.turnCounter) return;
  if (p.id !== S.cur) return;                  // board plays are on-turn only

  if (def.kind === "target"){
    hint("Drag " + def.name + " onto the player you want to hit.");
  } else if (def.kind === "board"){
    // The two tokens must be named before anyone can react — whether a player
    // may Defuse depends on which hexes are being swapped.
    beginAlterPick(p.id, (a, b) => {
      proposeAction({ type:"card", card:c, idx, actor:p.id, target:null, payload:{ hexes:[a, b] } });
    });
  } else {
    proposeAction({ type:"card", card:c, idx, actor:p.id, target:null, payload:{} });
  }
}

/* The confirmation prompts that used to stand between a click and a card
   — "Nope this turn?", "Play Attack now?" — are gone along with clicking.
   A card is played by dragging it where it should go, so the drop IS the
   confirmation, and nobody watching sees you hesitate over a reaction. */

function beginAlterPick(actorId, onPick){
  S.select = { kind:"alter", actor: actorId, first:null, onPick };
  logMsg(`<b>${S.players[actorId].name}</b> is choosing two number tokens to swap.`);
  render();
}

function favorGuessDialog(c, idx, tid, ownerId){
  pauseTurnTimer("choice");
  const asker = ownerId === undefined ? S.cur : ownerId;
  const want = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  const refresh = () => {
    promptFor(asker);        // every redraw is still this player's dialog
    const total = RES.reduce((s, r) => s + want[r], 0);
    let h = `<p class="sub">Name 3 resource cards. <b>${S.players[tid].name}</b> hands over whichever
             of them they actually hold — you get nothing for the ones they don't have.</p>`;
    for (const r of RES){
      h += `<div class="counter">
              <span class="lbl"><span class="swatch" style="background:${RES_COLOR[r]}"></span>${RES_NAME[r]}</span>
              <button class="sm" onclick="window.__fv('${r}',-1)">−</button>
              <span class="val">${want[r]}</span>
              <button class="sm" onclick="window.__fv('${r}',1)">+</button>
            </div>`;
    }
    h += `<div class="stack">Naming ${total} of 3</div>`;
    openModal("Favor — name 3 cards", h, [
      { label:"Cancel", fn: () => { closeModal(); resumeTurnTimer(); } },
      { label:"Demand", cls:"primary", disabled: total !== 3, fn: () => {
          closeModal();
          resumeTurnTimer();
          proposeAction({ type:"card", card:c, idx, actor:asker, target:tid,
                          payload:{ want:{ ...want } }, quiet: !!c.synthetic });
        } }
    ]);
  };
  window.__fv = (r, d) => {
    const total = RES.reduce((s, x) => s + want[x], 0);
    if (d > 0 && total >= 3) return;
    want[r] = Math.max(0, want[r] + d);
    refresh();
  };
  refresh();
}

/* ── Resolution: apply a card's effect ──────────────────────────────── */
function resolveCard(action){
  const c = action.card;
  const actor = S.players[action.actor];
  const target = action.target === null ? null : S.players[action.target];
  const def = KITTEN[c.key];

  switch (c.key){
    case "skip":
      target.skipTokens++;
      logMsg(`<b>${actor.name}</b> skips <b>${target.name}</b>'s next turn.`);
      break;

    case "explode": {
      let n = 0;
      const gone = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
      for (const r of RES){ gone[r] = target.res[r]; }
      flyCards(target.id, null, gone);          // back to the bank, face up
      for (const r of RES){ n += target.res[r]; S.bank[r] += target.res[r]; target.res[r] = 0; }
      logMsg(`💥 <b>${actor.name}</b> explodes <b>${target.name}</b> — ${n} resources returned to the bank.`);
      break;
    }

    case "attack": {
      const n = Math.min(3, totalRes(target));
      if (n === 0){ logMsg(`<b>${target.name}</b> has nothing to drop.`); break; }
      logMsg(`<b>${target.name}</b> must drop ${n} resource${n === 1 ? "" : "s"}.`);
      discardDialog(target, n, () => { render(); });
      break;
    }

    case "favor": {
      const want = action.payload.want;
      const got = [];
      const handed = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
      for (const r of RES){
        const n = Math.min(want[r], target.res[r]);
        if (n > 0){ target.res[r] -= n; actor.res[r] += n; noteGain(actor, r, n);
                    handed[r] = n; got.push(n + " " + RES_NAME[r]); }
      }
      flyCards(target.id, actor.id, handed);
      const asked = plainRes(want);
      logMsg(got.length
        ? `<b>${target.name}</b> owes <b>${actor.name}</b> a favor: ${got.join(", ")} (asked for ${asked}).`
        : `<b>${target.name}</b> had none of what <b>${actor.name}</b> asked for (${asked}).`);
      // The outcome had no feed line at all, so a Favor that came up empty
      // looked identical to one that was never resolved.
      announce(got.length
        ? pdot(actor) + " takes " + esc(got.join(", ")) + " from " + pdot(target)
        : pdot(target) + " has none of it — " + pdot(actor) + " gets nothing",
        got.length ? "attack" : "info");
      break;
    }

    case "knight":
      beginRobberMove(actor.id, { knight:true, noDefuse: !!action.noDefuse });
      break;

    case "alter": {
      const [ha, hb] = action.payload.hexes;
      const na = hexes[ha].number, nb = hexes[hb].number;
      hexes[ha].number = nb; hexes[hb].number = na;
      logMsg(`The swap takes effect: <b>${na}</b> ⇄ <b>${nb}</b>.`);
      break;
    }

    case "reverse":
      S.dir *= -1;
      S.extraTurn = true;
      logMsg(`<b>${actor.name}</b> plays Reverse — another turn, then order flips to ${S.dir === 1 ? "clockwise" : "counter-clockwise"}.`);
      break;
  }
  checkVictory();
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   ACTION JOURNAL
   ══════════════════════════════════════════════════════════════════════
   Nothing waits for permission any more. Every action resolves at once and
   is recorded here together with a snapshot of the state immediately before
   it. A Nope played later simply rewinds to that snapshot, which is what
   lets a player answer without first announcing that they hold the card.

   Rewinding to an entry also discards whatever happened after it — the Nope
   erases that action and everything that followed from it in the same turn.
   In practice you are answering the newest entry, so this rarely bites.
   ══════════════════════════════════════════════════════════════════════ */

let journalId = 0;

/* Everything a rewind has to put back. Taken before each recorded action. */
function snapAll(){
  return {
    res:     S.players.map(p => Object.assign({}, p.res)),
    bank:    Object.assign({}, S.bank),
    hands:   S.players.map(p => p.cards.slice()),      // refs, so identity survives
    knights: S.players.map(p => p.knights),
    skips:   S.players.map(p => p.skipTokens),
    roads:   S.players.map(p => p.roads),
    setts:   S.players.map(p => p.settlements),
    cities:  S.players.map(p => p.cities),
    vOwner:  vertices.map(v => v.owner),
    vType:   vertices.map(v => v.type),
    eOwner:  edges.map(e => e.owner),
    numbers: hexes.map(h => h.number),
    robber:  S.robber,
    dir:     S.dir,
    extra:   S.extraTurn,
    rolled:  S.rolled ? S.rolled.slice() : null,
    deck:    S.deck.slice(),
    discard: S.discard.slice(),
    lr:      Object.assign({}, S.longestRoad),
    la:      Object.assign({}, S.largestArmy),
    roadLens: (S.roadLens || []).slice(),
    implodeTurn: S.implodeTurn,
    // Copied, not referenced: the queue is shifted through as people pay, and
    // a snapshot holding the live array would be rewound to its own future.
    seven:   S.seven ? { actor: S.seven.actor, jid: S.seven.jid,
                         queue: S.seven.queue.slice() } : null,
    robberDue: (S.robberDue || []).map(m => Object.assign({}, m)),
    rec: S.turnRec ? {
      edges: S.turnRec.edges.slice(),
      verts: S.turnRec.verts.map(v => Object.assign({}, v)),
      drawn: S.turnRec.drawn.slice(),
      knights: S.turnRec.knights,
      gained: Object.assign({}, S.turnRec.gained)
    } : null
  };
}

function restoreAll(s){
  S.players.forEach((p, i) => {
    p.res = Object.assign({}, s.res[i]);
    p.cards = s.hands[i].slice();
    p.knights = s.knights[i];
    p.skipTokens = s.skips[i];
    p.roads = s.roads[i];
    p.settlements = s.setts[i];
    p.cities = s.cities[i];
  });
  S.bank = Object.assign({}, s.bank);
  vertices.forEach((v, i) => { v.owner = s.vOwner[i]; v.type = s.vType[i]; });
  edges.forEach((e, i) => { e.owner = s.eOwner[i]; });
  hexes.forEach((h, i) => { h.number = s.numbers[i]; });
  S.robber = s.robber;
  S.dir = s.dir;
  S.extraTurn = s.extra;
  S.rolled = s.rolled ? s.rolled.slice() : null;
  S.deck = s.deck.slice();
  S.discard = s.discard.slice();
  S.longestRoad = Object.assign({}, s.lr);
  S.largestArmy = Object.assign({}, s.la);
  S.roadLens = s.roadLens.slice();
  S.implodeTurn = s.implodeTurn;
  S.seven = s.seven ? { actor: s.seven.actor, jid: s.seven.jid,
                        queue: s.seven.queue.slice() } : null;
  S.robberDue = (s.robberDue || []).map(m => Object.assign({}, m));
  if (s.rec && S.turnRec){
    S.turnRec.edges = s.rec.edges.slice();
    S.turnRec.verts = s.rec.verts.map(v => Object.assign({}, v));
    S.turnRec.drawn = s.rec.drawn.slice();
    S.turnRec.knights = s.rec.knights;
    S.turnRec.gained = Object.assign({}, s.rec.gained);
  }
}

/* Record an action and show it in the log. Returns the entry. */
function logAction(html, kind, opts){
  opts = opts || {};
  const e = {
    id: ++journalId,
    turn: S.turnCounter,
    actor: opts.actor === undefined ? S.cur : opts.actor,
    target: opts.target === undefined ? null : opts.target,
    kind: kind,
    card: opts.card || null,
    payload: opts.payload || null,
    snap: opts.snap || null,
    turnBack: opts.turnBack || null,
    spent: opts.spent || null,
    redo: opts.redo || null,
    cardOwner: opts.cardOwner === undefined ? null : opts.cardOwner,
    participants: opts.participants ? opts.participants.slice() : null,
    noDefuse: !!opts.noDefuse,
    show: opts.show || null,
    // What this entry took OFF the table, if it is an answer to something.
    // Undoing it puts that back, and this is how the line saying so knows what
    // to name. Only a Nope sets it.
    undid: opts.undid || null,
    // Undoing this must not also end its actor's turn: it was defensive, and
    // played out of turn. Set by the Defuse spent on a seven.
    turnSafe: !!opts.turnSafe,
    nopeable: opts.nopeable !== false,
    noped: false,
    plain: String(html).replace(/<[^>]+>/g, "").trim()
  };
  S.journal.push(e);
  while (S.journal.length > 240) S.journal.shift();
  announce(html, kind, e);
  return e;
}

/* How far back a Nope or a Defuse may still reach. Undoing an entry also
   discards everything after it, so this stays short: far enough that you are
   never rushed, short enough that a Nope cannot rewrite the last five minutes.
   This replaced a timed window between turns, which made people wait and was
   never obvious to anyone. */
const NOPE_REACH = 4;

/* The gap between one turn ending and the next beginning. For three seconds
   the turn that just ended is still answerable and nobody can roll.

   Without it, playing a card and pressing End Turn in the same breath put the
   card out of reach before anyone could lift a finger — "play it and leave"
   was a strategy rather than a risk. Nothing is drawn for it: the table simply
   does not start, which is what a table does while somebody thinks. */
const HANDOVER_MS = 3000;
function handoverActive(){
  return !!(S && S.handoverUntil && Date.now() < S.handoverUntil);
}
function beginHandover(endedTurn){
  if (!S || S.phase === "over") return;
  S.handoverTurn = endedTurn;
  S.handoverUntil = Date.now() + HANDOVER_MS;
  const g = S;
  setTimeout(function(){
    // Whoever is up can roll now, and the bots pick themselves back up.
    if (S !== g || S.phase === "over") return;
    render();
    botTick();
  }, HANDOVER_MS + 20);
}

/* The newest entry still open to an answer — what a prompt's Defuse and Nope
   buttons act on, and what the hand highlights against. */
function openEntry(){
  if (!S || !S.journal.length) return null;
  const e = S.journal[S.journal.length - 1];
  return canNopeEntry(e) ? e : null;
}

/* Every entry currently answerable, newest first. */
function openEntries(){
  if (!S) return [];
  return S.journal.slice(-NOPE_REACH).filter(canNopeEntry).reverse();
}

/* May this entry still be answered?

   Any of the last NOPE_REACH lines of the log, whatever turn they came from.
   Reaching across a turn boundary is deliberate: being Noped ends your turn,
   so without it a Nope could never itself be Noped. Bots move at 3s, which is
   what keeps the reach usable rather than a reflex test. */
function canNopeEntry(e){
  if (!e || e.noped || !e.nopeable || !e.snap) return false;
  if (S.phase === "over" || S.phase.startsWith("setup")) return false;
  // Last call is the end of the turn — plus the three seconds after it, so a
  // card played and immediately walked away from is still answerable. Reaching
  // any further back let people rewrite something from several turns ago,
  // which nobody could see coming.
  if (e.turn !== S.turnCounter &&
      !(handoverActive() && e.turn === S.handoverTurn)) return false;
  const idx = S.journal.findIndex(x => x.id === e.id);
  if (idx < 0) return false;
  if (idx < S.journal.length - NOPE_REACH) return false;   // fallen out of reach
  // An Imploding Kitten seals its own turn for good, not just while it lasts.
  if (e.turn === S.implodeTurn && e.actor === S.implodeBy) return false;
  return true;
}

/* May THIS player Nope this entry?

   A Nope is somebody else's objection to what you did, so normally not your
   own line — except a roll, where a Nope is a reroll and wanting a different
   number of your own is the whole point. You pay a card for it either way. */
function canNopeFor(e, pid){
  if (!canNopeEntry(e)) return false;
  return e.kind === "roll" || e.actor !== pid;
}

/* A robbery: the robber has been moved, and may have taken a card with it.
   Marked in the payload rather than the kind so it still reads as an attack in
   the feed. */
function isRobberEntry(e){ return !!(e && e.payload && e.payload.robber); }

/* Everyone the robber actually landed on — anybody holding a building on that
   hex. They are the ones it costs, whether or not they were the one robbed. */
function settledOnRobbedHex(e, pid){
  if (!isRobberEntry(e)) return false;
  const hx = hexes[e.payload.hex];
  if (!hx) return false;
  return hx.verts.some(v => vertices[v].owner === pid);
}

/* A Defuse only answers an attack that landed on you. */
/* A Defuse only answers an attack that landed on you — and it cannot answer
   another Defuse. Anything at all can be Noped, but "no you" does not stack
   against itself: a Defuse entry carries no `card`, which is what rules it
   out here while leaving it wide open to a Nope. */
function canDefuseEntry(e, pid){
  if (!canNopeEntry(e)) return false;
  // A seven is not a card, but it is aimed at everybody holding more than
  // seven, and a Defuse answers it for exactly one of them. Only while the cut
  // is still owed, and only by somebody it is still owed by.
  //
  // The roller used to be excluded, on the grounds that their own seven was
  // theirs to wear. In practice that meant rolling a seven on a fat hand while
  // holding both cards offered you exactly one of them, for a reason nothing
  // on screen explained — so whichever card you had was the card you played.
  // Either answers it now: a Nope throws the dice again and costs you the
  // number, a Defuse spares your hand alone and lets the rest of the seven
  // stand. That defuseSeven already marks itself turnSafe "so it must not end
  // the turn of a roller who Defused their own seven" says this was always the
  // intended shape.
  if (e.kind === "roll")
    return e.show === "seven" && owesSevenCut(pid);
  // The robber landing on you is the other half of a seven, and the half that
  // keeps costing after the roll is forgotten. Anybody settled on that hex may
  // answer it — not only whoever the card came off — and only once between
  // them, which `answered` enforces.
  if (isRobberEntry(e))
    return !e.noDefuse && !e.answered && e.actor !== pid && settledOnRobbedHex(e, pid);
  if (!e.card) return false;           // a reaction, not a card aimed at anyone
  if (e.actor === pid) return false;
  if (e.card.key === "alter"){
    if (e.participants && e.participants.includes(pid)) return false;
    return (e.payload && e.payload.hexes || []).some(hid =>
      hexes[hid].verts.some(v => vertices[v].owner === pid));
  }
  return TARGETED.has(e.card.key) && e.target === pid;
}

function spendCard(p, key){
  const i = p.cards.findIndex(c => c.key === key);
  if (i < 0) return false;
  S.discard.push(p.cards.splice(i, 1)[0]);
  touch();
  return true;
}

/* ── Answering from inside a prompt ───────────────────────────────
   A card that forces a window open used to make you pay first and react
   afterwards — hand over the Favor, discard for the Attack, and only then go
   hunting in the log for a line to drop a Defuse on. By then the window had
   usually closed. The prompt now carries the answer itself.

   These buttons only appear when the player is genuinely holding the card, so
   a hand with nothing in it looks exactly like a hand that is holding back.
   A modal covers the screen, which is what makes them necessary: no card can
   be dragged anywhere while one is open. */
/* `jid` names the entry the dialog is answering. Left out, it is the newest
   line in the log, which is right for a card that has just landed on you.
   A seven names its own roll instead: the queue takes several answers to walk
   through, and by the time it reaches the third player the roll is no longer
   the newest thing said — but it is still the thing taking their cards. */
function promptReactions(pid, jid){
  const out = [];
  if (!S) return out;
  const e = jid === undefined ? openEntry() : S.journal.find(x => x.id === jid);
  if (!e || !canNopeEntry(e)) return out;
  const p = S.players[pid];
  if (!p) return out;
  const roll = e.kind === "roll";
  const fresh = c => c.boughtTurn !== S.turnCounter || playableWhenDrawn(c);
  if (p.cards.some(c => c.key === "defuse" && fresh(c)) && canDefuseEntry(e, pid))
    out.push({ label: roll ? "🛡 Defuse the 7" : "🛡 Defuse it", cls:"react",
               fn: () => { closeModal(); defuseEntry(e.id, pid); } });
  if (p.cards.some(c => c.key === "nope" && fresh(c)) && canNopeFor(e, pid))
    out.push({ label: roll ? "🚫 Nope it — reroll" : "🚫 Nope it", cls:"reactno",
               fn: () => { closeModal(); nopeEntry(e.id, pid); } });
  return out;
}

function reactNoteHTML(e){
  const roll = !!(e && e.kind === "roll");
  return `<div class="reactnote">You are holding an answer to this — spend it from
          here, or fold the dialog away and drop it on the log yourself.
          ${roll ? `A Nope throws the dice again and the turn carries on; a Defuse
                    spares your hand alone and lets the rest of the seven stand.` : ""}
          The window closes a few lines further down the log.</div>`;
}

/* No card opens a window asking whether you would like to answer it — not a
   Knight, not a Skip, not an Exploding Kitten. Everything such a window
   offered is on the board already: the card turns over in the middle of the
   screen, the line it wrote lights up in the log with a Defuse badge on it,
   and the card in your hand wakes up with an "answer" pip. What the window
   added was a modal standing on top of the log you wanted to drop onto.

   The forced dialogs that remain are the ones that take something from you
   before play can go on — a discard for a seven or an Attack. Those are a
   payment, not an offer. */

/* ── Nope an entry ───────────────────────────────────────────────────── */
function nopeEntry(id, noperId){
  const idx = S.journal.findIndex(e => e.id === id);
  if (idx < 0) return false;
  const e = S.journal[idx];
  if (!canNopeEntry(e)) return false;
  const noper = S.players[noperId];
  if (!noper.cards.some(c => c.key === "nope")) return false;

  const label = e.plain;
  // Your own roll is the one line you are allowed to Nope, so the log has to
  // read for that case too — "Red Nopes Red rolls 7" is nonsense.
  const selfRoll = noperId === e.actor && e.kind === "roll";
  // Nor does nesting one Nope's text inside the next: a counter-Nope came out
  // as "Blue Nopes Red Nopes Blue's turn", which nobody can read at a glance —
  // least of all the player who has just had their own Nope taken off them.
  //
  // A Defuse is journalled as "defend" too, and this used to call every one of
  // them a Nope: answering somebody's Defuse read "Orange Nopes Blue's Nope",
  // naming a card Blue had not played. What was spent on the entry says which
  // it actually was.
  const answeredCard = e.kind === "defend"
        ? (e.spent && e.spent.key === "defuse" ? "Defuse" : "Nope")
        : null;
  const answering = answeredCard
        ? pdot(S.players[e.actor]) + "'s <b>" + answeredCard + "</b>"
        : esc(label);
  let reroll = false;
