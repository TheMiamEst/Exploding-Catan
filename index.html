    // centre each row on the axis so the board comes out symmetric
    const qmin = Math.round(-(n - 1) / 2 - r / 2);
    for (let k = 0; k < n; k++) out.push({ q: qmin + k, r });
  });
  return out;
}

/* ══════════════════════════════════════════════════════════════════════
   BOARD GEOMETRY
   ══════════════════════════════════════════════════════════════════════ */

let hexes = [], vertices = [], edges = [];

/* A quarter turn, for a board that asks for one. Applied to the lattice rather
   than to the finished picture: hex centres and hex corners both come out of
   here already turned, so ports, roads, the deck's parking spot and the drag
   hit-testing are all computed from turned coordinates and none of them has to
   know about it. Turning a pointy-top tiling a quarter turn makes it flat-top,
   which is the only visible difference besides the shape of the whole board. */
function turnPt(x, y){
  return BOARDSET.turned ? { x: -y, y: x } : { x: x, y: y };
}
/* Degrees to add to anything measured from a hex centre. */
function turnDeg(){ return BOARDSET.turned ? 90 : 0; }

function axialCenter(q, r){
  return turnPt(HEX_SIZE * Math.sqrt(3) * (q + r/2), HEX_SIZE * 1.5 * r);
}
function cornerPoints(cx, cy){
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 180 * (60 * i - 30 + turnDeg());
    pts.push({ x: cx + HEX_SIZE * Math.cos(a), y: cy + HEX_SIZE * Math.sin(a) });
  }
  return pts;
}

function buildGeometry(){
  hexes = []; vertices = []; edges = [];
  const vKey = new Map(), eKey = new Map();

  for (const a of hexLayout(BOARDSET)){
    const c = axialCenter(a.q, a.r);
    hexes.push({ id: hexes.length, q: a.q, r: a.r, x: c.x, y: c.y,
                 terrain: null, number: null, verts: [], edges: [] });
  }

  for (const h of hexes){
    const pts = cornerPoints(h.x, h.y);
    const ids = pts.map(p => {
      // Distinct corners sit ~54px apart, so 1px quantization safely dedupes
      // without ever merging two genuinely different vertices.
      const k = Math.round(p.x) + "," + Math.round(p.y);
      if (!vKey.has(k)){
        vKey.set(k, vertices.length);
        vertices.push({ id: vertices.length, x: p.x, y: p.y, hexes: [], edges: [], adj: [],
                        owner: null, type: null, port: null });
      }
      return vKey.get(k);
    });
    h.verts = ids;
    for (const vid of ids) vertices[vid].hexes.push(h.id);

    for (let i = 0; i < 6; i++){
      const a = ids[i], b = ids[(i + 1) % 6];
      const k = Math.min(a, b) + "-" + Math.max(a, b);
      if (!eKey.has(k)){
        eKey.set(k, edges.length);
        edges.push({ id: edges.length, v: [a, b], hexes: [], owner: null, port: null });
      }
      const eid = eKey.get(k);
      edges[eid].hexes.push(h.id);
      h.edges.push(eid);
      if (!vertices[a].edges.includes(eid)) vertices[a].edges.push(eid);
      if (!vertices[b].edges.includes(eid)) vertices[b].edges.push(eid);
      if (!vertices[a].adj.includes(b)) vertices[a].adj.push(b);
      if (!vertices[b].adj.includes(a)) vertices[b].adj.push(a);
    }
  }
}

function placePorts(){
  // Coastal edges touch exactly one hex. Spread 9 ports around the ring.
  const coast = edges.filter(e => e.hexes.length === 1);
  coast.sort((a, b) => {
    const am = midOf(a), bm = midOf(b);
    return Math.atan2(am.y, am.x) - Math.atan2(bm.y, bm.x);
  });
  const n = BOARDSET.ports;
  const kinds = ["wood","brick","sheep","wheat","ore"];
  while (kinds.length < n) kinds.push("3:1");          // the rest are generic
  shuffle(kinds);
  // Spread them as evenly as the coastline allows.
  for (let i = 0; i < n; i++){
    const e = coast[Math.round(i * coast.length / n) % coast.length];
    e.port = kinds[i];
    for (const vid of e.v) vertices[vid].port = kinds[i];
  }
}
function midOf(e){
  const a = vertices[e.v[0]], b = vertices[e.v[1]];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function dealTerrain(){
  // Reshuffle until no two red numbers (6 / 8) sit on adjacent hexes. With six
  // reds on the extension board this can take longer, so allow more attempts
  // and fall through to the last shuffle rather than looping forever.
  for (let attempt = 0; attempt < 3000; attempt++){
    const terr = shuffle(TERRAIN.slice());
    const nums = shuffle(NUMBERS.slice());
    let n = 0;
    hexes.forEach((h, i) => {
      h.terrain = terr[i];
      h.number  = terr[i] === "desert" ? null : nums[n++];
    });
    if (!hasAdjacentReds()) return;
  }
}
function hasAdjacentReds(){
  for (const h of hexes){
    if (h.number !== 6 && h.number !== 8) continue;
    for (const o of hexes){
      if (o.id === h.id) continue;
      if (o.number !== 6 && o.number !== 8) continue;
      const shared = h.verts.filter(v => o.verts.includes(v)).length;
      if (shared >= 2) return true;   // sharing an edge = adjacent
    }
  }
  return false;
}

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ══════════════════════════════════════════════════════════════════════
   AGENTS
   ══════════════════════════════════════════════════════════════════════
   Seats can be driven by a bot instead of the UI. ai.js registers agents
   here; every decision that would normally open a modal checks for one
   first and asks it instead. With no ai.js present this is inert, and the
   only seats that move are the ones a person is driving.
   ══════════════════════════════════════════════════════════════════════ */
window.AGENTS = window.AGENTS || {};
function agentOf(pid){ return window.AGENTS ? (window.AGENTS[pid] || null) : null; }

/* Online, a browser that is not the host decides nothing: it says what the
   player did and waits to be told what came of it. Returns true when the
   caller should stop here. Offline this is always false and costs nothing. */
function netSend(type, args){
  return !!(window.NET && NET.sendIntent && NET.sendIntent(type, args));
}
function isBot(pid){ return !!agentOf(pid); }
function anyBots(){ return S && S.players.some(p => isBot(p.id)); }

/* Which seat the bottom bar belongs to. In a bot game that is always the
   human's own seat — never the current player, or a bot's hand would be on
   screen (and clickable) whenever a prompt handed us control mid-bot-turn. */
function viewSeat(){
  // Online, the bottom bar is always your own seat, whoever is playing.
  if (window.NET && NET.isOnline && NET.isOnline() && NET.mySeat() !== null) return NET.mySeat();
  for (const p of S.players) if (!isBot(p.id)) return p.id;
  // Nobody at this screen at all — only reachable by turning the bots off from
  // the console, which leaves the board driving itself. Follow the turn.
  return S.cur;
}
function viewPlayer(){ return S.players[viewSeat()]; }

/* True when the UI must ignore board clicks because the active seat is a bot.
   Exceptions: anything driven by proxy (see drivenByProxy), and prompts a human owns —
   for example the robber after we Defused a bot's knight. */
/* True while something other than the person sitting at this screen is driving
   the game: a bot taking its turn, or the host replaying a guest's action.

   Every "is it your turn" guard has to stand aside for this, because those
   guards are about the human here — not about who is allowed to act. The two
   cases used to be tested separately and in the wrong order, which cost a bug
   twice over: first remote players could not touch the board, then bots could
   not move once the game was online. One question, asked first, once. */
function drivenByProxy(){
  return !!(window.__botActing || window.__netApplying);
}

function uiBlocked(){
  if (drivenByProxy()) return false;
  if (window.NET && NET.isOnline && NET.isOnline()){
    // A prompt handed to you is yours to answer even on somebody else's turn.
    if (S.select && S.select.actor !== undefined) return S.select.actor !== viewSeat();
    return S.cur !== viewSeat();
  }
  if (!anyBots()) return false;
  if (S.select && S.select.actor !== undefined && !isBot(S.select.actor)) return false;
  return isBot(S.cur);
}
/* ai.js overrides this to drive a bot seat forward. */
function botTick(){}

/* ══════════════════════════════════════════════════════════════════════
   GAME STATE
   ══════════════════════════════════════════════════════════════════════ */

let S = null;

function newGame(numPlayers, mode, boardKey, winPoints, turnSeconds){
  BOARDSET = boardFor(numPlayers, boardKey);
  HEX_SIZE = BOARDSET.size;
  NUMBERS  = BOARDSET.numbers;
  TERRAIN  = BOARDSET.terrain;
  BANK_PER_RES = BOARDSET.bank;
  buildGeometry();
  dealTerrain();
  placePorts();

  const deck = [];
  let knightN = 0;
  for (const key in KITTEN){
    for (let i = 0; i < KITTEN[key].count; i++){
      const c = { key, id: deck.length, flavor: null };
      if (key === "knight") c.flavor = KNIGHT_FLAVOR[Math.floor(knightN++ / 2)];
      deck.push(c);
    }
  }
  shuffle(deck);

  const players = [];
  for (let i = 0; i < numPlayers; i++){
    players.push({
      id: i, name: PLAYER_NAMES[i], color: PLAYER_COLORS[i], avatar: "",
      res: { wood:0, brick:0, sheep:0, wheat:0, ore:0 },
      cards: [], knights: 0, skipTokens: 0,
      roads: 0, settlements: 0, cities: 0
    });
  }
  dealAvatars(players);

  const desert = hexes.find(h => h.terrain === "desert");   // either one, on the large board
  const first = Math.floor(Math.random() * numPlayers);   // nobody always leads

  S = {
    players, deck, discard: [],
    bank: { wood:BANK_PER_RES, brick:BANK_PER_RES, sheep:BANK_PER_RES, wheat:BANK_PER_RES, ore:BANK_PER_RES },
    robber: desert.id,
    cur: first, dir: 1, turnCounter: 0, firstPlayer: first,
    phase: "setup1",          // setup1 | setup2 | roll | main | over
    setupNeed: "settlement",
    setupLastVertex: null,
    setupOrder: buildSetupOrder(numPlayers, first),
    setupIdx: 0,
    rolled: null,
    rollId: 0,                // bumped per throw, so every screen tumbles it once
    extraTurn: false,
    roadLens: S_zeroLens(numPlayers),
    longestRoad: { owner:null, len:0 },
    largestArmy: { owner:null, n:0 },
    mode: MODES[mode] ? mode : "normal",   // normal | fast | fastplus
    board: BOARDSET === BOARD.large ? "large" : "small",
    winPoints: Math.min(20, Math.max(3, Number(winPoints) || 10)),
    turnSeconds: Number.isInteger(Number(turnSeconds)) && Number(turnSeconds) >= 20 && Number(turnSeconds) <= 100
      ? Number(turnSeconds) : 0,
    handoverUntil: 0,         // wall clock: the turn that just ended is still answerable
    handoverTurn: -1,         // which turn that was
    seven: null,              // {actor, queue:[pid]} — a 7 still being paid for
    robberDue: [],            // robber moves owed behind the one in progress
    select: null,             // {kind, ...} forced board interaction
    armed: null,              // {kind, id} spot awaiting a confirming second click
    diceLog: [],              // every roll this game, for the history panel
    pending: null,            // response-window stack
    turnRec: null,            // what the active player gained this turn
    turnTimerUntil: 0,
    turnTimerRemaining: 0,
    turnTimerPaused: false,
    turnTimerPauseReason: null,
    zoom: 1, panX: 0, panY: 0,   // board view
    journal: [],              // every action, with the state that preceded it
    revealed: false,          // hands are face up once somebody has won
    unstoppable: null,        // a win the table had no legal way to deny
    sweeping: false,          // re-entrancy guard for the turn-start win sweep
    implodeTurn: -1,          // turn number made Nope-proof by an Imploding Kitten
    implodeBy: null,          // who drew it, so the seal outlives their turn
    implodeUntil: 0,          // wall-clock deadline for that turn
    feed: [],                 // the on-screen event list, so it can be sent online
    chat: [],                 // what has been said, for the same reason
    emotes: [],               // emoji thrown recently — see syncEmotes
    fx: [],                   // cards in flight — see checkFlights
    msgId: 0,                 // one counter for all three: they are all messages
    rewinds: 0,               // bumped whenever a Nope or Defuse rewinds the board
    log: [],
    winner: null
  };
  S.turnRec = freshTurnRecord();
  closeAllPanels();
  forgetModalFold();
  clearShowcase();
  lastShowcased = -1;
  lastRollShown = 0;
  boardWatch = null;
  clearFeed();
  clearChat();
  clearFx();
  if (S.mode === "fastplus") dealOpeningKittens();
  logMsg("New game — " + numPlayers + " players. Deck: 54 kitten cards.");
  if (S.mode !== "normal")
    logMsg(`<b>${MODES[S.mode].name}</b> — ${MODES[S.mode].blurb}`);
  logMsg("<b>" + S.players[first].name + "</b> goes first.");
  logMsg("Setup: place your first settlement.");
  render();
}

/* Fast track + opens every hand with one kitten card. These are EXTRA copies
   run off for the occasion rather than dealt from the 54, so the deck still
   holds exactly what it always did and nobody has been quietly denied a card
   somebody else is holding.

   Drawn against the deck's own distribution, so a Defuse stays six times as
   likely as an Imploding Kitten would have been — except that the Imploding
   Kitten is not in the pool at all. It fires the instant it is drawn, and
   handing it out at setup would settle the game before anyone had rolled.

   boughtTurn is -1, not 0: these were not bought on turn zero, they were
   always there, and a card bought this turn cannot be played this turn. */
function dealOpeningKittens(){
  const pool = [];
  for (const key in KITTEN){
    if (key === "implode") continue;
    for (let i = 0; i < KITTEN[key].count; i++) pool.push(key);
  }
  if (!pool.length) return;
  let extraId = 10000;
  for (const p of S.players){
    const key = pool[Math.floor(Math.random() * pool.length)];
    const c = { key: key, id: extraId++, flavor: null, boughtTurn: -1 };
    if (key === "knight")
      c.flavor = KNIGHT_FLAVOR[Math.floor(Math.random() * KNIGHT_FLAVOR.length)];
    p.cards.push(c);
  }
  logMsg("Fast track + — everybody opens holding one kitten card.");
}

function S_zeroLens(n){ const a = []; for (let i = 0; i < n; i++) a.push(0); return a; }

function buildSetupOrder(n, start){
  const fwd = [];
  for (let i = 0; i < n; i++) fwd.push((start + i) % n);
  return fwd.concat(fwd.slice().reverse());   // snake order from the first player
}

function cur(){ return S.players[S.cur]; }

/* ── Turn record (used by Nope-the-turn) ─────────────────────────────────
   A Noped turn is not rewound to a snapshot — everything the player gained
   that turn is DELETED FROM PLAY. Drawn kitten cards do not go back into the
   deck, a knight played that turn stops counting toward Largest Army, and
   roads laid that turn are lifted (so a Longest Road earned that turn is
   lost with them). Resources spent are still never refunded.

   Only the active player's own record is touched, so reaction cards other
   players spent answering the turn stay spent.                            */
function freshTurnRecord(){
  return {
    edges: [],                       // edge ids built this turn
    verts: [],                       // {vid, prevType} — null prevType = new settlement
    drawn: [],                       // kitten card objects drawn this turn
    knights: 0,                      // knights played this turn
    gained: { wood:0, brick:0, sheep:0, wheat:0, ore:0 }   // excl. Imploding Kitten
  };
}

/* Record resources flowing to the active player so a Nope can strip them.
   The Imploding Kitten is explicitly immune, so its haul is never recorded. */
function noteGain(p, r, n){
  if (!S.turnRec || !p || p.id !== S.cur || n <= 0) return;
  S.turnRec.gained[r] += n;
}

/* Where this turn was standing before it started.

   Every recorded action carries the state that preceded it, so the earliest
   entry of the turn carries exactly that picture. Anything un-Nopeable draws a
   line under itself and moves the mark forward: the Imploding Kitten says in
   as many words that not even a cancelled turn undoes it, so the rewind point
   lands just after it rather than back over it. */
function turnStartSnap(){
  let snap = null;
  for (const e of S.journal){
    if (e.turn !== S.turnCounter) continue;
    if (e.nopeable === false){ snap = null; continue; }   // begin again after it
    if (!snap && e.snap) snap = e.snap;
  }
  return snap;
}

/* Seats whose resources this turn is NOT responsible for: somebody else threw
   a card during it. An Attack aimed at Green by Blue while Red is playing is
   Blue's doing and survives Red's turn being cancelled, so neither of them is
   rewound. Entries with nobody on the other end — a Nope, a roll — move
   nothing between players and disqualify nobody, which matters: whoever Nopes
   the turn is very often the player who was exploded during it. */
function notThisTurnsDoing(ownerId){
  const out = {};
  for (const e of S.journal){
    if (e.turn !== S.turnCounter) continue;
    if (e.actor === ownerId) continue;
    if (e.target === null || e.target === undefined) continue;
    out[e.actor] = 1;
    out[e.target] = 1;
  }
  return out;
}

function wipeNopedTurn(){
  const p = cur(), rec = S.turnRec;
  const lost = [];

  /* ── what the turn did to everybody ELSE ──
     A cancelled turn used to strip only what its owner GAINED, and everything
     it had done to the rest of the table stood: Nope somebody's turn after
     they threw an Exploding Kitten and the victim's hand was still sitting in
     the bank. The turn is cancelled, so the damage is cancelled with it.

     Resources and skip tokens only — those are the only things one player's
     turn takes from another. Kitten hands are deliberately left alone: a Nope
     or a Defuse somebody spent answering this turn stays spent, which is the
     rule everywhere else.

     Nothing is conjured. Whatever a victim gets back comes out of the bank,
     and the owner's own gains go into it a few lines further down — the two
     halves of the same sum, because the bank is where an exploded hand went. */
  const start = turnStartSnap();
  const skip = notThisTurnsDoing(p.id);
  const given = [];
  if (start){
    S.players.forEach((q, i) => {
      if (i === p.id || skip[i]) return;
      let back = 0;
      for (const r of RES){
        const d = start.res[i][r] - q.res[r];
        if (!d) continue;
        q.res[r] = start.res[i][r];
        S.bank[r] -= d;
        if (d > 0) back += d;
      }
      q.skipTokens = start.skips[i];
      if (back > 0) given.push(q.name + " " + back);
    });
    // A knight moved it, and the knight is being undone.
    S.robber = start.robber;
    // A cancelled Reverse must not leave its direction or bonus turn behind.
    S.dir = start.dir;
    S.extraTurn = start.extra;
  }

  for (const eid of rec.edges){ edges[eid].owner = null; p.roads--; }
  if (rec.edges.length) lost.push(rec.edges.length + " road" + (rec.edges.length === 1 ? "" : "s"));

  // Undo newest-first so a settlement→city upgrade unwinds before the build.
  for (let i = rec.verts.length - 1; i >= 0; i--){
    const { vid, prevType } = rec.verts[i];
    if (prevType === null){ vertices[vid].owner = null; vertices[vid].type = null; p.settlements--; }
    else { vertices[vid].type = "settlement"; p.cities--; p.settlements++; }
  }
  if (rec.verts.length) lost.push(rec.verts.length + " building" + (rec.verts.length === 1 ? "" : "s"));

  // Cards drawn this turn are destroyed, not returned to the deck.
  let vp = 0;
  for (const c of rec.drawn){
    const i = p.cards.indexOf(c);
    if (i >= 0) p.cards.splice(i, 1);
    if (c.key === "vp") vp++;
  }
  if (rec.drawn.length) lost.push(rec.drawn.length + " kitten card" + (rec.drawn.length === 1 ? "" : "s")
                                  + (vp ? " (incl. " + vp + " Feral)" : ""));

  if (rec.knights){ p.knights -= rec.knights; lost.push(rec.knights + " knight" + (rec.knights === 1 ? "" : "s")); }

  // Resources collected this turn go back to the bank.
  let res = 0;
  for (const r of RES){
    const n = Math.min(rec.gained[r], p.res[r]);
    if (n > 0){ p.res[r] -= n; S.bank[r] += n; res += n; }
  }
  if (res) lost.push(res + " resource" + (res === 1 ? "" : "s"));

  updateLongestRoad();
  updateLargestArmy();
  announce("🚫 " + pdot(p) + "'s turn is <b>cancelled</b>" +
           (lost.length ? " — lost " + lost.join(", ") : "") +
           (given.length ? "<br><span style='opacity:.85'>everything it took is handed "
                           + "back</span>" : ""), "big", 5200);
  logMsg(`<span style="color:#d98b4b"><b>${p.name}</b>'s turn is cancelled — `
       + (lost.length ? "lost " + lost.join(", ") : "nothing to lose")
       + `. Resources already spent are gone too.</span>`);
  if (given.length)
    logMsg(`<span style="color:#d98b4b">Cards the turn took are handed back: ` +
           given.map(esc).join(", ") + `.</span>`);
}

/* ══════════════════════════════════════════════════════════════════════
   RESOURCES / BANK
   ══════════════════════════════════════════════════════════════════════ */

function totalRes(p){ return RES.reduce((s, r) => s + p.res[r], 0); }

/* Ask for a repaint, once, however many times you ask.

   Numbers move in a dozen places and not every one of them repainted. A bot
   buying a kitten card spent three resources and gained a card without the
   board hearing about it, so the seat cards sat on figures that were minutes
   old until something else forced a redraw — which was usually the end of the
   turn. That is the "numbers only update when a turn ends" of it.

   Rather than hunt every call site and hope, the four things that actually
   move resources and cards ask for a repaint themselves. Coalesced through a
   microtask, so a production payout of twenty gives costs exactly one redraw,
   and it lands before the browser has painted anything — the number changes in
   the same breath as the thing that changed it. */
let repaintQueued = false;
function touch(){
  if (repaintQueued || !S) return;
  repaintQueued = true;
  Promise.resolve().then(function(){
    repaintQueued = false;
    if (S) render();
  });
}

function give(p, r, n){
  const actual = Math.min(n, S.bank[r]);
  p.res[r] += actual; S.bank[r] -= actual;
  noteGain(p, r, actual);
  if (actual) touch();
  return actual;
}
function take(p, r, n){
  const actual = Math.min(n, p.res[r]);
  p.res[r] -= actual; S.bank[r] += actual;
  if (actual) touch();
  return actual;
}
function canAfford(p, cost){ return Object.keys(cost).every(r => p.res[r] >= cost[r]); }
function pay(p, cost){ for (const r in cost) take(p, r, cost[r]); }

/* ══════════════════════════════════════════════════════════════════════
   VICTORY POINTS / LONGEST ROAD / LARGEST ARMY
   ══════════════════════════════════════════════════════════════════════ */

function vpCards(p){ return p.cards.filter(c => c.key === "vp").length; }
function publicVP(p){
  return p.settlements + p.cities * 2
       + (S.longestRoad.owner === p.id ? 2 : 0)
       + (S.largestArmy.owner === p.id ? 2 : 0);
}
function totalVP(p){ return publicVP(p) + vpCards(p); }

/* Longest continuous road. A path may END on a vertex holding an opponent's
   building but may not pass THROUGH it. */
function longestRoadFor(pid){
  let best = 0;
  const walk = (at, used, isStart) => {
    const v = vertices[at];
    if (!isStart && v.owner !== null && v.owner !== pid) return 0;  // broken here
    let local = 0;
    for (const eid of v.edges){
      const e = edges[eid];
      if (e.owner !== pid || used.has(eid)) continue;
      used.add(eid);
      const other = e.v[0] === at ? e.v[1] : e.v[0];
      local = Math.max(local, 1 + walk(other, used, false));
      used.delete(eid);
    }
    return local;
  };
  for (const v of vertices){
    if (!v.edges.some(eid => edges[eid].owner === pid)) continue;
    best = Math.max(best, walk(v.id, new Set(), true));
  }
  return best;
}

function updateLongestRoad(){
  let bestPid = S.longestRoad.owner, bestLen = S.longestRoad.owner === null ? 4 : S.longestRoad.len;
  const lens = S.players.map(p => longestRoadFor(p.id));
  // The current holder keeps it on ties; a challenger must strictly exceed.
  if (S.longestRoad.owner !== null){
    bestLen = lens[S.longestRoad.owner];
    bestPid = S.longestRoad.owner;
    if (bestLen < 5){ bestPid = null; bestLen = 4; }
  }
  for (const p of S.players){
    if (lens[p.id] >= 5 && lens[p.id] > bestLen){ bestLen = lens[p.id]; bestPid = p.id; }
  }
  if (bestPid !== S.longestRoad.owner && bestPid !== null)
  {
    logMsg(`<b>${S.players[bestPid].name}</b> takes Longest Road (${bestLen}).`);
    announce(pdot(S.players[bestPid]) + " takes <b>Longest Road</b> (" + bestLen + ")", "big");
  }
  S.roadLens = lens;              // cached so the player strip need not recompute
  S.longestRoad = { owner: bestPid, len: bestPid === null ? 0 : lens[bestPid] };
}

function updateLargestArmy(){
  let bestPid = S.largestArmy.owner;
  let bestN = S.largestArmy.owner === null ? 2 : S.players[S.largestArmy.owner].knights;
  // The holder loses the card if a cancelled turn drops them under three.
  if (bestPid !== null && bestN < 3){ bestPid = null; bestN = 2; }
  for (const p of S.players){
    if (p.knights >= 3 && p.knights > bestN){ bestN = p.knights; bestPid = p.id; }
  }
  if (bestPid !== S.largestArmy.owner && bestPid !== null)
  {
    logMsg(`<b>${S.players[bestPid].name}</b> takes Largest Army (${bestN} knights).`);
    announce(pdot(S.players[bestPid]) + " takes <b>Largest Army</b> (" + bestN + ")", "big");
  }
  S.largestArmy = { owner: bestPid, n: bestN };
}

/* ══════════════════════════════════════════════════════════════════════
   BUILD LEGALITY
   ══════════════════════════════════════════════════════════════════════ */

function canPlaceSettlement(vid, pid, setup){
  const v = vertices[vid];
  if (v.owner !== null) return false;
  for (const a of v.adj) if (vertices[a].owner !== null) return false;   // distance rule
  if (setup) return true;
  return v.edges.some(eid => edges[eid].owner === pid);                  // must touch own road
}
function canPlaceRoad(eid, pid, setupVertex){
  const e = edges[eid];
  if (e.owner !== null) return false;
  if (setupVertex !== null && setupVertex !== undefined) return e.v.includes(setupVertex);
  return e.v.some(vid => {
    const v = vertices[vid];
    if (v.owner === pid) return true;
    if (v.owner !== null) return false;   // opponent building blocks pass-through
    return v.edges.some(x => edges[x].owner === pid);
  });
}
function canPlaceCity(vid, pid){
  const v = vertices[vid];
  return v.owner === pid && v.type === "settlement";
}

/* ══════════════════════════════════════════════════════════════════════
   TRADE RATES
   ══════════════════════════════════════════════════════════════════════ */

function tradeRate(p, r){
  let rate = 4;
  for (const v of vertices){
    if (v.owner !== p.id || !v.port) continue;
    if (v.port === "3:1") rate = Math.min(rate, 3);
    else if (v.port === r) rate = Math.min(rate, 2);
  }
  return rate;
}

/* ══════════════════════════════════════════════════════════════════════
   RENDERING
   ══════════════════════════════════════════════════════════════════════ */

/* No game in progress. The page used to open on a New Game dialog with no way
   out of it, so you had to start a local game before you could even reach the
   Online button — and that local game, bots and all, then went on running
   underneath the online session. */
function renderIdle(){
  const strip = document.getElementById("players"); if (strip) strip.innerHTML = "";
  const svg = document.getElementById("board");     if (svg) svg.innerHTML = "";
  const dk  = document.getElementById("deckWrap");  if (dk) dk.innerHTML = "";
  const dc  = document.getElementById("diceWrap");  if (dc) dc.innerHTML = "";
  const bot = document.getElementById("bottom");
  if (bot) bot.innerHTML = '<div class="bside"></div><div class="bcentre">' +
    '<span class="emptyhand">No game running.</span></div><div class="bside right"></div>';
  hint(null);
  drawModeTag();
  drawTurnOrder();
  drawChat();
  closeEmojiTray();
  showIdle(true);
}

/* Put the table away and go back to the opening screen. */
function backToIdle(){
  if (window.AI && window.AI.stop) window.AI.stop();
  window.AGENTS = {};
  clearImplodeClock();
  S = null;
  closeAllPanels();
  clearFeed();
  clearChat();
  clearFx();
  renderIdle();
}

function showIdle(on){
  let el = document.getElementById("idleCard");
  if (!on){ if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement("div");
  el.id = "idleCard";
  el.innerHTML = '<h2>Exploding <span>Catan</span></h2>' +
    '<p>Catan with the development deck torn out and 54 kitten cards put in its place.</p>' +
    '<div class="pick">' +
      '<button class="primary" onclick="newGameDialog()">New game here</button>' +
      '<button onclick="onlineDialog()">Play online</button>' +
      '<button onclick="showRules()">Rules</button>' +
    '</div>';
  const area = document.getElementById("boardArea");
  if (area) area.appendChild(el);
}

/* A banner, not a dialog: the state arriving from the host would close a
   dialog on the next update, and this needs to stay put until it is fixed. */
function showVersionWarning(hostVer){
  let el = document.getElementById("verWarn");
  if (!hostVer || hostVer === GAME_VERSION){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement("div");
    el.id = "verWarn";
    const area = document.getElementById("boardArea");
    if (area) area.appendChild(el);
  }
  el.innerHTML = "⚠ You are running build <b>" + esc(GAME_VERSION) + "</b> but the host is on <b>" +
                 esc(hostVer) + "</b>. Reload the page — until you do, the game will " +
                 "behave strangely in ways that are not its fault.";
}

function render(){
  if (!S){ renderIdle(); return; }
  showIdle(false);
  // Before the board is drawn, not after: a piece that has just arrived is
  // taken off this very pass so the animation can bring it in, rather than
  // being drawn and then hidden by a second render a moment later.
  checkBoardChanges();
  // Before the strip is drawn, not after: a throw that has just arrived wants
  // to be in this repaint rather than to cause another one.
  syncEmotes();
  drawBoard(); drawPlayers(); drawBottom(); drawDeck(); drawDice(); drawHint();
  drawModeTag(); drawChat(); drawTurnOrder();
  refreshFeedMarks();
  checkStalePanels();
  checkShowcase();
  checkFlights();
  // A repaint in the middle of a drag (a bot moving, say) wipes the outlines
  // showing where the card may go. Put them straight back.
  if (dragCard) markDropTargets();
  placeDeck();
  placeFeed();
  // Replacing the board's markup can leave measurements momentarily stale, so
  // always settle these again on the next frame.
  requestAnimationFrame(function(){ placeDeck(); placeFeed(); });
  // Online: anything that redrew the host's screen is news. Debounced, so the
  // burst of renders one action causes goes out as a single state.
  if (window.NET && NET.publishSoon) NET.publishSoon();
}

const PORT_OUT = 1.075;     // how far outside the ring a port marker sits
function portPos(e){
  const m = midOf(e);
  return { x: m.x * PORT_OUT, y: m.y * PORT_OUT };
}

function drawBoard(){
  const svg = document.getElementById("board");
  // Bounds must include the port markers and their labels, not just the
  // hex ring — otherwise the outermost ports get clipped.
  const xs = vertices.map(v => v.x), ys = vertices.map(v => v.y);
  for (const e of edges){
    if (!e.port) continue;
    const p = portPos(e);
    xs.push(p.x - 15, p.x + 15);
    ys.push(p.y - 15, p.y + 15);
  }
  const pad = 16;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  // Zoom shrinks the viewBox about the centre; pan slides that window.
  const z = S.zoom || 1;
  const vw = (maxX - minX) / z, vh = (maxY - minY) / z;
  const cx = (minX + maxX) / 2 + (S.panX || 0);
  const cy = (minY + maxY) / 2 + (S.panY || 0);
  S.viewW = vw;                              // used to scale drag distances
  // The whole board, before zoom. Pinching has to know it to work out where a
  // given point on screen sits on the board and put it back afterwards.
  boardExtent = { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  svg.setAttribute("viewBox", `${cx - vw / 2} ${cy - vh / 2} ${vw} ${vh}`);

  const uiHidden = uiBlocked();
  let h = artDefs();
  h += `<rect x="${minX}" y="${minY}" width="${maxX - minX}" height="${maxY - minY}"
          fill="transparent" onclick="disarm()"/>`;
  const sel = S.select;

  // Ports
  for (const e of edges){
    if (!e.port) continue;
    const m = midOf(e);
    const pp = portPos(e);
    const px = pp.x, py = pp.y;
    const generic = e.port === "3:1";
    const col = generic ? "#95a1b3" : RES_COLOR[e.port];
    // 2:1 ports are identified by colour alone; 3:1s just show "?".
    // The <title> has to be a CHILD of what it describes. Loose in the SVG it
    // became the title of the whole drawing, so every port showed whichever
    // one happened to be emitted first. Wrapping each marker in its own <g>
    // gives each port back its own tooltip.
    const label = generic ? "3:1 port — any resource, three of a kind"
                          : "2:1 port — " + RES_NAME[e.port];
    h += `<line x1="${m.x}" y1="${m.y}" x2="${px}" y2="${py}" stroke="${col}" stroke-width="3" opacity=".6"/>`;
    h += `<g class="portmark"><title>${esc(label)}</title>
            <circle cx="${px}" cy="${py}" r="13" fill="#1a1e25" stroke="${col}" stroke-width="2.5"/>
            <text x="${px}" y="${py + 4}" text-anchor="middle" font-size="${generic ? 13 : 10}"
                  font-weight="700" fill="${col}" pointer-events="none">${generic ? "?" : "2:1"}</text>
          </g>`;
  }

  // Hexes
  for (const hx of hexes){
    const pts = cornerPoints(hx.x, hx.y).map(p => `${p.x},${p.y}`).join(" ");
    const hot = sel && (sel.kind === "robber" || sel.kind === "alter");
    const altPicked = sel && sel.kind === "alter" && sel.first === hx.id;
    const click = hot ? ` style="cursor:pointer" onclick="hexClick(${hx.id})"` : "";
    const tile = art("hex", hx.terrain);
    if (tile){
      // Square source, cropped to cover a POINTY-TOP hex's bounding box — the
      // shape the art is composed for, which trims the left and right edges
      // and nothing else (see art/README.txt).
      //
      // A turned board turns the tile with it rather than re-cropping it into
      // the flat-top box. Same rotation the lattice took, so the hexagon in
      // the picture still lines up with the clip — and the trim stays on the
      // edges the artist left room at, instead of moving to the top and bottom
      // where they had no reason to.
      const w = HEX_SIZE * Math.sqrt(3), ht = HEX_SIZE * 2;
      const spin = BOARDSET.turned ? ` transform="rotate(${turnDeg()})"` : "";
      h += `<g transform="translate(${hx.x},${hx.y})" clip-path="url(#hexclip)"${click}>
              <image${spin} href="${tile}" x="${-w/2}" y="${-ht/2}" width="${w}" height="${ht}"
                     preserveAspectRatio="xMidYMid slice"/>
            </g>`;
      h += `<polygon points="${pts}" fill="none" stroke="#0b0d10" stroke-width="2.5" pointer-events="none"/>`;
    } else {
      h += `<polygon points="${pts}" fill="${RES_COLOR[hx.terrain]}" stroke="#0b0d10" stroke-width="2.5"${click}/>`;
    }
    if (hot){
      const ok = sel.kind === "robber" ? hx.id !== S.robber : hx.number !== null;
      // Armed and awaiting its second click: the same brighter, thicker
      // treatment an armed building spot gets, so the two read alike.
      const hexArmed = armed("robber", hx.id) || armed("alterb", hx.id);
      if (ok) h += `<polygon points="${pts}" fill="${
                        hexArmed ? "#ffffff4d" : altPicked ? "#ffffff33" : "#ffffff14"}"
                      stroke="${hexArmed ? "var(--accent)" : altPicked ? "#fff" : "#ffffff66"}"
                      stroke-width="${hexArmed ? 5 : 3}"
                      style="cursor:pointer" onclick="hexClick(${hx.id})"/>`;
    }
    if (hx.number !== null){
      const red = hx.number === 6 || hx.number === 8;
      const blank = art("token", "blank");
      // The number and pips stay procedural so they remain legible.
      if (blank) h += `<image href="${blank}" x="${hx.x - 21}" y="${hx.y - 21}" width="42" height="42"
                              pointer-events="none"/>`;
      else h += `<circle cx="${hx.x}" cy="${hx.y}" r="19" fill="#ded5c1" stroke="#0b0d10"
                         stroke-width="1.5" pointer-events="none"/>`;
      // Muted rather than paper-white: at full brightness the tokens were the
      // loudest thing on the board, over the pieces they are meant to inform.
      //
      // And deaf to the pointer, all of it — the disc, the number, the pips.
      // The token is drawn AFTER the hex it sits on, so anything here that
      // takes a click takes it away from the hex: aiming at the number was the
      // one place Alter the Future and the robber did not respond, which is
      // exactly where anybody would aim first. The blank disc image already
      // said pointer-events="none"; the number and its pips never did, so the
      // dead spot moved around depending on whether you had token art.
      h += `<g opacity=".86" pointer-events="none">
              <text x="${hx.x}" y="${hx.y + 6}" text-anchor="middle" font-size="18" font-weight="700"
                fill="${red ? "#9e2c1c" : "#33312c"}">${hx.number}</text>`;
      const pips = 6 - Math.abs(7 - hx.number);
      for (let i = 0; i < pips; i++)
        h += `<circle cx="${hx.x - (pips - 1) * 2.6 + i * 5.2}" cy="${hx.y + 13}" r="1.45"
                fill="${red ? "#9e2c1c" : "#33312c"}" opacity=".8"/>`;
      h += `</g>`;
    } else {
      h += `<text x="${hx.x}" y="${hx.y + 5}" text-anchor="middle" font-size="12" fill="#8a7a52"
                   pointer-events="none">DESERT</text>`;
    }
    if (S.robber === hx.id){
      /* Standing ON the number, not off the hex's shoulder where it used to
         sit. A hex is dead while the robber is there, and the clearest way to
         say a number will not pay is to put something over the number. Off to
         one side you had to look twice to work out which hex it belonged to,
         which on a crowded board is a look you take every roll.

         A ring of the token still shows around it, so you can see there is a
         number under there without being able to read it — which is the point.
         Deaf to the pointer like everything else on this layer. */
      const rb = art("piece", "robber");
      if (rb){
        h += `<image href="${rb}" x="${hx.x - 16}" y="${hx.y - 16}" width="32" height="32"
                     filter="url(#tintRobber)" pointer-events="none"/>`;
      } else {
        h += `<g transform="translate(${hx.x},${hx.y})" pointer-events="none">
                <ellipse cx="0" cy="7" rx="10" ry="8" fill="#15181d" stroke="#000" stroke-width="1"/>
                <circle cx="0" cy="-5" r="6.5" fill="#15181d" stroke="#000" stroke-width="1"/>
              </g>`;
      }
    }
  }

  // Roads (edges)
  for (const e of edges){
    const a = vertices[e.v[0]], b = vertices[e.v[1]];
    if (e.owner !== null && !landing("e" + e.id)){
      const rd = art("piece", "road");
      if (rd){
        // Stretch a horizontal road tile along the edge.
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        const th  = 18;
        h += `<g transform="translate(${(a.x+b.x)/2},${(a.y+b.y)/2}) rotate(${ang})">
                <image href="${rd}" x="${-len/2}" y="${-th/2}" width="${len}" height="${th}"
                       preserveAspectRatio="none" filter="url(#tint${e.owner})"/>
              </g>`;
      } else {
        h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="#0b0d10" stroke-width="12" stroke-linecap="round"/>`;
        h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="${S.players[e.owner].color}" stroke-width="8" stroke-linecap="round"/>`;
      }
    } else if (!uiHidden && roadSpotShown(e.id)){
      const on = armed("road", e.id) || armed("free", e.id);
      // Halo + dashed fill so the target stays legible over any terrain colour.
      h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#fff"
              stroke-width="${on ? 16 : 12}" stroke-linecap="round" opacity="${on ? ".85" : ".3"}"
              style="cursor:pointer" onclick="edgeClick(${e.id})"/>`;
      h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${cur().color}"
              stroke-width="${on ? 9 : 7}" stroke-linecap="round"
              ${on ? "" : 'stroke-dasharray="7 5"'} opacity=".95"
              style="cursor:pointer" onclick="edgeClick(${e.id})"/>`;
    }
  }

  // Buildings (vertices)
  for (const v of vertices){
    if (v.owner !== null && !landing("v" + v.id)){
      const col = S.players[v.owner].color;
      const pieceArt = art("piece", v.type);
      if (pieceArt){
        const sz = v.type === "city" ? 38 : 32;
        h += `<image href="${pieceArt}" x="${v.x - sz/2}" y="${v.y - sz/2}" width="${sz}" height="${sz}"
                     filter="url(#tint${v.owner})" pointer-events="none"/>`;
      } else if (v.type === "settlement"){
        h += `<g transform="translate(${v.x},${v.y}) scale(1.18)">
                <path d="M-9,4 L-9,-2 L0,-9 L9,-2 L9,4 Z" fill="${col}" stroke="#0b0d10" stroke-width="1.8"/>
              </g>`;
      } else {
        h += `<g transform="translate(${v.x},${v.y}) scale(1.18)">
                <path d="M-12,6 L-12,-3 L-4,-9 L-4,-3 L4,-3 L12,-3 L12,6 Z" fill="${col}"
                      stroke="#0b0d10" stroke-width="1.8"/>
              </g>`;
      }
    }
    const spot = uiHidden ? null : vertexSpotShown(v.id);
    if (spot){
      const on = armed(spot, v.id) || armed("free", v.id);
      const r  = on ? 17 : (spot === "city" ? 15 : 13);
      h += `<circle cx="${v.x}" cy="${v.y}" r="${r}" fill="${cur().color}" opacity="${on ? ".9" : ".55"}"
              stroke="#fff" stroke-width="${on ? 3.5 : 2.5}" ${on ? "" : 'stroke-dasharray="4 3"'}
              style="cursor:pointer" onclick="vertexClick(${v.id})"/>`;
      if (spot === "city" && !on)
        h += `<text x="${v.x}" y="${v.y + 4}" text-anchor="middle" font-size="11" font-weight="700"
                fill="#fff" pointer-events="none">+</text>`;
      if (on)
        h += `<circle cx="${v.x}" cy="${v.y}" r="${r + 6}" fill="none" stroke="#fff"
                stroke-width="1.5" opacity=".7" pointer-events="none"/>`;
    }
  }
  svg.innerHTML = h;
}

/* One hex-shaped clip (all tiles share it) plus a tint filter per player.
   The tint floods the player's colour through the art's alpha and lays a dark
   dilated outline behind it, matching the look of the procedural pieces. */
/* Which build spots the board offers right now. During setup the forced
   placement wins; otherwise anything legal and affordable is shown. */
function roadSpotShown(eid){
  const sel = S.select;
  if (sel && sel.kind === "road") return canPlaceRoad(eid, S.cur, sel.fromVertex);
  if (S.select || S.pending || S.phase !== "main") return false;
  return buildableNow("road") && canPlaceRoad(eid, S.cur, null);
}
function vertexSpotShown(vid){
  const sel = S.select;
  if (sel && sel.kind === "settlement" && sel.setup)
    return canPlaceSettlement(vid, S.cur, true) ? "settlement" : null;
  if (S.select || S.pending || S.phase !== "main") return null;
  if (canPlaceCity(vid, S.cur) && buildableNow("city")) return "city";
  if (canPlaceSettlement(vid, S.cur, false) && buildableNow("settlement")) return "settlement";
  return null;
}

function artDefs(){
  const pts = cornerPoints(0, 0).map(p => `${p.x},${p.y}`).join(" ");
  let d = `<defs><clipPath id="hexclip"><polygon points="${pts}"/></clipPath>`;
  S.players.forEach(p => {
    d += `<filter id="tint${p.id}" x="-25%" y="-25%" width="150%" height="150%">
            <feFlood flood-color="${p.color}" result="col"/>
            <feComposite in="col" in2="SourceGraphic" operator="in" result="body"/>
            <feMorphology in="SourceGraphic" operator="dilate" radius="1.3" result="fat"/>
            <feFlood flood-color="#0b0d10" result="dark"/>
            <feComposite in="dark" in2="fat" operator="in" result="edge"/>
            <feMerge><feMergeNode in="edge"/><feMergeNode in="body"/></feMerge>
          </filter>`;
  });
  d += `<filter id="tintRobber" x="-25%" y="-25%" width="150%" height="150%">
          <feFlood flood-color="#15181d" result="col"/>
          <feComposite in="col" in2="SourceGraphic" operator="in"/>
        </filter>`;
  return d + `</defs>`;
}

/* ══════════════════════════════════════════════════════════════════════
   PLAYER STRIP (top)
   ══════════════════════════════════════════════════════════════════════ */

/* One entry per roll: who rolled what, and exactly who collected. */
function rollSummary(p, d1, d2, out){
  const sum = d1 + d2;
  let h = pdot(p) + " rolls <b>" + sum + "</b> " +
          "<span style='opacity:.55'>(" + d1 + "+" + d2 + ")</span>";
  const lines = [];
  for (const q of S.players){
    const g = out.paid[q.id];
    if (RES.some(r => g[r] > 0)) lines.push(pdot(q) + " " + resList(g));
  }
  h += lines.length ? "<br>" + lines.join("<br>")
                    : "<br><span style='opacity:.55'>nobody collects</span>";
  for (const n of out.notes) h += "<br><span style='opacity:.55'>" + n + "</span>";
  return h;
}

/* ── board view controls ─────────────────────────────────────────────── */
/* 1.6 was as far as the + button ever needed to go. Pinching wants more room
   than that: a hex on the six-player board is under 20px on a phone held
   sideways, and going in twice as far is the point of the gesture. */
const ZOOM_MIN = 0.85, ZOOM_MAX = 3;

function zoomBoard(delta){
  if (!S) return;
  const before = S.zoom || 1;
  S.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, before + delta));
  if (S.zoom <= 1.001){ S.panX = 0; S.panY = 0; }   // nothing to pan when it fits
  drawBoard();
}
function resetZoom(){
  if (!S) return;
  S.zoom = 1; S.panX = 0; S.panY = 0;
  drawBoard();
}

let boardExtent = null;

/* Where a point on screen falls on the board. The SVG letterboxes its viewBox
   inside whatever box it is given, so this is not a plain ratio — it is
   svgToScreen run backwards. */
function screenToBoard(sx, sy){
  const svg = document.getElementById("board");
  if (!svg) return null;
  const vb = (svg.getAttribute("viewBox") || "").split(" ").map(Number);
  if (vb.length !== 4 || !vb[2] || !vb[3]) return null;
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  const scale = Math.min(r.width / vb[2], r.height / vb[3]);
  return { x: vb[0] + (sx - r.left - (r.width  - vb[2] * scale) / 2) / scale,
           y: vb[1] + (sy - r.top  - (r.height - vb[3] * scale) / 2) / scale };
}

/* Zoom so that whatever is under the given point on screen stays under it.
   Pinching without this drags the board out from under your fingers, which
   makes zooming in on one corner of the island almost impossible. */
function zoomAbout(z, sx, sy){
  const svg = document.getElementById("board");
  if (!S || !svg || !boardExtent) return;
  const at = screenToBoard(sx, sy);
  const r = svg.getBoundingClientRect();
  z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  if (!at || !r.width){ S.zoom = z; drawBoard(); return; }

  const W = boardExtent.maxX - boardExtent.minX;
  const H = boardExtent.maxY - boardExtent.minY;
  const vw = W / z, vh = H / z;
  const scale = Math.min(r.width / vw, r.height / vh);
  // The viewBox origin that puts `at` back under (sx, sy) at the new zoom.
  const vbX = at.x - (sx - r.left - (r.width  - vw * scale) / 2) / scale;
  const vbY = at.y - (sy - r.top  - (r.height - vh * scale) / 2) / scale;
  S.zoom = z;
  S.panX = (vbX + vw / 2) - (boardExtent.minX + boardExtent.maxX) / 2;
  S.panY = (vbY + vh / 2) - (boardExtent.minY + boardExtent.maxY) / 2;
  if (z <= 1.001){ S.panX = 0; S.panY = 0; }   // nothing to pan when it fits
  drawBoard();
}

/* Wheel or pinch to zoom, drag to pan, double-tap to put it all back. The drag
   only counts once the pointer has moved a few pixels, so an ordinary click
   still builds where you clicked — and the same is true of a finger.

   Everything here is pointer events rather than touch events, so one path
   serves a mouse, a trackpad and a screen. */
function initBoardControls(){
  const svg = document.getElementById("board");
  if (!svg || svg.__wired) return;
  svg.__wired = true;

  svg.addEventListener("wheel", function(e){
    if (!S) return;
    e.preventDefault();
    zoomAbout((S.zoom || 1) + (e.deltaY < 0 ? 0.12 : -0.12), e.clientX, e.clientY);
  }, { passive:false });

  const touches = new Map();     // live pointers on the board
  let down = null;               // a one-finger drag
  let pinch = null;              // a two-finger zoom
  let lastTap = 0, lastTapAt = null;

  const spread = () => {
    const [a, b] = Array.from(touches.values());
    return { d: Math.hypot(a.x - b.x, a.y - b.y),
             mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  };

  svg.addEventListener("pointerdown", function(e){
    if (!S) return;
    touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (touches.size === 2){
      // A second finger turns a drag into a pinch.
      down = null;
      const g = spread();
      pinch = { d: g.d, zoom: S.zoom || 1 };
      return;
    }
    if (touches.size !== 1) return;
    if ((S.zoom || 1) <= 1.001) return;          // nothing to pan when it fits
    down = { x:e.clientX, y:e.clientY, panX:S.panX || 0, panY:S.panY || 0, moved:false };
  });

  svg.addEventListener("pointermove", function(e){
    if (!S) return;
    if (touches.has(e.pointerId)) touches.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (pinch && touches.size >= 2){
      const g = spread();
      if (pinch.d > 8){
        zoomAbout(pinch.zoom * (g.d / pinch.d), g.mx, g.my);
        window.__panDragged = true;              // this was a gesture, not a tap
      }
      return;
    }
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) < 5) return;
    down.moved = true;
    const scale = (S.viewW || 600) / Math.max(1, svg.clientWidth);
    S.panX = down.panX - dx * scale;
    S.panY = down.panY - dy * scale;
    drawBoard();
  });

  const lift = function(e){
    touches.delete(e.pointerId);
    if (touches.size < 2) pinch = null;
    // Suppress the click that follows a real drag so it does not place a piece.
    if (down && down.moved) window.__panDragged = true;
    down = null;
  };
  /* Two taps in the same spot mean "put the board back" ONLY on bare board.
     Building is itself a two-click gesture — the first click arms the spot,
     the second confirms it — so on anything clickable the double tap was the
     placement, and treating it as a reset ate the confirming click and put
     the zoom back instead. Which is why, zoomed in, you could not build at
     all: every attempt reset the view, and only then did the next pair of
     clicks land. Anything carrying an onclick is a hit target; the board
     behind them is not, and still resets. */
  const onHitTarget = function(e){
    const t = e.target;
    if (!t || !t.closest) return false;
    if (S && S.armed) return true;             // a spot is waiting to be confirmed
    return !!t.closest("[onclick]");
  };

  svg.addEventListener("pointerup", function(e){
    // Two quick taps in the same spot put the board back where it started.
    // Without a way out, a stray pinch or a fat-fingered zoom left you stuck
    // at 2x with only a 30px minus button to climb back down.
    const now = Date.now();
    const near = lastTapAt && Math.hypot(e.clientX - lastTapAt.x, e.clientY - lastTapAt.y) < 34;
    if (!(down && down.moved) && !pinch && near && now - lastTap < 320 && !onHitTarget(e)){
      lastTap = 0; lastTapAt = null;
      if (S && ((S.zoom || 1) > 1.001 || S.panX || S.panY)){
        window.__panDragged = true;              // a reset is not a placement
        resetZoom();
      }
    } else {
      lastTap = now; lastTapAt = { x:e.clientX, y:e.clientY };
    }
    lift(e);
  });
  svg.addEventListener("pointercancel", lift);
  svg.addEventListener("pointerleave", lift);
}

/* Board clicks arriving straight after a pan are swallowed. */
function swallowedByPan(){
  // A bot's move, or a remote player's, has nothing to do with whether the
  // person at this screen happened to be dragging the board a moment ago.
  if (drivenByProxy()) return false;
  if (window.__panDragged){ window.__panDragged = false; return true; }
  return false;
}

/* The points on somebody's card. Feral Kittens are worth a point each and are
   held face down, so the number the table sees leaves them out — but there is
   no reason to hide your own from you. Your card shows what you are actually
   on, tinted and with the hidden part spelled out in the tooltip; everybody
   else's shows the public figure the table is playing against. Once the game
   is over every hand is face up and everyone shows their real total. */
function vpStat(p){
  const mine = p.id === viewSeat();
  const ferals = vpCards(p);
  const open = mine || S.revealed;
  const shown = open ? totalVP(p) : publicVP(p);
  const hidden = open && ferals > 0;
  const kittens = `${ferals} Feral Kitten${ferals === 1 ? "" : "s"}`;
  const tip = !open
    ? "Victory points the table can see — Feral Kittens stay hidden"
    : hidden
      ? S.revealed
        ? `${shown} points, ${kittens} of them held face down`
        : `${shown} points, including ${kittens} only you can see — ` +
          `the rest of the table sees ${publicVP(p)}`
      : "Victory points";
  // Just the number, in a ring beside the name. It used to carry a "+2"
  // spelling out how much of your own total was hidden, which is arithmetic
  // you can do yourself and clutter on the one number you read most.
  return `<span class="vpring ${hidden ? "hidden" : ""}" title="${esc(tip)}">${shown}</span>`;
}

/* The log starts under the button strip, whatever height the strip has ended
   up: it wraps to two rows on a narrow screen and to one on a wide one, and it
   gained a button and a tag along the way. Hardcoding an offset per breakpoint
   worked until the row count changed under it, and then the log was drawn
   through the buttons. Measured after layout, like everything else here. */
function placeFeed(){
  const btns = document.getElementById("leftbtns");
  const stage = document.getElementById("stage");
  if (!btns || !stage || !btns.offsetHeight) return;
  stage.style.setProperty("--feedTop", (btns.offsetTop + btns.offsetHeight + 10) + "px");
}

/* Which way play is going round the table. Nothing else on screen says so,
   and a Reverse turns it over mid-game — you used to find out by watching
   whose turn came next, an hour into a game where somebody had quietly
   reversed it twice. The seats run left to right in the strip in the order
   play visits them, so the arrow is the strip's own direction. */
function drawTurnOrder(){
  const el = document.getElementById("turnDir");
  if (!el) return;
  if (!S || S.phase === "over" || S.players.length < 3){
    // Two players have no direction to speak of: play alternates either way.
    el.hidden = true;
    return;
  }
  const rightwards = (S.dir || 1) > 0;
  el.hidden = false;
  el.innerHTML = rightwards ? "turn order <b>→</b>" : "<b>←</b> turn order";
  el.title = "Play is going " + (rightwards ? "left to right" : "right to left") +
             " through the seats above. A Reverse turns this round.";
}

/* Fast track and fast track + are worth being able to see at a glance, an
   hour in, without opening a dialog. A normal game says nothing. */
function drawModeTag(){
  const el = document.getElementById("modeTag");
  if (!el) return;
  const m = S && S.mode && S.mode !== "normal" ? MODES[S.mode] : null;
  el.hidden = !m;
  if (m){ el.textContent = m.name; el.title = m.blurb; }
}

/* The first letter of a name, for a seat with no picture. Codepoint-aware, so
   a name that opens with an emoji shows the emoji rather than half of it. */
function initialOf(name){
  const s = String(name || "?").trim();
  return (Array.from(s)[0] || "?").toUpperCase();
}

/* The portrait, the score ring riding its top-left corner, and whatever emoji
   somebody has just thrown at it. Your own is a button in all but name. */
function avatarHTML(p){
  const src = avatarSrc(p.avatar);
  const mine = p.id === viewSeat() && ownsSeat(p.id) && S.phase !== "over";
  const face = src
    ? `<img src="${src}" alt="" draggable="false">`
    : `<span class="avinit">${esc(initialOf(p.name))}</span>`;
  return `<div class="avwrap ${mine ? "mine" : ""}"
               ${mine ? 'onclick="avatarDialog()" title="Your picture — click to change it"' : ""}>
            <span class="avin">${face}</span>
            ${vpStat(p)}
            ${emoteHTML(p.id)}
          </div>`;
}

function drawPlayers(){
  let h = "";
  for (const p of S.players){
    const active = p.id === S.cur && S.phase !== "over";
    h += `<div class="pcard ${active ? "active" : ""} ${p.skipTokens ? "done" : ""}"
                data-pid="${p.id}"
                style="--pc:${p.color}; --pcTint:${p.color}26; --pcEdge:${p.color}88">
            ${avatarHTML(p)}
            <div class="pname">
              <span class="nm">${esc(p.name)}</span>
              ${p.skipTokens ? `<span class="pskip">skip ×${p.skipTokens}</span>` : ""}
            </div>
            <div class="statgroup hand">
              <div class="stat res" title="Resource cards"><b>${totalRes(p)}</b>${ICON.res}</div>
              <div class="stat kit" title="Kitten cards in hand"><b>${p.cards.length}</b>${ICON.kit}</div>
            </div>
            <div class="statgroup board">
              <div class="stat road ${S.longestRoad.owner === p.id ? "holds" : ""}"
                   title="Longest unbroken road (${p.roads} built)${
                     S.longestRoad.owner === p.id ? " — holds Longest Road, +2" : ""}">
                <b>${(S.roadLens && S.roadLens[p.id] !== undefined) ? S.roadLens[p.id] : 0}</b>${ICON.road}</div>
              <div class="stat knight ${S.largestArmy.owner === p.id ? "holds" : ""}"
                   title="Knights played${
                     S.largestArmy.owner === p.id ? " — holds Largest Army, +2" : ""}">
                <b>${p.knights}</b>${ICON.knight}</div>
            </div>`;
    h += `</div>`;
  }
  document.getElementById("players").innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════
   KITTEN DECK (bottom-right of the board)
   ══════════════════════════════════════════════════════════════════════ */

function canBuyKitten(){
  return S.phase === "main" && S.deck.length > 0 && !owesAnswer() &&
         RES.filter(r => cur().res[r] > 0).length >= 3;
}

/* Is the seat the UI belongs to the one actually playing right now? Anything
   the human can click has to be gated on this, or a stray click acts for a
   bot — which is how the deck was letting you buy cards on their behalf. */
function myTurnNow(){
  if (drivenByProxy()) return true;               // acting as whoever is up
  if (window.NET && NET.isOnline && NET.isOnline()) return S.cur === viewSeat();
  if (!anyBots()) return true;
  return S.cur === viewSeat() && !uiBlocked();
}

/* Where the board's artwork actually sits inside the SVG, in pixels relative
   to #boardArea. The SVG fills the pane but the drawing is letterboxed inside
   it, so anything that should hug the board has to be placed from this. */
function boardContentRect(){
  const svg  = document.getElementById("board");
  const area = document.getElementById("boardArea");
  if (!svg || !area) return null;
  const vb = (svg.getAttribute("viewBox") || "").split(" ").map(Number);
  if (vb.length !== 4 || !vb[2] || !vb[3]) return null;
  const sr = svg.getBoundingClientRect(), ar = area.getBoundingClientRect();
  if (!sr.width || !sr.height) return null;
  const scale = Math.min(sr.width / vb[2], sr.height / vb[3]);   // xMidYMid meet
  const w = vb[2] * scale, h = vb[3] * scale;
  return {
    left:   sr.left - ar.left + (sr.width  - w) / 2,
    top:    sr.top  - ar.top  + (sr.height - h) / 2,
    width:  w, height: h
  };
}

/* Where a point in board coordinates lands on screen, relative to #boardArea. */
function svgToScreen(x, y){
  const svg  = document.getElementById("board");
  const area = document.getElementById("boardArea");
  if (!svg || !area) return null;
  const vb = (svg.getAttribute("viewBox") || "").split(" ").map(Number);
  if (vb.length !== 4 || !vb[2] || !vb[3]) return null;
  const sr = svg.getBoundingClientRect(), ar = area.getBoundingClientRect();
  if (!sr.width || !sr.height) return null;
  const scale = Math.min(sr.width / vb[2], sr.height / vb[3]);
  return {
    x: sr.left - ar.left + (sr.width  - vb[2] * scale) / 2 + (x - vb[0]) * scale,
    y: sr.top  - ar.top  + (sr.height - vb[3] * scale) / 2 + (y - vb[1]) * scale,
    scale
  };
}

/* The tiles alone, ignoring the port markers that ring them. */
function hexFieldBounds(){
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const h of hexes){
    for (const p of cornerPoints(h.x, h.y)){
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
  }
  return { minX, maxX, minY, maxY };
}

/* Park the deck off the board's bottom-right corner, roughly 70px clear of the
   nearest tile, and never hanging below the board itself. It is absolutely
   positioned, so it can never take space from the board or resize it. */
const DECK_GAP = 50;      // per axis — about 70px on the diagonal

function placeDeck(){
  const el = document.getElementById("deckWrap");
  if (!el) return;
  const card = el.querySelector(".deck");
  const area = document.getElementById("boardArea");
  const content = boardContentRect();
  if (!card || !area || !content){ el.style.left = ""; el.style.top = ""; return; }

  const hb = hexFieldBounds();
  const corner = svgToScreen(hb.maxX, hb.maxY);
  if (!corner){ el.style.left = ""; el.style.top = ""; return; }

  const ar = area.getBoundingClientRect();
  const cardH = card.offsetHeight || 104;
  const wrapW = el.offsetWidth  || 86;
  const wrapH = el.offsetHeight || 122;

  // Bottom edge of the card sits level with the board's lowest point at most.
  const boardBottom = content.top + content.height;
  const bottom = Math.min(corner.y + DECK_GAP, boardBottom);
  let left = corner.x + DECK_GAP;
  let top  = bottom - cardH;

  left = Math.max(6, Math.min(left, ar.width  - wrapW - 6));
  top  = Math.max(6, Math.min(top,  ar.height - wrapH - 6));

  el.style.left = left + "px";
  el.style.top = top + "px";
  el.style.right = "auto";
  el.style.bottom = "auto";
}

function drawDeck(){
  const el = document.getElementById("deckWrap");
  if (S.phase === "over" || S.phase.startsWith("setup")){ el.innerHTML = ""; return; }
  const buyable = canBuyKitten() && myTurnNow();
  const back = art("card", "back");
  el.innerHTML = `
    <div class="deck ${buyable ? "buyable" : "dim"}" ${buyable ? `onclick="buyKittenDialog()"` : ""}
         title="${buyable ? "Buy a kitten card — any 3 different resources"
                       : myTurnNow() ? "Needs 3 different resources" : "Not your turn"}">
      ${back ? `<img src="${back}" alt="">` : ""}
      <span class="cnt">${S.deck.length}</span>
    </div>
    <div class="deckcost">any 3 unique</div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   BOTTOM BAR — resources, hand, actions
   ══════════════════════════════════════════════════════════════════════ */

function drawBottom(){
  const p = viewPlayer();
  const netOn = !!(window.NET && NET.isOnline && NET.isOnline());
  const myTurn = netOn ? S.cur === p.id
                       : (!anyBots() || (S.cur === p.id && !uiBlocked()));
  let h = `<div class="bside"><div class="actions-bar">${turnTimerDisplay()}</div></div><div class="bcentre"><div class="group">`;
  for (const r of RES){
    const face = art("res", r);
    h += `<div class="slot ${p.res[r] ? "" : "zero"}" title="${RES_NAME[r]}">
            ${face ? `<img src="${face}" alt="">`
                   : `<span class="swatchbig" style="background:${RES_COLOR[r]}"></span>`}
            <span class="n">${p.res[r]}</span>
            <span class="rn">${RES_NAME[r]}</span>
          </div>`;
  }
  h += `</div><div class="sep"></div>`;

  // ── kitten hand ──
  h += `<div class="group hand" data-hand="${p.id}">`;
  if (!p.cards.length){
    h += `<span class="emptyhand">No kitten cards</span>`;
  } else {
    // Every entry still open to a reaction, so a Nope or Defuse with something
    // to answer right now can light up in your hand.
    const live = openEntries();
    p.cards.forEach((c, i) => {
      const def = KITTEN[c.key];
      // Online, another seat's hand arrives as face-down placeholders. The
      // bottom bar only ever draws your own, so this should never fire — but
      // one undefined lookup would take the whole screen down with it.
      if (!def) return;
      const isVP = def.kind === "vp";
      // A Feral Kitten is never played — it is a point the moment it is in
      // your hand, and checkVictory already treats it that way. Marking it
      // "next turn" said the opposite, which is why drawing one at 9 points
      // looked like a win you had to wait for.
      const locked = c.boughtTurn === S.turnCounter && !isVP && !playableWhenDrawn(c);
      const reaction = def.kind === "response";
      const offTurn  = OFF_TURN.has(c.key) && !locked && !isVP && !S.pending &&
                        S.phase !== "over" && !S.phase.startsWith("setup") &&
                        S.cur !== p.id;
      const playable = (myTurn && !locked && !isVP && !S.pending &&
                        (def.kind !== "response" || c.key === "nope") &&
                        (S.phase === "main" || S.phase === "roll")) || offTurn;
      const canAnswer = !locked && live.some(e =>
                        (c.key === "defuse" && canDefuseEntry(e, p.id)) ||
                        (c.key === "nope"   && canNopeFor(e, p.id)));
      const held = dragCard && dragCard.ownerId === p.id && dragCard.idx === i;
      const face = cardArt(c);
      let cls = offTurn ? "playable offturn" : playable ? "playable"
              : reaction ? "reaction" : locked ? "locked" : "";
      if (canAnswer) cls += " armedreact";
      if (held) cls += " picked";
      const tip = esc(def.name + (c.flavor ? " · " + c.flavor : "") + " — " + def.text) +
                  (locked ? "" : "\nDrag it where it should go.");
      h += `<div class="kcard ${cls}" title="${tip}"
                 data-idx="${i}" data-owner="${p.id}"
                 onpointerdown="cardPointerDown(event,${i},${p.id})">
              ${face ? `<img src="${face}" alt="" draggable="false">` : ""}
              ${locked ? `<span class="pip">next turn</span>` : ""}
              ${isVP ? `<span class="pip now">1 VP</span>` : ""}
              ${canAnswer ? `<span class="pip now">answer</span>`
                : offTurn ? `<span class="pip now">now</span>`
                : reaction ? `<span class="pip">react</span>` : ""}
              ${face ? "" : `<span class="kn">${def.name}${c.flavor ? "<br>" + c.flavor.split(" ")[0] : ""}</span>`}
            </div>`;
    });
  }
  h += `</div></div>`;

  // ── actions ──
  h += `<div class="bside right"><div class="actions-bar">`;
  // Being stuck is much easier to unpick when the screen says who on.
  const pend = pendingAnswerers().filter(s => s !== p.id);
  if (pend.length && S.phase !== "over"){
    h += `<span class="thinking"><span class="dot" style="background:${S.players[pend[0]].color}"></span>
            waiting for ${esc(S.players[pend[0]].name)}…</span>`;
  }
  if (!myTurn && S.phase !== "over"){
    const who = S.players[S.cur];
    h += `<span class="thinking"><span class="dot" style="background:${who.color}"></span>
            ${who.name} is thinking…</span>`;
  } else if (owesAnswer() && S.phase !== "over"){
    // The buttons are gated anyway; this is so a folded-away window does not
    // read as a game that has stopped responding.
    h += `<span class="thinking owed">⏳ ${
            S.select ? "finish the move on the board"
          : (S.seven && !owesSevenCut(p.id)) ? "waiting on the seven to be paid"
          : "finish the open window first"}</span>`;
  } else if (S.phase === "roll"){
    h += `<button class="primary" id="rollBtn" ${handoverActive() ? "disabled" : ""}
            onclick="rollDice()">Roll Dice</button>`;
  } else if (S.phase === "main"){
    h += `<button onclick="bankTradeDialog()">Bank / Port</button>`;
    h += `<button onclick="playerTradeDialog()">Trade</button>`;
    h += `<button class="warn" onclick="requestEndTurn()">End Turn</button>`;
  } else if (S.phase.startsWith("setup")){
    h += `<span class="emptyhand">Setup — place your ${S.setupNeed}</span>`;
  } else if (S.phase === "over"){
    h += `<button class="primary" onclick="showStandings()">Final standings</button>`;
    h += `<button onclick="newGameDialog()">New Game</button>`;
  }
  h += `</div></div>`;

  document.getElementById("bottom").innerHTML = h;
}
