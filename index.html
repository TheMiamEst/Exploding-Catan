  // Whose turn is being cut short. Off-turn plays (an Attack thrown during
  // somebody else's turn), and anything from a turn that has already handed
  // over, have no turn of their own to end.
  const victim = S.players[e.actor];
  const live = S.phase !== "over" && !S.phase.startsWith("setup");
  const wasNoperTurn = e.actor === S.cur && live;

  /* Their turn ended a moment ago and the hand-over window is still open.

     Last call is exactly what that window is for: pressing End Turn does not
     put the turn beyond answering, it only starts the clock on it — which is
     the whole reason canNopeEntry reaches across the boundary in the first
     place. But the reroll test asked whether the roller was the CURRENT player,
     and after End Turn they are not. So Noping your own roll a second after
     leaving the table quietly handed play to the next player instead of
     throwing again, which is the opposite of what a Nope on a roll is for.

     A roll answered in that window is still thrown again, and the turn goes
     back to whoever threw it. Anything else answered in it is not: their turn
     is already over, and being Noped cannot end a turn twice. */
  const lateTurn = live && e.actor !== S.cur &&
                   handoverActive() && e.turn === S.handoverTurn;
  // Where the turn was standing when this Nope landed. Whose turn it is lives
  // outside the snapshots — they carry the board, not the clock — so a
  // counter-Nope needs this to undo the ending as well as the effect. Recorded
  // for every Nope: putting it back is a no-op when nothing moved, and a turn
  // can change hands with no journal entry to hang it off.
  const turnBack = {
    cur: S.cur, phase: S.phase, turnCounter: S.turnCounter,
    rolled: S.rolled ? S.rolled.slice() : null, extraTurn: S.extraTurn
  };

  // Captured BEFORE the rewind: this is what a counter-Nope has to put back,
  // and it still holds the Nope we are about to spend.
  const undone = snapAll();
  S.rewinds++;

  // Rewind first, then spend the card — the entry's own snapshot predates the
  // Nope and would otherwise hand it straight back.
  restoreAll(e.snap);
  S.journal.splice(idx);
  spendCard(noper, "nope");

  // Undoing an entry throws away everything that came after it, so any forced
  // dialog still on screen is asking about a state that no longer exists —
  // the discard window for a roll that has been un-rolled, most of all. Take
  // it away. Anything genuinely still owed is reopened below by stepSeven.
  closeModal();

  // "The attack and the Nope are both spent." The rewind predates the card
  // leaving its owner's hand, so without this it would be handed straight
  // back and thrown again next turn.
  if (e.card && !e.card.synthetic){
    const owner = S.players[e.actor];
    const oi = owner.cards.indexOf(e.card);
    if (oi >= 0) S.discard.push(owner.cards.splice(oi, 1)[0]);
  }
  // Same rule one level up: a Nope that is itself Noped is still spent. The
  // rewind predates the reaction, so it would otherwise come back for free.
  if (e.spent && S.players[e.spent.pid]) spendCard(S.players[e.spent.pid], e.spent.key);
  // Undoing an answer puts what it answered back on the table. A robbery
  // Defused and then Noped is a robbery again, and the others standing on that
  // hex may reach for it in their turn.
  if (e.unanswers !== undefined && e.unanswers !== null){
    const back = S.journal.find(x => x.id === e.unanswers);
    if (back) back.answered = false;
  }
  // Half-finished board business belongs to the action being undone — a
  // robber still to place, two tokens still to name.
  S.select = null;
  S.robberDue = [];

  // A Nope can be Noped. It is the one reaction that can, and the hand-over
  // window is what makes it reachable.
  const noteEntry = logAction(pdot(noper) + " <b>Nopes</b> " +
            (selfRoll ? "their own roll" : answering), "defend",
            { actor: noperId, snap: undone, nopeable: true, turnBack: turnBack,
              spent: { pid: noperId, key: "nope" }, show: "nope",
              // What this Nope took off the table. Carried so that a Nope of
              // THIS Nope can say what came back — see below.
              undid: { plain: e.plain, actor: e.actor, kind: e.kind } });
  logMsg(selfRoll ? `<b>${noper.name}</b> Nopes their own roll.`
                  : `<b>${noper.name}</b> Nopes: ${esc(label)}`);

  // Noping a Defuse cancels the "no you", so the original card is simply
  // played again — at the target it was first aimed at, and by the player who
  // first aimed it. Quietly: this Nope is the log entry for all of it.
  if (e.redo){
    playResolved({ type:"card", card: e.redo.card, actor: e.redo.actor,
                   target: e.redo.target, payload: e.redo.payload, quiet: true });
  }

  /* Noping a NOPE puts back whatever that Nope cancelled, and the rewind above
     has already done it — the snapshot a Nope is journalled against is the
     board as it stood with the original action resolved. What was missing was
     anybody saying so.

     Played out, the log read: "Green Nopes Orange's Favor", "Orange is Noped —
     their turn ends", "Orange Nopes Green's Nope", "Orange gets their turn
     back". Four lines, and not one of them mentions the Favor, which by then
     has quietly taken effect for the second time. The cards had moved; the
     table had no way of knowing. A Defused card says this already, because
     replaying it announces itself — this is the same courtesy for a Nope. */
  if (e.undid && e.undid.plain){
    const back = String(e.undid.plain).replace(/\s+/g, " ").trim();
    if (back){
      announce("\u21ba " + esc(back) + " \u2014 <b>stands after all</b>", "defend");
      logMsg(`<span style="color:#8ad8f5">Back on: ${esc(back)}.</span>`);
    }
  }

  // Did undoing this entry move the turn back to somebody else? Only then is
  // the turn "handed back" — and only then does the usual end-your-turn
  // penalty step aside, because there is already a turn change in flight.
  const handedBack = !!e.turnBack &&
        (e.turnBack.cur !== S.cur || e.turnBack.turnCounter !== S.turnCounter);
  if (e.turnBack) restoreTurnPointer(e.turnBack);

  if (handedBack){
    // This was a Nope that ended somebody's turn. Undoing it gives the turn
    // back rather than ending another one — the interrupted player picks up
    // exactly where they were standing.
    const back = S.players[S.cur];
    announce(pdot(back) + " gets their turn back", "defend");
    logMsg(`<b>${back.name}</b> gets their turn back.`);
  } else if ((wasNoperTurn || lateTurn) && e.kind === "roll"){
    // A Noped roll is thrown again, and the player carries on with whatever
    // the dice say the second time. Ending the turn here was wrong twice over:
    // the whole point of Noping a roll is a seven you cannot afford, and
    // ending the turn is no answer to a seven at all — the robber moves and
    // the hands are cut before the turn is over. Rerolling is the answer, and
    // it costs the roller their number rather than their turn.
    reroll = true;
    if (lateTurn){
      // The turn had already handed over, so take it back. The snapshots carry
      // the board and not the clock, which is why who is up has to be put back
      // by hand — everything else advancePlayer touched (skip tokens spent
      // walking to the next seat, the turn record) is in the snapshot and has
      // already been rewound.
      S.cur = e.actor;
      S.turnCounter = e.turn;
      S.handoverUntil = 0;
      S.handoverTurn = -1;
    }
  } else if (lateTurn){
    // Answered after they had already left the table. The rewind has taken
    // back whatever the card did, and that is the whole of the punishment
    // available: there is no turn left to end, and ending the NEXT player's
    // would be punishing the wrong person.
  } else if (wasNoperTurn && !e.redo && !e.turnSafe){
    // Being Noped costs you the rest of your turn, whatever you were doing.
    //
    // Not so for a Defuse (the `e.redo` case above, and `turnSafe` for the one
    // spent on a seven). That is a defensive card played out of turn;
    // cancelling it means the original attack lands after all, which is
    // punishment enough. Ending the defender's turn on top of it was wrong —
    // an Exploding Kitten thrown at them on their OWN turn, then Defused, then
    // Noped, cost them the turn instead of the resources.
    announce(pdot(victim) + " is Noped — their turn ends", "attack");
    logMsg(`<b>${victim.name}</b>'s turn ends.`);
    endTurnAfterNope();
  }
  // A Nope that ends a turn (or hands one back) belongs to the turn it
  // produced, not the one it interrupted. Without this the "current turn
  // only" rule would put it out of reach the instant it landed, and a Nope
  // could never be Noped.
  noteEntry.turn = S.turnCounter;

  if (reroll){
    // The snapshot carries the board, not the clock: phase has to be put back
    // by hand or the roller is left in the middle of a turn they never rolled
    // for. Then throw the dice, which journals a fresh entry of its own — so
    // a second seven can be Noped again by anybody still holding one.
    S.phase = "roll";
    S.rolled = null;
    S.seven = null;
    announce(selfRoll ? pdot(victim) + " Nopes their own roll — throwing again"
                      : pdot(victim) + " is Noped — the dice are thrown again", "defend");
    logMsg(selfRoll ? `<b>${victim.name}</b> Nopes their own roll and throws again.`
                    : `<b>${victim.name}</b>'s roll is Noped — they roll again.`);
    doRoll();
    render();
    botTick();
    return true;
  }

  // A rewind that landed in the middle of a seven puts the queue back as it
  // stood. Whoever is at the head of it still owes their cards, and their
  // dialog went with the rewind, so ask again.
  if (S.seven) stepSeven();

  render();
  botTick();
  return true;
}

/* Put the turn pointer back where a Nope found it. Only the counter-Nope path
   uses this; every other rewind leaves whose turn it is alone. */
function restoreTurnPointer(t){
  if (!t) return;
  clearImplodeClock();
  S.robberDue = [];
  S.cur = t.cur;
  S.phase = t.phase;
  S.turnCounter = t.turnCounter;
  S.rolled = t.rolled ? t.rolled.slice() : null;
  S.extraTurn = t.extraTurn;
  S.select = null;
  S.armed = null;
}

/* A Noped player's turn is over immediately. Anything half-finished — a
   robber waiting to be placed, an armed build — is dropped on the way out. */
function endTurnAfterNope(){
  S.select = null;
  S.robberDue = [];
  S.armed = null;
  S.seven = null;
  clearImplodeClock();
  closeModal();
  doEndTurn();
}

/* ── Defuse a seven ──────────────────────────────────────────────────────
   Spending a Defuse on the roll buys one hand out of the cut. The roll itself
   stands: the robber still moves and everybody else still pays. Same reason
   you would Nope a seven — you are holding too much to lose it — at a smaller
   price and for one player only.

   Nothing is rewound, because nothing has happened yet: the queue has not
   reached this player's cards. That matters beyond tidiness — a rewind here
   would throw away the very queue the sequence is walking. Instead the
   defuser is simply lifted out of it, and the entry is journalled against the
   queue as it stood, so a Nope aimed at the Defuse drops them back in. */
function defuseSeven(e, defuserId){
  if (!S.seven) return false;
  const d = S.players[defuserId];
  const snapBefore = snapAll();
  const head = S.seven.queue[0];

  spendCard(d, "defuse");
  const i = S.seven.queue.indexOf(defuserId);
  if (i >= 0) S.seven.queue.splice(i, 1);

  logMsg(`<b>${d.name}</b> Defuses the seven — their hand is not cut.`);
  // turnSafe: a Defuse is defensive and played out of turn. Noping it puts the
  // defuser back in the queue, which is punishment enough — it must not also
  // end the turn of a roller who Defused their own seven.
  logAction(pdot(d) + " <b>Defuses</b> the seven — their hand is spared", "defend",
            { actor: defuserId, snap: snapBefore, nopeable: true, turnSafe: true,
              spent: { pid: defuserId, key: "defuse" }, show: "defuse" });

  // closeModal takes away EVERY forced dialog on the table, this screen's and
  // any shipped to another — including the discard window belonging to
  // whoever is at the head of the queue, who is very often somebody else
  // entirely, part-way through counting out a big hand. It used to be called
  // unconditionally and then re-ask only if the head had CHANGED, so Defusing
  // from the log while another player was mid-discard took their window away
  // and asked nobody for anything. That is a seven nobody is being asked to
  // pay, which stops the table for good — and it is the softlock that was
  // reported from a real game.
  //
  // So the dialog is only closed when it is the defuser's OWN, which is only
  // when they were the one being asked. Everybody else keeps the pile they had
  // counted out, and the queue carries on from where it stood.
  if (head === defuserId){
    closeModal();
    stepSeven();
  }
  render();
  return true;
}

/* ── Defuse a robbery ────────────────────────────────────────────────────
   A Defuse is "no you", here as everywhere else: the robbery is undone — the
   robber back where it came from, anything it took handed back — and then the
   defuser moves the robber THEMSELVES, and steals from whoever is standing on
   wherever they put it. The same seizure the Knight has always allowed, now
   available against the robber a seven sends round as well.

   Nothing is rewound to a snapshot. That would also undo what came after the
   robbery — the knight credited for the move, a second robber move already
   handed out — so the two pieces of it are put back by hand instead. A knight
   already credited stays credited: the card was played, and the Defuse answers
   the robbery rather than the card that caused it. */
function defuseRobber(e, defuserId){
  // One Defuse settles it for the whole hex. Two players reaching for the card
  // at the same moment is the ordinary case, not a rare one — the robber lands
  // on a hex several people share. The host takes them in the order they
  // arrive, and the second finds the entry already answered and is turned away
  // with the card still in hand.
  if (e.answered) return false;
  const d = S.players[defuserId];
  const thief = S.players[e.actor];
  if (!thief || e.fromHex === undefined || e.fromHex === null) return false;

  const snapBefore = snapAll();
  spendCard(d, "defuse");
  e.answered = true;

  // Put the robbery back: the robber where it was, the card with whoever it
  // came off.
  S.robber = e.fromHex;
  const r = e.stolen;
  const victim = (e.target === null || e.target === undefined) ? null : S.players[e.target];
  if (r && victim && thief.res[r] > 0){ thief.res[r]--; victim.res[r]++; }

  logMsg(`<b>${d.name}</b> Defuses the robbery — they take the robber from ` +
         `<b>${thief.name}</b>` +
         `${r && victim ? ", and the card goes back" : ""}.`);
  // turnSafe, like the Defuse spent on a seven: it is defensive and played out
  // of turn, so Noping it hands the robbery back rather than ending a turn.
  // `unanswers` is what lets a Noped Defuse put the robbery back on the table
  // for somebody else to answer.
  const note = logAction(pdot(d) + " <b>Defuses</b> the robbery — they move the robber instead",
            "defend",
            { actor: defuserId, target: e.actor, snap: snapBefore, nopeable: true,
              turnSafe: true, spent: { pid: defuserId, key: "defuse" }, show: "defuse" });
  note.unanswers = e.id;

  // "No you": they place it, and rob whoever is there. knight:false because
  // the knight that caused this, if there was one, has already been credited
  // by the finishRobber that ran for the move being answered.
  // The reflected robber placement is part of the Defuse, not a fresh attack.
  // It must not open another Defuse window against the same interaction.
  beginRobberMove(defuserId, { knight: false, noDefuse: true });
  render();
  return true;
}

/* ── Defuse an entry ─────────────────────────────────────────────────── */
function defuseEntry(id, defuserId){
  const idx = S.journal.findIndex(e => e.id === id);
  if (idx < 0) return false;
  const e = S.journal[idx];
  if (!canDefuseEntry(e, defuserId)) return false;
  const d = S.players[defuserId];
  if (!d.cards.some(c => c.key === "defuse")) return false;
  if (e.kind === "roll") return defuseSeven(e, defuserId);
  if (isRobberEntry(e)) return defuseRobber(e, defuserId);

  const card = e.card, payload = e.payload, victimId = e.actor;
  const key = card.key;

  /* What a Nope aimed at this Defuse has to put back. Not "the state just
     before the Defuse" — that would leave the original card already resolved
     and any prompt it owed already dismissed, so an Attack Defused from its
     own discard window would end up costing nobody anything. Instead the
     Defuse is journalled against the state before the ORIGINAL card, with the
     original play recorded alongside it. Undo the Defuse and the card is
     simply played again, at the target it was first aimed at. */
  const preCard = e.snap;
  const redo = { card: card, actor: victimId, target: e.target, payload: payload };
  const answerable = { snap: preCard, redo: redo, nopeable: true,
                       spent: { pid: defuserId, key: "defuse" } };

  S.rewinds++;
  restoreAll(e.snap);
  S.journal.splice(idx);
  spendCard(d, "defuse");
  // Same as a Nope: whatever forced dialog was standing on the entry we just
  // erased is asking about a state that no longer exists.
  closeModal();
  // And whatever board business it left half-finished goes with it. Without
  // this a robber move owed by an action that has just been un-happened stayed
  // on the table, and got placed by whoever was next to be asked — a robber
  // moving with no seven and no Knight anywhere in the log to explain it.
  S.select = null;
  S.robberDue = [];

  // The rewind put the defused card back in its owner's hand. It is spent
  // whichever way it ends up pointing, so take it out again here — otherwise
  // Defusing an Alter or a Favor handed the attacker their card back, and
  // Defusing anything else left a copy of it sitting in the discard pile as
  // well as in their hand.
  const origOwner = S.players[e.cardOwner === null || e.cardOwner === undefined
                              ? victimId : e.cardOwner];
  const oi = origOwner.cards.indexOf(card);
  if (oi >= 0) S.discard.push(origOwner.cards.splice(oi, 1)[0]);

  logMsg(`<b>${d.name}</b> Defuses <b>${KITTEN[key].name}</b>.`);

  // Alter the Future and Favor hand the card's power over rather than simply
  // reflecting it — the defuser names their own numbers or their own demand.
  if (key === "alter"){
    logAction(pdot(d) + " <b>Defuses</b> Alter the Future — they swap instead", "defend",
              Object.assign({ actor: defuserId, show: "defuse", card: card,
                              payload: payload, cardOwner: e.cardOwner === null || e.cardOwner === undefined
                                ? victimId : e.cardOwner,
                              participants: (e.participants || [victimId]).concat(defuserId) }, answerable));
    beginAlterPick(defuserId, (a, b) => playResolved(
      { type:"card", card:{ key:"alter", synthetic:true }, actor:defuserId,
        target:null, payload:{ hexes:[a, b] }, quiet:true }));
    render();
    return true;
  }
  if (key === "favor"){
    logAction(pdot(d) + " <b>Defuses</b> the Favor — " + pdot(S.players[victimId]) +
              " owes them instead", "defend",
              Object.assign({ actor: defuserId, show: "defuse" }, answerable));
    const ag = agentOf(defuserId);
    const synth = { key:"favor", synthetic:true };
    if (ag && ag.favorWant){
      playResolved({ type:"card", card:synth, actor:defuserId, target:victimId,
                     payload:{ want: ag.favorWant(S.players[victimId]) }, quiet:true });
    } else {
      favorGuessDialog(synth, -1, victimId, defuserId);
    }
    render();
    return true;
  }

  // Everything else bounces straight back at whoever played it.
  logAction(pdot(d) + " <b>Defuses</b> " + KITTEN[key].name + " — it hits " +
            pdot(S.players[victimId]) + " instead", "defend",
            Object.assign({ actor: defuserId, show: "defuse" }, answerable));
  playResolved({ type:"card", card:{ key: key, flavor: card.flavor, synthetic:true },
                 actor:defuserId, target:victimId, payload:payload, quiet:true,
                 noDefuse: key === "knight" });
  render();
  return true;
}

/* One line describing a card being played. */
/* Plain text version of a resource bundle: "2 Wheat, 1 Ore". resList() is the
   chip markup for the feed; this is for the places that want a sentence. */
function plainRes(o){
  if (!o) return "";
  return RES.filter(r => o[r] > 0).map(r => o[r] + " " + RES_NAME[r]).join(", ");
}

function describeCard(base){
  const who = S.players[base.actor];
  // Naming three cards IS the Favor — say which three. Without this a Favor
  // that collected nothing left no record of what was ever asked for.
  if (base.card.key === "favor" && base.payload && base.payload.want){
    const asked = plainRes(base.payload.want);
    return pdot(who) + " plays <b>Favor</b> on " + pdot(S.players[base.target]) +
           (asked ? "<br><span style='opacity:.8'> asks for " + esc(asked) + "</span>" : "");
  }
  if (base.card.key === "alter" && base.payload && base.payload.hexes){
    const [ha, hb] = base.payload.hexes;
    return pdot(who) + " plays <b>Alter the Future</b>: swap <b>" + hexes[ha].number +
           "</b> (" + hexes[ha].terrain + ") ⇄ <b>" + hexes[hb].number + "</b> (" +
           hexes[hb].terrain + ")";
  }
  const flav = base.card.flavor ? " (" + base.card.flavor + ")" : "";
  const tgt = base.target === null || base.target === undefined
            ? "" : " on " + pdot(S.players[base.target]);
  return pdot(who) + " plays <b>" + KITTEN[base.card.key].name + "</b>" + flav + tgt;
}

/* Play a card. Nothing pauses: it resolves now and is journalled so that a
   Nope or Defuse can undo it afterwards. */
/* Play a card. Nothing pauses: it resolves now and is journalled so that a
   Nope or Defuse can undo it afterwards.

   `base.quiet` resolves the card without writing a journal entry of its own.
   That is how a Defuse turns a card around: the whole "no you" is ONE
   answerable line in the log rather than two, so a Nope aimed at it undoes
   the reflection and the Defuse together instead of picking one apart. */
function playResolved(base){
  const snap = base.quiet ? null : snapAll();   // taken while the card is still held
  const owner = S.players[base.actor];
  if (base.card && !base.card.synthetic){
    const i = owner.cards.indexOf(base.card);
    if (i >= 0) owner.cards.splice(i, 1);
    S.discard.push(base.card);
  }
  const aggressive = TARGETED.has(base.card.key) || base.card.key === "alter";
  if (!base.quiet){
    logAction(describeCard(base), aggressive ? "attack" : "info",
              { actor: base.actor, target: base.target, card: base.card,
                payload: base.payload, snap: snap, show: base.card.key });
  } else {
    // Part of resolving somebody's reaction, so no journal entry of its own —
    // it must not become separately answerable. The table still needs to SEE
    // it though: a Defused Alter or Favor is played by the defuser, on their
    // own terms, and without this nothing ever said which tokens they swapped
    // or which three cards they demanded.
    announce(describeCard(base), aggressive ? "attack" : "info");
  }
  logMsg(describeCard(base).replace(/<span[^>]*><\/span>/g, "") + ".");
  resolveCard(base);
}

/* Older call sites still say proposeAction. */
function proposeAction(base){ playResolved(base); }

/* Shared by a voluntary turn-Nope and the forced one after a win. */
function cancelTurn(actorId, wasWin){
  S.winner = null;
  if (S.phase === "over") S.phase = "main";
  S.select = null;
  const onTheirTurn = actorId === S.cur;
  if (onTheirTurn){
    wipeNopedTurn();                       // rewind the turn that earned it
  } else {
    // They crossed 10 on somebody else's turn, so there is no turn of theirs
    // to rewind — the Nope simply takes the points back.
    logMsg(`<b>${S.players[actorId].name}</b> reached the target on another player's turn.`);
  }
  stripWinningPoints(S.players[actorId], wasWin);

  // The denial could not reduce them below 10 — their points are buildings and
  // Longest Road from earlier turns, which a Nope may not touch. Rather than
  // let them carry a silent win into the next turn, the win stands.
  if (S.unstoppable !== null && S.unstoppable !== undefined){
    const w = S.unstoppable;
    S.unstoppable = null;
    declareWinner(w);
    return;
  }
  if (onTheirTurn) advancePlayer();
  else { S.armed = null; render(); botTick(); }
}

/* Rewinding the turn is not always enough: a player sitting on 8 points with a
   Feral Kitten in hand is still on 10 the moment the settlement comes down,
   and would simply win again next turn. A cancelled win therefore destroys the
   points that carried them over — hidden Feral Kittens first, then the knights
   propping up Largest Army — until they are actually short of the target. */
function stripWinningPoints(p, wasWin){
  // Only a cancelled WIN costs Feral Kittens. cancelTurn runs this on every
  // Noped turn, win or not, so without this guard Noping somebody who was
  // merely having a good turn burned their whole hand of hidden points — and
  // said so in the log, announcing cards nobody had any business seeing.
  if (!wasWin && totalVP(p) < S.winPoints) return;

  let ferals = 0;
  // A cancelled win costs EVERY Feral Kitten in the hand, not just enough of
  // them to drop back under ten. Taking the minimum left a player parked on
  // nine with a spare, winning again the moment they laid one road — the Nope
  // bought a turn rather than denying the win.
  //
  // Knights are deliberately NOT taken. One played on the cancelled turn is
  // already undone by wipeNopedTurn; knights from earlier turns, and the
  // Largest Army resting on them, were never part of what is being cancelled.
  for (let i = p.cards.length - 1; i >= 0; i--){
    if (p.cards[i].key !== "vp") continue;
    p.cards.splice(i, 1);                     // out of the game, not discarded
    ferals++;
  }
  if (totalVP(p) >= S.winPoints){
    // Their 10 points are buildings and Longest Road from earlier turns —
    // there is nothing a Nope is allowed to destroy. Let it stand rather
    // than leave them parked on 10 forever.
    logMsg(`<span style="color:#d98b4b"><b>${p.name}</b> is still on ` +
           `${totalVP(p)} — nothing left that a Nope can take.</span>`);
    S.unstoppable = p.id;
  }
  if (ferals){
    const what = ferals === 1 ? "their Feral Kitten" :
                 "all " + ferals + " of their Feral Kittens";
    logMsg(`<span style="color:#d98b4b">The cancelled win costs <b>${p.name}</b> ${what}.</span>`);
    announce(pdot(p) + " loses " + what + " to the cancelled win", "big", 5600);
  }
}

/* ── Forced Nope on a win ────────────────────────────────────────────────
  If someone hits the target VP, the next player in turn order who holds a Nope must
   spend it. Without that, everyone sits on their Nopes waiting for somebody
   else to spend theirs first.                                             */
function forcedNoperFor(winnerId){
  const n = S.players.length;
  for (let i = 1; i < n; i++){
    const id = (winnerId + S.dir * i + n * n) % n;
    if (id === winnerId) continue;
    if (S.players[id].cards.some(c => c.key === "nope")) return id;
  }
  return null;
}

function forcedWinNope(winner, pid){
  promptFor(pid);
  const p = S.players[pid];
  const i = p.cards.findIndex(c => c.key === "nope");
  S.discard.push(p.cards.splice(i, 1)[0]);
  logMsg(`<b>${winner.name}</b> reaches ${S.winPoints} VP — <b>${p.name}</b> is forced to Nope it.`);
  announce("🏆 " + pdot(winner) + " reached " + S.winPoints + " VP — " + pdot(p) +
           " is <b>forced to Nope</b> it", "big", 6000);
  // Only the player being forced gets a prompt. Everyone else just sees it
  // happen — being asked to confirm somebody else's obligation is noise.
  if (isBot(pid)){ cancelTurn(winner.id, true); return; }
  openModal("Forced Nope", `
    <div class="warnbox"><b>${winner.name}</b> just reached ${S.winPoints} victory points.
    <b>${p.name}</b> is the next player in turn order holding a Nope, so they must
    spend it — no choice. ${winner.name}'s turn is cancelled and everything they
    gained this turn is destroyed, including whatever took them to the target.</div>`,
    [{ label:`Cancel ${winner.name}'s turn`, cls:"warn",
       fn: () => { closeModal(); cancelTurn(winner.id, true); } }]);
}

/* ══════════════════════════════════════════════════════════════════════
   TURN FLOW
   ══════════════════════════════════════════════════════════════════════ */

let turnTimerHandle = null;
function timerEnabled(){ return !!(S && S.turnSeconds); }
function startTurnTimer(){
  if (!timerEnabled()) return;
  S.turnTimerRemaining = S.turnSeconds;
  S.turnTimerPaused = false;
  S.turnTimerPauseReason = null;
  S.turnTimerUntil = Date.now() + S.turnSeconds * 1000;
  scheduleTurnTimer();
}
function pauseTurnTimer(reason){
  if (!timerEnabled() || S.turnTimerPaused) return;
  S.turnTimerRemaining = Math.max(0, (S.turnTimerUntil - Date.now()) / 1000);
  S.turnTimerPaused = true;
  S.turnTimerPauseReason = reason || "choice";
  S.turnTimerUntil = 0;
  render();
}
function resumeTurnTimer(){
  if (!timerEnabled() || !S.turnTimerPaused) return;
  S.turnTimerPaused = false;
  S.turnTimerPauseReason = null;
  S.turnTimerUntil = Date.now() + S.turnTimerRemaining * 1000;
  scheduleTurnTimer();
}
function scheduleTurnTimer(){
  if (turnTimerHandle) clearTimeout(turnTimerHandle);
  if (!timerEnabled() || S.turnTimerPaused || S.phase === "over") return;
  turnTimerHandle = setTimeout(turnTimerTick, 250);
}
function turnTimerTick(){
  turnTimerHandle = null;
  if (window.NET && NET.isGuest && NET.isGuest()){
    render();
    scheduleTurnTimer();
    return;
  }
  if (!timerEnabled() || S.phase === "over") return;
  if (S.seven || S.turnTimerPaused){ scheduleTurnTimer(); return; }
  if (S.turnTimerUntil > Date.now()){
    render();
    scheduleTurnTimer();
    return;
  }
  S.turnTimerRemaining = 0;
  S.turnTimerUntil = 0;
  if (!S.pending && !S.select && (S.phase === "main" || S.phase === "roll")){
    logMsg("⏱ " + pdot(cur()) + "'s turn timer expires.");
    announce("⏱ " + pdot(cur()) + "'s turn ends", "attack");
    doEndTurn();
  } else {
    S.turnTimerPaused = true;
    S.turnTimerPauseReason = "choice";
    render();
  }
}
function turnTimerDisplay(){
  if (!timerEnabled() || (!S.turnTimerUntil && !S.turnTimerPaused)) return "";
  const left = S.turnTimerPaused ? S.turnTimerRemaining
                                 : Math.max(0, (S.turnTimerUntil - Date.now()) / 1000);
  const pct = Math.min(100, Math.max(0, left / S.turnSeconds * 100));
  return `<span class="turntimer"><span class="timerfill" style="width:${pct}%"></span>` +
         `<span class="timertext">${Math.ceil(left)}s</span></span>`;
}

/* Ending a turn no longer polls the table for Nopes. A Nope must be played
   during the turn it is meant to cancel — once the turn is over it is too
   late, which also removes the prompt that fired after every single turn. */
function requestEndTurn(){
  // Checked before the intent goes out AND again when the host replays it, so
  // a terminal cannot end a turn it still owes a discard on.
  if (owesAnswer()){ hint("Finish the open window first."); return; }
  if (netSend("endTurn")) return;
  if (S.select){ hint("Finish or cancel the current board action first."); return; }
  doEndTurn();
}

function doEndTurn(){
  if (timerEnabled()){
    if (turnTimerHandle) clearTimeout(turnTimerHandle);
    turnTimerHandle = null;
    S.turnTimerUntil = 0;
    S.turnTimerRemaining = 0;
    S.turnTimerPaused = false;
    S.turnTimerPauseReason = null;
  }
  const ended = S.turnCounter;
  if (S.extraTurn){
    S.extraTurn = false;
    beginHandover(ended);
    S.phase = "roll";
    S.rolled = null;
    S.seven = null;
    S.turnCounter++;
    S.turnRec = freshTurnRecord();
    logMsg(`<b>${cur().name}</b> takes another turn.`);
    closeAllPanels();
    render();
    botTick();
    return;
  }
  beginHandover(ended);
  advancePlayer();
}

function advancePlayer(){
  const n = S.players.length;
  let guard = 0;
  do {
    S.cur = (S.cur + S.dir + n) % n;
    guard++;
    if (cur().skipTokens > 0){
      cur().skipTokens--;
      logMsg(`<b>${cur().name}</b>'s turn is skipped.`);
      continue;
    }
    break;
  } while (guard < n * 3);

  S.phase = "roll";
  S.rolled = null;
  S.armed = null;
  S.seven = null;
  S.robberDue = [];
  S.turnCounter++;
  S.turnRec = freshTurnRecord();
  clearImplodeClock();
  // Trades, purchases and bank exchanges all belong to the turn that opened
  // them. Leaving one standing would let it be settled against a board that
  // has moved on — and an unanswered offer stops the bots dead.
  closeAllPanels();
  render();
  botTick();

  // Final sweep. A crossing can happen while the PREVIOUS turn was resolving —
  // cancelling a turn recomputes Longest Road, which can hand it to a third
  // player who was not being examined at the time. Guarded because resolving
  // that win re-enters this function.
  if (!S.sweeping){
    S.sweeping = true;
    try { checkVictory(); } finally { S.sweeping = false; }
  }
}

/* A win does not always land on the player whose turn it is. Building a
   settlement can cut someone's road and hand Longest Road to a THIRD player,
   and a cancelled turn can shift Longest Road or Largest Army the same way.
   Checking only the current player let those crossings pass unnoticed, so the
   player carried 10+ into their own turn — and a Nope there could not undo a
   win that had been earned on somebody else's turn. Every player is checked. */
function checkVictory(){
  if (S.winner !== null || S.phase === "over") return;
  let claimant = totalVP(cur()) >= S.winPoints ? cur() : null;
  if (!claimant){
    for (const q of S.players)
      if (totalVP(q) >= S.winPoints && (!claimant || totalVP(q) > totalVP(claimant))) claimant = q;
  }
  if (!claimant) return;
  // An Imploding Kitten makes its turn un-Nopeable, and that includes the win
  // it produces. The forced-Nope rule used to bypass this entirely.
  if (implodeActive() && claimant.id === S.cur){
    logMsg(`<b>${claimant.name}</b> wins on an imploded turn — no Nope can touch it.`);
    announce("\ud83d\udca5 " + pdot(claimant) + " wins on an <b>imploded turn</b> — un-Nopeable", "big");
    declareWinner(claimant.id);
    return;
  }
  // Not optional: the next player in turn order holding a Nope must spend it.
  const forced = forcedNoperFor(claimant.id);
  if (forced !== null) forcedWinNope(claimant, forced);
  else declareWinner(claimant.id);
}

function declareWinner(pid){
  const p = S.players[pid];
  S.winner = pid;
  S.phase = "over";
  S.select = null;
  S.armed = null;
  S.revealed = true;              // every hand is face up once the game is done
  clearImplodeClock();
  logMsg(`🏆 <b>${p.name}</b> wins with ${totalVP(p)} victory points!`);
  announce("🏆 " + pdot(p) + " wins with <b>" + totalVP(p) + "</b> victory points", "big");
  render();
  showStandings();
}

/* The final table, rebuilt on demand so it can be reopened after closing. */
function standingsHTML(){
  const p = S.players[S.winner];
  const rest = S.players.filter(q => q.id !== p.id)
                        .sort((a, b) => totalVP(b) - totalVP(a) ||
                                        (b.cities * 2 + b.settlements) - (a.cities * 2 + a.settlements));
  const order = [p].concat(rest);

  let h = `<p class="sub">Final standings — every hand is revealed.</p>
    <table class="rank"><tr><th></th><th>Player</th><th>Breakdown</th><th style="text-align:right">VP</th></tr>`;
  order.forEach((q, i) => {
    const bits = [];
    if (q.settlements) bits.push(`${q.settlements} settlement${q.settlements === 1 ? "" : "s"}`);
    if (q.cities)      bits.push(`${q.cities} cit${q.cities === 1 ? "y" : "ies"} (+${q.cities * 2})`);
    if (vpCards(q))    bits.push(`${vpCards(q)} Feral`);
    if (S.longestRoad.owner === q.id) bits.push("Longest Road +2");
    if (S.largestArmy.owner === q.id) bits.push(`Largest Army +2 (${q.knights}⚔)`);
    h += `<tr class="${i === 0 ? "win" : ""}">
            <td class="pl">${i + 1}</td>
            <td><span class="who"><span class="dot" style="background:${q.color}"></span>${q.name}</span></td>
            <td class="brk">${bits.length ? bits.join(" · ") : "—"}</td>
            <td class="tot">${totalVP(q)}</td>
          </tr>`;
  });
  h += `</table>`;

  // What everyone was still holding at the end.
  h += `<h4 style="margin:14px 0 6px;font-size:13px">Kitten cards still in hand</h4>`;
  for (const q of order){
    const counts = {};
    for (const c of q.cards){
      const nm = KITTEN[c.key].name;
      counts[nm] = (counts[nm] || 0) + 1;
    }
    const names = Object.keys(counts)
      .map(nm => `<span class="rchip">${counts[nm] > 1 ? counts[nm] + "× " : ""}${nm}</span>`);
    h += `<div class="artrow" style="align-items:flex-start">
            <span class="dot" style="background:${q.color};margin-top:4px"></span>
            <span class="f" style="color:var(--ink)">${
              names.length ? names.join(" ") : "<i style='color:var(--dim)'>nothing</i>"}</span>
          </div>`;
  }
  return h;
}

function showStandings(){
  if (S.winner === null) return;
  openModal(`${S.players[S.winner].name} wins`, standingsHTML(), [
    { label:"Review board", fn: () => { closeModal(); render(); } },
    { label:"New Game", cls:"primary", fn: () => { closeModal(); newGameDialog(); } }
  ]);
}

/* ══════════════════════════════════════════════════════════════════════
   TRADING
   ══════════════════════════════════════════════════════════════════════ */

function bankTradeDialog(){
  if (owesAnswer()){ hint("Finish the open window first."); return; }
  if (netSend("bankTrade")) return;
  if (!myTurnNow()) return;
  const p = cur();
  const give_ = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };   // in LOTS, not cards
  const get_  = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };   // in single cards

  const lots  = () => RES.reduce((n, r) => n + give_[r], 0);
  const units = () => RES.reduce((n, r) => n + get_[r], 0);
  const cost  = (r) => give_[r] * tradeRate(p, r);

  const refresh = () => {
    const spend = {};
    for (const r of RES) spend[r] = cost(r);

    // 4:1 is the default, so printing it on all five buttons is noise that also
    // wraps the row. The badge appears only where a port beats it — which is
    // the only time the rate is worth reading.
    let h = `<p class="sub">Click to add, the − in the corner takes one back, and
             clicking past the limit clears it. 4:1 unless a port says otherwise;
             lots and cards must match.</p>`;

    h += `<div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Give — one lot at your rate</div>
          <div class="pick tight">`;
    for (const r of RES){
      const rate = tradeRate(p, r);
      h += `<button ${p.res[r] >= rate ? "" : "disabled"} onclick="window.__bGive('${r}',1)"
              title="${RES_NAME[r]} — ${rate}:1, you hold ${p.res[r]}">
              ${give_[r] ? `<span class="ct minus" title="Take one lot back"
                              onclick="event.stopPropagation();window.__bGive('${r}',-1)">−</span>` : ""}
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:3px"></span>
              ${RES_NAME[r]}${rate < 4 ? ` <span class="rate">${rate}:1</span>` : ""}<b
                class="ct ${give_[r] ? "" : "off"}">×${give_[r] || 1}</b></button>`;
    }
    h += `</div><div style="height:6px"></div>`;

    h += `<div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">Take — one card each</div>
          <div class="pick tight">`;
    for (const r of RES){
      h += `<button ${S.bank[r] > 0 ? "" : "disabled"} onclick="window.__bGet('${r}',1)"
              title="${RES_NAME[r]} — bank holds ${S.bank[r]}">
              ${get_[r] ? `<span class="ct minus" title="Take one card back"
                             onclick="event.stopPropagation();window.__bGet('${r}',-1)">−</span>` : ""}
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:3px"></span>
              ${RES_NAME[r]}<b class="ct ${get_[r] ? "" : "off"}">×${get_[r] || 1}</b></button>`;
    }
    h += `</div>`;

    const bal = lots() === units() && lots() > 0;
    if (lots() || units()){
      h += `<div class="tsum">${resList(spend)}<span class="arrow">→</span>${resList(get_)}
              ${lots() !== units()
                 ? `<span class="mismatch">${lots()} lot${lots() === 1 ? "" : "s"} vs ${
                      units()} card${units() === 1 ? "" : "s"}</span>` : ""}
            </div>`;
    }

    openPanel("bank", p.id, "Bank / port trade", h, [
      { label:"Clear", fn: () => { for (const r of RES){ give_[r] = 0; get_[r] = 0; } refresh(); } },
      { label:"Cancel", fn: () => { closePanel("bank"); render(); } },
      { label:"Trade", cls:"primary", disabled: !bal, fn: () => {
          closePanel("bank");
          const snapBefore = snapAll();
          for (const r of RES) if (spend[r]) take(p, r, spend[r]);
          for (const r of RES) if (get_[r])  give(p, r, get_[r]);
          logMsg(`<b>${p.name}</b> trades with the bank.`);
          bankToast(p, spend, get_, snapBefore);
          render();
        } }
    ]);
  };

  window.__bGive = (r, d) => {
    const rate = tradeRate(p, r);
    give_[r] = d < 0 ? Math.max(0, give_[r] - 1)
                     : (p.res[r] >= (give_[r] + 1) * rate ? give_[r] + 1 : 0);
    refresh();
  };
  window.__bGet = (r, d) => {
    get_[r] = d < 0 ? Math.max(0, get_[r] - 1)
                    : (S.bank[r] > get_[r] ? get_[r] + 1 : 0);
    refresh();
  };
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════
   OPEN TRADE
   ══════════════════════════════════════════════════════════════════════
   Build one offer, put it to the whole table at once, then pick from
   whoever accepted. Bots answer immediately; other people get
   Accept / Decline buttons in the same list.
   ══════════════════════════════════════════════════════════════════════ */
function playerTradeDialog(){
  if (owesAnswer()){ hint("Finish the open window first."); return; }
  if (netSend("playerTrade")) return;
  // The whole negotiation sits on the offering player's screen: the offer goes
  // out to every seat at once and each answers on their own, with the offerer
  // watching the replies land before choosing who to deal with.
  const p = cur();
  const offer = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  const want  = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  let replies = null;                 // playerId -> "yes" | "no" | "wait"
  let settled = false;                // one offer settles exactly once
  const WANT_CAP = 6;

  const fmt = o => RES.filter(r => o[r] > 0).map(r => o[r] + " " + RES_NAME[r]).join(", ") || "nothing";
  const others = () => S.players.filter(q => q.id !== p.id);
  const anyOffer = () => RES.some(r => offer[r] > 0) || RES.some(r => want[r] > 0);

  /* Click a resource to add one; click past the most you could put in and it
     wraps back to none. This replaced a −/+ pair on its own tall row for each
     of the five resources, twice over — ten rows, which put a scrollbar in a
     panel that is meant to be taken in at a glance. Same click-to-add idiom
     the bank panel already used. */
  function pickRow(label, obj, fn, capOf){
    let h = `<div style="margin:0 0 4px;color:var(--dim);font-size:11.5px">${label}</div>
             <div class="pick tight">`;
    for (const r of RES){
      const cap = capOf(r);
      h += `<button ${cap > 0 ? "" : "disabled"} onclick="window.${fn}('${r}',1)"
              title="${RES_NAME[r]}${cap > 0 ? " — up to " + cap + ", then back to none" : " — none to give"}">
              ${obj[r] ? `<span class="ct minus" title="Take one back"
                            onclick="event.stopPropagation();window.${fn}('${r}',-1)">−</span>` : ""}
              <span class="swatch" style="background:${RES_COLOR[r]};display:inline-block;margin-right:3px"></span>
              ${RES_NAME[r]}<b class="ct ${obj[r] ? "" : "off"}">×${obj[r] || 1}</b></button>`;
    }
    return h + `</div>`;
  }

  /* ── stage 1: compose ── */
  function compose(){
    let h = `<p class="sub">Click to add; the − in the corner takes one back, and
             clicking past the limit clears it.</p>
             ${pickRow("You give", offer, "__tof", r => p.res[r])}
             <div style="height:6px"></div>
             ${pickRow("You want", want, "__twa", () => WANT_CAP)}`;
    openPanel("trade", p.id, "Open trade", h, [
      { label:"Clear", disabled: !anyOffer(), fn: () => {
          for (const r of RES){ offer[r] = 0; want[r] = 0; } compose(); } },
      { label:"Cancel", fn: () => { closePanel("trade"); render(); } },
      { label:"Ask everyone", cls:"primary", disabled: !anyOffer(), fn: ask }
    ]);
  }

  /* ── stage 2: put it to the table ──
     Everyone answers for themselves. Bots decide on the spot; people are asked
     one at a time, each on their own screen. Only one dialog can be in flight
     across the table at once, so the offer goes round the room rather than out
     to everybody together — slower, but nobody can be answered FOR.

     This used to hand the offerer Accept and Decline buttons for every other
     player. Fine when the only person playing was the one holding the mouse;
     once other people were at other screens it meant you could simply take
     their resources. Nobody answers for anybody else now. */
  function ask(){
    replies = {};
    const toAsk = [];
    for (const q of others()){
      const canPay = RES.every(r => q.res[r] >= want[r]);
      if (!canPay){ replies[q.id] = "cant"; continue; }
      const ag = agentOf(q.id);
      if (ag && ag.considerTrade) replies[q.id] = ag.considerTrade(p, q, offer, want) ? "yes" : "no";
      else toAsk.push(q.id);
    }
    // Kept in the written log, but NOT put on screen. An offer is not an
    // action: nothing has moved, and it may well be declined by everybody. The
    // log is for what happened, and a trade that is agreed writes its own line
    // when it settles. Bot refusals have never been announced either, so this
    // makes the two match — the log stopped being a running commentary on
    // people thinking about trades.
    logMsg(`<b>${p.name}</b> offers ${fmt(offer)} for ${fmt(want)}.`);
    askAll(toAsk);
  }

  /* The offer goes to everyone who could pay, all at once, each on their own
     screen. Panels rather than modals, so nobody is locked out of the board or
     the log while they think about it. */
  function askAll(queue){
    for (const qid of queue){
      replies[qid] = "wait";
      askSeat(qid);
    }
    results();
  }

  function askSeat(qid){
    const key = "offer" + qid;
    const answer = (a) => { replies[qid] = a; closePanel(key); results(); };
    openPanel(key, qid, "Trade offer from " + esc(p.name),
      `<div class="stack"><div class="tline"><span>You get</span>${resList(offer)}</div>
         <div class="tline"><span>You give</span>${resList(want)}</div></div>`,
      [ { label:"Decline", fn: () => answer("no") },
        { label:"Accept", cls:"primary", fn: () => answer("yes") } ]);
  }

  function dropOffers(){
    for (const q of others()) closePanel("offer" + q.id);
  }

  function results(){
    const list = others();
    let h = `<div class="stack"><div class="tline"><span>You give</span>${resList(offer)}</div>
             <div class="tline"><span>You want</span>${resList(want)}</div></div>`;
    h += `<div style="margin-top:10px">`;
    for (const q of list){
      const st = replies[q.id];
      h += `<div class="counter">
              <span class="lbl"><span class="dot" style="background:${q.color}"></span><b>${q.name}</b></span>`;
      if (st === "wait"){
        h += `<span style="color:var(--dim);font-size:12px">thinking…</span>`;
      } else if (st === "yes"){
        h += `<span style="color:#6fbf7a;font-size:12px;margin-right:8px">accepted</span>
              <button class="sm primary" onclick="window.__deal(${q.id})">Trade</button>`;
      } else if (st === "cant"){
        h += `<span style="color:var(--dim);font-size:12px">can't pay</span>`;
      } else {
        h += `<span style="color:#b06a6a;font-size:12px">declined</span>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
    const waiting = list.some(q => replies[q.id] === "wait");
    if (!waiting && !list.some(q => replies[q.id] === "yes"))
      h += `<div class="warnbox">Nobody took it. Try a different offer.</div>`;

    openPanel("trade", p.id, "Open trade", h, [
      { label:"New offer", fn: () => { dropOffers(); compose(); } },
      { label:"Done", cls:"primary", fn: () => { dropOffers(); closePanel("trade"); render(); } }
    ]);
  }

  window.__tof = (r, d) => {
    offer[r] = d < 0 ? Math.max(0, offer[r] - 1)
                     : (offer[r] >= p.res[r] ? 0 : offer[r] + 1);
    compose();
  };
  window.__twa = (r, d) => {
    want[r] = d < 0 ? Math.max(0, want[r] - 1)
                    : (want[r] >= WANT_CAP ? 0 : want[r] + 1);
    compose();
  };
  /* One offer, one deal. Every acceptor used to keep a live Trade button after
     the first had gone through, so clicking a second one ran the transfer
     again — conjuring resources out of nothing and pushing the offerer
     negative. The negotiation now closes the moment it settles, and both
     sides are checked for the goods first, since a Nope may have moved them. */
  window.__deal = (qid) => {
    if (settled) return;
    const q = S.players[qid];
    if (!RES.every(r => q.res[r] >= want[r])){ replies[qid] = "cant"; results(); return; }
    if (!RES.every(r => p.res[r] >= offer[r])){
      hint("You no longer have what you offered.");
      settled = true; dropOffers(); closePanel("trade"); render();
      return;
    }
    settled = true;
    const snapBefore = snapAll();
    for (const r of RES){
      p.res[r] -= offer[r]; q.res[r] += offer[r]; noteGain(q, r, offer[r]);
      q.res[r] -= want[r];  p.res[r] += want[r];  noteGain(p, r, want[r]);
    }
    logMsg(`<b>${p.name}</b> ⇄ <b>${q.name}</b>: gave ${fmt(offer)} for ${fmt(want)}.`);
    tradeToast(p, q, offer, want, snapBefore);
    dropOffers();
    closePanel("trade");
    render();
  };

  compose();
}

/* ══════════════════════════════════════════════════════════════════════
   DISCARD DIALOG (used by the 7-roll and by Attack)
   ══════════════════════════════════════════════════════════════════════ */

function discardDialog(p, n, done, opts){
  const timerPause = !(opts && opts.answers !== undefined);
  if (timerPause) pauseTurnTimer("choice");
  const ag = agentOf(p.id);
  if (ag && ag.chooseDiscard){
    const pick = ag.chooseDiscard(p, n);
    flyCards(p.id, null, pick);            // to the bank, face up
    for (const r of RES) take(p, r, pick[r] || 0);
    logMsg("<b>" + p.name + "</b> discards " + n + ".");
    render();
    // Deferred so the discard is visible before play moves on. If a new game
    // has started by the time it fires, it belongs to a game that no longer
    // exists — S is a fresh object then, and continuing would reach into it.
    const gameAtCall = S;
    setTimeout(function(){
      if (S !== gameAtCall) return;
      if (timerPause) resumeTurnTimer();
      done();
    }, AI_PACE);
    return;
  }
  const pick = { wood:0, brick:0, sheep:0, wheat:0, ore:0 };
  const refresh = () => {
    promptFor(p.id);         // every redraw is still this player's dialog
    const total = RES.reduce((s, r) => s + pick[r], 0);
    let h = `<p class="sub"><b>${p.name}</b> must discard <b>${n}</b> resource card${n === 1 ? "" : "s"}.</p>`;
    for (const r of RES){
      h += `<div class="counter">
              <span class="lbl"><span class="swatch" style="background:${RES_COLOR[r]}"></span>${RES_NAME[r]} — has ${p.res[r]}</span>
              <button class="sm" onclick="window.__dc('${r}',-1)">−</button>
              <span class="val">${pick[r]}</span>
              <button class="sm" onclick="window.__dc('${r}',1)">+</button>
            </div>`;
    }
    h += `<div class="stack">Discarding ${total} of ${n}</div>`;
    // An Attack or a seven can be answered from right here rather than paid
    // for first: a Nope throws the dice again, a Defuse buys this hand out of
    // the cut. Whatever you would rather do with the card, the dialog also
    // folds away — see openModal — so the log is reachable to drop it on.
    const answers = opts && opts.answers;
    const ansEntry = answers === undefined ? null : S.journal.find(x => x.id === answers);
    const react = promptReactions(p.id, answers);
    openModal("Discard — " + esc(p.name), h + (react.length ? reactNoteHTML(ansEntry) : "") +
      `<p class="mininote">Fold this away with − if you would rather answer the
       log first. Nothing moves until you come back and confirm.</p>`, [
      { label:"Confirm", cls:"primary", disabled: total !== n, fn: () => {
          closeModal();
          if (timerPause) resumeTurnTimer();
          flyCards(p.id, null, pick);      // to the bank, face up
          for (const r of RES) take(p, r, pick[r]);
          logMsg(`<b>${p.name}</b> discards ${n}.`);
          render();
          done();
        } }
    ].concat(react), { mini: true });
  };
  window.__dc = (r, d) => {
    const total = RES.reduce((s, x) => s + pick[x], 0);
    if (d > 0 && (total >= n || pick[r] >= p.res[r])) return;
    pick[r] = Math.max(0, pick[r] + d);
    refresh();
  };
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════
   MODAL PLUMBING
   ══════════════════════════════════════════════════════════════════════ */

let modalEl = null;

/* Drawing and dismissing are split out from openModal/closeModal so that
   online play can hand a whole dialog to the browser it actually belongs to,
   and so that a dialog redrawing itself (every +/− on a counter reopens it)
   does not read as the dialog being dismissed. */
/* Folded-away state for the dialog on screen right now. A view concern and
   nothing more: it never travels, it survives the dialog redrawing itself
   (every +/− on a counter reopens the whole thing), and it is dropped the
   moment a different dialog takes the screen. */
let modalMini = false;
let modalKey  = null;
/* Forced dialogs are exactly the ones that may be folded away — a discard, a
   card aimed at you. Menus are not, and must not lock the table. */
let modalForced = false;

function drawLocalModal(title, bodyHTML, btnsHTML, canMini){
  // Same dialog redrawing itself, or a different one taking the screen? The
  // title says which. A redraw is written over the top of what is already
  // there rather than replacing it: these dialogs reopen on every click of a
  // counter, and tearing the overlay out to build a new one flashed, dropped
  // the scroll position in a long dialog and lost the folded state with it.
  if (!modalEl || modalKey !== title){
    dismissLocalModal();
    modalKey = title;
    modalMini = false;
    modalEl = document.createElement("div");
    modalEl.innerHTML = `<div class="modal"><h2></h2><div class="mbody"></div>
                         <div class="actions"></div></div>`;
    // Folded away, the whole tab is the way back — the button alone is a small
    // target for something you fold and unfold several times in a turn. Bound
    // once, to an <h2> that now outlives every redraw.
    modalEl.querySelector("h2").addEventListener("click", (ev) => {
      if (modalMini && !ev.target.closest(".minibtn")) toggleModalMini();
    });
    document.body.appendChild(modalEl);
  }
  document.body.classList.add("hasmodal");
  modalForced = !!canMini;
  modalEl.className = "overlay" + (canMini ? " canmini" : "") +
                      (canMini && modalMini ? " mini" : "");

  const mini = canMini
    ? `<button class="minibtn" onclick="toggleModalMini()"
         title="Fold this away — the board and the log stay live, and it is still owed"
       ><span class="down">−</span><span class="up">▴</span></button>` : "";
  // Written only where it differs. An identical write is not free: it drops
  // any text selection inside the dialog and costs a layout for nothing.
  const put = (el, html) => {
    if (!el || el.dataset.html === html) return;
    el.dataset.html = html;
    el.innerHTML = html;
  };
  put(modalEl.querySelector("h2"), mini + `<span class="mtitle">${title}</span>`);
  put(modalEl.querySelector(".mbody"), bodyHTML);
  const acts = modalEl.querySelector(".actions");
  put(acts, btnsHTML || "");
  acts.style.display = btnsHTML ? "" : "none";
}
function dismissLocalModal(){
  if (modalEl){ modalEl.remove(); modalEl = null; }
  modalForced = false;
  document.body.classList.remove("hasmodal");
}

/* Fold the dialog into a tab in the corner, or bring it back. Everything
   behind it — the log to drop a Nope on, your hand to drag it from — is live
   again while it is folded, and the table still waits for the answer. */
function toggleModalMini(){
  if (!modalEl || !modalEl.classList.contains("canmini")) return;
  modalMini = !modalMini;
  modalEl.classList.toggle("mini", modalMini);
}

/* The dialog has been taken off this screen by somebody else — online, the
   host withdrawing it. Called from net.js, since closeModal is the host's way
   of doing this and a terminal never runs it. */
function forgetModalFold(){ modalKey = null; modalMini = false; modalForced = false; }

/* Tag the dialog about to be opened as belonging to one seat. Online, that is
   what sends it to the right person instead of drawing it on the host's
   screen; offline it does nothing at all. */
function promptFor(pid){ if (window.NET) NET.promptSeat = pid; }

/* `opts.mini` marks a dialog that may be folded out of the way. Only the
   forced ones want it — a discard, a card aimed at you — and only because
   answering them is sometimes better done from the log than from the dialog. */
function openModal(title, bodyHTML, buttons, opts){
  const canMini = !!(opts && opts.mini);
  // Shipped elsewhere: nothing to draw here, and anything already on this
  // screen belongs to a dialog that has been handed away.
  if (window.NET && NET.shipModal && NET.shipModal(title, bodyHTML, buttons, canMini)){
    dismissLocalModal();
    forgetModalFold();
    return;
  }
  // No dismissal on this path — drawLocalModal decides for itself whether this
  // is a new dialog or the same one redrawing, and reuses the element when it
  // can. Clearing it here first made every redraw a new dialog, which is the
  // flicker these panels and prompts used to have.
  let btns = "";
  (buttons || []).forEach((b, i) => {
    btns += `<button class="${b.cls || ""}" ${b.disabled ? "disabled" : ""} onclick="window.__mb(${i})">${b.label}</button>`;
  });
  drawLocalModal(title, bodyHTML, btns, canMini);
  window.__mb = (i) => buttons[i].fn();
}
function closeModal(){
  modalKey = null;
  modalMini = false;
  dismissLocalModal();
  if (S && S.turnTimerPauseReason === "choice") resumeTurnTimer();
  if (window.NET && NET.clearRemote) NET.clearRemote();
}

/* ══ SHOWCASE ═════════════════════════════════════════════════════
   A card being played turns over in the middle of the board, and a seven
   lands with a thump. Both fade after a couple of seconds. The game log is
   untouched and still has everything — this is only so that a play is
   something you SEE rather than something you find by reading.

   Driven off the journal rather than the code that plays the card, so a
   terminal shows it too: the entry arrives with the rest of the state and
   the newest one gets its moment.
   ═══════════════════════════════════════════════════════════════════ */

const SHOWCASE_MS = 2300;
let lastShowcased = -1;
let showcaseTimer = null;

/* What the board looked like last repaint, so a change can be pointed at.
   Kept out of S deliberately: it is a view concern, and comparing it here
   means a terminal reacts to the same change the host does without anything
   extra having to travel. */
let boardWatch = null;

/* ══ MOVEMENT ═════════════════════════════════════════════════════
   Everything below is presentation and nothing below is state. It reads the
   live DOM for its coordinates, so it always measures after a repaint, and it
   fails quietly: no board on screen, no animation, no error.
   ═════════════════════════════════════════════════════════════════ */

/* Asked for less motion, give less. */
const fxOn = !(window.matchMedia &&
               window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* Every one of these is measured a frame late, so the board it is measuring
   has been laid out. A hidden tab never runs that frame, so rather than let a
   backlog pile up and replay against a board that has moved on, an animation
   asked for while nobody is looking is simply dropped. */
function fxSoon(fn){
  if (!fxOn || (typeof document !== "undefined" && document.hidden)) return;
  requestAnimationFrame(fn);
}

/* Nothing on this layer matters enough to be worth a thousand nodes. Each one
   takes itself off when it lands, but a burst that outruns its own clean-up
   loses its oldest members rather than the frame rate. */
const FX_MAX_NODES = 60;
function fxLayer(){
  let el = document.getElementById("fx");
  if (!el){ el = document.createElement("div"); el.id = "fx"; document.body.appendChild(el); }
  while (el.childElementCount > FX_MAX_NODES) el.removeChild(el.firstChild);
  return el;
}
/* Hex flashes live on the board itself, so they get the same treatment. */
function trimFlashes(area){
  const old = area.querySelectorAll(".hexflash");
  for (let i = 0; i + 24 < old.length; i++) old[i].remove();
}
function centreOf(el){
  if (!el) return null;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return null;
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
/* Window coordinates for the things journeys start and end at. */
function seatPoint(pid){
  return centreOf(document.querySelector('.pcard[data-pid="' + pid + '"]'));
}
/* Resources land on the resource counter itself rather than in the middle of
   the seat card, so the card you are watching arrives at the number it is
   about to change. Kitten cards keep the middle: their counter is already
   there. */
function seatResPoint(pid){
  return centreOf(document.querySelector('.pcard[data-pid="' + pid + '"] .stat.res')) ||
         seatPoint(pid);
}
/* And a kitten card lands on ITS counter, which sits beside the resource one.
   It used to fly to the middle of the seat card, which is where the counters
   were before the portrait took that space — so the one card that arrives
   face down was also the one that arrived nowhere in particular. */
function seatKitPoint(pid){
  return centreOf(document.querySelector('.pcard[data-pid="' + pid + '"] .stat.kit')) ||
         seatPoint(pid);
}
function boardPoint(x, y){
  const area = document.getElementById("boardArea");
  const pt = area && svgToScreen(x, y);
  if (!pt) return null;
  const ar = area.getBoundingClientRect();
  return { x: ar.left + pt.x, y: ar.top + pt.y, scale: pt.scale };
}
function hexPoint(hid){
  const h = hexes[hid];
  return h ? boardPoint(h.x, h.y) : null;
}
function deckPoint(){
  return centreOf(document.querySelector("#deckWrap .deck")) ||
         centreOf(document.getElementById("deckWrap"));
}

function resFaceHTML(r){
  const face = art("res", r);
  return face ? '<img src="' + face + '" alt="">'
              : '<span class="fxswatch" style="background:' + RES_COLOR[r] + '"></span>';
}
/* Kitten cards travel face DOWN. Which one it was is the owner's business. */
function kittenBackHTML(){
  const back = art("card", "back");
  return back ? '<img src="' + back + '" alt="">' : '<span class="fxback">🐱</span>';
}
/* So does the one resource card nobody is allowed to see: the one the robber
   takes. Everything else that moves resources is public and travels face up. */
function resBackHTML(){
  const back = art("res", "back");
  return back ? '<img src="' + back + '" alt="">' : '<span class="fxswatch hiddenface"></span>';
}

/* One card, flying from somewhere to somewhere — and standing still for a
   second at each end. A card that only ever moves cannot be read: you see
   something cross the screen and have to work out afterwards what it was and
   whose it became. It shows itself where it came from, crosses, and shows
   itself again where it landed.

   Several cards from the same place would sit exactly on top of one another
   through those two seconds, so each is fanned a little by its position in the
   run. */
const FX_IN = 180, FX_HOLD = 1000, FX_FLY = 620, FX_OUT = 260;
const FX_CARD_MS = FX_IN + FX_HOLD + FX_FLY + FX_HOLD + FX_OUT;

function flyCard(from, to, inner, cls, delay, idx){
  if (!fxOn || !from || !to) return;
  const el = document.createElement("div");
  el.className = "fxcard " + (cls || "");
  el.innerHTML = inner || "";
  fxLayer().appendChild(el);
  const i = idx || 0;
  const fan = { x: (i % 4) * 9 - 13, y: Math.floor(i / 4) * 7 - 6 };
  const at = (p, sc) => "translate(" + (p.x + fan.x) + "px," + (p.y + fan.y) +
                        "px) translate(-50%,-50%) scale(" + sc + ")";
  const t = FX_CARD_MS;
  const o1 = FX_IN / t;                       // shown at the source
  const o2 = (FX_IN + FX_HOLD) / t;           // starts across
  const o3 = (FX_IN + FX_HOLD + FX_FLY) / t;  // arrives
  const o4 = (t - FX_OUT) / t;                // held there, then goes
  const a = el.animate([
    { transform: at(from, .45), opacity: 0, offset: 0,  easing: "cubic-bezier(.2,.9,.3,1.3)" },
    { transform: at(from, 1),   opacity: 1, offset: o1, easing: "linear" },
    { transform: at(from, 1),   opacity: 1, offset: o2, easing: "cubic-bezier(.5,0,.3,1)" },
    { transform: at(to, 1),     opacity: 1, offset: o3, easing: "linear" },
    { transform: at(to, 1),     opacity: 1, offset: o4, easing: "ease-in" },
    { transform: at(to, .72),   opacity: 0, offset: 1 }
  ], { duration: t, delay: delay || 0, fill: "both" });
  const done = () => el.remove();
  a.onfinish = done; a.oncancel = done;
  // A tab sent to the background never runs the animation, so nothing would
  // ever fire onfinish and the layer would fill up.
  setTimeout(done, t + (delay || 0) + 400);
}

/* A hex lighting up as it pays out. */
function flashHex(hid){
  const h = hexes[hid];
  const area = document.getElementById("boardArea");
  if (!fxOn || !h || !area) return;
  const pt = svgToScreen(h.x, h.y);
  if (!pt) return;
  const el = document.createElement("div");
  el.className = "hexflash";
  const d = Math.round(HEX_SIZE * pt.scale * 1.8);
  el.style.width = el.style.height = d + "px";
  el.style.left = pt.x + "px";
  el.style.top  = pt.y + "px";
  el.style.setProperty("--fc", RES_COLOR[h.terrain] || "#fff");
  trimFlashes(area);
  area.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

/* The piece itself, drawn the shape it really is, for the overlay to fly in.
   The board tints a silhouette with an SVG filter, which only works inside the
   SVG that defines it — so the overlay carries its own copy of that filter and
   comes out identical to what lands. No art, no problem: the same procedural
   house, city and bar the board falls back to. */
let fxPieceId = 0;
function pieceSVG(kind, colour, w, h){
  const url = art("piece", kind === "road" ? "road" : kind);
  const W = Math.round(w), H = Math.round(h);
  if (url){
    const fid = "fxtint" + (fxPieceId++);
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 100 100"' +
           (kind === "road" ? ' preserveAspectRatio="none"' : '') + '>' +
             '<filter id="' + fid + '" x="-30%" y="-30%" width="160%" height="160%">' +
               '<feFlood flood-color="' + colour + '" result="col"/>' +
               '<feComposite in="col" in2="SourceGraphic" operator="in" result="body"/>' +
               '<feMorphology in="SourceGraphic" operator="dilate" radius="2" result="fat"/>' +
               '<feFlood flood-color="#0b0d10" result="dark"/>' +
               '<feComposite in="dark" in2="fat" operator="in" result="edge"/>' +
               '<feMerge><feMergeNode in="edge"/><feMergeNode in="body"/></feMerge>' +
             '</filter>' +
             '<image href="' + url + '" x="0" y="0" width="100" height="100"' +
             (kind === "road" ? ' preserveAspectRatio="none"' : '') +
             ' filter="url(#' + fid + ')"/>' +
           "</svg>";
  }
  // The board's own fallback shapes, at the board's own proportions.
  if (kind === "road")
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 100 24" preserveAspectRatio="none">' +
             '<rect x="1" y="1" width="98" height="22" rx="9" fill="' + colour +
             '" stroke="#0b0d10" stroke-width="3"/></svg>';
  if (kind === "city")
    return '<svg width="' + W + '" height="' + H + '" viewBox="-14 -12 28 24">' +
             '<path d="M-12,6 L-12,-3 L-4,-9 L-4,-3 L4,-3 L12,-3 L12,6 Z" fill="' + colour +
             '" stroke="#0b0d10" stroke-width="1.8"/></svg>';
  return '<svg width="' + W + '" height="' + H + '" viewBox="-11 -11 22 22">' +
           '<path d="M-9,4 L-9,-2 L0,-9 L9,-2 L9,4 Z" fill="' + colour +
           '" stroke="#0b0d10" stroke-width="1.8"/></svg>';
}

/* A piece coming down where it was placed. The board is not drawing it yet —
   plopBuild has taken it off the board for the duration — so what you are
   watching IS the piece arriving, rather than a flourish over one that landed
   a moment ago. */
function plop(pt, w, h, inner, ring, angle, colour, done){
  if (!pt){ done(); return; }
  const el = document.createElement("div");
  el.className = "plop";
  el.style.left = pt.x + "px";
  el.style.top  = pt.y + "px";
  if (angle) el.style.transform = "rotate(" + angle + "deg)";
  el.style.setProperty("--pcol", colour || "#fff");
  el.innerHTML = '<span class="plopbody" style="width:' + Math.round(w) +
                   "px;height:" + Math.round(h) + 'px">' + inner + "</span>" +
                 '<span class="plopring" style="width:' + ring + "px;height:" + ring + 'px"></span>';
  fxLayer().appendChild(el);
  setTimeout(function(){ el.remove(); done(); }, PLOP_MS);
}

/* Pieces that are mid-landing: drawBoard leaves these out, so each appears at
   the END of its animation rather than sitting there through it.

   Held with the time it started rather than as a bare flag, and read through
   landing() which expires anything older than the animation. A piece is on the
   board; the flourish that brings it in is not worth risking that. If the
   timer that clears it never runs — a suspended tab, a lost frame — the entry
   times itself out on the next repaint and the piece simply appears. */
const fxLanding = new Map();
const PLOP_MS = 520;
function landing(key){
  const t = fxLanding.get(key);
  if (t === undefined) return false;
  if (Date.now() - t > PLOP_MS + 500){ fxLanding.delete(key); return false; }
  return true;
}

/* Measured on the next frame, so the board has been laid out first. */
function plopBuild(kind, id, pid){
  if (!S || !S.players[pid]) return;
  const colour = S.players[pid].color;
  const key = (kind === "road" ? "e" : "v") + id;
  if (!fxOn || (typeof document !== "undefined" && document.hidden)) return;
  if (landing(key)) return;
  fxLanding.set(key, Date.now());
  const land = function(){
    fxLanding.delete(key);
    if (S) render();                    // and now the real piece is drawn
  };
  fxSoon(function(){
    if (kind === "road"){
      const e = edges[id];
      if (!e){ land(); return; }
      const a = vertices[e.v[0]], b = vertices[e.v[1]];
      const mid = boardPoint((a.x + b.x) / 2, (a.y + b.y) / 2);
      const pa = boardPoint(a.x, a.y), pb = boardPoint(b.x, b.y);
      if (!mid || !pa || !pb){ land(); return; }
      // The board draws a road the full length of its edge, 18 units thick.
      const len = Math.hypot(pb.x - pa.x, pb.y - pa.y);
      const th  = 18 * (mid.scale || 1);
      plop(mid, len, th, pieceSVG("road", colour, len, th), Math.round(len * 1.3),
           Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI, colour, land);
      return;
    }
    const v = vertices[id];
    if (!v){ land(); return; }
    const pt = boardPoint(v.x, v.y);
    if (!pt){ land(); return; }
    // 32 units for a settlement, 38 for a city — the board's own sizes.
    const d = (kind === "city" ? 38 : 32) * (pt.scale || 1);
    plop(pt, d, d, pieceSVG(kind === "city" ? "city" : "settlement", colour, d, d),
         Math.round(d * 2.1), 0, colour, land);
  });
}

/* ══ FLIGHTS ══════════════════════════════════════════════════════
   Cards that ought to be SEEN to move.

   These used to be called straight out of the game logic, which meant only
   the browser RUNNING that logic ever saw them. Online that is the host and
   nobody else: the host watched resources fly out of the ground, a trade
   cross between two seat cards and a robbery travel face down, and everyone
   else watched the numbers quietly change. Exactly the fault the feed had,
   and the same fix — the flight is written onto the state, travels with
   everything else, and every browser plays it off the record. The piece
   plops and the card reveals have always worked this way; now the rest does.

   There is a second reason to do it like this. A flight now carries what
   actually MOVED, copied at the instant it moved, rather than a reference to
   whatever object the caller happened to be holding at the time. An animation
   can no longer disagree with the board about how many cards changed hands,
   because the animation IS the receipt.
   ══════════════════════════════════════════════════════════════════ */

const FX_MAX_CARDS = 16;      // cards drawn for one flight
const FX_KEEP = 8;            // flights kept on the state and sent online

/* Short keys throughout: this is resent in full after every action, and a
   six-player payout is a dozen of them. */
function pushFx(rec){
  if (!S) return;
  if (!S.fx) S.fx = [];
  rec.id = ++S.msgId;
  S.fx.push(rec);
  while (S.fx.length > FX_KEEP) S.fx.shift();
  if (window.NET && NET.publishSoon) NET.publishSoon();
}

/* A resource bundle, copied, with the zeroes dropped. Copied because the
   caller's object is often still being written to; zeroes dropped because
   four of the five usually are. */
function fxBundle(o){
  const out = {};
  for (const r of RES) if (o && o[r] > 0) out[r] = o[r];
  return out;
}
function fxTotal(o){ let n = 0; for (const r of RES) n += (o && o[r]) || 0; return n; }

/* ── recording ── */

/* Cards out of the hexes that grew them.

   Capped against what the bank ACTUALLY handed over. The old version asked
   only whether something had been paid for that resource and then flew the
   whole claim, so a player owed three wood off two hexes and paid one by a
   nearly empty bank watched three cards arrive and their counter go up by
   one. */
function flyProduction(sources, paid){
  const left = (paid || []).map(o => Object.assign({}, o));
  const src = [];
  for (const g of sources){
    const room = (left[g.pid] && left[g.pid][g.r]) || 0;
    if (room <= 0) continue;
    const n = Math.min(g.n, room);
    left[g.pid][g.r] -= n;
    src.push({ h: g.hid, p: g.pid, r: g.r, n: n });
  }
  if (src.length) pushFx({ t:"prod", src: src });
}

/* A kitten card off the deck and into a hand, back showing the whole way. */
function flyKitten(pid){ pushFx({ t:"kit", p: pid }); }

/* Cards leaving one hand for another, or for the bank. `toPid` null means the
   bank, which sits just below the loser's own seat card — the same place their
   bank trades happen.

   Face up unless told otherwise. The only exchange in the game nobody is
   entitled to watch is the robbery, so that is the only one that travels face
   down; a Favor, an Exploding Kitten, an Attack and a seven all take cards
   everyone already knows about. */
function flyCards(fromPid, toPid, bundle, faceDown){
  const b = fxBundle(bundle);
  const n = fxTotal(b);
  if (!n) return;                             // nothing moved, nothing to watch
  const rec = { t:"cards", f: fromPid,
                o: (toPid === null || toPid === undefined) ? null : toPid };
  // Face down means face down ON THE WIRE too. Now that flights travel, a
  // bundle naming the resource would put the robbery in every player's copy of
  // the state, where anyone who opened devtools could read which card was
  // taken. That is the one exchange in the game nobody else is entitled to
  // see, so only the count goes out and the backs are drawn from that.
  if (faceDown){ rec.d = 1; rec.n = n; }
  else rec.b = b;
  pushFx(rec);
}

/* What each side handed over, crossing between the two seat cards — or, for
   the bank, between a seat card and the space just below it. */
function flyTrade(aid, bid, gave, got){
  const g = fxBundle(gave), h = fxBundle(got);
  if (!fxTotal(g) && !fxTotal(h)) return;
  pushFx({ t:"trade", a: aid, b: (bid === null || bid === undefined) ? null : bid,
           g: g, h: h });
}

/* ── playing them back ── */

/* Newest flights since the last look. Ids rather than clocks, because a
   terminal is not asked to trust anybody else's wall clock — and because the
   whole state is resent after every action, so the same flight arrives over
   and over and must only be flown once. */
let lastFx = -1;              // -1 = this screen has not looked at this table yet

function clearFx(){
  if (S) S.fx = [];
  lastFx = -1;
}

function checkFlights(){
  const list = (S && S.fx) || [];
  // Either a table this screen has not seen before, or one whose counter went
  // backwards — a new game, or a state applied from a host mid-game. Whatever
  // is already on the record happened before anybody here was watching, so
  // catch up to it silently rather than replay somebody else's last eight
  // actions at them.
  if (lastFx < 0 || (list.length && list[list.length - 1].id < lastFx)){
    lastFx = list.length ? list[list.length - 1].id : 0;
    return;
  }
  for (const f of list){
    if (!f || f.id <= lastFx) continue;
    lastFx = f.id;
    try { playFlight(f); }
    catch (err){ console.error("flight failed:", err); }
  }
}

function playFlight(f){
  if (f.t === "prod")  return playProduction(f.src || []);
  if (f.t === "kit")   return playKitten(f.p);
  if (f.t === "cards") return playCardsFx(f);
  if (f.t === "trade") return playTradeFx(f);
}

/* Cards flying from the hexes that grew them to the seat that owns the
   building, with each hex flashing as they leave. Staggered so a big roll
   reads as a sequence rather than a swarm, and capped so a six-player payout
   does not bury the board. */
function playProduction(src){
  fxSoon(function(){
    const flashed = {};
    let sent = 0;
    for (const g of src){
      if (sent >= FX_MAX_CARDS) break;
      const hp = hexPoint(g.h), sp = seatResPoint(g.p);
